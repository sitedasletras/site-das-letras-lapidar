<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lapidar — A casa do seu original</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:#0d0603;
color:white;
display:flex;
justify-content:center;
}

.container{
max-width:720px;
width:92%;
padding:40px 0 60px 0;
}

.titulo{
font-size:42px;
font-weight:bold;
text-align:center;
letter-spacing:2px;
}

.subtitulo{
text-align:center;
color:#ff7b2c;
margin-top:10px;
font-size:18px;
line-height:1.6;
}

.blocoTopo{
background:#140c08;
border-radius:14px;
padding:20px;
margin-top:24px;
line-height:1.7;
}

.linhaTopo{
margin-top:10px;
}

.label{
color:#ff7b2c;
font-weight:bold;
}

.valor{
color:#ffd2b3;
}

.texto{
text-align:center;
color:#ffd2b3;
margin-top:28px;
line-height:1.7;
}

.botao{
width:100%;
padding:20px;
margin-top:20px;
border:none;
border-radius:40px;
background:#ff5a00;
color:white;
font-size:20px;
font-weight:bold;
cursor:pointer;
}

.botao:hover{
background:#ff6f1a;
}

.botaoAzul{
background:#2c52ff;
}

.botaoAzul:hover{
background:#4366ff;
}

.botaoVerde{
background:#00a651;
}

.botaoVerde:hover{
background:#00bf5c;
}

.botaoRoxo{
background:#7a3cff;
}

.botaoRoxo:hover{
background:#8b55ff;
}

.botaoCinza{
background:#444;
}

.botaoCinza:hover{
background:#666;
}

.botaoBloqueado{
background:#2d2d2d;
opacity:0.6;
cursor:not-allowed;
}

.alerta{
margin-top:22px;
text-align:center;
color:#ffb199;
line-height:1.7;
}

.destaque{
color:#9cffb2;
font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<div class="titulo">
LAPIDAR
</div>

<div class="subtitulo">
A casa do seu original
</div>

<div class="blocoTopo">

<div>
<span class="label">Plano atual</span><br>
<span id="planoAtual" class="valor">Carregando...</span>
</div>

<div class="linhaTopo">
<span class="label">Situação do acesso</span><br>
<span id="situacaoAcesso" class="valor">Verificando...</span>
</div>

<div class="linhaTopo">
<span class="label">Limite mensal de obras</span><br>
<span id="limiteObras" class="valor">Carregando...</span>
</div>

</div>

<div class="texto">
Escolha abaixo o que deseja fazer com o seu material editorial.
</div>

<button id="btnOriginal" class="botao" onclick="window.location.href='upload_livro.html'">
Entrar com o seu original
</button>

<button id="btnIdiomaObra" class="botao botaoAzul" onclick="window.location.href='idioma_obra.html'">
Escolher idioma da obra
</button>

<button id="btnCapa" class="botao" onclick="window.location.href='bloco12.html'">
Preparar capa externa
</button>

<button id="btnCapista" class="botao botaoRoxo" onclick="window.location.href='capista_planos.html'">
Projeto Capista
</button>

<button id="btnLeitura" class="botao botaoAzul" onclick="window.location.href='leitura_tecnica_editorial.html'">
Leitura Técnica Editorial — Lapidar — Site das Letras
</button>

<button id="btnRelatorio" class="botao botaoVerde" onclick="abrirRelatorio()">
Ver relatório editorial da obra
</button>

<button id="btnRetirada" class="botao botaoCinza" onclick="retirarMateriais()">
Retirar materiais diagramados
</button>

<button class="botao botaoAzul" onclick="window.location.href='status_plano.html'">
Ver status do meu plano
</button>

<div id="alertaPlano" class="alerta"></div>

</div>

<script>

function definirLimiteTexto(limite){
if(!limite){
return "Não informado";
}

if(limite === "ilimitado"){
return "Uso livre dentro do período do plano";
}

return limite + " obra(s) no mês";
}

function bloquearEntrada(){

const btnOriginal = document.getElementById("btnOriginal");
const btnCapa = document.getElementById("btnCapa");
const btnIdiomaObra = document.getElementById("btnIdiomaObra");

btnOriginal.classList.add("botaoBloqueado");
btnCapa.classList.add("botaoBloqueado");
btnIdiomaObra.classList.add("botaoBloqueado");

btnOriginal.onclick = function(){
alert("Seu plano precisa estar ativo para continuar.");
};

btnCapa.onclick = function(){
alert("Seu plano precisa estar ativo para continuar.");
};

btnIdiomaObra.onclick = function(){
alert("Seu plano precisa estar ativo para alterar o idioma editorial da obra.");
};

}

function retirarMateriais(){

const prazoLiberado = localStorage.getItem("SDL_prazo_liberado");

if(prazoLiberado === "sim"){
alert("Seus materiais continuam disponíveis dentro do prazo extra de retirada.");
}else{
alert("No momento não há prazo liberado para retirada.");
}

}

function abrirRelatorio(){

const planoAtivo = localStorage.getItem("SDL_plano_ativo");
const prazoLiberado = localStorage.getItem("SDL_prazo_liberado");
const dataPrazoRetirada = localStorage.getItem("SDL_data_prazo_retirada");

if(planoAtivo === "ativo"){
window.location.href = "relatorio_lapidacao.html";
return;
}

if(prazoLiberado === "sim" && dataPrazoRetirada){
const hoje = new Date();
const prazo = new Date(dataPrazoRetirada);

if(hoje <= prazo){
window.location.href = "relatorio_lapidacao.html";
return;
}
}

alert("O relatório editorial é liberado apenas durante o período ativo do plano ou dentro do prazo extra permitido.");

}

function carregarPainelInicial(){

const plano = localStorage.getItem("SDL_plano");
const limite = localStorage.getItem("SDL_limite_obras");
const planoAtivo = localStorage.getItem("SDL_plano_ativo");
const dataVencimento = localStorage.getItem("SDL_data_vencimento");
const dataPrazoRetirada = localStorage.getItem("SDL_data_prazo_retirada");

document.getElementById("planoAtual").innerText =
plano || "Nenhum plano selecionado";

document.getElementById("limiteObras").innerText =
definirLimiteTexto(limite);

if(!plano || !dataVencimento || !dataPrazoRetirada){
document.getElementById("situacaoAcesso").innerText =
"Nenhum plano ativo no momento.";

document.getElementById("alertaPlano").innerText =
"Escolha um plano para ativar seu acesso.";

bloquearEntrada();
return;
}

const hoje = new Date();
const vencimento = new Date(dataVencimento);
const prazoRetirada = new Date(dataPrazoRetirada);

if(planoAtivo === "ativo" && hoje <= vencimento){
document.getElementById("situacaoAcesso").innerHTML =
"<span class='destaque'>Plano ativo</span>";

document.getElementById("alertaPlano").innerText =
"Seu acesso está liberado normalmente.";

return;
}

if(hoje > vencimento && hoje <= prazoRetirada){
document.getElementById("situacaoAcesso").innerText =
"Plano vencido com prazo extra disponível.";

document.getElementById("alertaPlano").innerText =
"Você ainda pode retirar seus materiais.";

bloquearEntrada();
return;
}

document.getElementById("situacaoAcesso").innerText =
"Plano encerrado.";

document.getElementById("alertaPlano").innerText =
"Escolha um novo plano para continuar.";

bloquearEntrada();

}

carregarPainelInicial();

</script>

</body>
</html>
