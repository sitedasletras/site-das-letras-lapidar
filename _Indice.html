
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Carregando...</title>
</head>

<body>

<script>

const inicioSessao = Date.now();

function registrarEvento(tipo){

const registro = {
evento: tipo,
data: new Date().toLocaleString("pt-BR"),
navegador: navigator.userAgent,
pagina: window.location.href
};

console.log("Registro:", registro);

localStorage.setItem("SDL_registro", JSON.stringify(registro));

}

registrarEvento("acesso_inicial");

window.addEventListener("beforeunload", () => {

const tempoSessao = Date.now() - inicioSessao;

localStorage.setItem("SDL_tempo_sessao", tempoSessao);

});

</script>

</body>
</html>
