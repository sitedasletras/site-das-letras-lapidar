<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Carregando...</title>

<script>

const inicioSessao = Date.now();

function registrarEvento(tipo){

const registro = {
evento: tipo,
data: new Date().toLocaleString("pt-BR"),
navegador: navigator.userAgent,
pagina: window.location.href
};

let logs = JSON.parse(localStorage.getItem("SDL_AUDITORIA") || "[]");

logs.push(registro);

localStorage.setItem("SDL_AUDITORIA", JSON.stringify(logs));

}

window.onload = () => {

registrarEvento("acesso__Indice_html");

};

window.onbeforeunload = () => {

const tempoSessao = Math.floor((Date.now() - inicioSessao)/1000);

registrarEvento("tempo_sessao_" + tempoSessao + "_segundos");

};

</script>

}

</style>
