<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel Lapidar</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
background:#0d0603;
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{
text-align:center;
max-width:420px;
width:90%;
}

.titulo{
font-size:34px;
font-weight:bold;
letter-spacing:2px;
margin-bottom:10px;
}

.subtitulo{
color:#ff7b2c;
letter-spacing:6px;
margin-bottom:10px;
font-size:14px;
}

.usuario{
margin-bottom:25px;
color:#ffd2b3;
font-size:14px;
}

.orientacao{
font-size:14px;
color:#ffd2b3;
margin-bottom:35px;
line-height:1.6;
}

.botao{

display:block;

width:100%;

margin:12px 0;

padding:18px;

border-radius:35px;

border:none;

background:#ff5a00;

color:white;

font-size:18px;

font-weight:bold;

cursor:pointer;

transition:0.3s;

}

.botao:hover{
background:#ff6f1a;
}

.sair{

background:#4a4a4a;

}

.sair:hover{
background:#6a6a6a;
}

.transparencia{

margin-top:35px;

font-size:13px;

color:#ffd2b3;

line-height:1.5;

}

</style>

</head>

<body>

<div class="container">

<div class="titulo">
PROJETO LAPIDAR
</div>

<div class="subtitulo">
PAINEL DE CONTROLE
</div>

<div id="usuarioLogado" class="usuario">
</div>

<div class="orientacao">

Selecione o módulo editorial que deseja utilizar para avançar na preparação do seu livro.

</div>


<button class="botao"
onclick="window.location.href='bloco11.html'">

Abrir Bloco 11

</button>


<button class="botao"
onclick="window.location.href='bloco12.html'">

Abrir Bloco 12

</button>


<button class="botao"
onclick="window.location.href='bloco13.html'">

Abrir Bloco 13

</button>


<button class="botao sair"
onclick="logout()">

Sair

</button>


<div class="transparencia">

A capa básica já está incluída no seu pacote.<br>
Capas com orelhas ou versões premium podem ser adicionadas opcionalmente.

</div>


</div>


<script>

function logout(){

localStorage.removeItem("SDL_usuario_logado");

window.location.href="index.html";

}


const usuario = localStorage.getItem("SDL_usuario_logado");

if(usuario){

document.getElementById("usuarioLogado").innerText =
"Bem-vindo, " + usuario + ".";

}

</script>


</body>

</html>
