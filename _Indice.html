<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lapidar — A casa do seu original</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
background:#0d0603;
color:white;
display:flex;
justify-content:center;
}

.container{
max-width:820px;
width:92%;
padding:40px 0 60px 0;
}

.titulo{
font-size:42px;
font-weight:bold;
text-align:center;
letter-spacing:2px;
}

.subtitulo{
text-align:center;
color:#ff7b2c;
margin-top:10px;
font-size:18px;
line-height:1.6;
}

.blocoTopo{
background:#140c08;
border-radius:14px;
padding:20px;
margin-top:24px;
line-height:1.7;
}

.linhaTopo{
margin-top:10px;
}

.label{
color:#ff7b2c;
font-weight:bold;
}

.valor{
color:#ffd2b3;
}

.texto{
text-align:center;
color:#ffd2b3;
margin-top:28px;
line-height:1.7;
}

.secao{
margin-top:30px;
background:#140c08;
border-radius:16px;
padding:18px;
}

.secaoTitulo{
font-size:24px;
font-weight:bold;
margin-bottom:8px;
}

.secaoTexto{
color:#ffd2b3;
line-height:1.7;
margin-bottom:14px;
}

.laranja{
color:#ff7b2c;
}

.azul{
color:#6ea8ff;
}

.verde{
color:#9cffb2;
}

.branco{
color:#ffffff;
}

.botao{
width:100%;
padding:20px;
margin-top:14px;
border:none;
border-radius:40px;
font-size:20px;
font-weight:bold;
cursor:pointer;
}

.botao:hover{
opacity:0.94;
}

.botaoLapidar{
background:#ff5a00;
color:white;
}

.botaoEntrar{
background:#6ea8ff;
color:white;
}

</style>
</head>

<body>

<div class="container">

<div class="titulo">
LAPIDAR
</div>

<div class="subtitulo">
A casa do seu original
</div>


<div class="blocoTopo">

<div class="linhaTopo">
<span class="label">Ambiente:</span>
<span class="valor">Editorial protegido</span>
</div>

<div class="linhaTopo">
<span class="label">Modo:</span>
<span class="valor">Produção autorizada</span>
</div>

<div class="linhaTopo">
<span class="label">Status:</span>
<span class="valor">Sessão ativa</span>
</div>

</div>


<div class="texto">

Bem-vindo, sua presença é importante para nós, aproveite sua estadia.

</div>


<div class="secao">

<div class="secaoTitulo">
Acesso ao ambiente
</div>

<div class="secaoTexto">

Você está dentro do ambiente editorial Lapidar.<br>
Utilize as opções abaixo para continuar.

</div>

<button class="botao botaoLapidar"
onclick="abrirPainel()">

Entrar no painel editorial

</button>


<button class="botao botaoEntrar"
onclick="sairSistema()">

Encerrar sessão

</button>

</div>


</div>


<script>

function abrirPainel(){

alert("Painel editorial em construção.");

}


function sairSistema(){

localStorage.removeItem("SDL_sessao_ativa");

window.location.href="login.html";

}

</script>


</body>
</html>
