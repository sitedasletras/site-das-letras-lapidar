<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel Lapidar</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#0d0603;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
text-align:center;
}

.logo{
font-size:32px;
font-weight:bold;
margin-bottom:10px;
}

.sublogo{
font-size:14px;
letter-spacing:4px;
color:#ff7b2c;
margin-bottom:40px;
}

.botao{

display:block;

width:260px;

margin:10px auto;

padding:16px;

border-radius:30px;

border:none;

background:#ff5a00;

color:white;

font-size:18px;

font-weight:bold;

cursor:pointer;

}

.sair{

background:#444;

}

</style>

</head>

<body>

<div class="container">

<div class="logo">

PROJETO LAPIDAR

</div>

<div class="sublogo">

PAINEL DE CONTROLE

</div>

<button class="botao">

Abrir Bloco 11

</button>

<button class="botao">

Abrir Bloco 12

</button>

<button class="botao">

Abrir Bloco 13

</button>

<button class="botao sair" onclick="logout()">

Sair

</button>

</div>

<script>

const usuarioLogado = localStorage.getItem("SDL_usuario_logado");

if(!usuarioLogado){

window.location.href="index.html";

}

function logout(){

localStorage.removeItem("SDL_usuario_logado");

window.location.href="index.html";

}

</script>

</body>

</html>
