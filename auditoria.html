<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auditoria e Controle</title>

<style>

body{
font-family:Arial;
background:#efe2c2;
margin:0;
padding:0;
}

header{
background:#a67c2d;
color:white;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.container{
padding:20px;
}

.card{
background:white;
border-radius:12px;
padding:20px;
margin-bottom:20px;
box-shadow:0 4px 10px rgba(0,0,0,.1);
}

button{
padding:12px 18px;
border:none;
border-radius:8px;
background:#a67c2d;
color:white;
cursor:pointer;
margin-right:10px;
margin-top:10px;
}

button.sec{
background:#2f436d;
}

button.alt{
background:#6c757d;
}

.lista{
margin-top:10px;
padding:10px;
background:#f7f2e4;
border-radius:8px;
}

</style>
</head>

<body>

<header>

<h2>Auditoria e Controle</h2>

<button onclick="voltar()">Voltar ao Admin</button>

</header>


<div class="container">


<div class="card">

<h3>Status geral do sistema</h3>

<div id="statusSistema">

Sessão ativa e ambiente operacional.

</div>

</div>



<div class="card">

<h3>Registro de acessos recentes</h3>

<div class="lista" id="acessosRecentes">

Nenhum registro recente.

</div>

<button onclick="registrarAuditoria()">Registrar evento de auditoria</button>

</div>



<div class="card">

<h3>Ferramentas institucionais</h3>

<button onclick="abrirRelatorios()">Abrir Hub de Relatórios</button>

<button class="sec" onclick="abrirProjetos()">Abrir Projetos</button>

<button class="alt" onclick="abrirEstatisticas()">Abrir Estatísticas</button>

</div>


</div>


<script>

/* =========================
SESSION GUARD INSTITUCIONAL
========================= */

const perfil = localStorage.getItem("lapidar_perfil")

if(!perfil){

window.location.href="index.html"

}


/* =========================
CARREGAR AUDITORIA
========================= */

const historicoAuditoria = JSON.parse(
localStorage.getItem("lapidar_auditoria_logs") || "[]"
)

if(historicoAuditoria.length){

document.getElementById("acessosRecentes").innerHTML =
historicoAuditoria.slice(-10).reverse().join("<br>")

}


/* =========================
REGISTRAR EVENTO
========================= */

function registrarAuditoria(){

const data = new Date().toLocaleString("pt-BR")

let logs = JSON.parse(
localStorage.getItem("lapidar_auditoria_logs") || "[]"
)

logs.push("Evento registrado em " + data)

localStorage.setItem(
"lapidar_auditoria_logs",
JSON.stringify(logs)
)

location.reload()

}


/* =========================
NAVEGAÇÃO
========================= */

function abrirRelatorios(){

window.location.href="hub_relatorios.html"

}

function abrirProjetos(){

window.location.href="projetos.html"

}

function abrirEstatisticas(){

window.location.href="estatisticas_lapidar.html"

}

function voltar(){

window.location.href="admin.html"

}

</script>


</body>
</html>
