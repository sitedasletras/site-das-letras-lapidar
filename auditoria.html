<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lapidar — Auditoria Institucional</title>

<style>

body{
font-family:Arial;
background:#f3efe6;
margin:0;
padding:0;
}

.topbar{
background:#3d4a5c;
color:white;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.container{
max-width:1100px;
margin:auto;
padding:30px;
}

.card{
background:white;
padding:20px;
margin-bottom:20px;
border-radius:12px;
box-shadow:0 3px 10px rgba(0,0,0,0.08);
}

h2{
margin-top:0;
color:#3d4a5c;
}

.linha{
margin-bottom:12px;
}

.rotulo{
font-size:12px;
color:#617287;
text-transform:uppercase;
}

.valor{
font-size:16px;
}

.relogio-box{
background:#eef4fb;
padding:15px;
border-radius:10px;
margin-top:10px;
}

button{
padding:12px 20px;
border:none;
background:#3d4a5c;
color:white;
border-radius:6px;
cursor:pointer;
margin-right:10px;
}

button:hover{
background:#2e3947;
}

.timeline{
margin-top:20px;
}

.evento{
background:#fbfcfe;
padding:12px;
margin-bottom:10px;
border-radius:8px;
}

</style>
</head>


<body>

<div class="topbar">

<div>Auditoria Institucional da Obra</div>

<div>

<button onclick="voltarMesario()">Retornar</button>

<button onclick="irExportacao()">Exportar</button>

</div>

</div>


<div class="container">


<div class="card">

<h2>LapidarClock institucional</h2>

<div class="relogio-box">

<div class="linha">

<span class="rotulo">Sessão iniciada em</span>

<div class="valor" id="inicioSessao"></div>

</div>

<div class="linha">

<span class="rotulo">Tempo ativo no fluxo</span>

<div class="valor" id="tempoSessao"></div>

</div>

</div>

</div>



<div class="card">

<h2>Contador de tarefas do departamento</h2>

<div class="relogio-box">

<div class="linha">

<span class="rotulo">Total de tarefas</span>

<div class="valor" id="totalTarefas"></div>

</div>

<div class="linha">

<span class="rotulo">Executadas</span>

<div class="valor" id="tarefasExecutadas"></div>

</div>

<div class="linha">

<span class="rotulo">Restantes</span>

<div class="valor" id="tarefasRestantes"></div>

</div>

</div>

</div>



<div class="card">

<h2>Validade do plano institucional</h2>

<div class="relogio-box">

<div class="linha">

<span class="rotulo">Dias restantes</span>

<div class="valor" id="diasPlano"></div>

</div>

<div class="linha">

<span class="rotulo">Ações restantes</span>

<div class="valor" id="acoesPlano"></div>

</div>

</div>

</div>



<div class="card">

<h2>Linha do tempo institucional</h2>

<div id="timeline"></div>

</div>


</div>



<script>


function carregarObra(){

let obra = JSON.parse(localStorage.getItem("obraAtual"));

if(!obra){

obra = {

lapidarClock:{

inicioSessao:Date.now(),

tempoAcumulado:0

},

tarefas:{

total:7,

executadas:2

},

plano:{

diasRestantes:20,

acoesRestantes:3

},

auditoria:[]

};

localStorage.setItem("obraAtual",JSON.stringify(obra));

}

return obra;

}



function atualizarClock(){

let obra = carregarObra();

let agora = Date.now();

let inicio = obra.lapidarClock.inicioSessao;

let tempo = agora - inicio;

let minutos = Math.floor(tempo/60000);

document.getElementById("inicioSessao").innerText =

new Date(inicio).toLocaleString("pt-BR");

document.getElementById("tempoSessao").innerText =

minutos + " minutos ativos";

}



function atualizarTarefas(){

let obra = carregarObra();

document.getElementById("totalTarefas").innerText =

obra.tarefas.total;

document.getElementById("tarefasExecutadas").innerText =

obra.tarefas.executadas;

document.getElementById("tarefasRestantes").innerText =

obra.tarefas.total - obra.tarefas.executadas;

}



function atualizarPlano(){

let obra = carregarObra();

document.getElementById("diasPlano").innerText =

obra.plano.diasRestantes;

document.getElementById("acoesPlano").innerText =

obra.plano.acoesRestantes;

}



function registrarEvento(texto){

let obra = carregarObra();

obra.auditoria.push({

texto:texto,

hora:new Date().toLocaleString("pt-BR")

});

localStorage.setItem("obraAtual",JSON.stringify(obra));

renderTimeline();

}



function renderTimeline(){

let obra = carregarObra();

let area = document.getElementById("timeline");

area.innerHTML="";

obra.auditoria.reverse().forEach(ev=>{

let div=document.createElement("div");

div.className="evento";

div.innerHTML=ev.texto+"<br><small>"+ev.hora+"</small>";

area.appendChild(div);

});

}



function voltarMesario(){

registrarEvento("Retorno ao Mesário");

window.location.href="mesario.html";

}



function irExportacao(){

registrarEvento("Encaminhado para Exportação");

window.location.href="exportar.html";

}



setInterval(atualizarClock,1000);

atualizarClock();

atualizarTarefas();

atualizarPlano();

renderTimeline();


</script>


</body>

</html>
