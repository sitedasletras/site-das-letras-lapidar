<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lapidar — Auditoria</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial, sans-serif;
background:#f5f7fb;
color:#1f2937;
}
.topo{
background:#3749a6;
color:#fff;
padding:22px 18px;
}
.topo h1{margin:0;font-size:1.8rem}
.topo p{margin:8px 0 0 0;opacity:.95}

.container{
max-width:1240px;
margin:0 auto;
padding:18px 14px 30px;
}

.card{
background:#fff;
border:1px solid #e1e6f5;
border-radius:16px;
padding:18px;
margin-bottom:18px;
box-shadow:0 4px 14px rgba(0,0,0,.08);
}

.card h2{
margin:0 0 14px 0;
color:#3749a6;
font-size:1.2rem;
}

.linha{
margin:10px 0;
font-size:14px;
}

.preview{
white-space:pre-wrap;
line-height:1.55;
font-size:14px;
max-height:420px;
overflow:auto;
background:#fff;
border:1px solid #e1e6f5;
border-radius:12px;
padding:18px;
}

.acoes{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:14px;
}

button{
border:none;
border-radius:10px;
padding:12px 16px;
font-size:15px;
cursor:pointer;
font-weight:bold;
}

.btn-azul{background:#3749a6;color:#fff}
.btn-azul:hover{background:#2c3b87}

.btn-claro{background:#dfe5fb;color:#2c3b87}
.btn-claro:hover{background:#cfd7f6}

.btn-verde{background:#15803d;color:#fff}
.btn-verde:hover{background:#11622f}

.mensagem{
margin-top:14px;
padding:12px 14px;
border-radius:10px;
display:none;
font-size:14px;
}

.ok{background:#edf9ef;border:1px solid #b7e1c1;color:#166534}
.erro{background:#fff1f1;border:1px solid #f0b9b9;color:#991b1b}
</style>
</head>
<body>

<header class="topo">
<h1>Auditoria</h1>
<p>Registro técnico final do fluxo editorial antes da etapa de exportação da obra.</p>
</header>

<main class="container">

<section class="card">
<h2>Verificação da trilha editorial</h2>

<div class="linha"><strong>Título:</strong> <span id="titulo">Carregando...</span></div>
<div class="linha"><strong>Autor:</strong> <span id="autor">Carregando...</span></div>
<div class="linha"><strong>Status Mesário:</strong> <span id="statusMesario">Validando...</span></div>

<div class="acoes">
<button class="btn-claro" onclick="voltarMesario()">Voltar ao Mesário</button>
<button class="btn-azul" onclick="executarAuditoria()">Executar Auditoria</button>
<button class="btn-verde" onclick="seguirExportacao()">Seguir para Exportação</button>
</div>

<div id="msgOk" class="mensagem ok"></div>
<div id="msgErro" class="mensagem erro"></div>

</section>

<section class="card">
<h2>Resumo técnico consolidado</h2>
<div class="preview" id="preview">Aguardando obra...</div>
</section>

</main>

<script>

function ok(msg){
let el=document.getElementById("msgOk")
let er=document.getElementById("msgErro")
er.style.display="none"
el.innerText=msg
el.style.display="block"
}

function erro(msg){
let el=document.getElementById("msgOk")
let er=document.getElementById("msgErro")
el.style.display="none"
er.innerText=msg
er.style.display="block"
}

function obra(){
try{
return JSON.parse(localStorage.getItem("obraAtual")||"null")
}catch{return null}
}

function mesarioOk(){
return localStorage.getItem("mesario_confirmado")==="true"
}

function carregar(){

let o=obra()

if(!o){
document.getElementById("titulo").innerText="Nenhuma obra ativa"
document.getElementById("autor").innerText="—"
document.getElementById("preview").innerText="Nenhuma obra carregada."
return
}

document.getElementById("titulo").innerText=o?.titulo||"Título não identificado"
document.getElementById("autor").innerText=o?.autor||"Autor não identificado"

document.getElementById("preview").innerText=(o?.textoExtraido||"Sem texto disponível").slice(0,3000)

document.getElementById("statusMesario").innerText=mesarioOk()?"Confirmado":"Pendente"
}

function executarAuditoria(){

if(!mesarioOk()){
erro("Confirme o Mesário antes de executar a Auditoria.")
return
}

localStorage.setItem("auditoria_concluida","true")

let relatorio={
data:new Date().toISOString(),
etapa:"auditoria.html",
status:"concluida"
}

localStorage.setItem("auditoria_relatorio",JSON.stringify(relatorio))

ok("Auditoria registrada com sucesso.")
}

function seguirExportacao(){

if(localStorage.getItem("auditoria_concluida")!=="true"){
erro("Execute a Auditoria antes de seguir.")
return
}

window.location.href="exportar.html"
}

function voltarMesario(){
window.location.href="mesario.html"
}

carregar()

</script>

<script src="lapidar_inteligencia_core.js"></script>

</body>
</html>
