<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bolsão de Limpeza Editorial</title>

<script src="https://unpkg.com/mammoth/mammoth.browser.min.js"></script>

<style>
body{
  font-family: Arial;
  background:#f5f1e8;
  margin:0;
  padding:20px;
}

.container{
  max-width:900px;
  margin:auto;
}

.card{
  background:white;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
  box-shadow:0 5px 15px rgba(0,0,0,0.05);
}

.preview{
  background:#fff;
  padding:25px;
  border:1px solid #ccc;
  min-height:250px;
  line-height:1.7;
}

h2,h3,h4{
  text-align:center;
}

.mensagem{
  background:#e8f5e9;
  border-left:5px solid #4CAF50;
  padding:15px;
  border-radius:8px;
}

.progress{
  height:10px;
  background:#ddd;
  border-radius:5px;
  overflow:hidden;
  margin-top:10px;
}

.progress-bar{
  height:100%;
  width:0%;
  background:#4CAF50;
}

input{
  width:100%;
  padding:10px;
  margin-bottom:10px;
}

.btn{
  padding:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  margin-top:10px;
}

.green{background:#4CAF50;color:white;}
.red{background:#c0392b;color:white;}
.blue{background:#3498db;color:white;}

.pagina{
  margin:40px 0;
  padding:20px;
  border:1px dashed #ccc;
  text-align:center;
}

.ficha{
  border:1px solid #000;
  padding:15px;
  margin:20px 0;
  font-size:13px;
  font-family: "Courier New", monospace;
  text-align:left;
  line-height:1.5;
}
</style>
</head>

<body>

<div class="container">

<div class="card">
<h2>Upload da Obra</h2>
<input type="file" id="uploadTexto" accept=".txt,.docx">
<p id="statusUpload">Nenhum arquivo carregado</p>
<button class="btn red" onclick="limparObra()">Limpar obra</button>
</div>

<div class="card">
<h2>Bolsão em ação</h2>
<div id="mensagemBolsao" class="mensagem">
Aguardando obra...
</div>

<div class="progress">
<div id="barra" class="progress-bar"></div>
</div>
</div>

<div class="card">
<h2>Prévia do Livro</h2>
<div id="previewTexto" class="preview"></div>
</div>

<div class="card">
<h2>Ficha da Obra</h2>
<input type="text" id="titulo" placeholder="Título">
<input type="text" id="autor" placeholder="Autor">
<button class="btn blue" onclick="salvarDados()">Salvar</button>
</div>

</div>

<script>

const mensagens = [
"Varrendo lixo editorial...",
"Removendo entulho textual...",
"Lendo sua obra com atenção...",
"Separando estrutura editorial...",
"Organizando capítulos...",
"Lapidando texto..."
];

document.getElementById('uploadTexto').addEventListener('change', function(e){

    const file = e.target.files[0];
    if(!file) return;

    const nome = file.name.toLowerCase();

    if(nome.endsWith('.txt')){
        const reader = new FileReader();
        reader.onload = e => iniciarProcesso(e.target.result, file.name);
        reader.readAsText(file);
    }

    else if(nome.endsWith('.docx')){
        const reader = new FileReader();
        reader.onload = function(event){
            mammoth.convertToHtml({arrayBuffer: event.target.result})
            .then(result => iniciarProcesso(result.value, file.name));
        };
        reader.readAsArrayBuffer(file);
    }

});

function calcularTempo(texto){
    return 4000;
}

async function iniciarProcesso(textoBruto, nomeArquivo){

    let texto = normalizar(textoBruto);

    for(let i=0;i<mensagens.length;i++){
        document.getElementById("mensagemBolsao").innerText = mensagens[i];
        atualizarBarra((i+1)/mensagens.length*100);
        await delay(700);
    }

    let estrutura = estruturarTexto(texto);

    document.getElementById("previewTexto").innerHTML = estrutura.html;
    document.getElementById("statusUpload").innerText = "Arquivo carregado: " + nomeArquivo;

    document.getElementById("mensagemBolsao").innerText =
    "Sua obra foi organizada com sucesso.";

    detectarDados(texto);
}

function atualizarBarra(valor){
    document.getElementById("barra").style.width = valor + "%";
}

function normalizar(texto){
    return texto
    .replace(/<[^>]*>/g,'')
    .replace(/\. /g,'.\n\n')
    .trim();
}

function estruturarTexto(texto){

    let html = "";

    texto = texto
    .replace(/SELO EDITORIAL/gi, "\n##SELO##\n")
    .replace(/FOLHA DE ROSTO/gi, "\n##ROSTO##\n")
    .replace(/FICHA CATALOGRÁFICA/gi, "\n##FICHA##\n");

    let linhas = texto.split("\n").filter(l=>l.trim());

    let dentroFicha = false;

    linhas.forEach((linha,i)=>{

        if(linha.includes("##SELO##")){
            html += `<div class="pagina"><h3>SELO EDITORIAL</h3></div>`;
            return;
        }

        if(linha.includes("##ROSTO##")){
            html += `<div class="pagina"><h2>FOLHA DE ROSTO</h2></div>`;
            return;
        }

        if(linha.includes("##FICHA##")){
            html += `<div class="ficha"><strong>FICHA CATALOGRÁFICA</strong><br><br>`;
            dentroFicha = true;
            return;
        }

        if(dentroFicha){

            if(linha.length < 3){
                html += `</div>`;
                dentroFicha = false;
                return;
            }

            html += linha + "<br>";
            return;
        }

        if(i===0){
            html += `<h2>${linha}</h2>`;
            return;
        }

        if(i===1){
            html += `<h3>${linha}</h3>`;
            return;
        }

        if(/cap[ií]tulo/i.test(linha)){
            html += `<h4>${linha}</h4>`;
            return;
        }

        html += `<p>${linha}</p>`;
    });

    return {html};
}

function detectarDados(texto){
    let linhas = texto.split("\n");
    document.getElementById("titulo").value = linhas[0] || "";
    document.getElementById("autor").value = linhas[2] || "";
}

function salvarDados(){
    alert("Salvo!");
}

function limparObra(){
    location.reload();
}

function delay(ms){
    return new Promise(r=>setTimeout(r,ms));
}

</script>

</body>
</html>
