<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bolsão de Execução</title>

<script src="https://unpkg.com/mammoth/mammoth.browser.min.js"></script>

<style>
body{
  font-family: Arial;
  background:#f5f1e8;
  margin:0;
  padding:20px;
}

.container{
  max-width:900px;
  margin:auto;
}

.card{
  background:white;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
  box-shadow:0 5px 15px rgba(0,0,0,0.05);
}

.preview{
  background:#fff;
  padding:20px;
  border:1px solid #ccc;
  min-height:300px;
  white-space:pre-wrap;
}

.btn{
  padding:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  margin-top:10px;
}

.green{background:#4CAF50;color:white;}
.red{background:#c0392b;color:white;}
.blue{background:#3498db;color:white;}
</style>

</head>
<body>

<div class="container">

<div class="card">
<h2>Upload da Obra</h2>
<input type="file" id="uploadTexto" accept=".txt,.docx">
<p id="statusUpload">Nenhum arquivo carregado</p>
<button class="btn red" onclick="limparObra()">Limpar obra</button>
</div>

<div class="card">
<h2>Prévia da Obra</h2>
<div id="previewTexto" class="preview">
Seu texto aparecerá aqui.
</div>
</div>

<div class="card">
<h2>Dados da Obra</h2>
<input type="text" id="titulo" placeholder="Título"><br><br>
<input type="text" id="autor" placeholder="Autor"><br><br>
<button class="btn blue" onclick="salvarDados()">Salvar</button>
</div>

<div class="card">
<h2>Encaminhamento</h2>
<button class="btn green" onclick="irModulo('diagramacao.html')">Diagramação</button>
<button class="btn green" onclick="irModulo('traducao.html')">Tradução</button>
<button class="btn green" onclick="irModulo('humanizacao.html')">Humanização</button>
</div>

</div>

<script>

document.getElementById('uploadTexto').addEventListener('change', function(e) {

    const file = e.target.files[0];
    if (!file) return;

    const nome = file.name.toLowerCase();

    // TXT
    if(nome.endsWith('.txt')){
        const reader = new FileReader();

        reader.onload = function(event){
            salvarTexto(event.target.result, file.name);
        };

        reader.readAsText(file);
    }

    // DOCX
    else if(nome.endsWith('.docx')){
        const reader = new FileReader();

        reader.onload = function(event){
            mammoth.extractRawText({arrayBuffer: event.target.result})
            .then(function(result){
                salvarTexto(result.value, file.name);
            });
        };

        reader.readAsArrayBuffer(file);
    }

    else{
        alert("Formato não suportado. Use .txt ou .docx");
    }

});

function salvarTexto(texto, nomeArquivo){
    localStorage.setItem("lapidar_texto", texto);

    document.getElementById("previewTexto").innerText = texto;
    document.getElementById("statusUpload").innerText = "Arquivo carregado: " + nomeArquivo;
}

// carregar ao abrir
window.onload = function(){
    const texto = localStorage.getItem("lapidar_texto");

    if(texto){
        document.getElementById("previewTexto").innerText = texto;
        document.getElementById("statusUpload").innerText = "Obra já carregada";
    }
}

// limpar
function limparObra(){
    localStorage.removeItem("lapidar_texto");
    document.getElementById("previewTexto").innerText = "";
    document.getElementById("statusUpload").innerText = "Obra removida";
}

// salvar dados
function salvarDados(){
    const titulo = document.getElementById('titulo').value;
    const autor = document.getElementById('autor').value;

    localStorage.setItem("lapidar_titulo", titulo);
    localStorage.setItem("lapidar_autor", autor);

    alert("Dados salvos");
}

// navegação
function irModulo(pagina){
    window.location.href = pagina;
}

</script>

</body>
</html>
