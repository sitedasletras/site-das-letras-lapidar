<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bolsão de Limpeza Editorial</title>

<script src="https://unpkg.com/mammoth/mammoth.browser.min.js"></script>

<style>
body{
  font-family: Arial;
  background:#f5f1e8;
  margin:0;
  padding:20px;
}

.container{
  max-width:900px;
  margin:auto;
}

.card{
  background:white;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
  box-shadow:0 5px 15px rgba(0,0,0,0.05);
}

.preview{
  background:#fff;
  padding:20px;
  border:1px solid #ccc;
  min-height:250px;
  line-height:1.6;
}

h2, h3, h4{
  text-align:center;
}

.mensagem{
  background:#e8f5e9;
  border-left:5px solid #4CAF50;
  padding:15px;
  border-radius:8px;
}

.progress{
  height:10px;
  background:#ddd;
  border-radius:5px;
  overflow:hidden;
  margin-top:10px;
}

.progress-bar{
  height:100%;
  width:0%;
  background:#4CAF50;
  transition:width 0.3s;
}

input{
  width:100%;
  padding:10px;
  margin-bottom:10px;
}

.btn{
  padding:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  margin-top:10px;
}

.green{background:#4CAF50;color:white;}
.red{background:#c0392b;color:white;}
.blue{background:#3498db;color:white;}
</style>
</head>

<body>

<div class="container">

<div class="card">
<h2>Upload da Obra</h2>
<input type="file" id="uploadTexto" accept=".txt,.docx">
<p id="statusUpload">Nenhum arquivo carregado</p>
<button class="btn red" onclick="limparObra()">Limpar obra</button>
</div>

<div class="card">
<h2>Bolsão em ação</h2>
<div id="mensagemBolsao" class="mensagem">
Aguardando obra...
</div>

<div class="progress">
<div id="barra" class="progress-bar"></div>
</div>
</div>

<div class="card">
<h2>Prévia do Livro</h2>
<div id="previewTexto" class="preview"></div>
</div>

<div class="card">
<h2>Ficha da Obra</h2>
<input type="text" id="titulo" placeholder="Título">
<input type="text" id="autor" placeholder="Autor">
<button class="btn blue" onclick="salvarDados()">Salvar</button>
</div>

</div>

<script>

// MENSAGENS
const mensagens = [
"Varrendo lixo editorial...",
"Removendo entulho textual...",
"Separando o que é obra do que é ruído...",
"Lendo sua obra com atenção...",
"Percorrendo capítulos...",
"Identificando estilo narrativo...",
"Organizando estrutura do livro...",
"Separando título, autor e capítulos...",
"Lapidando para os próximos módulos..."
];

// UPLOAD
document.getElementById('uploadTexto').addEventListener('change', function(e){

    const file = e.target.files[0];
    if(!file) return;

    const nome = file.name.toLowerCase();

    if(nome.endsWith('.txt')){
        const reader = new FileReader();
        reader.onload = e => iniciarProcesso(e.target.result, file.name);
        reader.readAsText(file);
    }

    else if(nome.endsWith('.docx')){
        const reader = new FileReader();
        reader.onload = function(event){
            mammoth.convertToHtml({arrayBuffer: event.target.result})
            .then(result => iniciarProcesso(result.value, file.name));
        };
        reader.readAsArrayBuffer(file);
    }

});

// TEMPO INTELIGENTE
function calcularTempo(texto){
    const palavras = texto.split(/\s+/).length;
    const paginas = palavras / 250;
    const tempo = (paginas / 800) * 60000;
    return Math.min(Math.max(tempo, 4000), 60000);
}

// PROCESSO
async function iniciarProcesso(textoBruto, nomeArquivo){

    let texto = normalizar(textoBruto);
    let tempoTotal = calcularTempo(texto);

    let intervalo = tempoTotal / mensagens.length;

    for(let i=0;i<mensagens.length;i++){
        document.getElementById("mensagemBolsao").innerText = mensagens[i];
        atualizarBarra((i+1)/mensagens.length*100);
        await delay(intervalo);
    }

    let estrutura = estruturarTexto(texto);

    document.getElementById("previewTexto").innerHTML = estrutura.html;
    document.getElementById("statusUpload").innerText = "Arquivo carregado: " + nomeArquivo;

    document.getElementById("mensagemBolsao").innerText =
    "Sua obra foi limpa, compreendida e organizada. Seguimos juntos.";

    detectarDados(texto);

    localStorage.setItem("lapidar_texto_base", texto);
}

// BARRA
function atualizarBarra(valor){
    document.getElementById("barra").style.width = valor + "%";
}

// NORMALIZAR
function normalizar(texto){
    return texto
    .replace(/<[^>]*>/g,'')
    .replace(/([a-zà-ú])([A-ZÀ-Ú])/g,'$1 $2')
    .replace(/\.([A-ZÀ-Ú])/g,'. $1')
    .replace(/\. /g,'.\n\n')
    .trim();
}

// ESTRUTURA
function estruturarTexto(texto){

    let linhas = texto.split("\n").filter(l=>l.trim());
    let html = "";
    let capitulo = false;

    linhas.forEach((linha,i)=>{

        if(i===0){
            html += `<h2>${linha}</h2>`;
            return;
        }

        if(i===1){
            html += `<h3>${linha}</h3>`;
            return;
        }

        if(/cap[ií]tulo/i.test(linha)){
            html += `<h4>${linha}</h4>`;
            capitulo = true;
            return;
        }

        html += `<p>${linha}</p>`;
    });

    return {html};
}

// DADOS
function detectarDados(texto){
    let linhas = texto.split("\n");
    document.getElementById("titulo").value = linhas[0] || "";
    document.getElementById("autor").value = linhas[2] || "";
}

// SALVAR
function salvarDados(){
    localStorage.setItem("titulo", titulo.value);
    localStorage.setItem("autor", autor.value);
    alert("Salvo!");
}

// LIMPAR
function limparObra(){
    localStorage.clear();
    location.reload();
}

// DELAY
function delay(ms){
    return new Promise(r=>setTimeout(r,ms));
}

</script>

</body>
</html>
