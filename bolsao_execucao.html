<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bolsão de Limpeza Editorial</title>

<script src="https://unpkg.com/mammoth/mammoth.browser.min.js"></script>

<style>
body{
  font-family: Arial;
  background:#f5f1e8;
  margin:0;
  padding:20px;
}

.container{
  max-width:900px;
  margin:auto;
}

.card{
  background:white;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
  box-shadow:0 5px 15px rgba(0,0,0,0.05);
}

.preview{
  background:#fff;
  padding:20px;
  border:1px solid #ccc;
  min-height:250px;
  white-space:pre-wrap;
  line-height:1.6;
}

.mensagem{
  background:#e8f5e9;
  border-left:5px solid #4CAF50;
  padding:15px;
  border-radius:8px;
}

.analise{
  background:#fff8e1;
  border-left:5px solid #f4b400;
  padding:15px;
  border-radius:8px;
}

input{
  width:100%;
  padding:10px;
  margin-bottom:10px;
}

.btn{
  padding:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  margin-top:10px;
}

.green{background:#4CAF50;color:white;}
.red{background:#c0392b;color:white;}
.blue{background:#3498db;color:white;}
</style>
</head>

<body>

<div class="container">

<div class="card">
<h2>Upload da Obra</h2>
<input type="file" id="uploadTexto" accept=".txt,.docx">
<p id="statusUpload">Nenhum arquivo carregado</p>
<button class="btn red" onclick="limparObra()">Limpar obra</button>
</div>

<div class="card">
<h2>Mensagem do Bolsão</h2>
<div id="mensagemBolsao" class="mensagem">
Aguardando leitura da obra...
</div>
</div>

<div class="card">
<h2>Análise Editorial</h2>
<div id="analiseBolsao" class="analise">
Aguardando análise...
</div>
</div>

<div class="card">
<h2>Prévia do Texto (organizado)</h2>
<div id="previewTexto" class="preview"></div>
</div>

<div class="card">
<h2>Ficha da Obra</h2>
<input type="text" id="titulo" placeholder="Título">
<input type="text" id="autor" placeholder="Autor">
<button class="btn blue" onclick="salvarDados()">Salvar</button>
</div>

</div>

<script>

// UPLOAD
document.getElementById('uploadTexto').addEventListener('change', function(e){

    const file = e.target.files[0];
    if(!file) return;

    const nome = file.name.toLowerCase();

    // TXT
    if(nome.endsWith('.txt')){
        const reader = new FileReader();
        reader.onload = e => processarTexto(e.target.result, file.name);
        reader.readAsText(file);
    }

    // DOCX
    else if(nome.endsWith('.docx')){
        const reader = new FileReader();
        reader.onload = function(event){
            mammoth.convertToHtml({arrayBuffer: event.target.result})
            .then(result => processarTexto(result.value, file.name));
        };
        reader.readAsArrayBuffer(file);
    }

    else{
        alert("Use .txt ou .docx");
    }

});

// PROCESSAMENTO
function processarTexto(textoBruto, nomeArquivo){

    let texto = normalizar(textoBruto);

    localStorage.setItem("lapidar_texto_base", texto);

    document.getElementById("previewTexto").innerText = texto;
    document.getElementById("statusUpload").innerText = "Arquivo carregado: " + nomeArquivo;

    mensagemBonita(texto);
    analisarTexto(texto);
    detectarDados(texto);
}

// NORMALIZAÇÃO (A MÁGICA ACONTECE AQUI)
function normalizar(texto){

    texto = texto.replace(/<[^>]*>/g, '');

    texto = texto.replace(/([a-zà-ú])([A-ZÀ-Ú])/g, '$1 $2');

    texto = texto.replace(/\.([A-ZÀ-Ú])/g, '. $1');

    texto = texto.replace(/\. /g, '.\n\n');

    texto = texto.replace(/\n{3,}/g, '\n\n');

    return texto.trim();
}

// MENSAGEM BONITA
function mensagemBonita(texto){

    let tamanho = texto.length;

    let msg = `
    Sua obra foi recebida pelo Bolsão.<br><br>
    O material foi lido, limpo e organizado.<br><br>
    Extensão detectada: ${tamanho} caracteres.<br>
    Sua jornada editorial está pronta para começar.
    `;

    document.getElementById("mensagemBolsao").innerHTML = msg;
}

// ANÁLISE
function analisarTexto(texto){

    let palavras = texto.split(" ").length;

    let estilo = "Narrativo";

    if(palavras < 500){
        estilo = "Texto curto / poético";
    }
    else if(texto.includes("—")){
        estilo = "Narrativo com diálogos";
    }

    let analise = `
    Estilo identificado: <b>${estilo}</b><br>
    Volume: ${palavras} palavras<br>
    Estrutura: Texto organizado e pronto para edição
    `;

    document.getElementById("analiseBolsao").innerHTML = analise;
}

// DETECTAR DADOS
function detectarDados(texto){

    let linhas = texto.split("\n");

    document.getElementById("titulo").value = linhas[0] || "";
    document.getElementById("autor").value = linhas[2] || "";
}

// SALVAR
function salvarDados(){
    localStorage.setItem("titulo", document.getElementById("titulo").value);
    localStorage.setItem("autor", document.getElementById("autor").value);
    alert("Dados salvos!");
}

// LIMPAR
function limparObra(){
    localStorage.clear();
    location.reload();
}

</script>

</body>
</html>
