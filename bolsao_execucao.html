<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cofre Editorial do Autor — Leitura Estrutural</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#eee8dd;
color:#2f2a24;
}

.topo{
background:#e2d8ca;
padding:18px;
text-align:center;
font-size:28px;
font-weight:bold;
border-bottom:1px solid #d2c6b6;
}

.sub{
text-align:center;
padding:10px;
font-size:15px;
color:#6c6257;
}

.container{
max-width:1000px;
margin:auto;
padding:25px;
}

.card{
background:white;
border-radius:14px;
padding:22px;
margin-bottom:20px;
border:1px solid #ddd2c0;
}

.card h2{
margin-top:0;
color:#5c5145;
}

.status{
margin-top:15px;
font-weight:bold;
color:#196b3a;
font-size:18px;
}

.progress{
height:18px;
background:#ddd;
border-radius:10px;
margin-top:15px;
overflow:hidden;
}

.bar{
height:100%;
width:0%;
background:#6f6559;
transition:width .5s;
}

.preview{
margin-top:20px;
background:white;
border:1px solid #ccc;
padding:20px;
border-radius:10px;
white-space:pre-wrap;
line-height:1.7;
}

.botao{
width:100%;
padding:18px;
border:none;
border-radius:12px;
font-size:18px;
font-weight:bold;
cursor:pointer;
margin-top:18px;
}

.workspace{
background:#6f6559;
color:white;
}

.workspace:hover{
background:#584f45;
}

.voltar{
background:#9aa4af;
color:white;
}

.voltar:hover{
background:#7e8893;
}

</style>
</head>

<body>

<div class="topo">
Cofre Editorial do Autor
</div>

<div class="sub">
Leitura estrutural da obra em andamento
</div>

<div class="container">

<div class="card">

<h2>Status da leitura editorial</h2>

<div class="progress">
<div class="bar" id="barra"></div>
</div>

<div class="status" id="status">
Iniciando leitura técnica da obra...
</div>

</div>


<div class="card">

<h2>Processamento editorial</h2>

<div id="preview" class="preview">

Preparando leitura estrutural...

</div>

</div>


<div class="card">

<h2>Próximo passo</h2>

<button
class="botao workspace"
onclick="abrirWorkspace()">

Seguir para Workspace da Obra

</button>

<button
class="botao voltar"
onclick="voltarCofre()">

Retornar ao Cofre Editorial

</button>

</div>

</div>


<script>

let progresso=0

function simularLeitura(){

let barra=document.getElementById("barra")

let status=document.getElementById("status")

let preview=document.getElementById("preview")

let interval=setInterval(()=>{

progresso+=10

barra.style.width=progresso+"%"

if(progresso==20)
status.innerText="Identificando estrutura da obra..."

if(progresso==40)
status.innerText="Separando elementos técnicos..."

if(progresso==60)
status.innerText="Preparando limpeza editorial..."

if(progresso==80)
status.innerText="Confirmando estrutura narrativa..."

if(progresso>=100){

status.innerText="Leitura estrutural concluída com sucesso."

preview.innerText=
`A obra foi analisada com sucesso.

A estrutura editorial foi identificada.

O texto está pronto para seguir para o Workspace.`

clearInterval(interval)

}

},600)

}


function abrirWorkspace(){

window.location.href="obra_workspace.html"

}


function voltarCofre(){

window.location.href="modulo_01_bolsao.html"

}


simularLeitura()

</script>

</body>
</html>
