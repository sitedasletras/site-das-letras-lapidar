<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bolsão de Limpeza Editorial</title>

<script src="https://unpkg.com/mammoth/mammoth.browser.min.js"></script>

<style>
body{
  font-family: Arial;
  background:#f5f1e8;
  margin:0;
  padding:20px;
}

.container{
  max-width:900px;
  margin:auto;
}

.card{
  background:white;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
  box-shadow:0 5px 15px rgba(0,0,0,0.05);
}

.preview{
  background:#fff;
  padding:20px;
  border:1px solid #ccc;
  min-height:250px;
  white-space:pre-wrap;
}

.mensagem{
  background:#e8f5e9;
  border-left:5px solid #4CAF50;
  padding:15px;
  border-radius:8px;
  margin-top:10px;
}

.analise{
  background:#fff8e1;
  border-left:5px solid #f4b400;
  padding:15px;
  border-radius:8px;
}

input{
  width:100%;
  padding:10px;
  margin-bottom:10px;
}

.btn{
  padding:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  margin-top:10px;
}

.green{background:#4CAF50;color:white;}
.red{background:#c0392b;color:white;}
.blue{background:#3498db;color:white;}
</style>
</head>

<body>

<div class="container">

<div class="card">
<h2>Upload da Obra</h2>
<input type="file" id="uploadTexto" accept=".txt,.docx">
<p id="statusUpload">Nenhum arquivo carregado</p>
<button class="btn red" onclick="limparObra()">Limpar obra</button>
</div>

<div class="card">
<h2>Mensagem do Bolsão</h2>
<div id="mensagemBolsao" class="mensagem">
Aguardando leitura da obra...
</div>
</div>

<div class="card">
<h2>Análise Editorial Automática</h2>
<div id="analiseBolsao" class="analise">
Aguardando análise...
</div>
</div>

<div class="card">
<h2>Prévia do Texto Limpo</h2>
<div id="previewTexto" class="preview"></div>
</div>

<div class="card">
<h2>Ficha de Dados da Obra</h2>
<input type="text" id="titulo" placeholder="Título">
<input type="text" id="subtitulo" placeholder="Subtítulo">
<input type="text" id="autor" placeholder="Autor">
<input type="text" id="organizador" placeholder="Organizador (se houver)">
<button class="btn blue" onclick="salvarDados()">Salvar Ficha</button>
</div>

</div>

<script>

// Upload inteligente
document.getElementById('uploadTexto').addEventListener('change', function(e) {

    const file = e.target.files[0];
    if (!file) return;

    const nome = file.name.toLowerCase();

    if(nome.endsWith('.txt')){
        const reader = new FileReader();
        reader.onload = e => processarTexto(e.target.result);
        reader.readAsText(file);
    }

    else if(nome.endsWith('.docx')){
        const reader = new FileReader();
        reader.onload = function(event){
            mammoth.convertToHtml({arrayBuffer: event.target.result})
            .then(result => processarTexto(result.value));
        };
        reader.readAsArrayBuffer(file);
    }

});

// PROCESSAMENTO CENTRAL (CORAÇÃO DO SISTEMA)
function processarTexto(textoBruto){

    let texto = normalizar(textoBruto);

    localStorage.setItem("lapidar_texto_base", texto);

    document.getElementById("previewTexto").innerText = texto;

    mostrarMensagem(texto);
    analisarTexto(texto);
    detectarDados(texto);
}

// NORMALIZAÇÃO
function normalizar(texto){
    return texto
        .replace(/<[^>]*>/g, '')
        .replace(/\n\s*\n/g, '\n\n')
        .trim();
}

// MENSAGEM INTELIGENTE
function mostrarMensagem(texto){

    let tamanho = texto.length;

    let msg = `
    Sua obra foi recebida pelo Bolsão Editorial.<br><br>
    O material foi lido, organizado e preparado como base estrutural.<br><br>
    Extensão detectada: ${tamanho} caracteres.<br>
    Pronto para seguir jornada editorial.
    `;

    document.getElementById("mensagemBolsao").innerHTML = msg;
}

// ANÁLISE DE ESTILO
function analisarTexto(texto){

    let palavras = texto.split(" ").length;

    let estilo = "Narrativo";

    if(palavras < 500){
        estilo = "Poético / Curto";
    }
    else if(texto.includes("—")){
        estilo = "Narrativa com diálogos";
    }

    let analise = `
    Estilo identificado: <b>${estilo}</b><br>
    Volume aproximado: ${palavras} palavras<br>
    Estrutura: Texto contínuo com potencial editorial<br>
    `;

    document.getElementById("analiseBolsao").innerHTML = analise;
}

// DETECÇÃO DE DADOS
function detectarDados(texto){

    let linhas = texto.split("\n");

    document.getElementById("titulo").value = linhas[0] || "";
    document.getElementById("autor").value = linhas[1] || "";
}

// SALVAR
function salvarDados(){
    localStorage.setItem("titulo", document.getElementById("titulo").value);
    localStorage.setItem("autor", document.getElementById("autor").value);
    alert("Ficha salva");
}

// LIMPAR
function limparObra(){
    localStorage.clear();
    location.reload();
}

</script>

</body>
</html>
