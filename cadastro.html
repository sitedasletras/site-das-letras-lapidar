<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro • Lapidar</title>

<style>
body{
margin:0;
font-family:Arial;
background:#e6d3a3;
}

.card{
max-width:460px;
margin:40px auto;
background:#fff;
padding:30px;
border-radius:20px;
box-shadow:0 12px 28px rgba(0,0,0,.12);
}

h2{
text-align:center;
margin-bottom:20px;
}

input{
width:100%;
padding:14px;
margin-bottom:14px;
border-radius:10px;
border:1px solid #ccc;
font-size:15px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#1f3f75;
color:#fff;
font-weight:bold;
font-size:16px;
cursor:pointer;
}

.msg{
margin-top:14px;
padding:12px;
border-radius:10px;
font-size:14px;
display:none;
}

.ok{
display:block;
background:#eef8f0;
border:1px solid #b8dfc0;
color:#1f6b36;
}

.erro{
display:block;
background:#fff1f1;
border:1px solid #efc0c0;
color:#a12626;
}
</style>
</head>

<body>

<div class="card">

<h2>Criar cadastro</h2>

<input id="nome" placeholder="Nome completo">
<input id="email" placeholder="Email">
<input id="telefone" placeholder="Telefone internacional (+55...)">
<input id="senha" type="password" placeholder="Senha">

<button onclick="salvarCadastro()">Salvar cadastro</button>

<div id="msg" class="msg"></div>

</div>

<script>

function mostrar(tipo,texto){
const box = document.getElementById("msg");
box.className = "msg " + tipo;
box.innerText = texto;
}

function salvarCadastro(){

const nome = document.getElementById("nome").value.trim();
const email = document.getElementById("email").value.trim().toLowerCase();
const telefone = document.getElementById("telefone").value.trim();
const senha = document.getElementById("senha").value;

if(!nome || !email || !senha){
mostrar("erro","Preencha os campos obrigatórios.");
return;
}

let lista = localStorage.getItem("lapidar_cadastros");

if(lista){
lista = JSON.parse(lista);
}else{
lista = [];
}

const existe = lista.find(u => u.email === email);

if(existe){
mostrar("erro","Este e-mail já está cadastrado.");
return;
}

const novoUsuario = {

id: "cad_" + Date.now(),

nomeCompleto: nome,

email: email,

telefone: telefone,

senha: senha

};

lista.push(novoUsuario);

localStorage.setItem("lapidar_cadastros", JSON.stringify(lista));

mostrar("ok","Cadastro criado com sucesso.");

setTimeout(() => {

window.location.href = "index.html";

}, 800);

}

</script>

</body>
</html>
