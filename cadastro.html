<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cadastro • Lapidar</title>

<style>

body{

font-family:Arial;
background:#f4efe4;
margin:0;

}

.container{

max-width:500px;
margin:auto;
padding:40px 20px;

}

.box{

background:white;
padding:30px;
border-radius:16px;
box-shadow:0 10px 25px rgba(0,0,0,0.08);

}

h1{

margin-top:0;

}

label{

display:block;
margin-top:20px;
font-weight:bold;

}

input{

width:100%;
padding:12px;
margin-top:6px;
border-radius:8px;
border:1px solid #ccc;

}

button{

width:100%;
padding:16px;
margin-top:25px;
border:none;
background:#17335d;
color:white;
font-size:16px;
border-radius:10px;
cursor:pointer;

}

.sair{

background:#aaa;

}

</style>

</head>

<body>

<div class="container">

<div class="box">

<h1>Criar cadastro</h1>

<form onsubmit="salvarCadastro(event)">

<label>Nome completo</label>
<input id="nome" required>

<label>Email</label>
<input id="email" type="email" required>

<label>Telefone internacional</label>

<input
type="tel"
id="telefone"
placeholder="+55 11999999999"
required
pattern="^\+[1-9]{1}[0-9]{3,14}$"
>

<label>Senha</label>
<input id="senha" type="password" required>

<button type="submit">

Criar cadastro

</button>

<button type="button"
class="sair"
onclick="sairSistema()">

Cancelar cadastro

</button>

</form>

</div>

</div>

<script>

function salvarCadastro(event){

event.preventDefault()

const nome =
document.getElementById("nome").value

const email =
document.getElementById("email").value

const telefone =
document.getElementById("telefone").value

const senha =
document.getElementById("senha").value


localStorage.setItem("lapidar_nome",nome)

localStorage.setItem("lapidar_email",email)

localStorage.setItem("lapidar_telefone",telefone)

localStorage.setItem("lapidar_senha",senha)


localStorage.setItem(
"lapidar_status_fluxo",
"cadastro_criado"
)


window.location.href =
"criar_perfil.html"

}


function sairSistema(){

window.location.href =
"index.html"

}

</script>

</body>
</html>
