<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OKapista • Lapidar</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
background:#0f1f13;
color:white;
}

header{
background:#2e7d32;
padding:16px;
display:flex;
justify-content:space-between;
align-items:center;
}

header h1{
margin:0;
font-size:22px;
}

button{
border:none;
border-radius:10px;
padding:12px 16px;
font-weight:bold;
cursor:pointer;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.card{
background:#183321;
padding:20px;
border-radius:14px;
margin-bottom:18px;
}

label{
display:block;
margin-top:12px;
font-weight:bold;
}

input, select, textarea{
width:100%;
padding:10px;
margin-top:6px;
border-radius:8px;
border:none;
font-size:16px;
}

textarea{
min-height:120px;
}

.btn-verde{
background:#2e7d32;
color:white;
}

.btn-azul{
background:#365a9c;
color:white;
}

.btn-dourado{
background:#b8943c;
color:white;
}

.btn-cinza{
background:#8a97a8;
color:white;
}

.status{
margin-top:12px;
background:#23422b;
padding:12px;
border-radius:10px;
}

</style>
</head>

<body>

<header>
<h1>OKapista</h1>
<button onclick="history.back()" class="btn-cinza">Voltar</button>
</header>

<div class="container">

<div class="card">

<h2>Projeto ativo</h2>

<div id="projetoAtivo">

Carregando projeto...

</div>

</div>


<div class="card">

<h2>Modo da capa</h2>

<label>Modo</label>

<select id="modoCapa">

<option>Nacional</option>
<option>Internacional</option>
<option>Híbrido</option>

</select>


<label>Tipo de projeto</label>

<select id="tipoProjeto">

<option>Obra individual</option>
<option>Antologia</option>
<option>Miscelânea</option>
<option>Coletânea</option>

</select>


<label>Descrição do modo</label>

<textarea id="descricaoModoCapa"></textarea>


<button class="btn-azul" onclick="aplicarModo()">Aplicar padrão</button>

<button class="btn-dourado" onclick="salvarModo()">Salvar modo</button>

<div class="status" id="statusModo">

Nenhum modo salvo ainda

</div>

</div>


<div class="card">

<h2>Dados da capa</h2>

<label>Título</label>

<input id="tituloObra">


<label>Subtítulo</label>

<input id="subtituloObra">


<label>Autor</label>

<input id="autorObra">


<label>Sinopse</label>

<textarea id="sinopseObra"></textarea>


<label>Biografia</label>

<textarea id="biografiaObra"></textarea>


<label>Destino da sinopse</label>

<select id="destinoSinopse">

<option>Contracapa</option>
<option>Orelha dianteira</option>
<option>Não usar</option>

</select>


<label>Destino da biografia</label>

<select id="destinoBiografia">

<option>Orelha traseira</option>
<option>Contracapa</option>
<option>Não usar</option>

</select>


<label>Foto do autor</label>

<select id="fotoAutor">

<option>Não</option>
<option>Sim</option>

</select>


<label>Tipo de capa</label>

<select id="tipoCapa">

<option>Física</option>
<option>E-book</option>
<option>Física + E-book</option>

</select>

</div>


<div class="card">

<h2>Upload de imagens</h2>

<label>Capa frontal</label>
<input type="file">

<label>Contracapa</label>
<input type="file">

<label>Orelha dianteira</label>
<input type="file">

<label>Orelha traseira</label>
<input type="file">

<label>Foto do autor</label>
<input type="file">

</div>


<div class="card">

<h2>Confirmação</h2>

<button class="btn-verde" onclick="confirmarCapa()">

Confirmar capa e seguir

</button>


<button class="btn-cinza" onclick="irExpedicao()">

Ir direto para expedição

</button>

</div>


</div>


<script>


function aplicarModo(){

let modo=document.getElementById("modoCapa").value

let texto=""

if(modo=="Nacional")

texto="Capa voltada ao mercado nacional"

if(modo=="Internacional")

texto="Capa com padrão internacional"

if(modo=="Híbrido")

texto="Capa híbrida nacional + internacional"

document.getElementById("descricaoModoCapa").value=texto

}



function salvarModo(){

sessionStorage.setItem("modoCapa",

document.getElementById("modoCapa").value)

document.getElementById("statusModo").innerText=

"Modo salvo com sucesso"

}



function confirmarCapa(){

salvarModo()

window.location.href="expedicao_material.html"

}



function irExpedicao(){

window.location.href="expedicao_material.html"

}



window.onload=function(){

let titulo=localStorage.getItem("lapidar_obra_titulo")

let autor=localStorage.getItem("lapidar_obra_autor")

let subtitulo=localStorage.getItem("lapidar_obra_subtitulo")


if(titulo)

document.getElementById("tituloObra").value=titulo


if(autor)

document.getElementById("autorObra").value=autor


if(subtitulo)

document.getElementById("subtituloObra").value=subtitulo


document.getElementById("projetoAtivo").innerText=

(titulo||"Obra não identificada")+

"\nAutor: "+

(autor||"Autor não identificado")

}


</script>


</body>
</html>
