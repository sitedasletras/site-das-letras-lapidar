<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lapidar — Configuração da Capa</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#5a0000;
color:white;
}

.container{
max-width:960px;
margin:auto;
padding:40px 20px;
}

h1{
text-align:center;
margin-bottom:10px;
}

.sub{
text-align:center;
margin-bottom:30px;
opacity:.9;
}

.card{
background:white;
color:black;
padding:30px;
border-radius:14px;
box-shadow:0 5px 15px rgba(0,0,0,.3);
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.campo{
margin-bottom:18px;
}

label{
display:block;
font-weight:bold;
margin-bottom:8px;
}

input, select, textarea{
width:100%;
padding:12px;
border-radius:8px;
border:1px solid #ccc;
font-size:15px;
box-sizing:border-box;
}

textarea{
min-height:100px;
resize:vertical;
}

.preview{
margin-top:25px;
padding:18px;
background:#f3f3f3;
border-radius:10px;
border:1px solid #ddd;
line-height:1.6;
}

.botoes{
margin-top:25px;
display:flex;
flex-direction:column;
gap:14px;
}

.botao{
width:100%;
padding:18px;
font-size:18px;
border:none;
border-radius:10px;
cursor:pointer;
}

.botao-continuar{
background:#28a745;
color:white;
}

.botao-voltar{
background:#ffc107;
color:black;
}

.botao-sair{
background:#dc3545;
color:white;
}

.botao:hover{
opacity:.92;
}

@media(max-width:800px){
.grid{
grid-template-columns:1fr;
}
}
</style>
</head>
<body>

<div class="container">
<h1>Configuração da Capa</h1>
<div class="sub">Defina os parâmetros visuais principais antes de seguir para idioma, planos e geração.</div>

<div class="card">

<div class="grid">

<div>
<div class="campo">
<label for="titulo">Título da obra</label>
<input type="text" id="titulo">
</div>

<div class="campo">
<label for="subtitulo">Subtítulo</label>
<input type="text" id="subtitulo">
</div>

<div class="campo">
<label for="autor">Autor</label>
<input type="text" id="autor">
</div>

<div class="campo">
<label for="serie">Série / trilogia / volume</label>
<input type="text" id="serie">
</div>

<div class="campo">
<label for="estilo">Estilo visual</label>
<select id="estilo">
<option value="classico">Clássico</option>
<option value="moderno">Moderno</option>
<option value="dramatico">Dramático</option>
<option value="gotico">Gótico</option>
<option value="minimalista">Minimalista</option>
<option value="institucional">Institucional</option>
</select>
</div>
</div>

<div>
<div class="campo">
<label for="paleta">Paleta principal</label>
<input type="text" id="paleta" placeholder="Ex.: verde escuro, dourado, preto">
</div>

<div class="campo">
<label for="tipografia">Tipografia de destaque</label>
<input type="text" id="tipografia" placeholder="Ex.: serifada clássica">
</div>

<div class="campo">
<label for="elementos">Elementos visuais desejados</label>
<textarea id="elementos" placeholder="Ex.: igreja antiga, procissão, névoa, velas, sombra"></textarea>
</div>

<div class="campo">
<label for="observacoes">Observações do capista</label>
<textarea id="observacoes" placeholder="Detalhes importantes para a composição da capa"></textarea>
</div>
</div>

</div>

<div class="preview" id="previewCapa">
Prévia textual da configuração da capa aparecerá aqui.
</div>

<div class="botoes">
<button class="botao botao-continuar" onclick="salvarEContinuar()">
Salvar configuração e seguir para idioma da capa
</button>

<button class="botao botao-voltar" onclick="window.location.href='capista_upload_tecnica.html'">
Voltar ao upload técnico
</button>

<button class="botao botao-sair" onclick="window.location.href='departamentos.html'">
Sair do sistema
</button>
</div>

</div>
</div>

<script>
function carregarJSON(chave){
const salvo = localStorage.getItem(chave);
if(!salvo) return null;
try{
return JSON.parse(salvo);
}catch(e){
return null;
}
}

function preencherCampos(){
const entrada = carregarJSON("lapidar_entrada_bolsao") || {};
const obra = carregarJSON("obraAtual") || {};
const capista = carregarJSON("okapista_obra") || {};

const titulo = entrada.tituloManual || entrada.tituloBase || obra?.estrutura?.titulo || "";
const subtitulo = entrada.subtituloManual || entrada.subtituloBase || "";
const autor = entrada.autoresManual || entrada.autorBase || obra?.estrutura?.autor || "";
const serie = [entrada.colecao, entrada.serie, entrada.volume].filter(Boolean).join(" | ");

document.getElementById("titulo").value = capista.titulo || titulo;
document.getElementById("subtitulo").value = capista.subtitulo || subtitulo;
document.getElementById("autor").value = capista.autor || autor;
document.getElementById("serie").value = capista.serie || serie;
document.getElementById("estilo").value = capista.estilo || "classico";
document.getElementById("paleta").value = capista.paleta || "";
document.getElementById("tipografia").value = capista.tipografia || "";
document.getElementById("elementos").value = capista.elementos || "";
document.getElementById("observacoes").value = capista.observacoes || "";

atualizarPreview();
}

function atualizarPreview(){
const titulo = document.getElementById("titulo").value || "Sem título";
const subtitulo = document.getElementById("subtitulo").value || "Sem subtítulo";
const autor = document.getElementById("autor").value || "Sem autor";
const serie = document.getElementById("serie").value || "Sem série";
const estilo = document.getElementById("estilo").value || "sem estilo";
const paleta = document.getElementById("paleta").value || "sem paleta";
const tipografia = document.getElementById("tipografia").value || "sem tipografia";
const elementos = document.getElementById("elementos").value || "sem elementos visuais definidos";

document.getElementById("previewCapa").innerText =
"Título: " + titulo + "\n" +
"Subtítulo: " + subtitulo + "\n" +
"Autor: " + autor + "\n" +
"Série/volume: " + serie + "\n" +
"Estilo: " + estilo + "\n" +
"Paleta: " + paleta + "\n" +
"Tipografia: " + tipografia + "\n" +
"Elementos: " + elementos;
}

function salvarEContinuar(){
const dados = {
titulo: document.getElementById("titulo").value || "",
subtitulo: document.getElementById("subtitulo").value || "",
autor: document.getElementById("autor").value || "",
serie: document.getElementById("serie").value || "",
estilo: document.getElementById("estilo").value || "",
paleta: document.getElementById("paleta").value || "",
tipografia: document.getElementById("tipografia").value || "",
elementos: document.getElementById("elementos").value || "",
observacoes: document.getElementById("observacoes").value || ""
};

localStorage.setItem("okapista_configuracao", JSON.stringify(dados));
window.location.href = "capista_idioma.html";
}

[
"titulo","subtitulo","autor","serie","estilo","paleta","tipografia","elementos","observacoes"
].forEach(id=>{
window.addEventListener("load", ()=>{
const el = document.getElementById(id);
if(el) el.addEventListener("input", atualizarPreview);
if(el && el.tagName === "SELECT") el.addEventListener("change", atualizarPreview);
});
});

window.addEventListener("load", preencherCampos);
</script>

</body>
</html>
