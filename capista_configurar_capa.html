<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Capista — Configurar Capa</title>

<style>
:root{
--bg:#0d0603;
--card:#140c08;
--card2:#1b100a;
--text:#ffffff;
--muted:#ffd2b3;
--orange:#f7b22c;
--green:#9cfdb2;
--border:rgba(255,123,44,0.18);
--shadow:0 10px 26px rgba(0,0,0,0.28);
}

body{
margin:0;
font-family:Arial, sans-serif;
background:var(--bg);
color:var(--text);
}

.container{
width:min(1100px,95%);
margin:auto;
padding:40px 0 60px;
}

.titulo{
font-size:36px;
font-weight:bold;
}

.subtitulo{
margin-top:6px;
color:var(--orange);
}

.card{
margin-top:24px;
background:var(--card);
border:1px solid var(--border);
border-radius:18px;
padding:22px;
box-shadow:var(--shadow);
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px;
}

label{
display:block;
margin-bottom:6px;
color:var(--orange);
font-weight:bold;
}

input, select, textarea{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#1b0e07;
color:#fff;
box-sizing:border-box;
}

textarea{
min-height:120px;
resize:vertical;
}

.status{
margin-top:18px;
padding:16px;
border-radius:12px;
background:rgba(247,178,44,0.12);
border:1px solid rgba(247,178,44,0.25);
color:#ffe7b0;
}

.preview{
margin-top:18px;
padding:18px;
border-radius:14px;
background:var(--card2);
line-height:1.8;
}

.actions{
margin-top:24px;
display:flex;
flex-wrap:wrap;
gap:12px;
}

button{
border:none;
padding:14px 18px;
border-radius:999px;
cursor:pointer;
font-weight:bold;
}

.btnSalvar{
background:#174d27;
color:#fff;
}

.btnCalcular{
background:#ff5a00;
color:#fff;
}

.btnGerar{
background:#5a2c00;
color:#fff;
}

.btnIndice{
background:#24150f;
color:#fff;
}

@media(max-width:900px){
.grid{
grid-template-columns:1fr;
}
}
</style>
</head>

<body>

<div class="container">

<div class="titulo">Configuração Técnica da Capa</div>
<div class="subtitulo">Integração entre projeto, ficha editorial e cálculo de lombada</div>

<div id="statusSistema" class="status">
Verificando projeto ativo...
</div>

<div class="card">
  <div class="grid">
    <div>
      <label for="tituloObra">Título da obra</label>
      <input id="tituloObra">
    </div>

    <div>
      <label for="subtituloObra">Subtítulo</label>
      <input id="subtituloObra">
    </div>

    <div>
      <label for="autorObra">Autor / identidade autoral</label>
      <input id="autorObra">
    </div>

    <div>
      <label for="formatoObra">Formato</label>
      <select id="formatoObra">
        <option>A5</option>
        <option>16x23</option>
        <option>16x27</option>
        <option>6x9</option>
        <option>A4</option>
      </select>
    </div>

    <div>
      <label for="paginasObra">Total de páginas</label>
      <input id="paginasObra" type="number" min="1" placeholder="Ex.: 120">
    </div>

    <div>
      <label for="papelObra">Tipo de papel</label>
      <select id="papelObra">
        <option value="0.050">Offset 75g</option>
        <option value="0.060">Offset 90g</option>
        <option value="0.070">Pólen 80g</option>
        <option value="0.065">Premium 90g</option>
      </select>
    </div>

    <div>
      <label for="gramaturaObra">Gramatura exibida</label>
      <select id="gramaturaObra">
        <option>75g</option>
        <option>80g</option>
        <option>90g</option>
      </select>
    </div>

    <div>
      <label for="seloObra">Selo editorial</label>
      <input id="seloObra" value="Site das Letras Edições Literárias">
    </div>
  </div>

  <div style="margin-top:18px;">
    <label for="observacoesCapa">Observações técnicas da capa</label>
    <textarea id="observacoesCapa" placeholder="Ex.: selo no canto inferior esquerdo, sem ISBN, lombada com tipografia oficial, orelha traseira sem foto..."></textarea>
  </div>

  <div class="actions">
    <button class="btnCalcular" onclick="calcularCapa()">Calcular capa técnica</button>
    <button class="btnSalvar" onclick="salvarConfiguracaoCapa()">Salvar configuração</button>
    <button class="btnGerar" onclick="abrirGeradorCapa()">Abrir gerador de capa</button>
    <button class="btnIndice" onclick="voltarIndice()">Voltar ao índice</button>
  </div>

  <div id="previewCapa" class="preview">
    A prévia técnica da capa aparecerá aqui.
  </div>
</div>

</div>

<script src="auditoria.js"></script>

<script>
function verificarSessao(){
  if(localStorage.getItem("SDL_sessao_ativa") !== "sim"){
    window.location.href = "login.html";
  }
}

function obterProjetoAtivo(){
  try{
    const lista = JSON.parse(localStorage.getItem("SDL_projetos_lista") || "[]");
    const ativo = localStorage.getItem("SDL_projeto_ativo");
    return lista.find(p => p.id === ativo) || null;
  }catch{
    return null;
  }
}

function carregarProjetoNaTela(){
  const projeto = obterProjetoAtivo();
  const status = document.getElementById("statusSistema");

  if(!projeto){
    status.innerHTML = "Nenhum projeto ativo selecionado.";
    return;
  }

  status.innerHTML = "Projeto ativo carregado: <strong>" + (projeto.titulo || "Sem título") + "</strong>";
  status.style.background = "rgba(23,77,39,0.28)";

  document.getElementById("tituloObra").value = projeto.titulo || "";
  document.getElementById("subtituloObra").value = projeto.subtitulo || "";
  document.getElementById("autorObra").value = projeto.autor || "";
  document.getElementById("formatoObra").value = projeto.formato || "A5";

  carregarConfiguracaoAnterior();
}

function carregarConfiguracaoAnterior(){
  try{
    const cfg = JSON.parse(localStorage.getItem("SDL_configuracao_capa_ativa") || "null");
    const projeto = obterProjetoAtivo();

    if(!cfg || !projeto || cfg.projetoID !== projeto.id){
      return;
    }

    document.getElementById("tituloObra").value = cfg.titulo || document.getElementById("tituloObra").value;
    document.getElementById("subtituloObra").value = cfg.subtitulo || "";
    document.getElementById("autorObra").value = cfg.autor || document.getElementById("autorObra").value;
    document.getElementById("formatoObra").value = cfg.formato || "A5";
    document.getElementById("paginasObra").value = cfg.paginas || "";
    document.getElementById("gramaturaObra").value = cfg.gramatura || "75g";
    document.getElementById("seloObra").value = cfg.selo || "Site das Letras Edições Literárias";
    document.getElementById("observacoesCapa").value = cfg.observacoes || "";

    const papelSelect = document.getElementById("papelObra");
    for(let i=0;i<papelSelect.options.length;i++){
      if(parseFloat(papelSelect.options[i].value) === Number(cfg.fatorPapel)){
        papelSelect.selectedIndex = i;
        break;
      }
    }

    if(cfg.previewHTML){
      document.getElementById("previewCapa").innerHTML = cfg.previewHTML;
    }
  }catch(e){}
}

function obterDimensoesFormato(formato){
  const mapa = {
    "A5": { largura: 148, altura: 210 },
    "16x23": { largura: 160, altura: 230 },
    "16x27": { largura: 160, altura: 270 },
    "6x9": { largura: 152.4, altura: 228.6 },
    "A4": { largura: 210, altura: 297 }
  };
  return mapa[formato] || mapa["A5"];
}

function montarResumoTecnico(){
  const titulo = document.getElementById("tituloObra").value.trim();
  const subtitulo = document.getElementById("subtituloObra").value.trim();
  const autor = document.getElementById("autorObra").value.trim();
  const formato = document.getElementById("formatoObra").value;
  const paginas = parseInt(document.getElementById("paginasObra").value, 10);
  const fator = parseFloat(document.getElementById("papelObra").value);
  const papelNome = document.getElementById("papelObra").selectedOptions[0].text;
  const gramatura = document.getElementById("gramaturaObra").value;
  const selo = document.getElementById("seloObra").value.trim();
  const observacoes = document.getElementById("observacoesCapa").value.trim();

  if(!titulo || !autor || !paginas || paginas < 1){
    return null;
  }

  const dim = obterDimensoesFormato(formato);
  const lombada = (paginas * fator).toFixed(2);
  const larguraAberta = (dim.largura * 2 + Number(lombada)).toFixed(2);

  let html = "";
  html += "<strong>Título:</strong> " + titulo + "<br>";
  html += "<strong>Subtítulo:</strong> " + (subtitulo || "—") + "<br>";
  html += "<strong>Autor:</strong> " + autor + "<br>";
  html += "<strong>Formato:</strong> " + formato + " (" + dim.largura + " x " + dim.altura + " mm)<br>";
  html += "<strong>Páginas:</strong> " + paginas + "<br>";
  html += "<strong>Tipo de papel:</strong> " + papelNome + "<br>";
  html += "<strong>Gramatura:</strong> " + gramatura + "<br>";
  html += "<strong>Lombada estimada:</strong> " + lombada + " mm<br>";
  html += "<strong>Largura total da capa aberta:</strong> " + larguraAberta + " mm<br>";
  html += "<strong>Altura da capa:</strong> " + dim.altura + " mm<br>";
  html += "<strong>Selo editorial:</strong> " + (selo || "Não informado") + "<br>";
  html += "<strong>Observações:</strong> " + (observacoes || "Sem observações") + "<br><br>";
  html += "Recomendação: usar esta base para montar frente + lombada + contra-capa com margem de segurança e validação final da gráfica.";

  return {
    titulo,
    subtitulo,
    autor,
    formato,
    paginas,
    fatorPapel: fator,
    papelNome,
    gramatura,
    selo,
    observacoes,
    largura: dim.largura,
    altura: dim.altura,
    lombada,
    larguraAberta,
    previewHTML: html
  };
}

function calcularCapa(){
  const resumo = montarResumoTecnico();

  if(!resumo){
    document.getElementById("previewCapa").innerHTML =
      "Preencha pelo menos título, autor e total de páginas.";
    return;
  }

  document.getElementById("previewCapa").innerHTML = resumo.previewHTML;
}

function salvarConfiguracaoCapa(){
  const projeto = obterProjetoAtivo();

  if(!projeto){
    alert("Nenhum projeto ativo selecionado.");
    return;
  }

  const resumo = montarResumoTecnico();

  if(!resumo){
    alert("Preencha pelo menos título, autor e total de páginas antes de salvar.");
    return;
  }

  const configuracao = {
    projetoID: projeto.id,
    dataRegistro: new Date().toISOString(),
    ...resumo
  };

  localStorage.setItem("SDL_configuracao_capa_ativa", JSON.stringify(configuracao));

  try{
    SDL_registrarAuditoria("Configuração técnica da capa salva", "capista_configurar_capa");
  }catch(e){}

  document.getElementById("previewCapa").innerHTML = resumo.previewHTML;
  alert("Configuração técnica da capa salva com sucesso.");
}

function abrirGeradorCapa(){
  window.location.href = "capista_gerar_capa.html";
}

function voltarIndice(){
  window.location.href = "_Indice.html";
}

verificarSessao();
carregarProjetoNaTela();
</script>

</body>
</html>
