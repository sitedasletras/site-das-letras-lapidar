<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Configurar geração de capa — Capista</title>

<style>

body{
margin:0;
background:#0c0603;
font-family:Arial;
color:white;
display:flex;
justify-content:center;
}

.container{
max-width:720px;
width:92%;
padding:40px 0 60px 0;
}

.titulo{
font-size:34px;
text-align:center;
font-weight:bold;
}

.subtitulo{
text-align:center;
color:#ff7b2c;
margin-top:10px;
margin-bottom:28px;
}

.card{
background:#140c08;
border-radius:14px;
padding:26px;
margin-top:20px;
}

label{
display:block;
margin-top:18px;
color:#ffd2b3;
}

select{
width:100%;
padding:12px;
margin-top:6px;
border-radius:8px;
border:none;
}

.botao{
width:100%;
padding:18px;
margin-top:24px;
border:none;
border-radius:40px;
background:#ff5a00;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.info{
margin-top:14px;
font-size:14px;
color:#ffcfaa;
}

</style>

</head>

<body>

<div class="container">

<div class="titulo">

Configurar geração da capa

</div>

<div class="subtitulo">

Escolha o formato editorial da capa antes de gerar

</div>

<div class="card">

<label>

Tipo de capa

</label>

<select id="tipoCapa">

<option value="fisica">Livro físico</option>
<option value="epub">EPUB digital</option>
<option value="ambos">Livro físico + EPUB</option>

</select>

<label>

Idioma principal da capa

</label>

<select id="idiomaPrincipal">

<option value="pt">Português</option>
<option value="en">English</option>
<option value="es">Español</option>
<option value="it">Italiano</option>
<option value="fr">Français</option>
<option value="de">Deutsch</option>

</select>

<label>

Gerar capa também em outro idioma (até 20%)

</label>

<select id="idiomaExtra">

<option value="nenhum">Não gerar outro idioma</option>
<option value="en">English</option>
<option value="es">Español</option>
<option value="it">Italiano</option>
<option value="fr">Français</option>
<option value="de">Deutsch</option>

</select>

<div class="info">

Planos Capista permitem até 20% das capas em idioma alternativo.

</div>

<button class="botao"

onclick="registrarConfiguracaoCapa()">

Confirmar configuração da capa

</button>

<button class="botao"

onclick="window.location.href='_Indice.html'">

Voltar para casa do original

</button>

</div>

</div>

<script>

function registrarConfiguracaoCapa(){

const tipoCapa =

document.getElementById("tipoCapa").value;

const idiomaPrincipal =

document.getElementById("idiomaPrincipal").value;

const idiomaExtra =

document.getElementById("idiomaExtra").value;

localStorage.setItem("CAPISTA_tipo_capa", tipoCapa);

localStorage.setItem("CAPISTA_idioma_principal", idiomaPrincipal);

if(idiomaExtra !== "nenhum"){

localStorage.setItem("CAPISTA_idioma_extra", idiomaExtra);

}

alert("Configuração registrada com sucesso.");

window.location.href = "capista_gerar_capa.html";

}

</script>

</body>

</html>
