<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Capista — Gerar Capa</title>

<style>
:root{
--bg:#0d0603;
--card:#140c08;
--card2:#1b100a;
--text:#ffffff;
--muted:#ffd2b3;
--orange:#f7b22c;
--border:rgba(255,123,44,0.18);
--shadow:0 10px 26px rgba(0,0,0,0.28);
}

body{
margin:0;
font-family:Arial, sans-serif;
background:var(--bg);
color:var(--text);
}

.container{
width:min(1100px,95%);
margin:auto;
padding:40px 0 60px;
}

.titulo{
font-size:36px;
font-weight:bold;
}

.subtitulo{
margin-top:6px;
color:var(--orange);
}

.card{
margin-top:24px;
background:var(--card);
border:1px solid var(--border);
border-radius:18px;
padding:22px;
box-shadow:var(--shadow);
}

.status{
margin-top:18px;
padding:16px;
border-radius:12px;
background:rgba(247,178,44,0.12);
border:1px solid rgba(247,178,44,0.25);
color:#ffe7b0;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px;
margin-top:18px;
}

.box{
padding:18px;
border-radius:14px;
background:var(--card2);
line-height:1.8;
}

.canvasTecnico{
margin-top:18px;
padding:18px;
border-radius:14px;
background:#120b07;
border:1px dashed rgba(255,123,44,0.28);
}

.faixa{
display:flex;
height:180px;
border:1px solid rgba(255,255,255,0.08);
overflow:hidden;
border-radius:10px;
}

.coluna{
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:10px;
font-weight:bold;
font-size:14px;
line-height:1.5;
}

.frente{
background:#1d130d;
}

.lombada{
background:#2a160d;
}

.contra{
background:#1a110b;
}

.actions{
margin-top:24px;
display:flex;
flex-wrap:wrap;
gap:12px;
}

button{
border:none;
padding:14px 18px;
border-radius:999px;
cursor:pointer;
font-weight:bold;
}

.btnVoltar{
background:#24150f;
color:#fff;
}

.btnConfig{
background:#5a2c00;
color:#fff;
}

.btnPrint{
background:#174d27;
color:#fff;
}

@media(max-width:900px){
.grid{
grid-template-columns:1fr;
}
}
</style>
</head>

<body>

<div class="container">

<div class="titulo">Gerador Técnico da Capa</div>
<div class="subtitulo">Prévia estrutural baseada na configuração salva</div>

<div id="statusGerador" class="status">
Carregando configuração da capa...
</div>

<div class="grid">
  <div class="card">
    <div id="dadosTecnicos" class="box">
      Nenhuma configuração carregada.
    </div>
  </div>

  <div class="card">
    <div id="dadosTextuais" class="box">
      Nenhum conteúdo carregado.
    </div>
  </div>
</div>

<div class="card">
  <div class="canvasTecnico">
    <div id="faixaTecnica" class="faixa">
      <div class="coluna contra" style="width:40%;">Contra-capa</div>
      <div class="coluna lombada" style="width:20%;">Lombada</div>
      <div class="coluna frente" style="width:40%;">Frente</div>
    </div>
  </div>
</div>

<div class="actions">
  <button class="btnConfig" onclick="abrirConfiguracao()">Voltar à configuração técnica</button>
  <button class="btnPrint" onclick="window.print()">Exportar PDF técnico</button>
  <button class="btnVoltar" onclick="voltarIndice()">Voltar ao índice</button>
</div>

</div>

<script src="auditoria.js"></script>

<script>
function verificarSessao(){
  if(localStorage.getItem("SDL_sessao_ativa") !== "sim"){
    window.location.href = "login.html";
  }
}

function obterProjetoAtivo(){
  try{
    const lista = JSON.parse(localStorage.getItem("SDL_projetos_lista") || "[]");
    const ativo = localStorage.getItem("SDL_projeto_ativo");
    return lista.find(p => p.id === ativo) || null;
  }catch{
    return null;
  }
}

function carregarGerador(){
  const projeto = obterProjetoAtivo();
  const status = document.getElementById("statusGerador");

  if(!projeto){
    status.innerHTML = "Nenhum projeto ativo selecionado.";
    return;
  }

  let cfg = null;

  try{
    cfg = JSON.parse(localStorage.getItem("SDL_configuracao_capa_ativa") || "null");
  }catch(e){}

  if(!cfg || cfg.projetoID !== projeto.id){
    status.innerHTML = "Nenhuma configuração técnica salva para este projeto.";
    return;
  }

  status.innerHTML = "Configuração técnica carregada para: <strong>" + (cfg.titulo || projeto.titulo || "Sem título") + "</strong>";
  status.style.background = "rgba(23,77,39,0.28)";

  document.getElementById("dadosTecnicos").innerHTML =
    "<strong>Formato:</strong> " + (cfg.formato || "—") + "<br>" +
    "<strong>Dimensão da capa:</strong> " + (cfg.largura || "—") + " x " + (cfg.altura || "—") + " mm<br>" +
    "<strong>Páginas:</strong> " + (cfg.paginas || "—") + "<br>" +
    "<strong>Papel:</strong> " + (cfg.papelNome || "—") + "<br>" +
    "<strong>Gramatura:</strong> " + (cfg.gramatura || "—") + "<br>" +
    "<strong>Lombada:</strong> " + (cfg.lombada || "—") + " mm<br>" +
    "<strong>Largura aberta:</strong> " + (cfg.larguraAberta || "—") + " mm<br>" +
    "<strong>Selo:</strong> " + (cfg.selo || "—");

  document.getElementById("dadosTextuais").innerHTML =
    "<strong>Título:</strong> " + (cfg.titulo || "—") + "<br>" +
    "<strong>Subtítulo:</strong> " + (cfg.subtitulo || "—") + "<br>" +
    "<strong>Autor:</strong> " + (cfg.autor || "—") + "<br><br>" +
    "<strong>Observações técnicas:</strong><br>" + (cfg.observacoes || "Sem observações");

  renderizarFaixa(cfg);

  try{
    SDL_registrarAuditoria("Gerador técnico da capa aberto", "capista_gerar_capa");
  }catch(e){}
}

function renderizarFaixa(cfg){
  const largura = Number(cfg.largura) || 148;
  const lombada = Number(cfg.lombada) || 10;
  const total = largura * 2 + lombada;

  const contraPct = ((largura / total) * 100).toFixed(2);
  const lombadaPct = ((lombada / total) * 100).toFixed(2);
  const frentePct = ((largura / total) * 100).toFixed(2);

  document.getElementById("faixaTecnica").innerHTML =
    '<div class="coluna contra" style="width:' + contraPct + '%;">Contra-capa<br>' + largura + ' mm</div>' +
    '<div class="coluna lombada" style="width:' + lombadaPct + '%;">Lombada<br>' + lombada + ' mm</div>' +
    '<div class="coluna frente" style="width:' + frentePct + '%;">Frente<br>' + largura + ' mm</div>';
}

function abrirConfiguracao(){
  window.location.href = "capista_configurar_capa.html";
}

function voltarIndice(){
  window.location.href = "_Indice.html";
}

verificarSessao();
carregarGerador();
</script>

</body>
</html>
