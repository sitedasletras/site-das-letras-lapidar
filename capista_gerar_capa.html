<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gerar capa — Capista</title>

<style>

body{
margin:0;
background:#0c0603;
font-family:Arial;
color:white;
display:flex;
justify-content:center;
}

.container{
max-width:720px;
width:92%;
padding:40px 0 60px 0;
}

.titulo{
font-size:34px;
text-align:center;
font-weight:bold;
}

.subtitulo{
text-align:center;
color:#ff7b2c;
margin-top:10px;
margin-bottom:28px;
}

.card{
background:#140c08;
border-radius:14px;
padding:26px;
margin-top:20px;
line-height:1.7;
}

.botao{
width:100%;
padding:18px;
margin-top:20px;
border:none;
border-radius:40px;
background:#ff5a00;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.status{
color:#9cffb2;
font-size:18px;
margin-top:14px;
text-align:center;
}

.alerta{
color:#ffcfaa;
margin-top:10px;
text-align:center;
}

</style>

</head>

<body>

<div class="container">

<div class="titulo">

Gerar capa editorial

</div>

<div class="subtitulo">

Capista — Site das Letras

</div>

<div class="card" id="statusCapas">

Carregando créditos disponíveis...

</div>

<button class="botao"

onclick="gerarCapa()">

Gerar capa agora

</button>

<button class="botao"

onclick="window.location.href='_Indice.html'">

Voltar para casa do original

</button>

</div>

<script>

function obterPlano(){

return localStorage.getItem("CAPISTA_plano") || "0";

}

function limitePlano(plano){

if(plano == "10") return 10;
if(plano == "30") return 30;
if(plano == "50") return 50;
if(plano == "90") return 90;
if(plano == "magistral") return 9999;

return 0;

}

function carregarStatus(){

const plano = obterPlano();

const limite = limitePlano(plano);

let usadasFisicas =
parseInt(localStorage.getItem("CAPISTA_usadas_fisicas")) || 0;

let usadasEpub =
parseInt(localStorage.getItem("CAPISTA_usadas_epub")) || 0;

document.getElementById("statusCapas").innerHTML =

"<div class='status'>Plano ativo: " + plano + "</div>" +

"<div class='status'>Capas físicas restantes: " +

(limite - usadasFisicas) +

"</div>" +

"<div class='status'>Capas EPUB restantes: " +

(limite - usadasEpub) +

"</div>";

}

function gerarCapa(){

const plano = obterPlano();

if(plano == "0"){

alert("Nenhum plano Capista ativo.");

return;

}

const tipoCapa =
localStorage.getItem("CAPISTA_tipo_capa");

let usadasFisicas =
parseInt(localStorage.getItem("CAPISTA_usadas_fisicas")) || 0;

let usadasEpub =
parseInt(localStorage.getItem("CAPISTA_usadas_epub")) || 0;

const limite = limitePlano(plano);

if(tipoCapa == "fisica"){

if(usadasFisicas >= limite){

alert("Limite de capas físicas atingido.");

return;

}

localStorage.setItem(

"CAPISTA_usadas_fisicas",

usadasFisicas + 1

);

}

if(tipoCapa == "epub"){

if(usadasEpub >= limite){

alert("Limite de capas EPUB atingido.");

return;

}

localStorage.setItem(

"CAPISTA_usadas_epub",

usadasEpub + 1

);

}

if(tipoCapa == "ambos"){

if(usadasFisicas >= limite ||

usadasEpub >= limite){

alert("Limite de capas atingido.");

return;

}

localStorage.setItem(

"CAPISTA_usadas_fisicas",

usadasFisicas + 1

);

localStorage.setItem(

"CAPISTA_usadas_epub",

usadasEpub + 1

);

}

alert("Capa gerada com sucesso.");

window.location.href = "relatorio_capista.html";

}

carregarStatus();

</script>

</body>

</html>
