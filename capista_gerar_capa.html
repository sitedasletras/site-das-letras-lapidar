<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OKapista — Gerar capa</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#1f2937;
color:white;
}

.topo{
background:#111827;
padding:18px;
display:flex;
justify-content:space-between;
align-items:center;
}

.topo h1{
margin:0;
font-size:22px;
}

.container{
max-width:900px;
margin:auto;
padding:30px 16px;
}

.card{

background:#374151;
border-radius:14px;
padding:20px;
margin-bottom:20px;

}

.card h2{
margin-top:0;
}

.preview{

background:#111827;
border-radius:10px;
padding:20px;
text-align:center;
margin-top:15px;

}

.preview span{
opacity:.7;
}

.botao{

width:100%;
padding:16px;
border:none;
border-radius:12px;
font-size:18px;
font-weight:bold;
cursor:pointer;
margin-top:12px;

}

.botao-gerar{

background:#f59e0b;
color:black;

}

.botao-confirmar{

background:#10b981;
color:white;

}

.botao-voltar{

background:white;
color:#111827;

}

.botao:hover{
opacity:.92;
}

.status{

margin-top:10px;
opacity:.8;

}

</style>
</head>


<body>


<div class="topo">

<h1>OKapista — Geração da capa</h1>

</div>



<div class="container">


<div class="card">

<h2>Pré-visualização institucional da capa</h2>

<div class="preview">

<span>Pré-visualização simbólica da capa institucional</span>

</div>

<p class="status">

Após confirmar, o sistema registra a definição visual da obra.

</p>

</div>



<div class="card">

<h2>Finalizar definição visual</h2>

<button class="botao botao-gerar"
onclick="gerarPreview()">

Gerar pré-visualização da capa

</button>


<button class="botao botao-confirmar"
onclick="finalizarCapista()">

Confirmar capa institucional

</button>


<button class="botao botao-voltar"
onclick="window.location.href='mesario.html'">

Voltar ao Mesário

</button>

</div>


</div>



<script>


function gerarPreview(){

alert("Pré-visualização simbólica da capa gerada.")

}


function finalizarCapista(){

localStorage.setItem("okapista_concluido","sim")

localStorage.setItem("estado_visual_obra","definido")

window.location.href="confirmacao_final_modulos.html"

}


</script>



</body>
</html>
