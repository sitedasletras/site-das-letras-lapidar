<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Lapidar — OKapista</title>

<style>

body{
margin:0;
font-family:Arial;
background:#8b0000;
color:white;
}

.container{
max-width:900px;
margin:auto;
padding:40px;
}

h1{
text-align:center;
}

.card{
background:white;
color:black;
padding:30px;
border-radius:12px;
margin-top:30px;
box-shadow:0px 5px 15px rgba(0,0,0,0.3);
}

.botao{
display:block;
width:100%;
padding:18px;
margin-top:20px;
font-size:18px;
border:none;
border-radius:8px;
cursor:pointer;
}

.botao-iniciar{
background:#28a745;
color:white;
}

.botao-voltar{
background:#ffc107;
color:black;
}

.botao-sair{
background:#dc3545;
color:white;
}

.botao:hover{
opacity:0.9;
}

</style>

</head>

<body>

<div class="container">

<h1>OKapista — Assistente de Criação de Capas</h1>

<div class="card">

<p>
Aqui começa o processo de criação da capa editorial da obra.
Nesta etapa você poderá preparar:
</p>

<ul>
<li>Capa frontal</li>
<li>Contracapa</li>
<li>Lombada</li>
<li>Orelhas</li>
<li>Versão ePub</li>
</ul>

<p>
O sistema seguirá a sequência técnica padrão do Lapidar.
</p>

<button class="botao botao-iniciar"
onclick="window.location.href='capista_upload_tecnica.html'">
Iniciar criação da capa
</button>

<button class="botao botao-voltar"
onclick="window.location.href='modulo_executor.html'">
Voltar aos módulos da obra
</button>

<button class="botao botao-sair"
onclick="window.location.href='departamentos.html'">
Sair do sistema
</button>

</div>

</div>

</body>
</html>
