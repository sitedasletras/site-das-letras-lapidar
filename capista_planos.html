<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Capista — Planos de Capa</title>

<style>

:root{
--bg:#0d0603;
--card:#140c08;
--card2:#1b100a;
--text:#ffffff;
--muted:#ffd2b3;
--orange:#f7b22c;
--orangeStrong:#ff5a00;
--green:#9cfdb2;
--danger:#ff7070;
--border:rgba(255,123,44,0.18);
--shadow:0 10px 26px rgba(0,0,0,0.28);
}

body{
margin:0;
font-family:Arial;
background:var(--bg);
color:white;
}

.container{
width:min(1100px,95%);
margin:auto;
padding:40px 0;
}

.titulo{
font-size:38px;
font-weight:bold;
}

.subtitulo{
margin-top:6px;
color:var(--orange);
}

.card{
margin-top:30px;
background:var(--card);
padding:24px;
border-radius:18px;
border:1px solid var(--border);
box-shadow:var(--shadow);
}

.statusBox{
margin-top:20px;
padding:18px;
border-radius:14px;
background:rgba(247,178,44,0.12);
border:1px solid rgba(247,178,44,0.2);
color:#ffe7b0;
}

.planoBox{
margin-top:20px;
padding:18px;
border-radius:14px;
background:var(--card2);
line-height:1.8;
}

.actions{
margin-top:26px;
display:flex;
flex-wrap:wrap;
gap:12px;
}

.botao{
border:none;
padding:14px 18px;
border-radius:999px;
font-weight:bold;
cursor:pointer;
}

.botaoIndice{
background:#24150f;
color:white;
}

.botaoPagamento{
background:#174d27;
color:#dfffe8;
}

.botaoPlano{
background:var(--orangeStrong);
color:white;
}

.botaoSolicitar{
background:#1e5d35;
color:white;
}

</style>
</head>

<body>

<div class="container">

<div class="titulo">
SERVIÇOS DO CAPISTA
</div>

<div class="subtitulo">
Solicitação de criação de capa dentro do ambiente Lapidar
</div>



<div class="card">

<div id="statusCapista" class="statusBox">
Verificando liberação do serviço...
</div>

<div id="planoDetectado" class="planoBox">
Carregando informações do plano...
</div>

</div>



<div class="actions">

<button class="botao botaoSolicitar" onclick="solicitarCapa()">
Solicitar capa
</button>

<button class="botao botaoPagamento" onclick="abrirPagamento()">
Registrar pagamento
</button>

<button class="botao botaoPlano" onclick="abrirPlanos()">
Escolher plano
</button>

<button class="botao botaoIndice" onclick="voltarIndice()">
Voltar ao índice
</button>

</div>



</div>



<script>

function verificarSessao(){

const sessao = localStorage.getItem("SDL_sessao_ativa")

if(sessao !== "sim"){

window.location.href = "login.html"

}

}



function verificarPlanoCapista(){

let plano = null
let pagamento = null

try{

plano = localStorage.getItem("SDL_plano")
pagamento = localStorage.getItem("SDL_pagamento")

}catch(e){}



const statusBox = document.getElementById("statusCapista")
const planoBox = document.getElementById("planoDetectado")

if(!plano){

statusBox.innerHTML =
"Nenhum plano selecionado. Escolha um plano para liberar o serviço do capista."

planoBox.innerHTML =
"Plano atual: não definido"

return

}



planoBox.innerHTML =
"Plano detectado: <strong>" + plano + "</strong>"



if(!pagamento){

statusBox.innerHTML =
"Plano selecionado, porém pagamento ainda não registrado."

statusBox.style.background =
"rgba(255,112,112,0.12)"

return

}



statusBox.innerHTML =
"Serviço do capista liberado para solicitação de capa."

statusBox.style.background =
"rgba(23,77,39,0.28)"

}



function solicitarCapa(){

let plano = localStorage.getItem("SDL_plano")
let pagamento = localStorage.getItem("SDL_pagamento")

if(!plano || !pagamento){

alert("Serviço do capista ainda não está liberado.")

return

}



alert("Solicitação de capa registrada com sucesso (modo inicial).")

}



function abrirPagamento(){

window.location.href = "pagamento.html"

}



function abrirPlanos(){

window.location.href = "planos_doacoes.html"

}



function voltarIndice(){

window.location.href = "_Indice.html"

}



verificarSessao()
verificarPlanoCapista()

</script>

</body>
</html>
