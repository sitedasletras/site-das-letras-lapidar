<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solicitação de Capa — Lapidar</title>

<style>

:root{
--bg:#0d0603;
--card:#140c08;
--card2:#1b100a;
--text:#ffffff;
--orange:#f7b22c;
--orangeStrong:#ff5a00;
--green:#9cfdb2;
--danger:#ff7070;
--border:rgba(255,123,44,0.18);
--shadow:0 10px 26px rgba(0,0,0,0.28);
}

body{
margin:0;
font-family:Arial;
background:var(--bg);
color:white;
}

.container{
width:min(1100px,95%);
margin:auto;
padding:40px 0;
}

.titulo{
font-size:36px;
font-weight:bold;
}

.subtitulo{
margin-top:6px;
color:var(--orange);
}

.card{
margin-top:30px;
background:var(--card);
padding:24px;
border-radius:18px;
border:1px solid var(--border);
box-shadow:var(--shadow);
}

.status{
margin-top:18px;
padding:16px;
border-radius:12px;
background:rgba(247,178,44,0.12);
border:1px solid rgba(247,178,44,0.25);
}

.box{
margin-top:20px;
padding:18px;
border-radius:14px;
background:var(--card2);
line-height:1.7;
}

.actions{
margin-top:24px;
display:flex;
flex-wrap:wrap;
gap:12px;
}

button{
border:none;
padding:14px 18px;
border-radius:999px;
cursor:pointer;
font-weight:bold;
}

.btnSolicitar{
background:#174d27;
color:white;
}

.btnPagamento{
background:var(--orangeStrong);
color:white;
}

.btnPlano{
background:#5a2c00;
color:white;
}

.btnIndice{
background:#24150f;
color:white;
}

</style>
</head>

<body>

<div class="container">

<div class="titulo">
Solicitação de Capa
</div>

<div class="subtitulo">
Serviço vinculado ao projeto ativo no Lapidar
</div>

<div id="statusSistema" class="status">
Verificando ambiente editorial...
</div>

<div id="dadosProjeto" class="box">
Carregando projeto...
</div>

<div class="actions">

<button class="btnSolicitar" onclick="registrarPedidoCapa()">
Solicitar capa
</button>

<button class="btnPagamento" onclick="abrirPagamento()">
Registrar pagamento
</button>

<button class="btnPlano" onclick="abrirPlano()">
Escolher plano
</button>

<button class="btnIndice" onclick="voltarIndice()">
Voltar ao índice
</button>

</div>

</div>

<script src="auditoria.js"></script>

<script>

function verificarSessao(){

const sessao = localStorage.getItem("SDL_sessao_ativa")

if(sessao !== "sim"){
window.location.href="login.html"
}

}

function obterProjetoAtivo(){

try{

const lista =
JSON.parse(localStorage.getItem("SDL_projetos_lista") || "[]")

const ativo =
localStorage.getItem("SDL_projeto_ativo")

return lista.find(p => p.id === ativo)

}catch{

return null

}

}

function verificarSistema(){

const projeto = obterProjetoAtivo()

const plano = localStorage.getItem("SDL_plano")

const pagamento = localStorage.getItem("SDL_pagamento")

const status = document.getElementById("statusSistema")

if(!projeto){

status.innerHTML =
"Nenhum projeto ativo selecionado."

return

}

document.getElementById("dadosProjeto").innerHTML =
"Projeto ativo: <strong>" + projeto.titulo + "</strong>"

if(!plano){

status.innerHTML =
"Selecione um plano antes de solicitar a capa."

return

}

if(!pagamento){

status.innerHTML =
"Plano selecionado, mas pagamento ainda não registrado."

status.style.background =
"rgba(255,112,112,0.12)"

return

}

status.innerHTML =
"Serviço liberado para solicitação de capa."

status.style.background =
"rgba(23,77,39,0.28)"

}

function registrarPedidoCapa(){

const projeto = obterProjetoAtivo()

if(!projeto){

alert("Nenhum projeto ativo.")
return

}

const plano =
localStorage.getItem("SDL_plano")

const pagamento =
localStorage.getItem("SDL_pagamento")

if(!plano || !pagamento){

alert("Serviço ainda não liberado.")
return

}

const pedido = {

id:"capa_"+Date.now(),

projetoID:projeto.id,

tituloProjeto:projeto.titulo,

plano,

status:"Solicitado",

dataRegistro:new Date().toISOString()

}

let lista =

JSON.parse(localStorage.getItem("SDL_capas_lista") || "[]")

lista.push(pedido)

localStorage.setItem(
"SDL_capas_lista",
JSON.stringify(lista)
)

/* auditoria automática */

try{

SDL_registrarAuditoria(
"Solicitação de capa registrada",
"capista"
)

}catch(e){}

alert("Solicitação de capa registrada com sucesso.")

}

function abrirPagamento(){
window.location.href="pagamento.html"
}

function abrirPlano(){
window.location.href="planos_doacoes.html"
}

function voltarIndice(){
window.location.href="_Indice.html"
}

verificarSessao()
verificarSistema()

</script>

</body>
</html>
