<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Lapidar — Upload Técnico da Capa</title>

<style>

body{
margin:0;
font-family:Arial;
background:#6a0000;
color:white;
}

.container{
max-width:900px;
margin:auto;
padding:40px;
}

h1{
text-align:center;
}

.card{
background:white;
color:black;
padding:30px;
border-radius:12px;
margin-top:30px;
box-shadow:0px 5px 15px rgba(0,0,0,0.3);
}

input{
width:100%;
padding:10px;
margin-top:10px;
margin-bottom:20px;
}

.botao{
display:block;
width:100%;
padding:18px;
margin-top:20px;
font-size:18px;
border:none;
border-radius:8px;
cursor:pointer;
}

.botao-continuar{
background:#28a745;
color:white;
}

.botao-voltar{
background:#ffc107;
color:black;
}

.botao-sair{
background:#dc3545;
color:white;
}

.botao:hover{
opacity:0.9;
}

</style>

</head>

<body>

<div class="container">

<h1>Upload Técnico da Obra</h1>

<div class="card">

<p>
Envie os elementos técnicos necessários para gerar a capa:
</p>

<ul>
<li>arquivo da obra diagramada</li>
<li>tamanho do livro</li>
<li>número de páginas</li>
<li>papel utilizado</li>
</ul>

<input type="file">

<button class="botao botao-continuar"
onclick="window.location.href='capista_configuracao.html'">
Continuar para configuração da capa
</button>

<button class="botao botao-voltar"
onclick="window.location.href='capista_inicio.html'">
Voltar ao início do OKapista
</button>

<button class="botao botao-sair"
onclick="window.location.href='departamentos.html'">
Sair do sistema
</button>

</div>

</div>

</body>
</html>
