<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cofre Editorial do Autor</title>

<style>

body{
margin:0;
font-family:Arial;
background:#efe7da;
}

header{
background:#d6cbb8;
padding:20px;
text-align:center;
font-size:22px;
font-weight:bold;
color:#4b4237;
}

.container{
max-width:900px;
margin:auto;
margin-top:30px;
background:white;
padding:30px;
border-radius:14px;
box-shadow:0px 6px 18px rgba(0,0,0,0.12);
}

.statusBox{
background:#f4f1ec;
padding:20px;
border-radius:12px;
margin-bottom:25px;
}

button{
width:100%;
border:none;
padding:18px;
font-size:16px;
border-radius:10px;
margin-top:12px;
cursor:pointer;
}

.botaoPrincipal{
background:#6f6254;
color:white;
}

.botaoUpload{
background:#9aa3ab;
color:white;
cursor:not-allowed;
}

.botaoAtivo{
background:#2e7d32;
cursor:pointer;
}

.progressContainer{
margin-top:20px;
height:25px;
background:#ddd;
border-radius:10px;
overflow:hidden;
display:none;
}

.progressBar{
height:100%;
width:0%;
transition:width 0.4s linear;
}

.progressText{
margin-top:10px;
font-size:14px;
color:#444;
}

.uploadBox{
margin-top:20px;
display:none;
}

</style>

</head>

<body>

<header>

Cofre Editorial do Autor

<br>

<span style="font-size:13px;font-weight:normal;">
Preparação do ambiente editorial antes da nova obra
</span>

</header>

<div class="container">

<div class="statusBox">

<h3>Status do Cofre</h3>

<p id="statusMensagem">

Para iniciar uma nova obra, prepare primeiro o ambiente do Cofre.

</p>

</div>

<button id="btnPreparar"
class="botaoPrincipal"
onclick="prepararCofre()">

Preparar Cofre para nova obra

</button>


<div class="progressContainer" id="progressContainer">

<div class="progressBar" id="progressBar"></div>

</div>

<div class="progressText" id="progressText"></div>


<div class="uploadBox" id="uploadBox">

<input type="file"
id="arquivoDOCX"
accept=".docx">

<button class="botaoAtivo"
onclick="registrarArquivo()">

Confirmar envio da obra

</button>

</div>

</div>


<script>

let progresso = 0


function prepararCofre(){

document.getElementById("progressContainer").style.display="block"

let barra = document.getElementById("progressBar")

let texto = document.getElementById("progressText")

let etapas = [

"Removendo resíduos da obra anterior...",

"Reorganizando ambiente editorial...",

"Sincronizando com Sistema Desbaste...",

"Sincronizando com Barracão de Polimento...",

"Cofre pronto para nova obra."

]

let etapaAtual = 0

let intervalo = setInterval(()=>{

progresso += 20

barra.style.width = progresso + "%"

if(progresso <=25){

barra.style.background="red"

}

else if(progresso <=50){

barra.style.background="orange"

}

else if(progresso <=75){

barra.style.background="gold"

}

else{

barra.style.background="green"

}

texto.innerText = etapas[etapaAtual]

etapaAtual++

if(progresso >=100){

clearInterval(intervalo)

localStorage.clear()

localStorage.setItem("cofre_preparado","true")

document.getElementById("statusMensagem").innerText =

"Cofre pronto para receber nova obra."

document.getElementById("uploadBox").style.display="block"

}

},800)

}



function registrarArquivo(){

let arquivo = document.getElementById("arquivoDOCX").files[0]

if(!arquivo){

alert("Selecione o arquivo DOCX")

return

}

let nomeArquivo = arquivo.name

let tituloBase = nomeArquivo.replace(".docx","")


let fichaBase = {

arquivo:nomeArquivo,

titulo_base:tituloBase,

autor:"Autor a confirmar",

classificacao_principal:"A definir",

classificacao_secundaria:"A definir",

classificacao_terciaria:"A definir",

status_tecnico:"Estrutura recebida no Cofre"

}


localStorage.setItem(

"lapidar_ficha_base_obra",

JSON.stringify(fichaBase)

)


alert("Arquivo registrado com sucesso")


window.location.href="modulo_02_sistema_desbaste.html"

}

</script>

</body>
</html>
