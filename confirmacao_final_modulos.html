<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmação final da obra — Lapidar</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f1e8;
}

header{
background:#32497d;
color:white;
padding:18px;
display:flex;
justify-content:space-between;
font-size:18px;
}

.container{
max-width:900px;
margin:auto;
padding:30px;
}

.card{
background:white;
padding:25px;
border-radius:16px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.botao{
width:100%;
padding:18px;
margin-top:14px;
border:none;
border-radius:12px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.confirmar{
background:#2e7d32;
color:white;
}

.voltar{
background:#607d8b;
color:white;
}

.apagar{
background:#b71c1c;
color:white;
}

.lista{
background:#f7f7f7;
padding:18px;
border-radius:12px;
margin-top:20px;
line-height:1.8;
}

p{
color:#4e4e4e;
}
</style>
</head>
<body>

<header>
<div>Confirmação final da estrutura</div>
<div>Lapidar</div>
</header>

<div class="container">
<div class="card">

<h2>Confira antes de continuar</h2>

<p>
Revise as escolhas feitas para sua obra antes de iniciar o processamento.
</p>

<div class="lista">
<strong>Você escolheu:</strong><br>
• Produção editorial<br>
• Produção audiovisual<br>
• Produção com voz / música
</div>

<button class="botao confirmar" onclick="iniciar()">
Confirmar e iniciar o trabalho da obra
</button>

<button class="botao voltar" onclick="voltar()">
Voltar para ajustar suas escolhas
</button>

<button class="botao apagar" onclick="apagar()">
Apagar escolhas e recomeçar
</button>

</div>
</div>

<script>
function iniciar(){
window.location.href="/motor_sequencial.html";
}

function voltar(){
window.location.href="/selecionar_modulos.html";
}

function apagar(){
window.location.href="/index.html";
}
</script>

</body>
</html>
