<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel de Cortesias • Lapidar</title>

<style>

body{
font-family:Arial;
background:#efe2c2;
margin:0;
padding:0;
}

header{
background:#2f436d;
color:white;
padding:18px;
display:flex;
justify-content:space-between;
align-items:center;
}

button{
cursor:pointer;
}

.logout{
background:#8b0000;
color:white;
border:none;
padding:10px 16px;
border-radius:8px;
}

.container{
padding:20px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:20px;
}

.card{
background:white;
padding:18px;
border-radius:16px;
box-shadow:0 6px 14px rgba(0,0,0,0.1);
}

.card h3{
margin-top:0;
}

.status{
background:#e8ffe8;
padding:6px 12px;
border-radius:20px;
font-size:12px;
font-weight:bold;
float:right;
}

label{
display:block;
margin-top:10px;
}

select{
width:100%;
padding:8px;
margin-top:4px;
}

.setores{
margin-top:10px;
}

.footer-btns{
margin-top:14px;
display:flex;
gap:10px;
}

.save{
background:#2f436d;
color:white;
border:none;
padding:8px 14px;
border-radius:6px;
}

.reset{
background:#ddd;
border:none;
padding:8px 14px;
border-radius:6px;
}

</style>
</head>

<body>

<header>

<h2>Painel de Cortesias • Lapidar</h2>

<button class="logout"
onclick="localStorage.clear();window.location.href='index.html';">
Sair geral
</button>

</header>


<div class="container" id="cards"></div>


<script>

const STORAGE_KEY="lapidar_courtesy_profiles";

const perfis=[
"quimera",
"valetbooks",
"acl",
"andre"
];


function carregar(){

const data=JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}");

const container=document.getElementById("cards");

container.innerHTML="";


perfis.forEach(nome=>{

if(!data[nome]){

data[nome]={

status:"ativa",

accessLevel:"global",

sectors:[1,3,5,7,11,13]

};

}


container.innerHTML+=`

<div class="card">

<h3>${nome.toUpperCase()}

<span class="status">${data[nome].status}</span>

</h3>


<label>Status

<select onchange="alterarStatus('${nome}',this.value)">

<option value="ativa"

${data[nome].status=="ativa"?"selected":""}>

Ativa

</option>

<option value="inativa"

${data[nome].status=="inativa"?"selected":""}>

Inativa

</option>

</select>

</label>


<label>Modo de acesso

<select onchange="alterarAccess('${nome}',this.value)">

<option value="global"

${data[nome].accessLevel=="global"?"selected":""}>

Top Global

</option>

<option value="custom"

${data[nome].accessLevel=="custom"?"selected":""}>

Personalizado

</option>

</select>

</label>


<div class="setores">

${[1,3,5,7,11,13].map(s=>

`<label>

<input type="checkbox"

${data[nome].sectors.includes(s)?"checked":""}

onchange="alterarSetor('${nome}',${s},this.checked)"

>

Setor ${s}

</label>`

).join("")}

</div>


<div class="footer-btns">

<button class="save"

onclick="salvar('${nome}')">

Salvar

</button>

<button class="reset"

onclick="resetar('${nome}')">

Restaurar padrão

</button>

</div>


</div>

`;

});


localStorage.setItem(STORAGE_KEY,JSON.stringify(data));

}


function alterarStatus(nome,status){

const data=JSON.parse(localStorage.getItem(STORAGE_KEY));

data[nome].status=status;

localStorage.setItem(STORAGE_KEY,JSON.stringify(data));

}


function alterarAccess(nome,mode){

const data=JSON.parse(localStorage.getItem(STORAGE_KEY));

data[nome].accessLevel=mode;

localStorage.setItem(STORAGE_KEY,JSON.stringify(data));

}


function alterarSetor(nome,setor,val){

const data=JSON.parse(localStorage.getItem(STORAGE_KEY));

if(val){

data[nome].sectors.push(setor);

}else{

data[nome].sectors=data[nome].sectors.filter(x=>x!==setor);

}

localStorage.setItem(STORAGE_KEY,JSON.stringify(data));

}


function salvar(nome){

alert("Perfil "+nome+" salvo com sucesso.");

}


function resetar(nome){

const data=JSON.parse(localStorage.getItem(STORAGE_KEY));

data[nome]={

status:"ativa",

accessLevel:"global",

sectors:[1,3,5,7,11,13]

};

localStorage.setItem(STORAGE_KEY,JSON.stringify(data));

carregar();

}


carregar();

</script>


</body>
</html>
