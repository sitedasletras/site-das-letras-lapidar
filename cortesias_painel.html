<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Cortesias • Lapidar</title>

<style>

body{
font-family:Arial;
margin:0;
background:#ead9b8;
}

.header{
background:#1e2a44;
color:white;
padding:25px;
border-bottom-left-radius:25px;
border-bottom-right-radius:25px;
}

.header h1{
margin:0;
}

.container{
padding:25px;
}

.card{
background:white;
padding:20px;
border-radius:20px;
margin-bottom:20px;
box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

button{
padding:10px 14px;
border-radius:10px;
border:none;
font-weight:bold;
cursor:pointer;
}

.save{
background:#1e2a44;
color:white;
}

.logout{
background:white;
color:#1e2a44;
}

.top{
background:#cda85a;
color:white;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

input,select{
padding:10px;
border-radius:10px;
border:1px solid #ccc;
width:100%;
}

.checkbox-group{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}

.tag{
padding:5px 10px;
border-radius:20px;
font-size:12px;
font-weight:bold;
}

.active{
background:#d4f3df;
color:#1f6b36;
}

.inactive{
background:#ffe7d1;
color:#8b5a17;
}

</style>
</head>

<body>

<div class="header">

<h1>Painel de Cortesias</h1>

<button class="logout" onclick="logout()">Sair geral</button>

<button class="top" onclick="saveAll()">Salvar cortesias</button>

</div>

<div class="container">

<div class="card">

<h2>Resumo geral</h2>

<p>Total de perfis:
<strong id="total"></strong>
</p>

<p>Perfis ativos:
<strong id="ativos"></strong>
</p>

<p>Perfis personalizados:
<strong id="personalizados"></strong>
</p>

</div>

<div id="painelCortesias" class="grid"></div>

</div>
