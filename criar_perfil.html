<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Completar perfil • Lapidar</title>

<style>
body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:#e6d3a3;
}

.container{
max-width:520px;
margin:40px auto;
background:white;
padding:30px;
border-radius:18px;
box-shadow:0 10px 25px rgba(0,0,0,.12);
}

.logo{
text-align:center;
font-size:32px;
font-weight:bold;
margin-bottom:6px;
}

.sub{
text-align:center;
font-size:13px;
color:#777;
margin-bottom:24px;
line-height:1.6;
}

.form-group{
margin-bottom:14px;
}

label{
display:block;
font-size:13px;
font-weight:bold;
margin-bottom:6px;
color:#444;
}

input, select, textarea{
width:100%;
padding:14px;
border-radius:10px;
border:1px solid #ccc;
font-size:15px;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

textarea{
min-height:100px;
resize:vertical;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
font-size:16px;
cursor:pointer;
font-weight:bold;
}

.salvar{
background:#1f3f75;
color:white;
margin-bottom:10px;
}

.voltar{
background:#ddd;
color:#333;
}

.msg{
margin-top:12px;
padding:12px;
border-radius:10px;
font-size:14px;
display:none;
}

.msg.ok{
background:#eef8f0;
color:#1f6b36;
display:block;
}

.msg.erro{
background:#fff1f1;
color:#a12626;
display:block;
}
</style>
</head>
<body>

<div class="container">

<div class="logo">
Completar perfil
</div>

<div class="sub">
Complete seu perfil literário para seguir no Lapidar.
</div>

<div class="form-group">
<label>Nome completo</label>
<input id="nomeCompleto" type="text" readonly>
</div>

<div class="form-group">
<label>E-mail</label>
<input id="email" type="email" readonly>
</div>

<div class="form-group">
<label>Telefone / WhatsApp</label>
<input id="telefone" type="text" readonly>
</div>

<div class="form-group">
<label>Área principal de interesse literário</label>
<select id="interessePrincipal">
  <option value="">Selecione</option>
  <option value="poesia">Poesia</option>
  <option value="prosa">Prosa</option>
  <option value="conto">Conto</option>
  <option value="romance">Romance</option>
  <option value="cronica">Crônica</option>
  <option value="infantil">Literatura infantil</option>
  <option value="traducao">Tradução</option>
  <option value="diagramacao">Diagramação</option>
  <option value="capa">Capas</option>
  <option value="avaliacao">Avaliação literária</option>
  <option value="outro">Outro</option>
</select>
</div>

<div class="form-group">
<label>Fale um pouco do que você curte ou produz</label>
<textarea id="perfilLiterario" placeholder="Ex.: poesia, contos, romances, fantasia, literatura espiritual, revisão, capa, diagramação..."></textarea>
</div>

<div class="form-group">
<label>Pergunta de segurança 1</label>
<input id="pergunta1" placeholder="Ex.: Qual o nome da sua sobrinha favorita?">
</div>

<div class="form-group">
<label>Resposta 1</label>
<input id="resposta1" type="text">
</div>

<div class="form-group">
<label>Pergunta de segurança 2</label>
<input id="pergunta2" placeholder="Ex.: Qual o nome da sua primeira namorada?">
</div>

<div class="form-group">
<label>Resposta 2</label>
<input id="resposta2" type="text">
</div>

<button class="salvar" onclick="salvarPerfil()">
Salvar perfil
</button>

<button class="voltar" onclick="voltarLogin()">
Voltar ao login
</button>

<div id="mensagem" class="msg"></div>

</div>

<script>
function mostrarMensagem(tipo, texto){
  const box = document.getElementById("mensagem");
  box.className = "msg " + tipo;
  box.innerText = texto;
}

function carregarCadastros(){
  try{
    return JSON.parse(localStorage.getItem("lapidar_cadastros") || "[]");
  }catch(e){
    return [];
  }
}

function salvarCadastros(lista){
  localStorage.setItem("lapidar_cadastros", JSON.stringify(lista));
}

const cadastroId = localStorage.getItem("lapidar_cadastro_id");
const cadastros = carregarCadastros();
const atual = cadastros.find(item => item.id === cadastroId);

if(!atual){
  window.location.href = "cadastro.html";
}

document.getElementById("nomeCompleto").value = atual.nomeCompleto || "";
document.getElementById("email").value = atual.email || "";
document.getElementById("telefone").value = atual.telefone || "";
document.getElementById("interessePrincipal").value = atual.interessePrincipal || "";
document.getElementById("perfilLiterario").value = atual.perfilLiterario || "";
document.getElementById("pergunta1").value = atual.pergunta1 || "";
document.getElementById("resposta1").value = atual.resposta1 || "";
document.getElementById("pergunta2").value = atual.pergunta2 || "";
document.getElementById("resposta2").value = atual.resposta2 || "";

function salvarPerfil(){
  const interessePrincipal = document.getElementById("interessePrincipal").value;
  const perfilLiterario = document.getElementById("perfilLiterario").value.trim();
  const pergunta1 = document.getElementById("pergunta1").value.trim();
  const resposta1 = document.getElementById("resposta1").value.trim();
  const pergunta2 = document.getElementById("pergunta2").value.trim();
  const resposta2 = document.getElementById("resposta2").value.trim();

  if(!interessePrincipal || !perfilLiterario || !pergunta1 || !resposta1 || !pergunta2 || !resposta2){
    mostrarMensagem("erro","Preencha todos os campos do perfil.");
    return;
  }

  const lista = carregarCadastros();
  const indice = lista.findIndex(item => item.id === cadastroId);

  if(indice === -1){
    mostrarMensagem("erro","Cadastro não encontrado.");
    return;
  }

  lista[indice].interessePrincipal = interessePrincipal;
  lista[indice].perfilLiterario = perfilLiterario;
  lista[indice].pergunta1 = pergunta1;
  lista[indice].resposta1 = resposta1;
  lista[indice].pergunta2 = pergunta2;
  lista[indice].resposta2 = resposta2;

  salvarCadastros(lista);

  localStorage.setItem("lapidar_status_fluxo", "perfil_criado");

  mostrarMensagem("ok","Perfil salvo com sucesso.");

  setTimeout(() => {
    window.location.href = "index.html";
  }, 700);
}

function voltarLogin(){
  window.location.href = "index.html";
}
</script>

</body>
</html>
