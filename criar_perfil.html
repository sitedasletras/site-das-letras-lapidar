<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Criar Perfil — Lapidar</title>

<style>

body{
font-family: Arial, sans-serif;
background:#f5f5f5;
margin:0;
padding:0;
}

.container{
width:420px;
margin:50px auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0px 0px 15px rgba(0,0,0,0.15);
}

h1{
text-align:center;
margin-bottom:25px;
}

label{
display:block;
margin-top:12px;
font-weight:bold;
}

input, select{
width:100%;
padding:8px;
margin-top:5px;
border-radius:5px;
border:1px solid #ccc;
}

button{
margin-top:20px;
width:100%;
padding:12px;
background:#2b7cff;
color:white;
border:none;
border-radius:6px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#1d5ed8;
}

.info{
margin-top:15px;
font-size:13px;
color:#666;
text-align:center;
}

.voltar{
margin-top:20px;
text-align:center;
}

.voltar a{
text-decoration:none;
color:#2b7cff;
font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<h1>Criar Perfil Editorial</h1>

<form>

<label>Nome completo</label>
<input type="text" required>

<label>E-mail</label>
<input type="email" required>

<label>Telefone (WhatsApp preferencial)</label>
<input type="tel" required>

<label>Cidade</label>
<input type="text" required>

<label>Estado</label>
<input type="text" required>

<label>País</label>
<input type="text" value="Brasil" required>

<label>Perfil principal</label>
<select required>

<option value="">Selecione</option>

<option>Escritor</option>
<option>Capista</option>
<option>Tradutor</option>
<option>Diagramador</option>
<option>Leitor técnico</option>
<option>Pesquisador</option>
<option>Outro</option>

</select>

<label>Senha</label>
<input type="password" required>

<label>Confirmar senha</label>
<input type="password" required>

<button type="submit">
Criar Perfil
</button>

</form>

<div class="info">

Essas informações ajudam o Lapidar a organizar o ambiente editorial e gerar estatísticas institucionais do uso da plataforma.

</div>

<div class="voltar">

<a href="index.html">
Voltar ao login
</a>

</div>

</div>

</body>
</html>
