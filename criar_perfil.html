<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Criar cadastro • Lapidar</title>

<style>

body{
margin:0;
font-family:Arial;
background:#e6d3a3;
}

.container{

max-width:520px;
margin:40px auto;
background:white;
padding:30px;
border-radius:18px;
box-shadow:0 10px 25px rgba(0,0,0,.12);

}

.logo{

text-align:center;
font-size:32px;
font-weight:bold;
margin-bottom:6px;

}

.sub{

text-align:center;
font-size:13px;
color:#777;
margin-bottom:24px;

}

.form-group{

margin-bottom:14px;

}

label{

display:block;
font-size:13px;
font-weight:bold;
margin-bottom:6px;

}

input{

width:100%;
padding:14px;
border-radius:10px;
border:1px solid #ccc;

}

button{

width:100%;
padding:14px;
border:none;
border-radius:12px;
font-size:16px;
cursor:pointer;
font-weight:bold;

}

.salvar{

background:#1f3f75;
color:white;
margin-bottom:10px;

}

.voltar{

background:#ddd;

}

.frase{

margin-top:25px;
font-size:14px;
text-align:center;
color:#555;
line-height:1.6;

}

.msg{

margin-top:12px;
padding:12px;
border-radius:10px;
font-size:14px;
display:none;

}

.msg.ok{

background:#eef8f0;
color:#1f6b36;
display:block;

}

.msg.erro{

background:#fff1f1;
color:#a12626;
display:block;

}

</style>
</head>

<body>

<div class="container">

<div class="logo">

Criar cadastro

</div>

<div class="sub">

Preencha seus dados para criar seu acesso dentro do Lapidar.

</div>


<div class="form-group">

<label>Nome completo</label>

<input id="nomeCompleto">

</div>


<div class="form-group">

<label>Login</label>

<input id="login">

</div>


<div class="form-group">

<label>E-mail</label>

<input id="email">

</div>


<div class="form-group">

<label>Senha</label>

<input id="senha" type="password">

</div>


<div class="form-group">

<label>Pergunta de segurança 1</label>

<input id="pergunta1" placeholder="Qual é o seu nome do meio?">

</div>


<div class="form-group">

<label>Resposta 1</label>

<input id="resposta1">

</div>


<div class="form-group">

<label>Pergunta de segurança 2</label>

<input id="pergunta2" placeholder="Qual é o número da sua casa?">

</div>


<div class="form-group">

<label>Resposta 2</label>

<input id="resposta2">

</div>


<button class="salvar" onclick="salvarCadastro()">

Salvar cadastro

</button>


<button class="voltar" onclick="voltarLogin()">

Voltar ao login

</button>


<div id="mensagem" class="msg"></div>


<div class="frase">

Este Celeiro Literário era um sonho — e aqui está a prova de que sonhos também podem tornar-se reais.<br>
Bem-vindo ao Lapidar.

</div>


</div>



<script>

function detectarIdioma(){

const nav=(navigator.language||"pt").toLowerCase()

if(nav.startsWith("en"))return"en"

if(nav.startsWith("es"))return"es"

return"pt"

}



function carregarCadastros(){

return JSON.parse(localStorage.getItem("lapidar_cadastros")||"[]")

}



function salvarCadastros(lista){

localStorage.setItem("lapidar_cadastros",JSON.stringify(lista))

}



function mostrarMensagem(tipo,texto){

const box=document.getElementById("mensagem")

box.className="msg "+tipo

box.innerText=texto

}



function salvarCadastro(){


const nomeCompleto=document.getElementById("nomeCompleto").value.trim()

const login=document.getElementById("login").value.trim().toLowerCase()

const email=document.getElementById("email").value.trim().toLowerCase()

const senha=document.getElementById("senha").value

const pergunta1=document.getElementById("pergunta1").value

const resposta1=document.getElementById("resposta1").value

const pergunta2=document.getElementById("pergunta2").value

const resposta2=document.getElementById("resposta2").value



if(!nomeCompleto||!login||!email||!senha||!pergunta1||!resposta1||!pergunta2||!resposta2){

mostrarMensagem("erro","Preencha todos os campos.")

return

}



const cadastros=carregarCadastros()



const existe=cadastros.find(item=>item.login===login||item.email===email)



if(existe){

mostrarMensagem("erro","Login ou e-mail já cadastrado.")

return

}



cadastros.push({

nomeCompleto,

login,

email,

senha,

perfil:"cortesia",

idioma:detectarIdioma(),

pergunta1,

resposta1,

pergunta2,

resposta2

})



salvarCadastros(cadastros)



mostrarMensagem("ok","Cadastro salvo com sucesso.")



setTimeout(()=>{

window.location.href="index.html"

},800)



}



function voltarLogin(){

window.location.href="index.html"

}

</script>

</body>
</html>
