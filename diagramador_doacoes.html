<script src="auditoria.js"></script>
<script src="planos_usuario.js"></script>

<script>

function selecionarPlano(codigo, nome){

if(codigo === "diagramador_avulso"){

SDL_definirPlanoAvulso("diagramador")

}else{

let dias = 0

if(codigo.includes("30")) dias = 30
if(codigo.includes("90")) dias = 90
if(codigo.includes("180")) dias = 180
if(codigo.includes("365")) dias = 365

SDL_definirPlanoSetor("diagramador", nome, dias)

}

document.getElementById(
"statusDiagramadorDoacoes"
).innerHTML =
"Plano registrado: <strong>" + nome + "</strong>"

}

function abrirDiagramador(){

window.location.href =
"diagramador_inicio.html"

}

function voltarSetores(){

window.location.href =
"painel_setores.html"

}

</script>
