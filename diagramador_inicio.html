<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Assistente de Diagramação • Lapidar</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:#0e0604;
color:white;
}

header{
background:#32497d;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

header a{
background:#7b8795;
padding:10px 16px;
border-radius:10px;
color:white;
text-decoration:none;
font-weight:bold;
}

.container{
max-width:1000px;
margin:auto;
padding:20px;
}

.card{
background:#210805;
border-radius:16px;
padding:20px;
margin-bottom:20px;
}

button{
padding:14px 18px;
border-radius:12px;
border:none;
font-weight:bold;
cursor:pointer;
}

.botao-verde{
background:#2e7d32;
color:white;
}

.botao-cinza{
background:#7b8795;
color:white;
}

input,select,textarea{
width:100%;
padding:12px;
border-radius:10px;
border:none;
margin-top:8px;
margin-bottom:18px;
background:#3a120c;
color:white;
}
</style>
</head>

<body>

<header>
<h2>Assistente de Diagramação</h2>
<a href="projetos.html">Voltar</a>
</header>

<div class="container">

<div class="card">

<h3>Formato do livro</h3>
<select id="formatoLivro">
<option>A5</option>
<option>16x23</option>
<option>A4</option>
</select>

<h3>Fonte do texto</h3>
<select id="fonteTexto">
<option>Garamond</option>
<option>Times New Roman</option>
<option>Arial</option>
</select>

<h3>Tamanho da fonte</h3>
<input id="tamanhoFonte" value="12">

<h3>Espaçamento entre linhas</h3>
<select id="espacamento">
<option>1,15</option>
<option selected>1,5</option>
<option>2</option>
</select>

<h3>Observações da diagramação</h3>
<textarea id="observacoes"></textarea>

<button class="botao-verde" onclick="confirmarDiagramacao()">
Concordo com esta diagramação e quero seguir
</button>

<button class="botao-cinza" onclick="irParaExpedicao()">
Pular para expedição
</button>

</div>

</div>

<script>

function obterModulosSelecionados(){

try{
return JSON.parse(localStorage.getItem("lapidar_modulos_marcados")) || {}
}
catch{
return {}
}

}

function salvarConfiguracaoDiagramacao(){

const config = {

formato:document.getElementById("formatoLivro").value,
fonte:document.getElementById("fonteTexto").value,
tamanho:document.getElementById("tamanhoFonte").value,
espacamento:document.getElementById("espacamento").value,
observacoes:document.getElementById("observacoes").value

}

sessionStorage.setItem("diagramacao_config_atual",JSON.stringify(config))

}

function proximoModulo(){

const modulos = obterModulosSelecionados()

if(modulos.capista){

window.location.href="capista_inicio.html"
return

}

if(modulos.traducao){

window.location.href="tradutor_inicio.html"
return

}

if(modulos.avaliacao){

window.location.href="avaliador_inicio.html"
return

}

if(modulos.analisador){

window.location.href="analisador_inicio.html"
return

}

if(modulos.lapidacao){

window.location.href="lapidacao_inicio.html"
return

}

if(modulos.siloSonoro){

window.location.href="silo_sonoro_inicio.html"
return

}

window.location.href="expedicao_material.html"

}

function confirmarDiagramacao(){

salvarConfiguracaoDiagramacao()

proximoModulo()

}

function irParaExpedicao(){

window.location.href="expedicao_material.html"

}

</script>

</body>
</html>
