<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assistente de Diagramação</title>
<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:#0e0604;
color:white;
}
header{
background:#2f436d;
padding:18px 20px;
display:flex;
justify-content:space-between;
align-items:center;
}
.container{
max-width:1000px;
margin:auto;
padding:24px 16px 40px;
}
.card{
background:#1c0e08;
border-radius:14px;
padding:20px;
margin-bottom:18px;
box-shadow:0 6px 18px rgba(0,0,0,.25);
}
.modulo{
background:#2a140c;
padding:14px;
border-radius:10px;
margin-top:10px;
}
button{
padding:12px 16px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
background:#2f436d;
color:white;
}
.linhaBotoes{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:14px;
}
</style>
</head>
<body>

<header>
<h2>Assistente de Diagramação</h2>
<button onclick="voltar()">Voltar</button>
</header>

<div class="container">

<div class="card">
<h3>Projeto ativo</h3>
<div id="nomeProjeto">Nenhum projeto selecionado.</div>
</div>

<div class="card">
<h3>Módulos do Diagramador</h3>
<div class="modulo">📄 Upload do original</div>
<div class="modulo">📐 Estrutura editorial</div>
<div class="modulo">🔤 Tipografia</div>
<div class="modulo">🔢 Numeração</div>
<div class="modulo">📘 Exportação PDF</div>

<div class="linhaBotoes">
<button onclick="abrirProjetos()">Projetos</button>
<button onclick="abrirSetores()">Setores</button>
<button onclick="abrirFluxo()">Fluxo editorial</button>
</div>
</div>

</div>

<script>
const perfil = localStorage.getItem("lapidar_perfil");
if(!perfil){
window.location.href = "index.html";
}

const projeto = localStorage.getItem("lapidar_projeto_ativo");
if(projeto){
document.getElementById("nomeProjeto").innerText = projeto;
}

function voltar(){
window.location.href = "painel_setores.html";
}
function abrirProjetos(){
window.location.href = "projetos.html";
}
function abrirSetores(){
window.location.href = "painel_setores.html";
}
function abrirFluxo(){
window.location.href = "status_fluxo_editorial.html";
}
</script>

</body>
</html>
