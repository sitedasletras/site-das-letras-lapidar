<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bolsão Inicial da Obra — Lapidar</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
background:#111;
color:white;
}

header{
background:#32497d;
padding:18px;
display:flex;
justify-content:space-between;
font-size:18px;
}

.container{
max-width:900px;
margin:auto;
padding:25px;
}

.card{
border-radius:16px;
padding:22px;
margin-bottom:20px;
}

.azul{
background:#1e3a5f;
}

.amarelo{
background:#6b5200;
}

.verde{
background:#1f4a2a;
}

input{
width:100%;
padding:14px;
border:none;
border-radius:10px;
margin-top:10px;
margin-bottom:15px;
font-size:16px;
}

button{
padding:15px;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
font-size:16px;
}

.leitura{
background:#c89b00;
color:black;
margin-top:10px;
}

.continuar{
background:#2e7d32;
color:white;
width:100%;
}

</style>
</head>

<body>

<header>

<div>Bolsão inicial da obra</div>

<div>Lapidar</div>

</header>


<div class="container">


<!-- TEXTO -->

<div class="card azul">

<h2>Upload do texto da obra</h2>

<input type="file">

<button class="leitura">

Leitura automática da obra

</button>

</div>


<!-- IMAGEM -->

<div class="card amarelo">

<h2>Upload de imagens da obra</h2>

<input type="file">

</div>


<!-- AUDIO -->

<div class="card verde">

<h2>Upload da voz do autor</h2>

<input type="file">

</div>


<!-- IDENTIFICAÇÃO -->

<div class="card">

<h2>Identificação da obra</h2>

<input placeholder="Título da obra">

<input placeholder="Autor / Organizador">

</div>


<button
class="continuar"
onclick="seguir()"
>

Continuar para escolha dos módulos

</button>


</div>


<script>

function seguir(){

window.location.href="selecionar_modulos.html"

}

</script>

</body>
</html>
