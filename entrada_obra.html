<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrada da Obra — Lapidar</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
background:#0e0604;
color:white;
}

header{
background:#32497d;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.container{
max-width:900px;
margin:auto;
padding:30px;
}

.card{
background:#210805;
border-radius:18px;
padding:24px;
margin-bottom:20px;
}

select,input{
width:100%;
padding:14px;
border-radius:10px;
border:none;
margin-top:10px;
margin-bottom:20px;
background:#3a120c;
color:white;
font-size:16px;
}

button{
padding:16px 20px;
border:none;
border-radius:12px;
font-weight:bold;
cursor:pointer;
}

.botao-verde{
background:#2e7d32;
color:white;
}

</style>
</head>

<body>

<script>

/* BLOQUEIO DE ENTRADA DIRETA — PAGINA INSTITUCIONAL */

const respiracaoConfirmada =
localStorage.getItem("lapidar_respiracao_ok")

if(!respiracaoConfirmada){

window.location.href =
"pagina_institucional_lapidar.html"

}

</script>


<header>

<div>
Entrada da Obra
</div>

<div>
Lapidar
</div>

</header>


<div class="container">

<div class="card">

<h2>Identificação inicial da obra</h2>

<label>Nome da obra</label>

<input
type="text"
placeholder="Digite o nome da obra"
/>

<label>Tipo de material</label>

<select>

<option>Livro</option>
<option>Áudio</option>
<option>Vídeo</option>
<option>Projeto misto</option>

</select>


<button
class="botao-verde"
onclick="seguirFluxo()"
>

Continuar

</button>

</div>

</div>


<script>

function seguirFluxo(){

window.location.href =
"selecionar_modulos.html"

}

</script>

</body>
</html>
