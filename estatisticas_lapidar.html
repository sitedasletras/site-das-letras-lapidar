<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estatísticas do Sistema</title>

<style>

body{
font-family:Arial;
background:#efe2c2;
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:20px;
box-shadow:0 4px 10px rgba(0,0,0,.1);
}

h2{
margin-top:0;
}

.numero{
font-size:28px;
font-weight:bold;
color:#2f436d;
}

</style>
</head>

<body>

<h2>Painel Estatístico do Lapidar</h2>

<div class="card">
Hoje: <span class="numero" id="hoje"></span>
</div>

<div class="card">
Este mês: <span class="numero" id="mes"></span>
</div>

<div class="card">
Este ano: <span class="numero" id="ano"></span>
</div>

<div class="card">
Setor mais usado: <span class="numero" id="setor"></span>
</div>

<script>

const hoje = new Date()

const dia = hoje.toISOString().slice(0,10)
const mes = dia.slice(0,7)
const ano = dia.slice(0,4)

const stats = JSON.parse(localStorage.getItem("lapidar_stats") || "{}")

document.getElementById("hoje").innerText = stats[dia] || 0
document.getElementById("mes").innerText = stats[mes] || 0
document.getElementById("ano").innerText = stats[ano] || 0


let maior = 0
let setorMaisUsado = "-"

[1,3,5,7,11,13].forEach(setor=>{

const valor = stats["setor_"+setor] || 0

if(valor > maior){

maior = valor
setorMaisUsado = setor

}

})

document.getElementById("setor").innerText = setorMaisUsado

</script>

</body>
</html>
