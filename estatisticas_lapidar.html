<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Estatístico do Lapidar</title>

<style>

body{
font-family:Arial;
background:#efe2c2;
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:20px;
box-shadow:0 4px 10px rgba(0,0,0,.1);
}

.numero{
font-size:28px;
font-weight:bold;
color:#2f436d;
}

canvas{
background:white;
border-radius:12px;
padding:10px;
}

h2{
margin-top:0;
}

</style>
</head>

<body>

<h2>Painel Estatístico do Lapidar</h2>


<div class="card">
Hoje:
<span class="numero" id="hoje"></span>
</div>


<div class="card">
Este mês:
<span class="numero" id="mes"></span>
</div>


<div class="card">
Este ano:
<span class="numero" id="ano"></span>
</div>


<div class="card">
Usuários ativos agora:
<span class="numero" id="ativos"></span>
</div>


<div class="card">
Setor mais usado:
<span class="numero" id="setor"></span>
</div>


<div class="card">
Perfil mais ativo:
<span class="numero" id="perfil"></span>
</div>


<div class="card">
Acessos via cortesias:
<span class="numero" id="cortesias"></span>
</div>



<div class="card">
<h3>Uso mensal</h3>
<canvas id="graficoMes" width="320" height="150"></canvas>
</div>


<div class="card">
<h3>Uso por setor</h3>
<canvas id="graficoSetor" width="320" height="150"></canvas>
</div>


<div class="card">
<h3>Uso por perfil</h3>
<canvas id="graficoPerfil" width="320" height="150"></canvas>
</div>



<script>

/* =========================
DADOS BASE
========================= */

const hoje = new Date()

const dia = hoje.toISOString().slice(0,10)
const mes = dia.slice(0,7)
const ano = dia.slice(0,4)

const stats = JSON.parse(localStorage.getItem("lapidar_stats") || "{}")

document.getElementById("hoje").innerText = stats[dia] || 0
document.getElementById("mes").innerText = stats[mes] || 0
document.getElementById("ano").innerText = stats[ano] || 0



/* =========================
USUÁRIOS ATIVOS
========================= */

let ativos = localStorage.getItem("lapidar_online")

if(!ativos){

ativos = 1
localStorage.setItem("lapidar_online",1)

}

document.getElementById("ativos").innerText = ativos



/* =========================
SETOR MAIS USADO
========================= */

let maiorSetor = 0
let setorMaisUsado = "-"

const setores=[1,3,5,7,11,13]

setores.forEach(setor=>{

const valor = stats["setor_"+setor] || 0

if(valor > maiorSetor){

maiorSetor = valor
setorMaisUsado = setor

}

})

document.getElementById("setor").innerText = setorMaisUsado



/* =========================
PERFIL MAIS ATIVO
========================= */

let perfis = ["admin","heteronimo","usuario","convidado"]

let maiorPerfil = 0
let perfilMaisAtivo = "-"

perfis.forEach(p=>{

let valor = stats["perfil_"+p] || 0

if(valor > maiorPerfil){

maiorPerfil = valor
perfilMaisAtivo = p

}

})

document.getElementById("perfil").innerText = perfilMaisAtivo



/* =========================
CORTESIAS
========================= */

document.getElementById("cortesias").innerText = stats["perfil_convidado"] || 0



/* =========================
GRÁFICO MENSAL
========================= */

const canvasMes = document.getElementById("graficoMes")
const ctxMes = canvasMes.getContext("2d")

let dias=[]

for(let i=1;i<=31;i++){

let d = ano+"-"+mes.slice(5)+"-"+String(i).padStart(2,"0")

dias.push(stats[d] || 0)

}

ctxMes.beginPath()

dias.forEach((valor,index)=>{

let x=index*10
let y=150-(valor*8)

if(index===0){

ctxMes.moveTo(x,y)

}else{

ctxMes.lineTo(x,y)

}

})

ctxMes.stroke()



/* =========================
GRÁFICO SETOR
========================= */

const canvasSetor = document.getElementById("graficoSetor")
const ctxSetor = canvasSetor.getContext("2d")

setores.forEach((setor,index)=>{

let valor = stats["setor_"+setor] || 0

ctxSetor.fillRect(index*40,150-(valor*8),20,valor*8)

})



/* =========================
GRÁFICO PERFIL
========================= */

const canvasPerfil = document.getElementById("graficoPerfil")
const ctxPerfil = canvasPerfil.getContext("2d")

perfis.forEach((perfil,index)=>{

let valor = stats["perfil_"+perfil] || 0

ctxPerfil.fillRect(index*40,150-(valor*8),20,valor*8)

})


</script>

</body>
</html>
