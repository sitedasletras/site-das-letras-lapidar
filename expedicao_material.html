<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Expedição do Material • Lapidar</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
background:#0e0604;
color:white;
}

header{
background:#32497d;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.container{
max-width:1000px;
margin:auto;
padding:30px;
}

.card{
background:#210805;
border-radius:18px;
padding:24px;
margin-bottom:20px;
}

button{
padding:16px 22px;
border:none;
border-radius:12px;
font-weight:bold;
cursor:pointer;
}

.botao-verde{
background:#2e7d32;
color:white;
}

.botao-cinza{
background:#7b8795;
color:white;
}

.status{
background:#3a120c;
padding:14px;
border-radius:10px;
margin-top:10px;
}

</style>
</head>

<body>

<header>

<h2>Expedição do Material</h2>

<a href="inicio.html">Página inicial</a>

</header>

<div class="container">

<div class="card">

<h2>Status da obra</h2>

<div class="status" id="statusObra">

Preparando material final da obra...

</div>

</div>


<div class="card">

<button class="botao-verde" onclick="gerarMaterialFinal()">

Gerar material final da obra

</button>

</div>


<div class="card">

<button class="botao-cinza" onclick="voltarInicio()">

Voltar para página inicial

</button>

</div>


</div>

<script>

function gerarMaterialFinal(){

// simulação geração material

document.getElementById("statusObra").innerHTML=
"Material gerado com sucesso. Preparando ambiente para nova obra...";

setTimeout(function(){

resetarProjetoLapidar();

window.location.href="inicio.html";

},1500);

}



function resetarProjetoLapidar(){

console.log("Resetando ambiente editorial...");

// limpa projeto ativo

localStorage.removeItem("projetoAtivo");

localStorage.removeItem("lapidar_projeto_ativo");

localStorage.removeItem("lapidar_obra_autor");

localStorage.removeItem("lapidar_modulos_marcados");

localStorage.removeItem("estrutura_editorial_obra");


// limpa configurações temporárias

sessionStorage.removeItem("diagramacao_config_atual");

sessionStorage.removeItem("capista_config_atual");

sessionStorage.removeItem("traducao_config_atual");

sessionStorage.removeItem("avaliacao_config_atual");

sessionStorage.removeItem("lapidacao_config_atual");

sessionStorage.removeItem("silo_config_atual");


console.log("Ambiente limpo com sucesso");

}



function voltarInicio(){

window.location.href="inicio.html";

}

</script>

</body>
</html>
