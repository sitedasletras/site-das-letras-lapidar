<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expedição do Material • Lapidar</title>

<style>
body{
font-family: Arial, sans-serif;
background:#0f1f13;
color:#fff;
margin:0;
padding:0;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.card{
background:#183321;
padding:20px;
border-radius:15px;
margin-bottom:20px;
}

button{
background:#2e7d32;
border:none;
padding:14px 18px;
border-radius:10px;
color:white;
font-weight:bold;
cursor:pointer;
}

.total{
font-size:22px;
font-weight:bold;
margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<div class="card">
<h2>Resumo do Projeto</h2>

<div id="resultadoCalculo">
Carregando cálculo...
</div>

<div class="total" id="valorTotal">
Total: ---
</div>

</div>

<div class="card">
<h2>Expedição</h2>

<button onclick="simularPagamento()">
Simular pagamento aprovado
</button>

<br><br>

<button id="btnDownload" disabled onclick="baixarArquivoFinal()">
Baixar material final
</button>

</div>

</div>


<script src="lapidar_motor_calculo.js"></script>

<script>

let pagamentoConfirmado = false;


function calcularProjeto(){

const resumo = LapidarCalculo.calcularProjeto({

modulos:{
avaliacao:true,
traducao:true
},

avaliacao:{
topGlobal:false,
quantidadeModulos:4
},

traducao:{
topGlobal:false,
quantidadeIdiomas:2
},

extras:{
gerarSinopse:true,
gerarPrefacio:true,
gerarBiografia:true
}

});

document.getElementById("resultadoCalculo").innerText =
JSON.stringify(resumo.itens, null, 2);

document.getElementById("valorTotal").innerText =
"Total: " + resumo.totalFormatado;

}


function simularPagamento(){

pagamentoConfirmado = true;

alert("Pagamento confirmado (simulação). Download liberado.");

document.getElementById("btnDownload").disabled = false;

}


function baixarArquivoFinal(){

if(!pagamentoConfirmado){

alert("Pagamento ainda não confirmado.");

return;

}

const conteudo = "Arquivo final gerado pelo Lapidar.";

const blob = new Blob([conteudo], {type:"text/plain"});

const link = document.createElement("a");

link.href = URL.createObjectURL(blob);

link.download = "material_final_lapidar.txt";

link.click();

}


calcularProjeto();

</script>


</body>
</html>
