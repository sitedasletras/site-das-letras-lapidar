<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expedição do material • Lapidar</title>

<style>
body{font-family:Arial;background:#0f1f13;color:white;margin:0}
.container{max-width:950px;margin:auto;padding:20px}
.card{background:#183321;padding:20px;border-radius:15px;margin-bottom:20px}
button{background:#2e7d32;border:none;padding:14px 18px;border-radius:10px;color:white;font-weight:bold;cursor:pointer}
.total{font-size:22px;font-weight:bold;margin-top:10px}
</style>
</head>

<body>

<div class="container">

<div class="card">
<h2>Resumo financeiro</h2>
<pre id="resumo">Calculando...</pre>
<div class="total" id="total"></div>
</div>

<div class="card">
<h2>Status pagamento</h2>
<div id="status">Aguardando confirmação Hotmart</div>
<button onclick="simularPagamento()">Simular pagamento aprovado</button>
</div>

<div class="card">
<h2>Download</h2>
<button id="downloadBtn" disabled onclick="baixar()">Baixar pacote editorial</button>
</div>

</div>

<script src="lapidar_motor_calculo.js"></script>

<script>

let pago=false;

function carregar(){

const dados=JSON.parse(localStorage.getItem("lapidar_modulos"));

if(!dados)return;

const resumo=LapidarCalculo.calcularProjeto({
modulos:dados,
avaliacao:{quantidadeModulos:4},
traducao:{quantidadeIdiomas:2}
});

document.getElementById("resumo").innerText=JSON.stringify(resumo.itens,null,2);
document.getElementById("total").innerText="Total: "+resumo.totalFormatado;

}

function simularPagamento(){

pago=true;

document.getElementById("status").innerText="Pagamento confirmado";

document.getElementById("downloadBtn").disabled=false;

}

function baixar(){

if(!pago)return alert("Pagamento não confirmado");

const blob=new Blob(["Pacote Lapidar"],{type:"text/plain"});

const a=document.createElement("a");

a.href=URL.createObjectURL(blob);

a.download="pacote_lapidar.txt";

a.click();

}

carregar();

</script>

</body>
</html>
