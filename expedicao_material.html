<style>

body{

}

.container{
max-width:950px;
margin:auto;
padding:20px;

<body>

<div class="container">

<div class="card">

<h2>Resumo Financeiro do Projeto</h2>

<pre id="listaItens">
Calculando projeto...
</pre>

<div class="total" id="valorTotal">
Total: ---
</div>

</div>


<div class="card">

<h2>Status do Pedido</h2>

<div id="statusPagamento">
Aguardando confirmaÃ§Ã£o de pagamento Hotmart
</div>

<button onclick="simularPagamento()">
Simular pagamento aprovado
</button>

</div>


<div class="card">

<h2>Download do Material</h2>

<button id="botaoDownload" disabled onclick="baixarPacoteFinal()">
Baixar pacote editorial completo
</button>

</div>

</div>


<script src="lapidar_motor_calculo.js"></script>

<script>

let pagamentoConfirmado=false;


function montarProjeto(){

const dadosSelecionados=JSON.parse(
localStorage.getItem("lapidar_modulos")
);

if(!dadosSelecionados){

alert("Nenhum mÃ³dulo selecionado");

return;

}


const resumo=LapidarCalculo.calcularProjeto({

modulos:dadosSelecionados,

diagramacao:{
topGlobal:false,
modo:"hibrido",
planoAtivo:false,
cvrItens:[0.12,0.08]
},

capista:{
topGlobal:false,
modo:"nacional",
planoAtivo:false,
cvrItens:[0.10]
},

traducao:{
topGlobal:false,
quantidadeIdiomas:2
},

avaliacao:{
topGlobal:false,
quantidadeModulos:4
},

analisador:{
topGlobal:false,
paginasRelatorio:11
},

lapidacao:{
topGlobal:false
},

siloSonoro:{
topGlobal:false,
quantidadeAudiobooks:1
},

extras:{
gerarSinopse:true,
gerarPrefacio:true,
gerarBiografia:true
}

});


document.getElementById("listaItens").innerText=
JSON.stringify(resumo.itens,null,2);


document.getElementById("valorTotal").innerText=
"Total: "+resumo.totalFormatado;

}



function simularPagamento(){

pagamentoConfirmado=true;

document.getElementById("statusPagamento").innerText=
"Pagamento confirmado pela Hotmart";

document.getElementById("botaoDownload").disabled=false;

}



function baixarPacoteFinal(){

if(!pagamentoConfirmado){

alert("Pagamento nÃ£o confirmado ainda");

return;

}

const conteudo="Pacote editorial Lapidar gerado com sucesso";

const blob=new Blob([conteudo],{type:"text/plain"});

const link=document.createElement("a");

link.href=URL.createObjectURL(blob);

link.download="pacote_editorial_lapidar.txt";

link.click();

}



montarProjeto();

</script>


</body>
</html>
