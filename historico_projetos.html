<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Histórico editorial — Lapidar</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:#0d0603;
color:white;
display:flex;
justify-content:center;
}

.container{
max-width:760px;
width:92%;
padding:40px 0 60px 0;
}

.titulo{
font-size:36px;
text-align:center;
font-weight:bold;
}

.subtitulo{
text-align:center;
color:#ff7b2c;
margin-top:10px;
margin-bottom:28px;
line-height:1.6;
}

.card{
background:#140c08;
border-radius:14px;
padding:22px;
margin-top:18px;
line-height:1.7;
}

.linha{
margin-top:14px;
}

.label{
color:#ff7b2c;
font-weight:bold;
}

.valor{
color:#ffd2b3;
}

.alerta{
margin-top:18px;
color:#9cffb2;
font-weight:bold;
text-align:center;
}

.botao{
width:100%;
padding:18px;
margin-top:18px;
border:none;
border-radius:40px;
background:#ff5a00;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.botao:hover{
background:#ff6f1a;
}

.botaoCinza{
background:#444;
}

.botaoCinza:hover{
background:#666;
}

.lista{
margin-top:14px;
line-height:1.8;
}
</style>
</head>

<body>

<div class="container">

<div class="titulo">
Histórico editorial
</div>

<div class="subtitulo">
Registro das ações realizadas dentro do ambiente Lapidar
</div>

<div class="card">

<div class="linha">
<span class="label">Original enviado</span><br>
<span id="originalStatus" class="valor"></span>
</div>

<div class="linha">
<span class="label">Idioma principal definido</span><br>
<span id="idiomaStatus" class="valor"></span>
</div>

<div class="linha">
<span class="label">Preferências de diagramação</span><br>
<span id="diagramacaoStatus" class="valor"></span>
</div>

<div class="linha">
<span class="label">Projeto Capista</span><br>
<span id="capistaStatus" class="valor"></span>
</div>

<div class="linha">
<span class="label">Leitura Técnica Editorial</span><br>
<span id="leituraStatus" class="valor"></span>
</div>

</div>

<div class="card">

<div class="label">
Registro técnico do ambiente
</div>

<div id="registroSistema" class="lista"></div>

</div>

<div class="alerta" id="mensagemFinal"></div>

<button class="botao"
onclick="window.location.href='_Indice.html'">

Voltar para a casa do original

</button>

<button class="botao botaoCinza"
onclick="limparHistorico()">

Limpar histórico local deste navegador

</button>

</div>

<script>

function status(valor){

if(valor)
return "Registrado";

return "Não registrado";

}

function carregarHistorico(){

const original =
localStorage.getItem("SDL_original_enviado");

const idioma =
localStorage.getItem("SDL_idioma_obra");

const diagramacao =
localStorage.getItem("SDL_preferencias_diag");

const capista =
localStorage.getItem("CAPISTA_status_geracao");

const leitura =
localStorage.getItem("LTE_status");

document.getElementById("originalStatus")
.innerText = status(original);

document.getElementById("idiomaStatus")
.innerText = status(idioma);

document.getElementById("diagramacaoStatus")
.innerText = status(diagramacao);

document.getElementById("capistaStatus")
.innerText = status(capista);

document.getElementById("leituraStatus")
.innerText = status(leitura);

gerarRegistroTecnico();

}

function gerarRegistroTecnico(){

const idiomaSistema =
localStorage.getItem("SDL_idioma_interface");

const usuario =
localStorage.getItem("SDL_usuario_logado");

const plano =
localStorage.getItem("SDL_plano_lapidar");

const pagamento =
localStorage.getItem("SDL_status_pagamento");

let texto = "";

texto += "Usuário ativo: " + (usuario || "Não identificado") + "<br>";

texto += "Idioma da interface: "
+ (idiomaSistema || "Não definido") + "<br>";

texto += "Plano Lapidar: "
+ (plano || "Não selecionado") + "<br>";

texto += "Situação de pagamento: "
+ (pagamento || "Não registrada") + "<br>";

document.getElementById("registroSistema")
.innerHTML = texto;

if(usuario){

document.getElementById("mensagemFinal")
.innerText =
"O ambiente editorial Lapidar está registrando corretamente as ações desta sessão.";

}

}

function limparHistorico(){

localStorage.clear();

alert("Histórico local removido deste navegador.");

window.location.href = "login.html";

}

carregarHistorico();

</script>

</body>
</html>
