<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Histórico de Projetos — Lapidar</title>

<style>

:root{
--bg:#0d0603;
--card:#140c08;
--card2:#1b100a;
--text:#ffffff;
--muted:#ffd2b3;
--orange:#f7b22c;
--green:#9cfdb2;
--border:rgba(255,123,44,0.18);
--shadow:0 10px 26px rgba(0,0,0,0.28);
}

body{
margin:0;
font-family:Arial;
background:var(--bg);
color:white;
}

.container{
width:min(1100px,95%);
margin:auto;
padding:40px 0;
}

.titulo{
font-size:38px;
font-weight:bold;
}

.card{
margin-top:25px;
background:var(--card);
padding:24px;
border-radius:18px;
border:1px solid var(--border);
box-shadow:var(--shadow);
}

.projeto{
padding:18px;
margin-top:14px;
border-radius:14px;
background:var(--card2);
cursor:pointer;
}

.projeto:hover{
background:#23140c;
}

.actions{
margin-top:20px;
display:flex;
gap:10px;
flex-wrap:wrap;
}

button{
border:none;
padding:12px 18px;
border-radius:999px;
cursor:pointer;
}

.btnAtivar{
background:#174d27;
color:white;
}

.btnExcluir{
background:#5a1c1c;
color:white;
}

.btnIndice{
background:#24150f;
color:white;
}

</style>
</head>

<body>

<div class="container">

<div class="titulo">
HISTÓRICO DE PROJETOS
</div>

<div id="listaProjetos"></div>

<div class="actions">

<button class="btnIndice" onclick="voltarIndice()">
Voltar ao índice
</button>

</div>

</div>



<script>

function verificarSessao(){

const sessao=localStorage.getItem("SDL_sessao_ativa")

if(sessao!=="sim"){

window.location.href="login.html"

}

}



function carregarProjetos(){

let lista=[]

try{

const bruto=localStorage.getItem("SDL_projetos_lista")

if(bruto){

lista=JSON.parse(bruto)

}

}catch(e){}



const ativo=localStorage.getItem("SDL_projeto_ativo")

const area=document.getElementById("listaProjetos")

if(lista.length===0){

area.innerHTML="Nenhum projeto registrado ainda."

return

}



area.innerHTML=""



lista.forEach(p=>{

area.innerHTML+=`

<div class="card">

<strong>${p.titulo}</strong><br>

Autor: ${p.autor || "—"}<br>

Formato: ${p.formato || "—"}<br>

Status: ${p.status || "—"}<br>

Registrado em:
${formatarData(p.dataRegistro)}

<br><br>

<button class="btnAtivar"
onclick="ativarProjeto('${p.id}')">

${ativo===p.id ? "Projeto ativo" : "Ativar projeto"}

</button>

<button class="btnExcluir"
onclick="excluirProjeto('${p.id}')">

Excluir

</button>

</div>

`

})

}



function ativarProjeto(id){

localStorage.setItem("SDL_projeto_ativo",id)

alert("Projeto ativado.")

carregarProjetos()

}



function excluirProjeto(id){

let lista=JSON.parse(localStorage.getItem("SDL_projetos_lista")||"[]")

lista=lista.filter(p=>p.id!==id)

localStorage.setItem("SDL_projetos_lista",JSON.stringify(lista))

carregarProjetos()

}



function formatarData(d){

if(!d) return "—"

try{

return new Date(d).toLocaleString("pt-BR")

}catch{

return d

}

}



function voltarIndice(){

window.location.href="_Indice.html"

}



verificarSessao()
carregarProjetos()

</script>

</body>
</html>
