<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Histórico de Projetos — Lapidar</title>

<style>

body{
margin:0;
font-family:Arial;
background:linear-gradient(180deg,#0d2a21,#04120d);
color:white;
}

.container{
max-width:1100px;
margin:auto;
padding:24px;
}

.card{
background:rgba(255,255,255,.07);
border-radius:18px;
padding:24px;
margin-bottom:20px;
}

h1{
margin-top:0;
}

.projeto{
background:rgba(255,255,255,.05);
padding:14px;
border-radius:12px;
margin-bottom:10px;
display:flex;
justify-content:space-between;
align-items:center;
}

button{
border:none;
padding:10px 14px;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

.btn{
background:#2ecc71;
color:#062414;
}

.btn2{
background:#dcefe4;
color:#103222;
}

.vazio{
opacity:.7;
}

</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>Histórico de Projetos</h1>

<div id="listaProjetos"></div>

<br>

<button class="btn" onclick="novoProjeto()">
Novo projeto
</button>

</div>

</div>

<script>

function carregarProjetos(){

let projetos = JSON.parse(localStorage.getItem("historico_lapidar") || "[]");

let container = document.getElementById("listaProjetos");

if(projetos.length === 0){

container.innerHTML = "<div class='vazio'>Nenhum projeto registrado ainda.</div>";

return;

}

container.innerHTML = "";

projetos.reverse().forEach((p,i)=>{

container.innerHTML += `
<div class="projeto">

<div>

<strong>${p.titulo}</strong><br>

Autor: ${p.autor}<br>

Criado: ${new Date(p.criadoEm).toLocaleString()}

</div>

<div>

<button class="btn" onclick="abrirProjeto(${i})">
Abrir
</button>

</div>

</div>
`;

});

}

function abrirProjeto(index){

let projetos = JSON.parse(localStorage.getItem("historico_lapidar"));

localStorage.setItem("projeto_lapidar", JSON.stringify(projetos[index]));

window.location.href="painel_projeto.html";

}

function novoProjeto(){

window.location.href="producao_integrada.html";

}

carregarProjetos();

</script>

</body>
</html>
