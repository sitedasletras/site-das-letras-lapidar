<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Histórico de Projetos — Lapidar</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0d0603;
color:white;
}

header{
background:#2f436d;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.container{
max-width:1000px;
margin:auto;
padding:30px 20px;
}

.card{
background:#14100c;
border-radius:14px;
padding:20px;
margin-bottom:20px;
box-shadow:0 6px 20px rgba(0,0,0,.25);
}

.lista{
background:#1b100a;
border-radius:10px;
padding:15px;
margin-top:10px;
}

button{
padding:12px 16px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
background:#2f436d;
color:white;
margin-right:10px;
margin-top:10px;
}

button.alt{
background:#8a6f3f;
}

button.sec{
background:#6c757d;
}

</style>
</head>

<body>

<header>

<h2>Histórico de Projetos</h2>

<button onclick="voltar()">Voltar</button>

</header>


<div class="container">


<div class="card">

<h3>Projeto ativo</h3>

<div id="projetoAtual">

Nenhum projeto ativo selecionado.

</div>

</div>


<div class="card">

<h3>Projetos registrados</h3>

<div class="lista" id="listaProjetos">

Nenhum projeto registrado ainda.

</div>

<button onclick="limparHistorico()" class="alt">
Limpar histórico
</button>

</div>


<div class="card">

<h3>Ações rápidas</h3>

<button onclick="abrirProjetos()">
Ir para Projetos
</button>

<button onclick="abrirFluxo()" class="sec">
Abrir Fluxo Editorial
</button>

</div>


</div>


<script>

/* =========================
SESSION GUARD PADRÃO LAPIDAR
========================= */

const perfil = localStorage.getItem("lapidar_perfil")

if(!perfil){

window.location.href="index.html"

}


/* =========================
CARREGAR PROJETO ATIVO
========================= */

const ativo = localStorage.getItem("lapidar_projeto_ativo")

if(ativo){

document.getElementById("projetoAtual").innerText = ativo

}


/* =========================
CARREGAR HISTÓRICO
========================= */

const historico = JSON.parse(
localStorage.getItem("lapidar_historico_projetos") || "[]"
)

if(historico.length){

document.getElementById("listaProjetos").innerHTML =
historico.join("<br>")

}


/* =========================
FUNÇÕES
========================= */

function limparHistorico(){

localStorage.removeItem("lapidar_historico_projetos")

location.reload()

}


function abrirProjetos(){

window.location.href="projetos.html"

}


function abrirFluxo(){

window.location.href="status_fluxo_editorial.html"

}


function voltar(){

window.location.href="admin.html"

}

</script>


</body>
</html>
