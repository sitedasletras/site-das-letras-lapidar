<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Histórico de Projetos — Lapidar</title>

<style>

:root{
--bg:#0d0603;
--card:#140c08;
--card2:#1b100a;
--text:#ffffff;
--muted:#ffd2b3;
--orange:#f7b22c;
--orangeStrong:#ff5a00;
--green:#9cfdb2;
--danger:#ff7070;
--border:rgba(255,123,44,0.18);
--shadow:0 10px 26px rgba(0,0,0,0.28);
}

body{
margin:0;
font-family:Arial;
background:var(--bg);
color:white;
}

.container{
width:min(1100px,95%);
margin:auto;
padding:40px 0;
}

.titulo{
font-size:38px;
font-weight:bold;
}

.subtitulo{
margin-top:6px;
color:var(--orange);
}

.card{
margin-top:30px;
background:var(--card);
padding:24px;
border-radius:18px;
border:1px solid var(--border);
box-shadow:var(--shadow);
}

.statusBox{
margin-top:20px;
padding:18px;
border-radius:14px;
background:rgba(247,178,44,0.12);
border:1px solid rgba(247,178,44,0.2);
color:#ffe7b0;
}

.linha{
margin-top:12px;
color:var(--muted);
}

.rotulo{
color:var(--orange);
font-weight:bold;
}

.actions{
margin-top:26px;
display:flex;
flex-wrap:wrap;
gap:12px;
}

.botao{
border:none;
padding:14px 18px;
border-radius:999px;
font-weight:bold;
cursor:pointer;
}

.botaoIndice{
background:#24150f;
color:white;
}

.botaoPreview{
background:var(--orangeStrong);
color:white;
}

.botaoUpload{
background:#174d27;
color:#dfffe8;
}

.botaoLimpar{
background:#5a1c1c;
color:white;
}

</style>
</head>

<body>

<div class="container">

<div class="titulo">
HISTÓRICO DO PROJETO ATIVO
</div>

<div class="subtitulo">
Leitura do cadastro editorial salvo no ambiente Lapidar
</div>



<div class="card">

<div id="statusHistorico" class="statusBox">
Carregando projeto...
</div>

<div id="dadosProjeto"></div>

</div>



<div class="actions">

<button class="botao botaoPreview" onclick="abrirPreview()">
Abrir preview
</button>

<button class="botao botaoUpload" onclick="abrirUpload()">
Editar projeto
</button>

<button class="botao botaoLimpar" onclick="limparProjeto()">
Limpar projeto
</button>

<button class="botao botaoIndice" onclick="voltarIndice()">
Voltar ao índice
</button>

</div>



</div>



<script>

function verificarSessao(){

const sessao = localStorage.getItem("SDL_sessao_ativa")

if(sessao !== "sim"){

window.location.href = "login.html"

}

}



function carregarProjeto(){

let projeto = null

try{

const bruto = localStorage.getItem("SDL_projeto_ativo")

if(bruto){

projeto = JSON.parse(bruto)

}

}catch(e){

console.log("Erro ao ler projeto")

}



const status = document.getElementById("statusHistorico")
const area = document.getElementById("dadosProjeto")

if(!projeto){

status.innerHTML =
"Nenhum projeto cadastrado ainda neste dispositivo."

area.innerHTML = ""

return

}



status.innerHTML =
"Projeto carregado com sucesso."

status.style.background =
"rgba(23,77,39,0.28)"



area.innerHTML = `

<div class="linha"><span class="rotulo">Título:</span> ${projeto.titulo || "—"}</div>

<div class="linha"><span class="rotulo">Subtítulo:</span> ${projeto.subtitulo || "—"}</div>

<div class="linha"><span class="rotulo">Autor:</span> ${projeto.autor || "—"}</div>

<div class="linha"><span class="rotulo">Coleção:</span> ${projeto.colecao || "—"}</div>

<div class="linha"><span class="rotulo">Formato:</span> ${projeto.formato || "—"}</div>

<div class="linha"><span class="rotulo">Status editorial:</span> ${projeto.status || "—"}</div>

<div class="linha"><span class="rotulo">Observações:</span> ${projeto.observacoes || "—"}</div>

<div class="linha"><span class="rotulo">Registrado em:</span> ${formatarData(projeto.dataRegistro)}</div>

`

}



function formatarData(data){

if(!data) return "—"

try{

return new Date(data).toLocaleString("pt-BR")

}catch(e){

return data

}

}



function limparProjeto(){

const confirmar = confirm("Deseja remover o projeto ativo deste dispositivo?")

if(!confirmar) return

localStorage.removeItem("SDL_projeto_ativo")

document.getElementById("statusHistorico").innerHTML =
"Projeto removido com sucesso."

document.getElementById("dadosProjeto").innerHTML = ""

}



function abrirPreview(){

window.location.href = "preview_projeto.html"

}



function abrirUpload(){

window.location.href = "upload_livro.html"

}



function voltarIndice(){

window.location.href = "_Indice.html"

}



verificarSessao()
carregarProjeto()

</script>

</body>
</html>
