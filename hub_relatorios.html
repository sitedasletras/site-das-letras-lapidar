<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hub de Relatórios</title>

<style>

body{
font-family:Arial;
background:#efe2c2;
margin:0;
padding:0;
}

header{
background:#6b4ca5;
color:white;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.container{
padding:20px;
}

.card{
background:white;
border-radius:12px;
padding:20px;
margin-bottom:20px;
box-shadow:0 4px 10px rgba(0,0,0,.1);
}

button{
padding:12px 18px;
border:none;
border-radius:8px;
background:#6b4ca5;
color:white;
cursor:pointer;
margin-right:10px;
margin-top:10px;
}

button.sec{
background:#2f436d;
}

button.alt{
background:#8a6f3f;
}

.lista{
margin-top:10px;
padding:10px;
background:#f7f2e4;
border-radius:8px;
}

</style>
</head>

<body>

<header>

<h2>Hub de Relatórios</h2>

<button onclick="voltar()">Voltar ao Admin</button>

</header>


<div class="container">


<div class="card">

<h3>Relatório mestre da obra</h3>

<button onclick="abrirFluxo()">Abrir Status do Fluxo Editorial</button>

<button class="sec" onclick="abrirProjetos()">Abrir Projetos</button>

</div>


<div class="card">

<h3>Painel estatístico do sistema</h3>

<button onclick="abrirEstatisticas()">Abrir Estatísticas do Lapidar</button>

</div>


<div class="card">

<h3>Histórico de relatórios gerados</h3>

<div class="lista" id="historicoRelatorios">

Nenhum relatório registrado ainda.

</div>

<button class="alt" onclick="gerarRelatorio()">Gerar novo relatório</button>

</div>


</div>


<script>

/* =========================
SESSION GUARD INSTITUCIONAL
========================= */

const perfil = localStorage.getItem("lapidar_perfil")

if(!perfil){

window.location.href="index.html"

}


/* =========================
CARREGAR HISTÓRICO
========================= */

const historico = JSON.parse(
localStorage.getItem("lapidar_historico_relatorios") || "[]"
)

if(historico.length){

document.getElementById("historicoRelatorios").innerHTML =
historico.join("<br>")

}


/* =========================
GERAR RELATÓRIO
========================= */

function gerarRelatorio(){

const data = new Date().toLocaleString("pt-BR")

let hist = JSON.parse(
localStorage.getItem("lapidar_historico_relatorios") || "[]"
)

hist.push("Relatório gerado em " + data)

localStorage.setItem(
"lapidar_historico_relatorios",
JSON.stringify(hist)
)

location.reload()

}


/* =========================
NAVEGAÇÃO
========================= */

function abrirFluxo(){

window.location.href="status_fluxo_editorial.html"

}


function abrirProjetos(){

window.location.href="projetos.html"

}


function abrirEstatisticas(){

window.location.href="estatisticas_lapidar.html"

}


function voltar(){

window.location.href="admin.html"

}

</script>


</body>
</html>
