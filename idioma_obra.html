<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Idioma da obra — Lapidar</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0d0603;
color:white;
display:flex;
justify-content:center;
}

.container{
max-width:760px;
width:92%;
padding:40px 0 60px 0;
}

.titulo{
font-size:36px;
text-align:center;
font-weight:bold;
}

.epigrafe{
text-align:center;
font-style:italic;
color:#ffe6c9;
margin-top:10px;
}

.subtitulo{
text-align:center;
color:#ff7b2c;
margin-top:10px;
margin-bottom:28px;
}

.card{
background:#140c08;
border-radius:14px;
padding:24px;
}

select,input{
width:100%;
padding:14px;
margin-top:8px;
border-radius:10px;
border:none;
}

.botaoIdioma{
width:100%;
padding:18px;
margin-top:20px;
border-radius:40px;
border:2px solid #ff7b2c;
background:white;
color:black;
font-weight:bold;
cursor:pointer;
}

.botaoIdioma:hover{
background:#fff6ef;
}

.botaoCinza{
width:100%;
padding:18px;
margin-top:10px;
border-radius:40px;
border:none;
background:#444;
color:white;
cursor:pointer;
}
</style>
</head>
<body>

<div class="container">

<div class="titulo">Idioma da obra</div>

<div class="epigrafe">
Opus tuum in alias linguas conversum a Lapidare
</div>

<div class="subtitulo">
Diagramação internacional multilíngue com estrutura editorial preservada
</div>

<div class="card">

<label>Plano internacional</label>

<select id="plano">
<option value="40">
Plano simples — 10 diagramações internacionais — capa simples
</option>

<option value="70">
Plano premium — 20 diagramações internacionais — capa premium
</option>

</select>


<label>ID da obra</label>

<input id="idObra"
placeholder="ex: obra_baltar_2026">


<label>Idioma original</label>

<select id="idiomaOriginal"></select>


<label>Idioma internacional desejado</label>

<select id="idiomaDestino"></select>


<button class="botaoIdioma"
onclick="registrarPlano()">

Registrar diagramação internacional

</button>


<button class="botaoCinza"
onclick="window.location.href='status_plano.html'">

Ver status do plano

</button>

</div>

</div>

<script>

let idiomasDisponiveis=null


async function carregarIdiomas(){

let resposta=await fetch("idiomas.json")

let dados=await resposta.json()

idiomasDisponiveis=dados.idiomas_suportados

let origem=document.getElementById("idiomaOriginal")

let destino=document.getElementById("idiomaDestino")

origem.innerHTML=""

destino.innerHTML=""

idiomasDisponiveis.forEach(function(nome){

let opt1=document.createElement("option")

opt1.value=nome

opt1.textContent=nome

origem.appendChild(opt1)

let opt2=document.createElement("option")

opt2.value=nome

opt2.textContent=nome

destino.appendChild(opt2)

})

}


function registrarPlano(){

let plano=document.getElementById("plano").value

let idObra=document.getElementById("idObra").value.trim()

if(idObra===""){

alert("Informe o ID da obra")

return

}

let inicio=localStorage.getItem("DIAGRAMACAO_INTERNACIONAL_DATA_ATIVACAO")

if(!inicio){

let agora=new Date()

let fim=new Date()

fim.setDate(agora.getDate()+30)

localStorage.setItem(

"DIAGRAMACAO_INTERNACIONAL_DATA_ATIVACAO",

agora.toISOString()

)

localStorage.setItem(

"DIAGRAMACAO_INTERNACIONAL_DATA_FIM",

fim.toISOString()

)

}

if(plano==="40"){

localStorage.setItem(

"DIAGRAMACAO_INTERNACIONAL_PLANO",

"40"

)

localStorage.setItem(

"DIAGRAMACAO_INTERNACIONAL_LIMITE",

"10"

)

localStorage.setItem(

"DIAGRAMACAO_INTERNACIONAL_CAPA",

"simples"

)

}

if(plano==="70"){

localStorage.setItem(

"DIAGRAMACAO_INTERNACIONAL_PLANO",

"70"

)

localStorage.setItem(

"DIAGRAMACAO_INTERNACIONAL_LIMITE",

"20"

)

localStorage.setItem(

"DIAGRAMACAO_INTERNACIONAL_CAPA",

"premium"

)

}


let usados=parseInt(

localStorage.getItem(

"DIAGRAMACAO_INTERNACIONAL_USADOS"

)||"0"

)

let limite=parseInt(

localStorage.getItem(

"DIAGRAMACAO_INTERNACIONAL_LIMITE"

)

)


let lista=

JSON.parse(

localStorage.getItem(

"DIAGRAMACAO_INTERNACIONAL_IDS"

)||"[]"

)


if(!lista.includes(idObra)){

if(usados>=limite){

alert("Limite do plano atingido")

return

}

lista.push(idObra)

localStorage.setItem(

"DIAGRAMACAO_INTERNACIONAL_IDS",

JSON.stringify(lista)

)

localStorage.setItem(

"DIAGRAMACAO_INTERNACIONAL_USADOS",

usados+1

)

}

alert("Diagramação internacional registrada com sucesso")

}


carregarIdiomas()

</script>

</body>
</html>
