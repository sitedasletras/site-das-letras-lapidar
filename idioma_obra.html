<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Idioma da obra — Lapidar</title>

<style>

body{

margin:0;
background:#0c0603;
font-family:Arial;
color:white;
display:flex;
justify-content:center;

}

.container{

max-width:720px;
width:92%;
padding:40px 0 60px 0;

}

.titulo{

font-size:34px;
text-align:center;
font-weight:bold;

}

.subtitulo{

text-align:center;
color:#ff7b2c;
margin-top:10px;
margin-bottom:28px;

}

.card{

background:#140c08;
border-radius:14px;
padding:26px;
margin-top:20px;

}

label{

display:block;
margin-top:18px;
color:#ffd2b3;

}

select{

width:100%;
padding:12px;
margin-top:6px;
border-radius:8px;
border:none;

}

.botao{

width:100%;
padding:18px;
margin-top:24px;
border:none;
border-radius:40px;
background:#ff5a00;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;

}

.info{

margin-top:14px;
font-size:14px;
color:#ffcfaa;

}

</style>

</head>

<body>

<div class="container">

<div class="titulo">

Idioma da obra

</div>

<div class="subtitulo">

Escolha o idioma principal do material editorial

</div>

<div class="card">

<label>

Idioma original da obra

</label>

<select id="idiomaOriginal">

<option value="pt">Português</option>
<option value="en">English</option>
<option value="es">Español</option>
<option value="it">Italiano</option>
<option value="fr">Français</option>
<option value="de">Deutsch</option>

</select>

<label>

Gerar versão em outro idioma

</label>

<select id="idiomaDestino">

<option value="nenhum">Não gerar outro idioma</option>
<option value="en">English</option>
<option value="es">Español</option>
<option value="it">Italiano</option>
<option value="fr">Français</option>
<option value="de">Deutsch</option>

</select>

<div class="info">

Gerar versão multilíngue possui contribuição editorial de R$ 5,99.

</div>

<button

class="botao"

onclick="salvarIdiomaObra()">

Confirmar idioma da obra

</button>

<button

class="botao"

onclick="window.location.href='_Indice.html'">

Voltar para casa do original

</button>

</div>

</div>

<script>

function detectarIdiomaSistema(){

const idioma = navigator.language;

if(idioma.startsWith("pt")) return "pt";
if(idioma.startsWith("en")) return "en";
if(idioma.startsWith("es")) return "es";
if(idioma.startsWith("it")) return "it";
if(idioma.startsWith("fr")) return "fr";
if(idioma.startsWith("de")) return "de";

return "pt";

}

function salvarIdiomaObra(){

const idiomaOriginal =

document.getElementById("idiomaOriginal").value;

const idiomaDestino =

document.getElementById("idiomaDestino").value;

localStorage.setItem(

"SDL_idioma_obra_global",

idiomaOriginal

);

localStorage.setItem(

"SDL_idioma_interface",

detectarIdiomaSistema()

);

if(idiomaDestino !== "nenhum"){

localStorage.setItem(

"SDL_idioma_extra",

idiomaDestino

);

localStorage.setItem(

"SDL_servico_extra",

"idioma_obra"

);

}

alert("Idioma configurado com sucesso.");

window.location.href = "upload_livro.html";

}

</script>

</body>

</html>
