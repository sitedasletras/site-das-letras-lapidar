<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lapidar</title>

<style>

body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:#f4efe4;
}

.container{
max-width:420px;
margin:auto;
padding:40px 20px;
}

.box{
background:white;
padding:30px;
border-radius:18px;
box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

h1{
text-align:center;
margin-top:0;
}

label{
display:block;
margin-top:14px;
font-weight:bold;
font-size:14px;
}

input{
width:100%;
padding:14px;
margin-top:6px;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
box-sizing:border-box;
}

button{
width:100%;
padding:16px;
margin-top:20px;
border:none;
background:#17335d;
color:white;
font-size:16px;
border-radius:12px;
cursor:pointer;
font-weight:bold;
}

.cadastro{
background:#c9b48b;
color:#333;
}

.msg{
margin-top:14px;
padding:12px;
border-radius:10px;
font-size:14px;
display:none;
}

.msg.ok{
display:block;
background:#eef8f0;
color:#1f6b36;
}

.msg.erro{
display:block;
background:#fff1f1;
color:#a12626;
}

</style>
</head>


<body>

<div class="container">
<div class="box">

<h1>Entrar no Lapidar</h1>

<label>Email</label>
<input id="email">

<label>Senha</label>
<input id="senha" type="password">

<button onclick="entrarSistema()">
Entrar
</button>

<button class="cadastro" onclick="irCadastro()">
Criar cadastro
</button>

<div id="mensagem" class="msg"></div>

</div>
</div>


<script>


function mostrarMensagem(tipo,texto){

const box=document.getElementById("mensagem")

box.className="msg "+tipo
box.innerText=texto

}


function carregarCadastros(){

try{

return JSON.parse(localStorage.getItem("lapidar_cadastros") || "[]")

}

catch(e){

return []

}

}



function entrarSistema(){

const email=document.getElementById("email").value.trim().toLowerCase()
const senha=document.getElementById("senha").value.trim()

if(!email || !senha){

mostrarMensagem("erro","Digite email e senha.")

return

}


const cadastros=carregarCadastros()

const usuario=cadastros.find(item=>

item.email===email &&
item.senha===senha

)


if(!usuario){

mostrarMensagem("erro","Cadastro não encontrado.")

return

}


/* login válido */

localStorage.setItem("lapidar_usuario_logado",usuario.id)
localStorage.setItem("lapidar_nome",usuario.nomeCompleto)
localStorage.setItem("lapidar_email",usuario.email)


mostrarMensagem("ok","Entrada autorizada.")


setTimeout(()=>{

window.location.href="painel_setores.html"

},600)

}



function irCadastro(){

window.location.href="cadastro.html"

}


</script>

</body>
</html>
