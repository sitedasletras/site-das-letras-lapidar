<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lapidar — Acesso</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
height:100vh;
font-family:Arial, sans-serif;

background-image:url("pergaminho.jpg");
background-size:cover;
background-position:center;
background-repeat:no-repeat;

display:flex;
align-items:center;
justify-content:center;
}

.overlay{
position:absolute;
top:0;
left:0;
right:0;
bottom:0;
background:rgba(0,0,0,0.35);
}

.login-box{
position:relative;
background:white;
padding:40px;
border-radius:18px;
width:340px;
box-shadow:0 20px 40px rgba(0,0,0,0.4);
z-index:2;
}

.logo{
text-align:center;
font-size:26px;
font-weight:bold;
margin-bottom:24px;
color:#0e2f24;
}

label{
display:block;
font-weight:bold;
margin-bottom:6px;
color:#1b3a2f;
}

input{
width:100%;
padding:12px;
margin-bottom:16px;
border-radius:10px;
border:1px solid #ddd;
font-size:14px;
}

select{
width:100%;
padding:12px;
margin-bottom:18px;
border-radius:10px;
border:1px solid #ddd;
font-size:14px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
font-size:15px;
font-weight:bold;
cursor:pointer;
margin-bottom:10px;
}

.btn-login{
background:#2ecc71;
color:#062414;
}

.btn-login:hover{
background:#27b765;
}

.btn-sair{
background:#e9f5ee;
color:#0f2e24;
}

.btn-sair:hover{
background:#d8efe4;
}

.footer{
text-align:center;
font-size:12px;
color:#5b6e67;
margin-top:10px;
}

.status{
display:none;
margin-top:12px;
padding:10px;
border-radius:10px;
font-size:13px;
}

.ok{
background:#e8fff2;
color:#0c3c27;
}

.erro{
background:#ffecec;
color:#7a1d1d;
}
</style>
</head>

<body>

<div class="overlay"></div>

<div class="login-box">

<div class="logo">
Lapidar
</div>

<label>Usuário</label>
<input type="text" id="usuario" placeholder="Digite seu usuário">

<label>Perfil</label>
<select id="perfil">

<option value="admin">
Administrador
</option>

<option value="veterano">
Veterano
</option>

<option value="cortesia">
Cortesia
</option>

</select>

<button class="btn-login" onclick="entrarSistema()">
Entrar no Lapidar
</button>

<button class="btn-sair" onclick="sairSistema()">
Sair geral
</button>

<div id="statusBox" class="status"></div>

<div class="footer">
Sistema editorial Lapidar
</div>

</div>

<script>

function entrarSistema(){

let usuario =
document.getElementById("usuario").value.trim();

let perfil =
document.getElementById("perfil").value;

if(!usuario){

mostrarErro("Informe o nome do usuário.");

return;

}

const sessao = {

usuario:usuario,

perfil:perfil,

loginEm:new Date().toISOString()

};

localStorage.setItem(
"sessao_lapidar",
JSON.stringify(sessao)
);

mostrarOk("Sessão iniciada com sucesso.");

setTimeout(()=>{

window.location.href="producao_integrada.html";

},600);

}


function sairSistema(){

localStorage.removeItem("sessao_lapidar");

localStorage.removeItem("projeto_lapidar");

mostrarOk("Sessão encerrada.");

}


function mostrarOk(msg){

let box =
document.getElementById("statusBox");

box.className="status ok";

box.style.display="block";

box.innerText=msg;

}


function mostrarErro(msg){

let box =
document.getElementById("statusBox");

box.className="status erro";

box.style.display="block";

box.innerText=msg;

}

</script>

</body>
</html>
