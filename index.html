<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site das Letras — Lapidar —</title>

<style>
body{margin:0;font-family:Arial;background:#f4f4f4;text-align:center;padding:50px 20px;}
.container{max-width:980px;margin:auto;background:white;padding:40px;border-radius:18px;box-shadow:0 6px 18px rgba(0,0,0,0.08);}
h1,h2{color:#222;margin-top:0;}
.sub{color:#666;font-size:18px;line-height:1.6;max-width:760px;margin:0 auto 30px;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;margin-top:30px;}
.card{background:#fafafa;border:1px solid #ddd;border-radius:16px;padding:30px 24px;text-align:left;}
button{margin-top:20px;padding:14px 22px;font-size:17px;border:none;border-radius:10px;background:#222;color:white;cursor:pointer;}
button:hover{background:#444;}
.secundario{background:#777;}
.secundario:hover{background:#666;}
.modulo{display:none;text-align:left;margin-top:10px;}
fieldset{border:1px solid #ddd;border-radius:12px;padding:20px;margin-top:20px;}
label{display:block;margin-top:14px;font-weight:bold;color:#333;}
input,select,textarea{width:100%;padding:10px;margin-top:5px;border-radius:6px;border:1px solid #ccc;font-size:16px;}
.resultado{margin-top:20px;padding:15px;background:#f8f8f8;border-radius:8px;border:1px solid #ddd;}
.certificado{margin-top:15px;background:#fff;border:2px solid #bbb;border-radius:12px;padding:24px;white-space:pre-line;text-align:center;}
</style>
</head>

<body>

<div class="container">

<h1>Site das Letras<br>— Lapidar —</h1>

<p class="sub">
Lapidar é o primeiro passo na jornada de quem decide escrever suas próprias histórias.
</p>

<button onclick="abrirProjetoCompleto()">Entrar no Projeto Completo</button>

<div id="projetoCompleto" class="modulo">

<fieldset>
<label>Título</label>
<input id="tituloObra">

<label>Subtítulo</label>
<input id="subtituloObra">

<label>Autor</label>
<input id="autorCapa">
</fieldset>

<fieldset>
<label>Páginas</label>
<input id="paginas" type="number" value="100" oninput="calcularLombada(); calcularCapaCompleta();">

<label>Papel</label>
<select id="papel" onchange="calcularLombada(); calcularCapaCompleta();">
<option value="0.050">Offset 75g</option>
<option value="0.060">Offset 90g</option>
</select>

<div class="resultado">
<strong>Lombada:</strong>
<span id="lombada"></span>
</div>
</fieldset>

<fieldset>
<label>Formato</label>
<select id="formatoLivro" onchange="calcularCapaCompleta()">
<option value="14.8|21">A5</option>
<option value="16|23">16x23</option>
</select>

<label>Orelha esquerda</label>
<input id="orelhaEsquerda" value="7" oninput="calcularCapaCompleta()">

<label>Orelha direita</label>
<input id="orelhaDireita" value="7" oninput="calcularCapaCompleta()">

<div class="resultado">
<strong>Capa completa:</strong>
<div id="capaCalculada"></div>
</div>
</fieldset>

<fieldset>
<button onclick="gerarCertificado()">Gerar certificado editorial</button>
<div id="certificadoGerado" class="certificado"></div>
</fieldset>

<fieldset>
<button onclick="gerarRegistro()">Gerar registro editorial</button>
<div id="registroGerado" class="certificado"></div>
</fieldset>

<fieldset>
<button onclick="gerarRegistroPDF()">Gerar registro editorial permanente (PDF)</button>
</fieldset>

</div>
</div>

<script>

function abrirProjetoCompleto(){
document.getElementById("projetoCompleto").style.display="block";
}

function calcularLombada(){
var paginas=parseFloat(document.getElementById("paginas").value)||0;
var espessura=parseFloat(document.getElementById("papel").value)||0;
var lombadaMm=(paginas*espessura)+0.20;
document.getElementById("lombada").innerText=lombadaMm.toFixed(2)+" mm";
return lombadaMm;
}

function calcularCapaCompleta(){
var formato=document.getElementById("formatoLivro").value.split("|");
var largura=parseFloat(formato[0])||0;
var altura=parseFloat(formato[1])||0;

var lombadaMm=calcularLombada();
var lombadaCm=lombadaMm/10;

var orelhaE=parseFloat(document.getElementById("orelhaEsquerda").value)||0;
var orelhaD=parseFloat(document.getElementById("orelhaDireita").value)||0;

var total=orelhaE+largura+lombadaCm+largura+orelhaD;

document.getElementById("capaCalculada").innerText=
"Altura: "+altura.toFixed(2)+" cm | Largura total: "+total.toFixed(2)+" cm";
}

function gerarCertificado(){
const data=new Date().toLocaleString("pt-BR");

const certificado=`
CERTIFICADO EDITORIAL – SISTEMA LAPIDAR

Projeto editorial processado com sucesso.

Data:
${data}
`;

document.getElementById("certificadoGerado").innerText=certificado;
}

function gerarRegistro(){
var titulo=document.getElementById("tituloObra").value||"Título não informado";
var autor=document.getElementById("autorCapa").value||"Autor não informado";

var agora=new Date();

var registro=`
REGISTRO EDITORIAL INTERNO LAPIDAR

Obra: ${titulo}
Autor: ${autor}

Data: ${agora.toLocaleDateString("pt-BR")}
`;

document.getElementById("registroGerado").innerText=registro;
}

function gerarRegistroPDF(){

var titulo=document.getElementById("tituloObra").value||"Título não informado";
var autor=document.getElementById("autorCapa").value||"Autor não informado";

var data=new Date().toLocaleString("pt-BR");

var texto=`
REGISTRO EDITORIAL PERMANENTE — LAPIDAR

Obra: ${titulo}
Autor: ${autor}

Documento técnico permanente exportável

Gerado em:
${data}
`;

var area=document.createElement("textarea");
area.value=texto;
document.body.appendChild(area);
area.select();
document.execCommand("copy");
document.body.removeChild(area);

alert("Registro permanente copiado e pronto para impressão/PDF.");
}

calcularLombada();
calcularCapaCompleta();

</script>

</body>
</html>
