<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lapidar • Entrada oficial</title>

<style>
body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:#e6d3a3;
}

.page{
max-width:460px;
margin:40px auto;
padding:20px;
}

.card{
background:#fff;
border-radius:20px;
padding:28px 24px;
box-shadow:0 12px 28px rgba(0,0,0,.12);
}

.top{
text-align:center;
margin-bottom:20px;
}

.brasao{
display:block;
margin:0 auto 10px;
width:130px;
height:auto;
object-fit:contain;
}

.logo{
font-size:34px;
font-weight:bold;
letter-spacing:2px;
margin:0 0 6px;
}

.sub{
font-size:13px;
color:#777;
line-height:1.5;
}

label{
display:block;
font-size:13px;
font-weight:bold;
margin:14px 0 6px;
color:#444;
}

input{
width:100%;
padding:14px;
border:1px solid #ccc;
border-radius:10px;
font-size:15px;
box-sizing:border-box;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
font-size:16px;
cursor:pointer;
font-weight:bold;
margin-top:14px;
}

.btn-entrar{
background:#1f3f75;
color:#fff;
}

.btn-cadastro{
background:#d4a73c;
color:#fff;
}

.btn-recuperar{
background:#eee;
color:#333;
}

.msg{
margin-top:14px;
padding:12px;
border-radius:10px;
font-size:14px;
display:none;
}

.msg.ok{
display:block;
background:#eef8f0;
color:#1f6b36;
border:1px solid #b8dfc0;
}

.msg.erro{
display:block;
background:#fff1f1;
color:#a12626;
border:1px solid #efc0c0;
}

.footer{
text-align:center;
margin-top:18px;
font-size:12px;
color:#777;
line-height:1.5;
}
</style>
</head>
<body>

<div class="page">
  <div class="card">

    <div class="top">
      <img
        class="brasao"
        src="file_00000000d8bc71f5b57491905e34ae99.jpg"
        alt="Brasão institucional do Site das Letras"
      >
      <div class="logo">LAPIDAR</div>
      <div class="sub">
        Produto institucional do Celeiro Literário<br>
        Site das Letras Edições Literárias
      </div>
    </div>

    <label>Login ou e-mail</label>
    <input id="acesso" placeholder="Digite seu e-mail ou telefone internacional">

    <label>Senha</label>
    <input id="senha" type="password" placeholder="Digite sua senha">

    <button class="btn-entrar" onclick="entrarNoLapidar()">Entrar no Lapidar</button>
    <button class="btn-cadastro" onclick="window.location.href='cadastro.html'">Criar cadastro</button>
    <button class="btn-recuperar" onclick="window.location.href='recuperar_senha.html'">Recuperar senha</button>

    <div id="mensagem" class="msg"></div>

    <div class="footer">
      Lapidar • Celeiro Literário • Site das Letras Edições Literárias
    </div>

  </div>
</div>

<script>
function mostrarMensagem(tipo,texto){
  const box = document.getElementById("mensagem");
  box.className = "msg " + tipo;
  box.innerText = texto;
}

function normalizarTelefone(valor){
  valor = (valor || "").trim();
  valor = valor.replace(/[^\d+]/g, "");
  if(valor && !valor.startsWith("+")){
    valor = "+" + valor.replace(/\+/g,"");
  }
  if(valor.indexOf("+") > 0){
    valor = "+" + valor.replace(/\+/g,"");
  }
  return valor.toLowerCase();
}

function carregarCadastros(){
  try{
    let dados = localStorage.getItem("lapidar_cadastros");

    if(!dados){
      const nome = localStorage.getItem("lapidar_nome");
      const email = localStorage.getItem("lapidar_email");
      const telefone = localStorage.getItem("lapidar_telefone");
      const senha = localStorage.getItem("lapidar_senha");
      const id = localStorage.getItem("lapidar_cadastro_id");

      if(email && senha){
        return [{
          id: id || "cad_local",
          nomeCompleto: nome || "Utilizador comum",
          email: email,
          telefone: telefone || "",
          senha: senha
        }];
      }

      return [];
    }

    return JSON.parse(dados);
  }catch(e){
    return [];
  }
}

function limparSessaoComum(){
  localStorage.removeItem("lapidar_usuario_logado");
  localStorage.removeItem("lapidar_nome");
  localStorage.removeItem("lapidar_email");
  localStorage.removeItem("lapidar_telefone");
}

function entrarNoLapidar(){
  const acesso = document.getElementById("acesso").value.trim().toLowerCase();
  const senha = document.getElementById("senha").value;

  if(!acesso || !senha){
    mostrarMensagem("erro","Digite seu acesso e sua senha.");
    return;
  }

  // Perfis internos
  if(acesso.includes("admin")){
    localStorage.setItem("lapidar_perfil","admin");
    localStorage.setItem("lapidar_usuario","admin");
    localStorage.setItem("lapidar_nome","Administrador do Sistema");
    window.location.href = "sala_reunioes.html";
    return;
  }

  if(acesso.includes("heteronimo")){
    localStorage.setItem("lapidar_perfil","heteronimo");
    localStorage.setItem("lapidar_usuario","heteronimo");
    localStorage.setItem("lapidar_nome","Heterônimo do Sistema");
    window.location.href = "sala_reunioes.html";
    return;
  }

  // Utilizador comum
  const cadastros = carregarCadastros();
  const acessoTelefone = normalizarTelefone(acesso);

  const usuario = cadastros.find(function(item){
    const emailOk = (item.email || "").toLowerCase() === acesso;
    const telefoneOk = normalizarTelefone(item.telefone || "") === acessoTelefone;
    const senhaOk = (item.senha || "") === senha;
    return senhaOk && (emailOk || telefoneOk);
  });

  if(!usuario){
    mostrarMensagem("erro","Cadastro não encontrado ou senha incorreta.");
    return;
  }

  limparSessaoComum();

  localStorage.setItem("lapidar_perfil","utilizador");
  localStorage.setItem("lapidar_usuario_logado", usuario.id || "");
  localStorage.setItem("lapidar_nome", usuario.nomeCompleto || "Utilizador comum");
  localStorage.setItem("lapidar_email", usuario.email || "");
  localStorage.setItem("lapidar_telefone", usuario.telefone || "");
  localStorage.setItem("lapidar_status_fluxo", "perfil_criado");

  mostrarMensagem("ok","Entrada autorizada. Abrindo o Lapidar...");

  setTimeout(function(){
    window.location.href = "producao_integrada.html";
  }, 500);
}
</script>

</body>
</html>
