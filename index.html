<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lapidar — Site das Letras</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0d0603;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.container{
  text-align:center;
  max-width:420px;
  width:90%;
  padding:20px 0 30px 0;
}

.logo{
  width:260px;
  max-width:100%;
  height:auto;
  margin-bottom:25px;
}

.titulo{
  font-size:32px;
  font-weight:bold;
  margin:10px 0;
  letter-spacing:2px;
}

.subtitulo{
  color:#ff7b2c;
  font-size:15px;
  margin-bottom:25px;
  line-height:1.5;
}

.frase{
  color:#ff7b2c;
  font-size:16px;
  margin-bottom:40px;
  line-height:1.6;
}

input{
  width:100%;
  padding:16px;
  margin:10px 0;
  border-radius:30px;
  border:none;
  font-size:16px;
  box-sizing:border-box;
  text-transform:none !important;
}

.botao{
  display:block;
  width:100%;
  margin-top:20px;
  padding:18px;
  border-radius:35px;
  border:none;
  background:#ff5a00;
  color:white;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

.botao:hover{
  background:#ff6f1a;
}

.erro{
  margin-top:15px;
  color:#ff8080;
  font-size:15px;
}
</style>
</head>

<body>
<div class="container">

  <img class="logo" src="file_00000000760c720ebb734bb5e71340bb.png" alt="Selo híbrido Site das Letras">

  <div class="titulo">— LAPIDAR —</div>

  <div class="subtitulo">
    Um projeto do Site das Letras Edições Literárias
  </div>

  <div class="frase">
    Aqui você tira os seus rascunhos da gaveta e realiza os seus sonhos.
  </div>

  <input
    id="usuario"
    type="text"
    placeholder="UTILIZADOR"
    autocapitalize="off"
    autocomplete="username"
    autocorrect="off"
    spellcheck="false"
    oninput="this.value=this.value.toLowerCase()"
  >

  <input
    id="senha"
    type="password"
    placeholder="SENHA"
    autocapitalize="off"
    autocomplete="current-password"
    autocorrect="off"
    spellcheck="false"
  >

  <button class="botao" onclick="login()">
    Entre para diagramar o seu livro
  </button>

  <div id="erro" class="erro"></div>

</div>

<script>
function login(){
  const usuario = document.getElementById("usuario").value.trim().toLowerCase();
  const senha = document.getElementById("senha").value.trim();

  if(
    (usuario === "admin" && senha === "lapidar2026") ||
    (usuario === "autor" && senha === "lapidar2026")
  ){
    localStorage.setItem("SDL_usuario_logado", usuario);
    window.location.href = "_Indice.html";
  }else{
    document.getElementById("erro").innerText = "Utilizador ou senha inválidos.";
  }
}
</script>

</body>
</html>
