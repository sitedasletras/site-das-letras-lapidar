<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site das Letras Edições Literárias</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #05070f 0%, #090d18 100%);
      color: white;
      min-height: 100vh;
    }

    .topo{
      width: 100%;
      padding: 28px 18px 18px 18px;
      text-align: center;
      border-top: 4px solid #d4b15f;
      border-bottom: 2px solid rgba(212,177,95,0.25);
      background: linear-gradient(180deg, #0e1322 0%, #090d18 100%);
    }

    .logo{
      width: 300px;
      max-width: 92%;
      display: block;
      margin: 0 auto 14px auto;
      border-radius: 18px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.45);
    }

    .titulo{
      font-size: 28px;
      font-weight: bold;
      color: #f3d27b;
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .subtitulo{
      font-size: 14px;
      color: #d8d8d8;
      opacity: 0.9;
    }

    .container{
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      padding: 30px 20px 60px 20px;
    }

    .menu{
      display: flex;
      flex-direction: column;
      gap: 18px;
      margin-top: 10px;
    }

    .botao{
      display: block;
      width: 100%;
      padding: 22px 18px;
      text-align: center;
      text-decoration: none;
      font-size: 18px;
      color: white;
      background: #1b1933;
      border: 2px solid rgba(255,255,255,0.05);
      border-radius: 18px;
      transition: 0.2s;
      box-shadow: 0 6px 16px rgba(0,0,0,0.18);
    }

    .botao:hover{
      transform: translateY(-2px);
      background: #2a2750;
    }

    .botao.destaque{
      background: #d2b161;
      color: #111;
      font-weight: bold;
      border: 2px solid #e6cb8b;
    }

    .rodape{
      text-align: center;
      margin-top: 40px;
      font-size: 14px;
      color: rgba(255,255,255,0.6);
    }

    @media (max-width: 480px){
      .titulo{
        font-size: 23px;
      }

      .botao{
        font-size: 16px;
        padding: 20px 14px;
      }
    }
  </style>
</head>
<body>

  <div class="topo">
    <img src="file_00000000d8bc71f5b57491905e34ae99.jpg" alt="Site das Letras Edições Literárias" class="logo">

    <div class="titulo">Site das Letras Edições Literárias</div>
    <div class="subtitulo">Celeiro Literário • Plataforma Lapidar</div>
  </div>

  <div class="container">
    <div class="menu">
      <a class="botao" href="autor.html">Entrar como Autor</a>
      <a class="botao destaque" href="heteronimo.html">Entrar como Heterônimo</a>
      <a class="botao" href="admin.html">Entrar como Admin</a>
      <a class="botao" href="assistente-diagramacao.html">Assistente de Diagramação do Autor</a>
      <a class="botao" href="okapista.html">OKapista</a>
      <a class="botao" href="segunda-linguas.html">Segunda Língua(s)</a>
      <a class="botao" href="avaliacao-literaria.html">Avaliação Literária</a>
      <a class="botao" href="analisador-de-obra.html">Analisador de Obra</a>
      <a class="botao" href="lapidacao-literaria.html">Lapidação Literária</a>
    </div>

    <div class="rodape">
      © Site das Letras Edições Literárias
    </div>
  </div>

</body>
</html>
