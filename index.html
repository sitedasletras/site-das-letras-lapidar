<script>

async function obterTempoServidor(){

try{

const resposta = await fetch("tempo-oficial.json",{
method:"HEAD",
cache:"no-store"
});

const dataServidor = resposta.headers.get("date");

return new Date(dataServidor).getTime();

}catch{

return Date.now();

}

}

const usuariosPermitidos = {

admin:"lapidar2026",
autor:"lapidar2026"

};

async function login(){

const usuario=document.getElementById("usuario").value.trim().toLowerCase();
const senha=document.getElementById("senha").value.trim();

if(usuariosPermitidos[usuario]===senha){

const agoraServidor = await obterTempoServidor();

localStorage.setItem("SDL_usuario_logado",usuario);
localStorage.setItem("SDL_login_time",agoraServidor);

window.location.href="_Indice.html";

}else{

document.getElementById("erro").innerText="Utilizador ou senha invÃ¡lidos.";

}

}

</script>
