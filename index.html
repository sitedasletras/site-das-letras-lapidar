<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lapidar — Site das Letras — V42</title>

<style>
body{margin:0;font-family:Arial;background:#f4f4f4;text-align:center;padding:40px;}
.container{max-width:1000px;margin:auto;background:white;padding:35px;border-radius:18px;box-shadow:0 6px 18px rgba(0,0,0,0.08);}
input,button{margin-top:10px;padding:12px;font-size:16px;border-radius:8px;border:1px solid #ccc;width:100%;box-sizing:border-box;}
button{background:#222;color:white;cursor:pointer;}
button:hover{background:#444;}
.relatorio{margin-top:20px;border:2px solid #bbb;border-radius:10px;padding:25px;white-space:pre-line;text-align:left;}
</style>
</head>

<body>

<div class="container">

<h2>Site das Letras — Lapidar V42</h2>
<p>Nome automático inteligente do arquivo final da obra.</p>

<label>Autor</label>
<input id="autor" placeholder="Ex: Aurora Wings">

<label>Título da obra</label>
<input id="titulo" placeholder="Ex: Crônicas da Persida">

<button onclick="gerarNomeArquivo()">Gerar nome automático do arquivo final</button>

<div id="saida" class="relatorio"></div>

</div>

<script>

function limpar(txt){
return (txt||"")
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"")
.replace(/[^a-zA-Z0-9 ]/g,"")
.trim()
}

function formatoArquivo(txt){
return limpar(txt)
.replace(/\s+/g,"_")
}

function obterBancoHeteronimosSDL(){
return JSON.parse(localStorage.getItem("BANCO_HETERONIMOS_SDL")||"[]")
}

function autorEhSDL(nome){

var banco=obterBancoHeteronimosSDL()

var autor=limpar(nome).toUpperCase()

for(var i=0;i<banco.length;i++){

if(limpar(banco[i].nome).toUpperCase()==autor){

return true

}

}

return false

}

function gerarNomeArquivo(){

var autor=document.getElementById("autor").value.trim()
var titulo=document.getElementById("titulo").value.trim()

if(!autor || !titulo){

alert("Preencha autor e título.")
return

}

var tituloFormatado=formatoArquivo(titulo)

var interno=autorEhSDL(autor)

var resultado=""

if(interno){

resultado=
"Autor identificado como heterônimo SDL\n\n"+
"Arquivos gerados automaticamente:\n"+
tituloFormatado+".pdf\n"+
tituloFormatado+".docx"

}else{

resultado=
"Autor externo identificado\n\n"+
"Arquivo gerado automaticamente:\n"+
tituloFormatado+".pdf"

}

document.getElementById("saida").innerText=resultado

}

</script>

</body>
</html>
