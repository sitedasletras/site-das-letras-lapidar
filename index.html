<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lapidar • Celeiro Literário</title>

<style>

body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:#e8d6b4;
}

/* FUNDO CENTRAL INSTITUCIONAL */

.fundo-central{

position:absolute;
top:0;
bottom:0;
left:50%;
transform:translateX(-50%);
width:220px;
background:#d9c29a;

}

/* FAIXA HORIZONTAL TEMPLÁRIA */

.faixa-horizontal{

position:absolute;
top:40%;
left:0;
right:0;
height:120px;
background:#d9c29a;

}

/* BRASÃO */

.brasao{

width:180px;
margin:auto;
margin-top:60px;
display:block;

}

/* TITULO */

.titulo{

text-align:center;
font-size:42px;
letter-spacing:6px;
color:white;
margin-top:20px;

}

/* SUBTITULO */

.subtitulo{

text-align:center;
font-size:18px;
color:white;

}

/* LOGIN CARD */

.card{

background:white;
width:90%;
max-width:420px;
margin:auto;
margin-top:30px;
padding:30px;
border-radius:30px;
box-shadow:0px 10px 25px rgba(0,0,0,0.2);

}

input{

width:100%;
padding:15px;
margin-top:10px;
border-radius:12px;
border:1px solid #d3c1a2;
font-size:16px;

}

button{

margin-top:20px;
width:100%;
padding:18px;
border:none;
border-radius:15px;
background:#1b2c48;
color:white;
font-size:18px;
cursor:pointer;

}

button:hover{

background:#2a446c;

}

.footer{

text-align:center;
margin-top:20px;
font-size:14px;
color:#6c5c45;

}

</style>

</head>

<body>

<div class="fundo-central"></div>
<div class="faixa-horizontal"></div>

<img src="brasao.png" class="brasao">

<div class="titulo">

LAPIDAR

</div>

<div class="subtitulo">

PRODUTO INSTITUCIONAL DO CELEIRO LITERÁRIO  
Site das Letras Edições Literárias

</div>

<div class="card">

<h2>Acesso ao sistema</h2>

<input
id="login"
placeholder="Login ou e-mail"
/>

<input
id="senha"
type="password"
placeholder="Senha"
/>

<button onclick="entrar()">

Entrar no Lapidar

</button>

<div class="footer">

O perfil é reconhecido automaticamente pelo seu acesso.

</div>

</div>


<script>

/* PERFIS OFICIAIS LAPIDAR */

const usuarios = {

"admin@sitedasletras.com":{

senha:"admin123",
perfil:"admin"

},

"heteronimos@sitedasletrasedicoesliterarias.com":{

senha:"heteronimo123",
perfil:"heteronimo"

},

"andre.capista":{

senha:"andre123",
perfil:"cortesia",
nivel:"top-global",
nome:"Cortesia André Capista"

}

}


/* LOGIN */

function entrar(){

let login=document
.getElementById("login")
.value
.trim()
.toLowerCase()

let senha=document
.getElementById("senha")
.value

if(!usuarios[login]){

alert("Login ou e-mail não encontrado.")

return

}

if(usuarios[login].senha!==senha){

alert("Senha incorreta.")

return

}

/* SALVA PERFIL */

localStorage.setItem(

"lapidar_perfil",

usuarios[login].perfil

)

localStorage.setItem(

"lapidar_usuario",

login

)

/* REDIRECIONA */

window.location.href="sala_reunioes.html"

}

</script>

</body>
</html>
