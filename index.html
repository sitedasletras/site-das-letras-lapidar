<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lapidar — Site das Letras</title>

<style>

body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:#0f172a;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
text-align:center;
background:#111827;
padding:40px;
border-radius:20px;
box-shadow:0 20px 40px rgba(0,0,0,.5);
width:90%;
max-width:420px;
}

.logo{
width:160px;
margin-bottom:20px;
border-radius:20px;
box-shadow:0 8px 25px rgba(0,0,0,.5);
}

h1{
margin:10px 0;
font-size:28px;
letter-spacing:1px;
}

.subtitulo{
font-size:14px;
opacity:.7;
margin-bottom:30px;
}

.botao{
display:block;
width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:12px;
background:#7c3aed;
color:white;
font-size:16px;
cursor:pointer;
transition:.2s;
}

.botao:hover{
background:#6d28d9;
}

.footer{
margin-top:25px;
font-size:12px;
opacity:.5;
}

</style>

</head>

<body>

<div class="container">

<img src="file_00000000760c720ebb734bb5e71340bb.png" class="logo">

<h1>LAPIDAR</h1>

<div class="subtitulo">
Ambiente Editorial Institucional<br>
Site das Letras Edições Literárias
</div>

<button class="botao" onclick="entrar()">
Entrar no sistema
</button>

<button class="botao" onclick="sairSistema()" style="background:#374151;">
Sair geral
</button>

<div class="footer">
Plataforma editorial proprietária
</div>

</div>

<script>

function entrar(){
window.location.href="login.html"
}

function sairSistema(){
alert("Sessão encerrada.")
}

</script>

</body>
</html>
