<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site das Letras — Lapidar</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f4f4;
text-align:center;
padding:50px 20px;
}

.container{
max-width:980px;
margin:auto;
background:white;
padding:40px;
border-radius:18px;
box-shadow:0 6px 18px rgba(0,0,0,0.08);
}

h1,h2{
color:#222;
margin-top:0;
}

.sub{
color:#666;
font-size:18px;
line-height:1.6;
max-width:760px;
margin:0 auto 30px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:24px;
margin-top:30px;
}

.card{
background:#fafafa;
border:1px solid #ddd;
border-radius:16px;
padding:30px 24px;
text-align:left;
box-shadow:0 3px 10px rgba(0,0,0,0.04);
}

.card p{
color:#555;
font-size:17px;
line-height:1.6;
}

.card ul{
padding-left:20px;
color:#555;
line-height:1.8;
}

button{
margin-top:20px;
padding:14px 22px;
font-size:17px;
border:none;
border-radius:10px;
background:#222;
color:white;
cursor:pointer;
}

button:hover{
background:#444;
}

.secundario{
background:#777;
}

.secundario:hover{
background:#666;
}

.footer{
margin-top:35px;
font-size:14px;
color:#777;
line-height:1.7;
}

.modulo{
display:none;
text-align:left;
margin-top:10px;
}

fieldset{
border:1px solid #ddd;
border-radius:12px;
padding:20px;
margin-top:20px;
}

legend{
font-weight:bold;
padding:0 8px;
}

label{
display:block;
margin-top:14px;
font-weight:bold;
color:#333;
}

input,select,textarea
