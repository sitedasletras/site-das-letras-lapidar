<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lapidar — Site das Letras — V36</title>

<style>
body{margin:0;font-family:Arial;background:#f4f4f4;text-align:center;padding:40px;}
.container{max-width:980px;margin:auto;background:white;padding:35px;border-radius:18px;box-shadow:0 6px 18px rgba(0,0,0,0.08);}
input,select,button{margin-top:10px;padding:12px;font-size:16px;border-radius:8px;border:1px solid #ccc;width:100%;box-sizing:border-box;}
button{background:#222;color:white;cursor:pointer;}
button:hover{background:#444;}
.relatorio{margin-top:20px;border:2px solid #bbb;border-radius:10px;padding:25px;white-space:pre-line;text-align:left;}
small{display:block;color:#666;margin-top:6px;}
</style>
</head>

<body>

<div class="container">

<h2>Site das Letras — Lapidar V36</h2>

<label>Conta editorial</label>
<input id="conta" placeholder="Ex: Site das Letras">

<label>Autor</label>
<input id="autor" placeholder="Ex: Aurora Wings">

<label>Código Cutter</label>
<input id="cutter" placeholder="Ex: L953-01">

<label>Coleção editorial (opcional)</label>
<input id="colecao" placeholder="Ex: Crônicas da Persida">

<label>Formato</label>
<select id="formato">
<option value="A5">A5</option>
<option value="1623">16x23</option>
<option value="1627">16x27</option>
<option value="A4">A4</option>
<option value="69">6x9</option>
<option value="INFQ">Infantil Quadrado</option>
</select>

<label>Tipo da obra</label>
<select id="tipoObra">
<option value="RMN">Romance</option>
<option value="CNT">Contos</option>
<option value="PES">Poesia</option>
<option value="INF">Infantil</option>
<option value="ANT">Antologia</option>
<option value="TEC">Técnico</option>
<option value="ENS">Ensaio</option>
<option value="BIO">Biografia</option>
<option value="ESP">Espiritual</option>
<option value="HIS">Histórico</option>
<option value="FAN">Fantasia</option>
<option value="HOR">Horror</option>
<option value="MIS">Miscelânea</option>
</select>

<label>Edição</label>
<select id="edicao">
<option value="1ED">1ª edição</option>
<option value="2ED">2ª edição</option>
<option value="REV">Edição revista</option>
<option value="AMP">Edição ampliada</option>
<option value="DEF">Edição definitiva</option>
<option value="COM">Edição comemorativa</option>
<option value="REI">Reimpressão</option>
</select>

<label>País (automático)</label>
<input id="pais" readonly>

<button onclick="gerarIDSDLCompleto()">Gerar ID institucional SDL completo</button>
<small>Estrutura: SDL-PAIS-ANO-EDITORA-AUTOR-CUTTER-COLECAO-FORMATO-TIPO-EDICAO-SEQUENCIAL</small>

<div id="saidaID" class="relatorio"></div>

</div>

<script>

function detectarPaisAutomatico(){
var idioma=(navigator.language||"pt-BR").toUpperCase();
if(idioma.includes("-BR")) return "BR";
if(idioma.includes("-PT")) return "PT";
if(idioma.includes("-US")) return "US";
if(idioma.includes("-CH")) return "CH";
if(idioma.includes("-FR")) return "FR";
if(idioma.includes("-ES")) return "ES";
if(idioma.includes("-IT")) return "IT";
return "BR";
}

function preencherPais(){
document.getElementById("pais").value = detectarPaisAutomatico();
}

function limparSigla(txt){
return (txt || "")
.toUpperCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"")
.replace(/[^A-Z0-9 ]/g,"")
.trim();
}

function siglaConta(conta){
var limpa = limparSigla(conta);
if(!limpa) return "SDL";
var palavras = limpa.split(/\s+/).filter(Boolean);
if(palavras.length === 1){
return palavras[0].substring(0,4);
}
return palavras.map(p => p.charAt(0)).join("").substring(0,4);
}

function siglaAutor(autor){
var limpa = limparSigla(autor);
if(!limpa) return "AUT";
var palavras = limpa.split(/\s+/).filter(Boolean);
if(palavras.length === 1){
return palavras[0].substring(0,2);
}
return palavras.map(p => p.charAt(0)).join("").substring(0,3);
}

function siglaColecao(colecao){
var limpa = limparSigla(colecao);
if(!limpa) return "";
var palavras = limpa.split(/\s+/).filter(Boolean);
if(palavras.length === 1){
return palavras[0].substring(0,4);
}
return palavras.map(p => p.charAt(0)).join("").substring(0,4);
}

function sequencialPorConta(conta){
var chave = "SEQ_SDL_COMPLETO_" + limparSigla(conta);
var atual = parseInt(localStorage.getItem(chave) || "0", 10);
atual += 1;
localStorage.setItem(chave, String(atual));
return String(atual).padStart(4,"0");
}

function gerarIDSDLCompleto(){

var conta = document.getElementById("conta").value.trim();
var autor = document.getElementById("autor").value.trim();
var cutter = document.getElementById("cutter").value.trim();
var colecao = document.getElementById("colecao").value.trim();
var formato = document.getElementById("formato").value;
var tipo = document.getElementById("tipoObra").value;
var edicao = document.getElementById("edicao").value;
var pais = detectarPaisAutomatico();
var ano = new Date().getFullYear();

if(!conta || !autor || !cutter){
alert("Preencha conta, autor e Cutter.");
return;
}

var contaSigla = siglaConta(conta);
var autorSigla = siglaAutor(autor);
var colecaoSigla = siglaColecao(colecao);
var seq = sequencialPorConta(conta);

var partes = [
"SDL",
pais,
ano,
contaSigla,
autorSigla,
cutter.toUpperCase()
];

if(colecaoSigla){
partes.push(colecaoSigla);
}

partes.push(formato);
partes.push(tipo);
partes.push(edicao);
partes.push(seq);

var id = partes.join("-");

var texto =
"ID INSTITUCIONAL SDL COMPLETO\n\n" +
"País: " + pais + "\n" +
"Ano: " + ano + "\n" +
"Conta editorial: " + conta + " → " + contaSigla + "\n" +
"Autor: " + autor + " → " + autorSigla + "\n" +
"Cutter: " + cutter.toUpperCase() + "\n" +
"Coleção: " + (colecao ? colecao + " → " + colecaoSigla : "—") + "\n" +
"Formato: " + formato + "\n" +
"Tipo: " + tipo + "\n" +
"Edição: " + edicao + "\n" +
"Sequencial da conta: " + seq + "\n\n" +
"Código:\n" + id;

document.getElementById("saidaID").innerText = texto;
localStorage.setItem("ULTIMO_ID_SDL_COMPLETO", id);

}

preencherPais();

</script>

</body>
</html>
