<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lapidar — Acesso</title>

<style>

body{

margin:0;
font-family:Arial,sans-serif;
background:#0d0603;
color:white;

display:flex;
justify-content:center;
align-items:center;

height:100vh;

}

.container{

width:90%;
max-width:420px;
text-align:center;

}

.logo{

font-size:32px;
font-weight:bold;
margin-bottom:10px;

}

.sublogo{

font-size:14px;
letter-spacing:4px;
color:#ff7b2c;
margin-bottom:40px;

}

input{

width:100%;
padding:16px;

margin-top:12px;

border-radius:30px;
border:none;

font-size:18px;

text-transform:none !important;

}

button{

width:100%;
padding:18px;

margin-top:25px;

border-radius:30px;
border:none;

background:#ff5a00;
color:white;

font-size:18px;
font-weight:bold;

cursor:pointer;

}

.erro{

margin-top:15px;
color:#ff8080;

}

</style>

</head>

<body>

<div class="container">

<div class="logo">

LAPIDAR

</div>

<div class="sublogo">

Aqui os escritores têm a oportunidade de realizar seus sonhos

</div>

<input

id="usuario"
type="email"
placeholder="E-MAIL"

autocapitalize="off"
autocomplete="username"
autocorrect="off"
spellcheck="false"

oninput="this.value=this.value.toLowerCase()"

>

<input

id="senha"
type="password"
placeholder="SENHA"

autocapitalize="off"
autocomplete="current-password"
autocorrect="off"
spellcheck="false"

>

<button onclick="login()">

Entre para diagramar seu material

</button>

<div id="erro" class="erro"></div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const firebaseConfig = {

apiKey: "COLE_AQUI",
authDomain: "COLE_AQUI",
projectId: "COLE_AQUI",
storageBucket: "COLE_AQUI",
messagingSenderId: "COLE_AQUI",
appId: "COLE_AQUI"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


/*
VERIFICA SE USUÁRIO JÁ ESTÁ LOGADO
SE ESTIVER → ENTRA DIRETO
*/

onAuthStateChanged(auth,(user)=>{

if(user){

window.location.href="_Indice.html";

}

});


window.login = async function(){

const email = document
.getElementById("usuario")
.value
.trim()
.toLowerCase();

const senha = document
.getElementById("senha")
.value
.trim();


try{

await signInWithEmailAndPassword(auth,email,senha);

window.location.href="_Indice.html";

}

catch(error){

document.getElementById("erro")
.innerText="E-mail ou senha inválidos.";

}

};

</script>

</body>

</html>
