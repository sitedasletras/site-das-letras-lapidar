<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lapidar — Site das Letras — V40</title>

<style>
body{margin:0;font-family:Arial;background:#f4f4f4;text-align:center;padding:40px;}
.container{max-width:1000px;margin:auto;background:white;padding:35px;border-radius:18px;box-shadow:0 6px 18px rgba(0,0,0,0.08);}
input,button{margin-top:10px;padding:12px;font-size:16px;border-radius:8px;border:1px solid #ccc;width:100%;box-sizing:border-box;}
button{background:#222;color:white;cursor:pointer;}
button:hover{background:#444;}
.lista{margin-top:25px;text-align:left;border:2px solid #bbb;border-radius:10px;padding:20px;}
.item{padding:6px 0;border-bottom:1px solid #eee;}
small{display:block;color:#666;margin-top:6px;}
</style>
</head>

<body>

<div class="container">

<h2>Site das Letras — Lapidar V40</h2>
<p>Banco oficial ilimitado de heterônimos SDL</p>

<label>Nome do heterônimo</label>
<input id="heteronimoNome" placeholder="Ex: Aurora Wings">

<button onclick="cadastrarHeteronimo()">Cadastrar heterônimo</button>

<button onclick="listarHeteronimos()">Atualizar lista</button>

<button onclick="exportarLista()">Exportar lista de heterônimos</button>

<small>Autores cadastrados aqui recebem automaticamente exportação PDF + Word.</small>

<div id="listaHeteronimos" class="lista"></div>

</div>

<script>

function limpar(txt){
return (txt||"")
.trim()
.toUpperCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"")
}

function chaveBanco(){
return "BANCO_HETERONIMOS_SDL"
}

function obterBanco(){
return JSON.parse(localStorage.getItem(chaveBanco())||"[]")
}

function salvarBanco(banco){
localStorage.setItem(chaveBanco(),JSON.stringify(banco))
}

function cadastrarHeteronimo(){

var nome=document.getElementById("heteronimoNome").value.trim()

if(!nome){

alert("Digite o nome do heterônimo.")
return

}

var banco=obterBanco()

var existe=banco.find(a=>limpar(a.nome)==limpar(nome))

if(existe){

alert("Heterônimo já cadastrado.")
return

}

var novo={

id:"SDL-AUTOR-"+String(banco.length+1).padStart(4,"0"),
nome:nome,
dataCadastro:new Date().toLocaleString("pt-BR")

}

banco.push(novo)

salvarBanco(banco)

document.getElementById("heteronimoNome").value=""

listarHeteronimos()

}

function listarHeteronimos(){

var banco=obterBanco()

var html=""

if(banco.length==0){

html="Nenhum heterônimo cadastrado ainda."

}else{

banco.forEach(function(a){

html+="<div class='item'><b>"+a.nome+"</b><br>ID: "+a.id+"<br>Cadastrado em: "+a.dataCadastro+"</div>"

})

}

document.getElementById("listaHeteronimos").innerHTML=html

}

function exportarLista(){

var banco=obterBanco()

if(banco.length==0){

alert("Nenhum heterônimo para exportar.")
return

}

var texto="BANCO OFICIAL DE HETERÔNIMOS SDL\n\n"

banco.forEach(function(a){

texto+=a.nome+" — "+a.id+"\n"

})

var blob=new Blob([texto],{type:"text/plain"})

var link=document.createElement("a")

link.href=URL.createObjectURL(blob)

link.download="heteronimos_SDL.txt"

link.click()

}

listarHeteronimos()

</script>

</body>
</html>
