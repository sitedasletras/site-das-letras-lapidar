<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lapidar — Site das Letras — V30</title>

<style>
body{margin:0;font-family:Arial;background:#f4f4f4;text-align:center;padding:40px;}
.container{max-width:980px;margin:auto;background:white;padding:35px;border-radius:18px;box-shadow:0 6px 18px rgba(0,0,0,0.08);}
input,button{margin-top:10px;padding:12px;font-size:16px;border-radius:8px;border:1px solid #ccc;width:100%;box-sizing:border-box;}
button{background:#222;color:white;cursor:pointer;}
button:hover{background:#444;}
.relatorio{margin-top:20px;border:2px solid #bbb;border-radius:10px;padding:20px;white-space:pre-line;text-align:left;}
</style>
</head>

<body>

<div class="container">

<h2>Site das Letras — Lapidar V30</h2>

<label>Conta editorial</label>
<input id="contaCliente" placeholder="Ex: Site das Letras">

<button onclick="gerarCatalogo()">Gerar catálogo institucional SDL</button>

<button onclick="exportarCatalogo()">Exportar catálogo (TXT)</button>

<div id="saidaCatalogo" class="relatorio"></div>

</div>

<script>

function chaveCatalogo(conta){
return "CATALOGO_OBRAS_" + conta.toUpperCase();
}

function gerarCatalogo(){

var conta=document.getElementById("contaCliente").value.trim();

if(!conta){

alert("Informe a conta editorial.");
return;

}

var chave=chaveCatalogo(conta);

var banco=JSON.parse(localStorage.getItem(chave)||"[]");

if(banco.length===0){

document.getElementById("saidaCatalogo").innerText="Nenhuma obra registrada nesta conta.";
return;

}

var texto="CATÁLOGO INSTITUCIONAL — "+conta.toUpperCase()+"\n\n";

banco.forEach(function(item,index){

texto+=
(index+1)+". "+item.titulo+"\n"+
"Autor: "+item.autor+"\n"+
"Coleção: "+item.colecao+"\n"+
"Selo: "+item.selo+"\n"+
"Formato: "+item.formato+"\n"+
"Registro: "+item.data+"\n\n";

});

document.getElementById("saidaCatalogo").innerText=texto;

}

function exportarCatalogo(){

var texto=document.getElementById("saidaCatalogo").innerText;

if(!texto){

alert("Gere o catálogo primeiro.");
return;

}

var blob=new Blob([texto],{type:"text/plain"});
var link=document.createElement("a");

link.href=URL.createObjectURL(blob);
link.download="catalogo_SDL.txt";
link.click();

}

</script>

</body>
</html>
