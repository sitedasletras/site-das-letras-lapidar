<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lapidar — Site das Letras — V33</title>

<style>
body{margin:0;font-family:Arial;background:#f4f4f4;text-align:center;padding:40px;}
.container{max-width:980px;margin:auto;background:white;padding:35px;border-radius:18px;box-shadow:0 6px 18px rgba(0,0,0,0.08);}
input,textarea,button{margin-top:10px;padding:12px;font-size:16px;border-radius:8px;border:1px solid #ccc;width:100%;box-sizing:border-box;}
button{background:#222;color:white;cursor:pointer;}
button:hover{background:#444;}
.relatorio{margin-top:20px;border:2px solid #bbb;border-radius:10px;padding:20px;white-space:pre-line;text-align:left;}
</style>
</head>

<body>

<div class="container">

<h2>Site das Letras — Lapidar V33</h2>

<label>Conta editorial</label>
<input id="contaCliente" placeholder="Ex: Site das Letras">

<label>Autor</label>
<input id="autorNome" placeholder="Ex: Aurora Wings">

<label>Título da obra</label>
<input id="tituloObra" placeholder="Ex: Crônicas da Persida">

<label>Biografia do autor</label>
<textarea id="biografiaAutor" rows="6" placeholder="Insira aqui a biografia institucional do autor"></textarea>

<button onclick="salvarBiografia()">Salvar biografia vinculada</button>

<button onclick="verBiografia()">Ver biografia vinculada</button>

<div id="saidaBiografia" class="relatorio"></div>

</div>

<script>

function chaveBiografia(conta,autor,titulo){
return "BIOGRAFIA_VINCULADA_"+conta.toUpperCase()+"_"+autor.toUpperCase()+"_"+titulo.toUpperCase();
}

function salvarBiografia(){

var conta=document.getElementById("contaCliente").value.trim();
var autor=document.getElementById("autorNome").value.trim();
var titulo=document.getElementById("tituloObra").value.trim();
var bio=document.getElementById("biografiaAutor").value.trim();

if(!conta||!autor||!titulo||!bio){

alert("Preencha todos os campos.");
return;

}

var chave=chaveBiografia(conta,autor,titulo);

localStorage.setItem(chave,bio);

alert("Biografia vinculada com sucesso.");

}

function verBiografia(){

var conta=document.getElementById("contaCliente").value.trim();
var autor=document.getElementById("autorNome").value.trim();
var titulo=document.getElementById("tituloObra").value.trim();

if(!conta||!autor||!titulo){

alert("Informe conta, autor e título.");
return;

}

var chave=chaveBiografia(conta,autor,titulo);

var bio=localStorage.getItem(chave);

if(!bio){

document.getElementById("saidaBiografia").innerText="Nenhuma biografia vinculada encontrada.";
return;

}

document.getElementById("saidaBiografia").innerText=
"BIOGRAFIA VINCULADA À OBRA\n\n"+bio;

}

</script>

</body>
</html>
