<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lapidar • Entrada oficial</title>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      background:#e6d3a3;
      min-height:100vh;
      position:relative;
      overflow-x:hidden;
    }

    .faixa-vertical{
      position:fixed;
      top:0;
      bottom:0;
      left:50%;
      transform:translateX(-50%);
      width:136px;
      background:#d8c28c;
      z-index:0;
    }

    .faixa-horizontal{
      position:fixed;
      left:0;
      right:0;
      top:50%;
      transform:translateY(-50%);
      height:136px;
      background:#d8c28c;
      z-index:0;
    }

    .selo-topo{
      position:relative;
      z-index:2;
      text-align:center;
      padding-top:44px;
      margin-bottom:22px;
    }

    .selo-topo img{
      width:140px;
      max-width:42vw;
      height:auto;
      display:inline-block;
    }

    .page{
      position:relative;
      z-index:2;
      max-width:460px;
      margin:0 auto;
      padding:20px 20px 60px;
    }

    .card{
      background:#ffffff;
      border-radius:22px;
      padding:30px 24px;
      box-shadow:0 16px 34px rgba(0,0,0,0.14);
    }

    .logo{
      text-align:center;
      font-size:34px;
      font-weight:800;
      letter-spacing:1px;
      color:#111827;
      margin:0 0 10px 0;
    }

    .sub{
      text-align:center;
      font-size:13px;
      color:#777;
      line-height:1.55;
      margin-bottom:24px;
    }

    label{
      display:block;
      font-size:13px;
      font-weight:700;
      margin:14px 0 6px;
      color:#444;
    }

    input{
      width:100%;
      padding:14px;
      border:1px solid #d7d7d7;
      border-radius:11px;
      font-size:15px;
      background:#fff;
      color:#111827;
    }

    button{
      width:100%;
      padding:14px;
      border:none;
      border-radius:12px;
      font-size:16px;
      cursor:pointer;
      font-weight:700;
      margin-top:14px;
    }

    .btn-entrar{
      background:#1f3f75;
      color:#fff;
    }

    .btn-cadastro{
      background:#d4a73c;
      color:#fff;
    }

    .btn-recuperar{
      background:#ececec;
      color:#555;
    }

    .msg{
      margin-top:14px;
      padding:12px;
      border-radius:10px;
      font-size:14px;
      display:none;
      line-height:1.5;
    }

    .msg.ok{
      display:block;
      background:#eef8f0;
      color:#1f6b36;
      border:1px solid #b8dfc0;
    }

    .msg.erro{
      display:block;
      background:#fff1f1;
      color:#a12626;
      border:1px solid #efc0c0;
    }

    .footer{
      text-align:center;
      margin-top:18px;
      font-size:12px;
      color:#777;
      line-height:1.5;
    }

    @media(max-width:560px){
      .faixa-vertical{
        width:120px;
      }

      .faixa-horizontal{
        height:120px;
      }

      .selo-topo img{
        width:120px;
      }

      .page{
        padding:14px 14px 50px;
      }

      .card{
        padding:26px 20px;
      }

      .logo{
        font-size:30px;
      }
    }
  </style>
</head>
<body>

  <div class="faixa-vertical"></div>
  <div class="faixa-horizontal"></div>

  <div class="selo-topo">
    <img src="file_00000000d8bc71f5b57491905e34ae99.jpg" alt="Selo Lapidar">
  </div>

  <div class="page">
    <div class="card">
      <div class="logo">LAPIDAR</div>

      <div class="sub">
        Produto institucional do Celeiro Literário<br>
        Site das Letras Edições Literárias
      </div>

      <label for="acesso">Login ou e-mail</label>
      <input id="acesso" placeholder="Digite seu e-mail ou telefone internacional">

      <label for="senha">Senha</label>
      <input id="senha" type="password" placeholder="Digite sua senha">

      <button class="btn-entrar" onclick="entrarNoLapidar()">Entrar no Lapidar</button>
      <button class="btn-cadastro" onclick="window.location.href='cadastro.html'">Criar cadastro</button>
      <button class="btn-recuperar" onclick="window.location.href='recuperar_senha.html'">Recuperar senha</button>

      <div id="mensagem" class="msg"></div>

      <div class="footer">
        Lapidar &nbsp;•&nbsp; Celeiro Literário &nbsp;•&nbsp; Site das Letras Edições Literárias
      </div>
    </div>
  </div>

  <script>
    function mostrarMensagem(tipo, texto){
      var box = document.getElementById("mensagem");
      box.className = "msg " + tipo;
      box.innerText = texto;
    }

    function normalizarTelefone(valor){
      valor = (valor || "").trim();
      valor = valor.replace(/[^\d+]/g, "");

      if (valor && !valor.startsWith("+")) {
        valor = "+" + valor.replace(/\+/g, "");
      }

      if (valor.indexOf("+") > 0) {
        valor = "+" + valor.replace(/\+/g, "");
      }

      return valor.toLowerCase();
    }

    function carregarCadastros(){
      try{
        var dados = localStorage.getItem("lapidar_cadastros");
        if(!dados) return [];
        return JSON.parse(dados);
      }catch(e){
        return [];
      }
    }

    function entrarNoLapidar(){
      var acesso = document.getElementById("acesso").value.trim().toLowerCase();
      var senha = document.getElementById("senha").value;

      if(!acesso || !senha){
        mostrarMensagem("erro", "Digite seu acesso e sua senha.");
        return;
      }

      if(acesso.includes("admin")){
        localStorage.setItem("lapidar_perfil", "admin");
        localStorage.setItem("lapidar_usuario", "admin");
        localStorage.setItem("lapidar_nome", "Administrador do Sistema");
        window.location.href = "sala_reunioes.html";
        return;
      }

      if(acesso.includes("heteronimo")){
        localStorage.setItem("lapidar_perfil", "heteronimo");
        localStorage.setItem("lapidar_usuario", "heteronimo");
        localStorage.setItem("lapidar_nome", "Heterônimo do Sistema");
        window.location.href = "sala_reunioes.html";
        return;
      }

      var cadastros = carregarCadastros();
      var acessoTelefone = normalizarTelefone(acesso);

      var usuario = cadastros.find(function(item){
        var emailOk = ((item.email || "").toLowerCase() === acesso);
        var telefoneOk = (normalizarTelefone(item.telefone || "") === acessoTelefone);
        var senhaOk = ((item.senha || "") === senha);
        return senhaOk && (emailOk || telefoneOk);
      });

      if(!usuario){
        mostrarMensagem("erro", "Cadastro não encontrado ou senha incorreta.");
        return;
      }

      localStorage.setItem("lapidar_perfil", "utilizador");
      localStorage.setItem("lapidar_usuario_logado", usuario.id || "");
      localStorage.setItem("lapidar_nome", usuario.nomeCompleto || "Utilizador comum");
      localStorage.setItem("lapidar_email", usuario.email || "");
      localStorage.setItem("lapidar_telefone", usuario.telefone || "");
      localStorage.setItem("lapidar_status_fluxo", "perfil criado");

      mostrarMensagem("ok", "Entrada autorizada. Abrindo o Lapidar...");

      setTimeout(function(){
        window.location.href = "producao_integrada.html";
      }, 500);
    }
  </script>

</body>
</html>
