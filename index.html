<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site das Letras Edições Literárias</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #05060d;
      color: white;
      text-align: center;
    }

    header {
      background: #111;
      padding: 30px 10px;
      border-bottom: 3px solid #caa85c;
    }

    .logo {
      width: 420px;
      max-width: 95%;
      border-radius: 18px;
      display: block;
      margin: 0 auto;
    }

    .titulo {
      margin-top: 18px;
      font-size: 28px;
      color: #f5d27a;
      font-weight: bold;
      line-height: 1.2;
    }

    .menu {
      margin: 40px auto 0 auto;
      width: 90%;
      max-width: 620px;
    }

    .botao {
      display: block;
      width: 100%;
      margin: 14px 0;
      padding: 22px 16px;
      background: #1d1d2e;
      border-radius: 16px;
      text-decoration: none;
      color: white;
      font-size: 18px;
      transition: 0.2s;
    }

    .botao:hover {
      background: #caa85c;
      color: black;
    }

    .destaque {
      background: #d1b15f;
      color: black;
      font-weight: bold;
    }

    footer {
      margin-top: 60px;
      padding: 25px 15px 40px 15px;
      font-size: 14px;
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <header>
    <img src="file_00000000d8bc71f5b57491905e34ae99.jpg" alt="Site das Letras Edições Literárias" class="logo">
    <div class="titulo">Site das Letras Edições Literárias</div>
  </header>

  <div class="menu">
    <a class="botao" href="#">Entrar como Autor</a>
    <a class="botao destaque" href="#">Entrar como Heterônimo</a>
    <a class="botao" href="#">Entrar como Admin</a>
    <a class="botao" href="#">Assistente de Diagramação do Autor</a>
    <a class="botao" href="#">OKapista</a>
    <a class="botao" href="#">Segunda Língua(s)</a>
    <a class="botao" href="#">Avaliação Literária</a>
    <a class="botao" href="#">Analisador de Obra</a>
    <a class="botao" href="#">Lapidação Literária</a>
  </div>

  <footer>
    © Site das Letras Edições Literárias
  </footer>

</body>
</html>
