<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lapidar — Site das Letras — V29</title>

<style>
body{margin:0;font-family:Arial;background:#f4f4f4;text-align:center;padding:40px;}
.container{max-width:960px;margin:auto;background:white;padding:35px;border-radius:18px;box-shadow:0 6px 18px rgba(0,0,0,0.08);}
input,select,textarea,button{margin-top:10px;padding:12px;font-size:16px;border-radius:8px;border:1px solid #ccc;width:100%;box-sizing:border-box;}
button{background:#222;color:white;cursor:pointer;}
button:hover{background:#444;}
.cert{margin-top:15px;border:2px solid #bbb;border-radius:10px;padding:20px;white-space:pre-line;}
</style>
</head>

<body>

<div class="container">

<h2>Site das Letras — Lapidar V29</h2>

<label>Conta editorial</label>
<input id="contaCliente" placeholder="Ex: Site das Letras">

<label>Autor</label>
<input id="autorNome" placeholder="Ex: Aurora Wings">

<label>Título da obra</label>
<input id="tituloObra" placeholder="Ex: Crônicas da Persida">

<label>Coleção (opcional)</label>
<input id="colecaoEditorial" placeholder="Ex: CDP">

<label>Selo editorial (opcional)</label>
<input id="seloEditorial" placeholder="Ex: SIGMAL">

<label>Formato</label>
<select id="formatoObra">
<option value="A5">A5</option>
<option value="1623">16x23</option>
<option value="1627">16x27</option>
<option value="A4">A4</option>
<option value="69">6x9</option>
<option value="INFQ">Infantil Quadrado</option>
</select>

<button onclick="registrarObra()">Registrar obra no catálogo institucional</button>

<div id="saidaRegistro" class="cert"></div>

</div>

<script>

function chaveCatalogo(conta){
return "CATALOGO_OBRAS_" + conta.toUpperCase();
}

function registrarObra(){

var conta=document.getElementById("contaCliente").value.trim();
var autor=document.getElementById("autorNome").value.trim();
var titulo=document.getElementById("tituloObra").value.trim();
var colecao=document.getElementById("colecaoEditorial").value.trim();
var selo=document.getElementById("seloEditorial").value.trim();
var formato=document.getElementById("formatoObra").value;

if(!conta||!autor||!titulo){

alert("Conta, autor e título são obrigatórios.");
return;

}

var chave=chaveCatalogo(conta);

var banco=JSON.parse(localStorage.getItem(chave)||"[]");

var registro={
titulo:titulo,
autor:autor,
colecao:colecao||"—",
selo:selo||"—",
formato:formato,
data:new Date().toLocaleString("pt-BR")
};

banco.push(registro);

localStorage.setItem(chave,JSON.stringify(banco));

document.getElementById("saidaRegistro").innerText=
"OBRA REGISTRADA COM SUCESSO NO CATÁLOGO SDL\n\n"+
"Título: "+titulo+"\n"+
"Autor: "+autor+"\n"+
"Coleção: "+(colecao||"—")+"\n"+
"Selo: "+(selo||"—")+"\n"+
"Formato: "+formato;

}

</script>

</body>
</html>
