<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site das Letras — Lapidar</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f4f4;
text-align:center;
padding:60px 20px;
}

.container{
max-width:760px;
margin:auto;
background:white;
padding:40px;
border-radius:18px;
box-shadow:0 6px 18px rgba(0,0,0,0.08);
}

button{
margin-top:25px;
padding:14px 24px;
font-size:18px;
border:none;
border-radius:10px;
background:#222;
color:white;
cursor:pointer;
}

form{
display:none;
margin-top:30px;
text-align:left;
}

fieldset{
border:1px solid #ddd;
border-radius:12px;
padding:20px;
margin-top:25px;
}

label{
display:block;
margin-top:15px;
font-weight:bold;
}

input,select{
width:100%;
padding:10px;
margin-top:5px;
border-radius:6px;
border:1px solid #ccc;
}

.resultado{
margin-top:25px;
padding:18px;
background:#f8f8f8;
border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>Site das Letras — Lapidar</h1>

<button onclick="abrirFicha()">Iniciar Ficha Global</button>

<form id="ficha">

<fieldset>
<legend>Bloco 1 — Identidade da Obra</legend>

<label>Título da obra</label>
<input type="text">

<label>Autor civil</label>
<input type="text">

</fieldset>

<fieldset>
<legend>Bloco 2 — Formato e Estrutura Física</legend>

<label>Número de páginas</label>
<input type="number" id="paginas" value="100" oninput="calcularLombada()">

<label>Papel</label>
<select id="papel" onchange="calcularLombada()">
<option value="0.05">Offset 75g</option>
<option value="0.06">Offset 90g</option>
</select>

<div class="resultado">
<strong>Lombada estimada:</strong>
<span id="lombada">5.00 mm</span>
</div>

</fieldset>

</form>

</div>

<script>

function abrirFicha(){
document.getElementById("ficha").style.display="block";
}

function calcularLombada(){
var paginas = document.getElementById("paginas").value;
var fator = document.getElementById("papel").value;
var lombada = paginas * fator;
document.getElementById("lombada").innerText =
lombada.toFixed(2) + " mm";
}

calcularLombada();

</script>

</body>
</html>
