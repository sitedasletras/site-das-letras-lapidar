<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lapidar — Site das Letras — V34</title>

<style>
body{margin:0;font-family:Arial;background:#f4f4f4;text-align:center;padding:40px;}
.container{max-width:980px;margin:auto;background:white;padding:35px;border-radius:18px;box-shadow:0 6px 18px rgba(0,0,0,0.08);}
input,button{margin-top:10px;padding:12px;font-size:16px;border-radius:8px;border:1px solid #ccc;width:100%;box-sizing:border-box;}
button{background:#222;color:white;cursor:pointer;}
button:hover{background:#444;}
.relatorio{margin-top:20px;border:2px solid #bbb;border-radius:10px;padding:20px;white-space:pre-line;text-align:left;}
</style>
</head>

<body>

<div class="container">

<h2>Site das Letras — Lapidar V34</h2>

<label>Conta editorial</label>
<input id="conta" placeholder="Ex: Site das Letras">

<label>Autor</label>
<input id="autor" placeholder="Ex: Aurora Wings">

<label>Título da obra</label>
<input id="titulo" placeholder="Ex: Crônicas da Persida">

<label>Selo editorial</label>
<input id="selo" placeholder="Ex: SDL">

<label>ID institucional SDL</label>
<input id="idSDL" placeholder="Ex: SDL-BR-2026-RMN-L953-CDP-A5-0001">

<button onclick="gerarCreditos()">Gerar créditos editoriais automáticos</button>

<button onclick="exportarCreditos()">Exportar créditos (TXT)</button>

<div id="saidaCreditos" class="relatorio"></div>

</div>

<script>

function gerarCreditos(){

var conta=document.getElementById("conta").value.trim();
var autor=document.getElementById("autor").value.trim();
var titulo=document.getElementById("titulo").value.trim();
var selo=document.getElementById("selo").value.trim();
var idSDL=document.getElementById("idSDL").value.trim();

if(!conta||!autor||!titulo||!idSDL){

alert("Preencha todos os campos obrigatórios.");
return;

}

var data=new Date().getFullYear();

var texto=
"CRÉDITOS EDITORIAIS — SITE DAS LETRAS\n\n"+
"Título da obra:\n"+titulo+"\n\n"+
"Autor:\n"+autor+"\n\n"+
"Coordenação editorial:\n"+conta+"\n\n"+
"Diagramação:\nLapidar SDL\n\n"+
"Revisão:\nLapidar SDL\n\n"+
"Capa:\n"+conta+"\n\n"+
"Selo editorial:\n"+(selo||"—")+"\n\n"+
"Registro institucional SDL:\n"+idSDL+"\n\n"+
"Ano de produção editorial:\n"+data;

document.getElementById("saidaCreditos").innerText=texto;

}

function exportarCreditos(){

var texto=document.getElementById("saidaCreditos").innerText;

if(!texto){

alert("Gere os créditos primeiro.");
return;

}

var blob=new Blob([texto],{type:"text/plain"});
var link=document.createElement("a");

link.href=URL.createObjectURL(blob);
link.download="creditos_editoriais_SDL.txt";
link.click();

}

</script>

</body>
</html>
