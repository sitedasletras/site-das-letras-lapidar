<script>

function normalizarTelefone(valor){

valor = (valor || "").trim();

valor = valor.replace(/[^\d+]/g,"");

if(valor && !valor.startsWith("+")){

valor = "+" + valor;

}

return valor;

}


function migrarCadastroAntigo(){

let nome = localStorage.getItem("lapidar_nome");

let email = localStorage.getItem("lapidar_email");

let telefone = localStorage.getItem("lapidar_telefone");

let senha = localStorage.getItem("lapidar_senha");

if(!email || !senha){

return;

}

let lista = localStorage.getItem("lapidar_cadastros");

if(lista){

lista = JSON.parse(lista);

}else{

lista = [];

}

let existe = lista.find(u => u.email === email);

if(existe){

return;

}

lista.push({

id:"cad_"+Date.now(),

nomeCompleto:nome,

email:email,

telefone:telefone,

senha:senha

});

localStorage.setItem("lapidar_cadastros",JSON.stringify(lista));

}


function entrarNoLapidar(){

migrarCadastroAntigo();

let acesso = document.getElementById("acesso").value.trim().toLowerCase();

let senha = document.getElementById("senha").value;


if(!acesso || !senha){

alert("Digite seu acesso e sua senha");

return;

}


if(acesso.includes("admin")){

localStorage.setItem("lapidar_perfil","admin");

window.location.href="sala_reunioes.html";

return;

}


if(acesso.includes("heteronimo")){

localStorage.setItem("lapidar_perfil","heteronimo");

window.location.href="sala_reunioes.html";

return;

}


let lista = localStorage.getItem("lapidar_cadastros");

if(!lista){

alert("Cadastro não encontrado");

return;

}


lista = JSON.parse(lista);

let acessoTelefone = normalizarTelefone(acesso);


let usuario = lista.find(u=>{

return (

u.email.toLowerCase()==acesso ||

normalizarTelefone(u.telefone)==acessoTelefone

)&&

u.senha==senha;

});


if(!usuario){

alert("Cadastro não encontrado ou senha incorreta");

return;

}


localStorage.setItem("lapidar_perfil","utilizador");

localStorage.setItem("lapidar_usuario_logado",usuario.id);

localStorage.setItem("lapidar_nome",usuario.nomeCompleto);

localStorage.setItem("lapidar_email",usuario.email);


window.location.href="producao_integrada.html";

}

</script>
