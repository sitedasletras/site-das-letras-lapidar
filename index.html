<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lapidar — Entrada</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(180deg,#0e2b22,#04120d);
color:#ffffff;
display:flex;
align-items:center;
justify-content:center;
min-height:100vh;
}

.container{
max-width:720px;
width:100%;
padding:24px;
}

.card{
background:rgba(255,255,255,0.07);
border:1px solid rgba(255,255,255,0.08);
border-radius:18px;
padding:32px;
text-align:center;
}

h1{
margin-top:0;
font-size:32px;
}

p{
color:#d8efe2;
line-height:1.6;
margin-bottom:24px;
}

button{
border:none;
border-radius:14px;
padding:16px 22px;
font-size:16px;
font-weight:bold;
cursor:pointer;
background:#2ecc71;
color:#062414;
}

button:hover{
background:#29b765;
}

.footer{
margin-top:18px;
font-size:14px;
color:#cfe8da;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>Lapidar</h1>

<p>
Ambiente editorial do autor independente.<br>
Inicie um novo projeto e acompanhe a lapidação da obra passo a passo dentro do fluxo profissional.
</p>

<button onclick="iniciarProjeto()">
Iniciar novo projeto
</button>

<div class="footer">
Fluxo editorial: Produção → Painel → Lapidação → Pagamento → Exportação
</div>

</div>

</div>

<script>
function iniciarProjeto(){

localStorage.removeItem("projeto_lapidar");

window.location.href="producao_integrada.html";

}
</script>

</body>
</html>
