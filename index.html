<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lapidar — Site das Letras — V31</title>

<style>
body{margin:0;font-family:Arial;background:#f4f4f4;text-align:center;padding:40px;}
.container{max-width:980px;margin:auto;background:white;padding:35px;border-radius:18px;box-shadow:0 6px 18px rgba(0,0,0,0.08);}
input,select,button{margin-top:10px;padding:12px;font-size:16px;border-radius:8px;border:1px solid #ccc;width:100%;box-sizing:border-box;}
button{background:#222;color:white;cursor:pointer;}
button:hover{background:#444;}
.relatorio{margin-top:20px;border:2px solid #bbb;border-radius:10px;padding:20px;white-space:pre-line;text-align:left;}
</style>
</head>

<body>

<div class="container">

<h2>Site das Letras — Lapidar V31</h2>

<label>Conta editorial</label>
<input id="contaCliente" placeholder="Ex: Site das Letras">

<label>Título da obra</label>
<input id="tituloObra" placeholder="Ex: Crônicas da Persida">

<label>Tipo de edição</label>
<select id="tipoEdicao">
<option>1ª edição</option>
<option>2ª edição</option>
<option>Edição revista</option>
<option>Edição ampliada</option>
<option>Edição definitiva</option>
<option>Edição comemorativa</option>
<option>Reimpressão</option>
</select>

<button onclick="registrarEdicao()">Registrar edição da obra</button>

<button onclick="verHistorico()">Ver histórico editorial</button>

<div id="saidaHistorico" class="relatorio"></div>

</div>

<script>

function chaveEdicao(conta,titulo){
return "HISTORICO_EDICOES_"+conta.toUpperCase()+"_"+titulo.toUpperCase();
}

function registrarEdicao(){

var conta=document.getElementById("contaCliente").value.trim();
var titulo=document.getElementById("tituloObra").value.trim();
var tipo=document.getElementById("tipoEdicao").value;

if(!conta||!titulo){

alert("Conta editorial e título são obrigatórios.");
return;

}

var chave=chaveEdicao(conta,titulo);

var banco=JSON.parse(localStorage.getItem(chave)||"[]");

var registro={
edicao:tipo,
data:new Date().toLocaleString("pt-BR")
};

banco.push(registro);

localStorage.setItem(chave,JSON.stringify(banco));

alert("Edição registrada com sucesso.");

}

function verHistorico(){

var conta=document.getElementById("contaCliente").value.trim();
var titulo=document.getElementById("tituloObra").value.trim();

if(!conta||!titulo){

alert("Informe conta editorial e título.");
return;

}

var chave=chaveEdicao(conta,titulo);

var banco=JSON.parse(localStorage.getItem(chave)||"[]");

if(banco.length===0){

document.getElementById("saidaHistorico").innerText="Nenhuma edição registrada para esta obra.";
return;

}

var texto="HISTÓRICO EDITORIAL — "+titulo+"\n\n";

banco.forEach(function(item,index){

texto+=
(index+1)+". "+item.edicao+" — "+item.data+"\n";

});

document.getElementById("saidaHistorico").innerText=texto;

}

</script>

</body>
</html>
