<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lapidar — Site das Letras — V45</title>

<style>
body{margin:0;font-family:Arial;background:#f4f4f4;text-align:center;padding:40px;}
.container{max-width:1100px;margin:auto;background:white;padding:35px;border-radius:18px;box-shadow:0 6px 18px rgba(0,0,0,0.08);}
textarea,input,button{margin-top:10px;padding:12px;font-size:16px;border-radius:8px;border:1px solid #ccc;width:100%;box-sizing:border-box;}
button{background:#222;color:white;cursor:pointer;}
button:hover{background:#444;}
.relatorio{margin-top:20px;border:2px solid #bbb;border-radius:10px;padding:25px;white-space:pre-line;text-align:left;}
</style>
</head>

<body>

<div class="container">

<h2>Site das Letras — Lapidar V45</h2>
<p>Recomposição narrativa automática com variação inteligente de conectores temporais.</p>

<label>Texto após limpeza do V44</label>
<textarea id="textoEntrada" rows="16" placeholder="Cole aqui o texto já higienizado."></textarea>

<button onclick="recomporNarrativa()">Aplicar recomposição narrativa inteligente</button>

<label>Texto recomposto</label>
<textarea id="textoSaida" rows="16"></textarea>

<div id="relatorio" class="relatorio"></div>

</div>

<script>

let conectoresDisponiveis=[
"Pouco depois",
"Instantes mais tarde",
"Na sequência dos acontecimentos",
"Mais adiante",
"Algum tempo depois",
"Momentos depois",
"Horas mais tarde",
"Logo depois",
"Em seguida",
"No desenrolar daquele instante narrativo"
];

function limparConectorInicial(frase){

return frase.replace(/^\s*(Agora|Então|Assim|Logo|Depois|Em seguida|A seguir|Nesse momento)[,\s]+/i,"");

}

function selecionarConector(usados){

for(let i=0;i<conectoresDisponiveis.length;i++){

if(!usados.includes(conectoresDisponiveis[i])){

return conectoresDisponiveis[i]

}

}

return "Momentos depois"

}

function recomporNarrativa(){

let texto=document.getElementById("textoEntrada").value.trim()

if(!texto){

alert("Cole um texto primeiro.")
return

}

let linhas=texto.split("\n")
let usados=[]
let substituicoes=0

for(let i=0;i<linhas.length;i++){

let linhaOriginal=linhas[i]

if(/^(Agora|Então|Assim|Logo|Depois|Em seguida|A seguir|Nesse momento)[,\s]/i.test(linhaOriginal)){

let conectorNovo=selecionarConector(usados)

let fraseLimpa=limparConectorInicial(linhaOriginal)

linhas[i]=conectorNovo + ", " + fraseLimpa

usados.push(conectorNovo)

substituicoes++

}

}

let textoFinal=linhas.join("\n")

document.getElementById("textoSaida").value=textoFinal

document.getElementById("relatorio").innerText=
"RECOMPOSIÇÃO NARRATIVA EXECUTADA\n\n"+
"Conectores substituídos: "+substituicoes+"\n"+
"Variação automática aplicada conforme regra editorial do Prompt 001."

}

</script>

</body>
</html>
