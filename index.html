<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site das Letras — Lapidar</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f4f4;
text-align:center;
padding:60px 20px;
}

.container{
max-width:720px;
margin:auto;
background:white;
padding:40px;
border-radius:18px;
box-shadow:0 6px 18px rgba(0,0,0,0.08);
}

h1{
color:#222;
}

p{
color:#555;
font-size:18px;
line-height:1.6;
}

button{
margin-top:25px;
padding:14px 24px;
font-size:18px;
border:none;
border-radius:10px;
background:#222;
color:white;
cursor:pointer;
}

form{
display:none;
margin-top:30px;
text-align:left;
}

label{
display:block;
margin-top:15px;
font-weight:bold;
}

input,select{
width:100%;
padding:10px;
margin-top:5px;
border-radius:6px;
border:1px solid #ccc;
box-sizing:border-box;
}
</style>
</head>

<body>
<div class="container">
<h1>Site das Letras — Lapidar</h1>

<p>Sistema editorial inteligente para autores independentes.</p>
<p>Bem-vindo ao ambiente de criação do seu livro.</p>

<button onclick="abrirFicha()">Iniciar Ficha Global</button>

<form id="ficha">
<label>Título da obra</label>
<input type="text">

<label>Subtítulo (opcional)</label>
<input type="text">

<label>Autor civil</label>
<input type="text">

<label>Identidade autoral</label>
<select onchange="mostrarHeteronimo(this.value)">
<option>Autor civil</option>
<option>Heterônimo</option>
<option>Pseudônimo</option>
</select>

<div id="heteronimoCampo" style="display:none;">
<label>Nome do heterônimo</label>
<input type="text">
</div>

<label>Coleção (opcional)</label>
<input type="text">

<label>Selo editorial</label>
<input type="text" value="Site das Letras Edições Literárias">
</form>
</div>

<script>
function abrirFicha(){
document.getElementById("ficha").style.display="block";
}

function mostrarHeteronimo(valor){
if(valor==="Heterônimo"){
document.getElementById("heteronimoCampo").style.display="block";
}else{
document.getElementById("heteronimoCampo").style.display="none";
}
}
</script>
</body>
</html>
