<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Lapidar - Ferramenta para Escritores</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #f5f2eb;
            margin: 0;
            padding: 16px;
            color: #2c2418;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 1.8rem;
            margin: 0;
            letter-spacing: -0.5px;
        }
        .tagline {
            color: #6b4e2e;
            font-style: italic;
        }
        .modulos {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
            justify-content: center;
        }
        button {
            background: #e0d6c8;
            border: none;
            padding: 10px 18px;
            border-radius: 60px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #2c2418;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        button.ativo {
            background: #2c6e2f;
            color: white;
            box-shadow: 0 2px 6px rgba(44,110,47,0.3);
        }
        button:active {
            transform: scale(0.97);
        }
        .painel {
            background: white;
            border-radius: 28px;
            padding: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            min-height: 400px;
        }
        iframe {
            width: 100%;
            border: none;
            background: white;
            border-radius: 16px;
        }
        footer {
            text-align: center;
            font-size: 0.7rem;
            color: #9b8a74;
            margin-top: 32px;
        }
        .carregando {
            text-align: center;
            padding: 40px;
            color: #6b4e2e;
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>✍️ Lapidar</h1>
        <div class="tagline">núcleo & engine · ferramenta para escritores</div>
    </header>

    <div class="modulos" id="botoesModulos">
        <!-- os botões serão gerados pela engine -->
        <button disabled>carregando...</button>
    </div>

    <div class="painel" id="painelPrincipal">
        <div class="carregando">⚙️ Inicializando Engine do Lapidar...</div>
    </div>
    <footer>
        core + engine · integração dos módulos Site das Letras
    </footer>
</div>

<script src="engine_lapidar.js"></script>
</body>
</html>
