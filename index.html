<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lapidar — Site das Letras — V20</title>

<style>
body{margin:0;font-family:Arial;background:#f4f4f4;text-align:center;padding:50px 20px;}
.container{max-width:980px;margin:auto;background:white;padding:40px;border-radius:18px;box-shadow:0 6px 18px rgba(0,0,0,0.08);}
button{margin-top:20px;padding:14px 22px;font-size:17px;border:none;border-radius:10px;background:#222;color:white;cursor:pointer;}
button:hover{background:#444;}
.modulo{display:none;text-align:left;margin-top:10px;}
fieldset{border:1px solid #ddd;border-radius:12px;padding:20px;margin-top:20px;}
.certificado{margin-top:15px;background:#fff;border:2px solid #bbb;border-radius:12px;padding:24px;white-space:pre-line;text-align:center;}
</style>
</head>

<body>

<div class="container">

<h1>Site das Letras<br>Lapidar V20</h1>

<button onclick="abrirSistema()">Entrar</button>

<div id="sistema" class="modulo">

<fieldset>
<button onclick="gerarRelatorioMensal()">Gerar relatório mensal por país</button>
<div id="saidaRelatorioMensal" class="certificado"></div>
</fieldset>

<fieldset>
<button onclick="exportarRelatorioMensalPDF()">Exportar relatório mensal SDL (PDF)</button>
<div id="saidaMensalPDF" class="certificado"></div>
</fieldset>

<fieldset>
<button onclick="gerarRelatorioAnual()">Gerar relatório anual SDL</button>
<div id="saidaRelatorioAnual" class="certificado"></div>
</fieldset>

<fieldset>
<button onclick="exportarRelatorioAnualPDF()">Exportar relatório anual SDL (PDF)</button>
<div id="saidaAnualPDF" class="certificado"></div>
</fieldset>

</div>
</div>

<script>

function abrirSistema(){
document.getElementById("sistema").style.display="block";
}

function componentesBrasil(){
var agora=new Date();
var formatter=new Intl.DateTimeFormat("en-CA",{
timeZone:"America/Sao_Paulo",
year:"numeric",
month:"2-digit"
});
var parts=formatter.formatToParts(agora);
var map={};
parts.forEach(p=>map[p.type]=p.value);
return map;
}

function gerarRelatorioMensal(){

var comp=componentesBrasil();
var chave=comp.year+"-"+comp.month;

var dados=JSON.parse(localStorage.getItem("relatorioMensalSDL")||"{}");
var mesAtual=dados[chave]||{};

var paises=Object.keys(mesAtual);

if(paises.length===0){
document.getElementById("saidaRelatorioMensal").innerText=
"RELATÓRIO MENSAL SDL\n\nNenhum registro neste mês.";
return;
}

var total=0;
var texto="RELATÓRIO MENSAL SDL\n";
texto+="Site das Letras Edições Literárias\n\n";
texto+="Período: "+comp.month+"/"+comp.year+"\n";
texto+="Horário oficial: Brasil\n\n";

paises.forEach(p=>{
texto+=p+" — "+mesAtual[p]+" registros\n";
total+=mesAtual[p];
});

texto+="\nTotal: "+total+" obras";

document.getElementById("saidaRelatorioMensal").innerText=texto;
localStorage.setItem("relatorioMensalTextoAtual",texto);

}

function exportarRelatorioMensalPDF(){

var texto=localStorage.getItem("relatorioMensalTextoAtual");

if(!texto){
alert("Gere o relatório mensal primeiro.");
return;
}

var janela=window.open("","_blank");
janela.document.write("<pre style='font-family:Arial;font-size:14px'>"+texto+"</pre>");
janela.document.close();
janela.print();

document.getElementById("saidaMensalPDF").innerText=
"Relatório mensal preparado para exportação.";

}

function gerarRelatorioAnual(){

var comp=componentesBrasil();
var anoAtual=comp.year;

var dados=JSON.parse(localStorage.getItem("relatorioMensalSDL")||"{}");

var totalPais={};

Object.keys(dados).forEach(chave=>{

if(chave.startsWith(anoAtual)){

var mes=dados[chave];

Object.keys(mes).forEach(pais=>{

if(!totalPais[pais]) totalPais[pais]=0;

totalPais[pais]+=mes[pais];

});

}

});

var paises=Object.keys(totalPais);

if(paises.length===0){

document.getElementById("saidaRelatorioAnual").innerText=
"RELATÓRIO ANUAL SDL\n\nNenhum registro neste ano.";

return;

}

var total=0;

var texto="RELATÓRIO EDITORIAL ANUAL SDL\n";
texto+="Site das Letras Edições Literárias\n\n";
texto+="Ano: "+anoAtual+"\n";
texto+="Horário oficial: Brasil\n\n";

paises.forEach(p=>{

texto+=p+" — "+totalPais[p]+" registros\n";

total+=totalPais[p];

});

texto+="\nTotal anual: "+total+" obras";

document.getElementById("saidaRelatorioAnual").innerText=texto;

localStorage.setItem("relatorioAnualTextoAtual",texto);

}

function exportarRelatorioAnualPDF(){

var texto=localStorage.getItem("relatorioAnualTextoAtual");

if(!texto){

alert("Gere o relatório anual primeiro.");

return;

}

var janela=window.open("","_blank");

janela.document.write("<pre style='font-family:Arial;font-size:14px'>"+texto+"</pre>");

janela.document.close();

janela.print();

document.getElementById("saidaAnualPDF").innerText=
"Relatório anual preparado para exportação.";

}

</script>

</body>
</html>
