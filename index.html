<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>— Lapidar —</title>

<style>
body{margin:0;font-family:Arial;background:#f4f4f4;text-align:center;padding:40px;}
.container{max-width:1100px;margin:auto;background:white;padding:35px;border-radius:18px;box-shadow:0 6px 18px rgba(0,0,0,0.08);}
textarea,input,button{margin-top:10px;padding:12px;font-size:16px;border-radius:8px;border:1px solid #ccc;width:100%;box-sizing:border-box;}
button{background:#222;color:white;cursor:pointer;}
button:hover{background:#444;}
.relatorio{margin-top:20px;border:2px solid #bbb;border-radius:10px;padding:25px;white-space:pre-line;text-align:left;}
small{display:block;color:#666;margin-top:6px;}
</style>

</head>

<body>

<div class="container">

<h2>— Lapidar —</h2>
<p>Memória narrativa global com variação automática de conectores temporais (integra V44 + V45).</p>

<label>Texto da obra (ou capítulo)</label>
<textarea id="textoEntrada" rows="18" placeholder="Cole aqui o texto já higienizado pelo módulo anterior."></textarea>

<button onclick="processarMemoriaNarrativa()">Aplicar recomposição com memória global</button>

<label>Texto recomposto</label>
<textarea id="textoSaida" rows="18"></textarea>

<div id="relatorio" class="relatorio"></div>

</div>

<script>

function limpar(txt){
return (txt||"").trim();
}

function bancoConectoresUsados(){
return JSON.parse(localStorage.getItem("MEMORIA_CONECTORES_LAPIDAR")||"[]");
}

function salvarBanco(conectores){
localStorage.setItem("MEMORIA_CONECTORES_LAPIDAR",JSON.stringify(conectores));
}

function escolherConector(usados){

const lista=[
"Pouco depois",
"Instantes mais tarde",
"Algum tempo depois",
"Momentos depois",
"Horas mais tarde",
"Mais adiante",
"Na sequência dos acontecimentos",
"No desenrolar daquele instante narrativo",
"Posteriormente",
"Na continuidade daquele período narrativo"
];

for(let c of lista){
if(!usados.includes(c)) return c;
}

return "Momentos depois";
}

function removerConectorOrfao(linha){
return linha.replace(/^\s*(Agora|Então|Assim|Logo|Depois|Em seguida|A seguir|Nesse momento)[,\s]+/i,"");
}

function processarMemoriaNarrativa(){

let texto=limpar(document.getElementById("textoEntrada").value);

if(!texto){
alert("Cole o texto primeiro.");
return;
}

let usados=bancoConectoresUsados();

let linhas=texto.split("\n");
let substituicoes=0;

for(let i=0;i<linhas.length;i++){

if(/^(Agora|Então|Assim|Logo|Depois|Em seguida|A seguir|Nesse momento)[,\s]/i.test(linhas[i])){

let novo=escolherConector(usados);

linhas[i]=novo+", "+removerConectorOrfao(linhas[i]);

usados.push(novo);

substituicoes++;

}

}

salvarBanco(usados);

let final=linhas.join("\n");

document.getElementById("textoSaida").value=final;

document.getElementById("relatorio").innerText=
"MEMÓRIA NARRATIVA GLOBAL ATUALIZADA\n\n"+
"Conectores substituídos nesta execução: "+substituicoes+"\n"+
"Total de conectores já registrados na obra: "+usados.length+"\n"+
"Repetição futura automaticamente evitada conforme Prompt 001.";

}

</script>

</body>
</html>
