<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lapidar — Site das Letras — V38</title>

<style>
body{margin:0;font-family:Arial;background:#f4f4f4;text-align:center;padding:40px;}
.container{max-width:980px;margin:auto;background:white;padding:35px;border-radius:18px;box-shadow:0 6px 18px rgba(0,0,0,0.08);}
input,textarea,button{margin-top:10px;padding:12px;font-size:16px;border-radius:8px;border:1px solid #ccc;width:100%;box-sizing:border-box;}
button{background:#222;color:white;cursor:pointer;}
button:hover{background:#444;}
.relatorio{margin-top:20px;border:2px solid #bbb;border-radius:10px;padding:25px;white-space:pre-line;text-align:left;}
small{display:block;color:#666;margin-top:6px;}
</style>
</head>

<body>

<div class="container">

<h2>Site das Letras — Lapidar V38</h2>
<p>Importar dados iniciais automaticamente a partir do arquivo do autor</p>

<label>Selecionar arquivo do autor (.txt recomendado / .docx permitido)</label>
<input type="file" id="arquivoAutor">

<button onclick="extrairDados()">Extrair dados automaticamente</button>

<label>Título sugerido</label>
<input id="tituloSug" placeholder="Resultado automático">

<label>Subtítulo sugerido</label>
<input id="subtituloSug" placeholder="Resultado automático">

<label>Autor sugerido</label>
<input id="autorSug" placeholder="Resultado automático">

<label>Tipo provável</label>
<input id="tipoSug" placeholder="Resultado automático">

<div id="saidaAuto" class="relatorio"></div>

</div>

<script>

function sugerirTipo(texto){

texto = texto.toLowerCase()

if(texto.includes("poema") || texto.includes("poesia")) return "Poesia"
if(texto.includes("conto")) return "Contos"
if(texto.includes("infantil") || texto.includes("criança")) return "Infantil"
if(texto.includes("ensaio")) return "Ensaio"
if(texto.includes("biografia")) return "Biografia"
if(texto.includes("fantasia")) return "Fantasia"
if(texto.includes("história") || texto.includes("historia")) return "Histórico"
if(texto.includes("espiritual")) return "Espiritual"
if(texto.includes("terror") || texto.includes("horror")) return "Horror"

return "Romance"

}

function extrairDados(){

var arquivo = document.getElementById("arquivoAutor").files[0]

if(!arquivo){

alert("Selecione um arquivo primeiro.")
return

}

var leitor = new FileReader()

leitor.onload = function(e){

var conteudo = e.target.result

var linhas = conteudo.split("\n").filter(l => l.trim() !== "")

var titulo = linhas[0] || ""
var subtitulo = linhas[1] || ""
var autor = linhas[2] || ""

var tipo = sugerirTipo(conteudo)

document.getElementById("tituloSug").value = titulo
document.getElementById("subtituloSug").value = subtitulo
document.getElementById("autorSug").value = autor
document.getElementById("tipoSug").value = tipo

document.getElementById("saidaAuto").innerText =
"DADOS EXTRAÍDOS AUTOMATICAMENTE\n\n" +
"Título: " + titulo + "\n" +
"Subtítulo: " + subtitulo + "\n" +
"Autor: " + autor + "\n" +
"Tipo sugerido: " + tipo

}

leitor.readAsText(arquivo)

}

</script>

</body>
</html>
