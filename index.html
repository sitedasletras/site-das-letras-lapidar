<!DOCTYPE html>
<html lang="pt-br">

<head>

<title>Lapidar — Site das Letras</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
background:#0d0603;
color:white;

height:100vh;
}

.container{
text-align:center;

padding:20px;
}

.logo-svg{

}

.titulo{

}

.subtitulo{
color:#ff7b2c;
font-size:15px;
margin-bottom:25px;
}

.frase{

<svg class="logo-svg" viewBox="0 0 64 64">

<path fill="#fff"

</svg>


<div class="titulo">

— LAPIDAR —

</div>


<div class="subtitulo">

</div>


<div class="frase">

<input placeholder="UTILIZADOR">
