<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lapidar • Login</title>

<style>
body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:#e6d3a3;
}

.container{
max-width:420px;
margin:60px auto;
background:white;
padding:30px;
border-radius:18px;
box-shadow:0 10px 25px rgba(0,0,0,.12);
}

.brasao{
display:block;
margin:auto;
width:140px;
margin-bottom:12px;
object-fit:contain;
}

.logo{
text-align:center;
font-size:36px;
font-weight:bold;
letter-spacing:3px;
margin-bottom:6px;
}

.sub{
text-align:center;
font-size:13px;
color:#777;
margin-bottom:24px;
line-height:1.5;
}

input{
width:100%;
padding:14px;
margin-bottom:14px;
border-radius:10px;
border:1px solid #ccc;
font-size:15px;
box-sizing:border-box;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
font-size:16px;
cursor:pointer;
font-weight:bold;
}

.login{
background:#1f3f75;
color:white;
margin-bottom:10px;
}

.criar{
background:#d4a73c;
color:white;
margin-bottom:10px;
}

.recuperar{
background:#eee;
}

.footer{
text-align:center;
margin-top:20px;
font-size:12px;
color:#777;
line-height:1.5;
}

.msg{
margin-top:10px;
padding:12px;
border-radius:10px;
font-size:14px;
display:none;
}

.msg.ok{
background:#eef8f0;
color:#1f6b36;
border:1px solid #b8dfc0;
display:block;
}

.msg.erro{
background:#fff1f1;
color:#a12626;
border:1px solid #efc0c0;
display:block;
}
</style>
</head>

<body>

<div class="container">

<img
class="brasao"
src="file_00000000d8bc71f5b57491905e34ae99.jpg"
alt="Brasão do Site das Letras"
>

<div class="logo">LAPIDAR</div>

<div class="sub">
Produto institucional do Celeiro Literário<br>
Site das Letras Edições Literárias
</div>

<input
id="usuario"
placeholder="Digite seu e-mail ou telefone"
>

<input
id="senha"
type="password"
placeholder="Digite sua senha"
>

<button
class="login"
onclick="entrar()"
>
Entrar no Lapidar
</button>

<button
class="criar"
onclick="irCadastro()"
>
Criar cadastro
</button>

<button
class="recuperar"
onclick="recuperarSenha()"
>
Recuperar senha
</button>

<div id="mensagem" class="msg"></div>

<div class="footer">
Lapidar • Celeiro Literário • Site das Letras Edições Literárias
</div>

</div>

<script>
function mostrarMensagem(tipo, texto){
  const box = document.getElementById("mensagem");
  box.className = "msg " + tipo;
  box.innerText = texto;
}

function carregarCadastros(){
  try{
    return JSON.parse(localStorage.getItem("lapidar_cadastros") || "[]");
  }catch(e){
    return [];
  }
}

function normalizarTelefone(valor){
  let limpo = valor.replace(/[^\d+]/g, "");
  if(!limpo.startsWith("+") && limpo.length > 0 && !valor.includes("@")){
    limpo = "+" + limpo;
  }
  return limpo;
}

function entrar(){
  const usuarioBruto = document.getElementById("usuario").value.trim().toLowerCase();
  const senha = document.getElementById("senha").value;

  if(usuarioBruto.includes("admin")){
    localStorage.setItem("lapidar_perfil","admin");
    localStorage.setItem("lapidar_usuario","admin");
    localStorage.setItem("lapidar_nome","Administrador do Sistema");
    window.location.href="sala_reunioes.html";
    return;
  }

  if(usuarioBruto.includes("heteronimo")){
    localStorage.setItem("lapidar_perfil","heteronimo");
    localStorage.setItem("lapidar_usuario","heteronimo");
    localStorage.setItem("lapidar_nome","Heterônimo do Sistema");
    window.location.href="sala_reunioes.html";
    return;
  }

  const usuario = usuarioBruto.includes("@") ? usuarioBruto : normalizarTelefone(usuarioBruto);
  const cadastros = carregarCadastros();

  const encontrado = cadastros.find(item =>
    item.email === usuario || item.telefone === usuario
  );

  if(!encontrado){
    mostrarMensagem("erro","E-mail ou telefone não encontrado.");
    return;
  }

  if(encontrado.senha !== senha){
    mostrarMensagem("erro","Senha incorreta.");
    return;
  }

  localStorage.setItem("lapidar_perfil", encontrado.perfil || "utilizador");
  localStorage.setItem("lapidar_usuario", encontrado.email || encontrado.telefone);
  localStorage.setItem("lapidar_nome", encontrado.nomeCompleto || "Utilizador");
  localStorage.setItem("lapidar_idioma", encontrado.idioma || "pt");
  localStorage.setItem("lapidar_utilizador_email", encontrado.email || "");
  localStorage.setItem("lapidar_utilizador_telefone", encontrado.telefone || "");

  if((encontrado.perfil || "utilizador") === "utilizador"){
    window.location.href="producao_integrada.html";
  }else{
    window.location.href="sala_reunioes.html";
  }
}

function irCadastro(){
  window.location.href = "criar_perfil.html";
}

function recuperarSenha(){
  window.location.href = "recuperar_senha.html";
}
</script>

</body>
</html>
