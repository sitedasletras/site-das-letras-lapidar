<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=login.html">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lapidar — Redirecionando</title>
  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#f4efe6;
      color:#2f2a24;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
      padding:24px;
    }

    .box{
      background:#fff;
      border-radius:14px;
      padding:28px;
      box-shadow:0 4px 14px rgba(0,0,0,0.08);
      max-width:560px;
      text-align:center;
    }

    h1{
      margin-top:0;
      color:#5d4b2d;
      font-size:26px;
    }

    p{
      line-height:1.5;
      margin-bottom:16px;
    }

    a{
      display:inline-block;
      padding:12px 18px;
      background:#5d4b2d;
      color:#fff;
      text-decoration:none;
      border-radius:10px;
    }

    a:hover{
      background:#4a3b23;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>Lapidar</h1>
    <p>Redirecionando para a entrada oficial do sistema.</p>
    <p>Se o redirecionamento não acontecer automaticamente, clique abaixo.</p>
    <a href="login.html">Abrir login</a>
  </div>

</body>
</html>
