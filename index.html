<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lapidar • Entrada oficial</title>

<style>

body{

margin:0;
font-family:Arial, sans-serif;
background:#f4f1e8;

display:flex;
justify-content:center;
align-items:center;

height:100vh;

}

.card{

background:white;

padding:40px;

border-radius:20px;

box-shadow:0px 12px 32px rgba(0,0,0,0.12);

text-align:center;

width:360px;

}

button{

margin-top:25px;

padding:16px 28px;

border:none;

border-radius:12px;

font-size:18px;

background:#2e7d32;

color:white;

cursor:pointer;

}

</style>

</head>

<body>

<div class="card">

<h2>Entrada oficial do Lapidar</h2>

<p>Preparando ambiente de acesso...</p>

<button onclick="entrarSistema()">

Continuar

</button>

</div>


<script>

/* VERIFICA PERFIL */

const perfil = localStorage.getItem("lapidar_perfil")

if(!perfil){

window.location.href = "login.html"

}


/* VERIFICA PRIMEIRO ACESSO */

const respiracaoConfirmada =
localStorage.getItem("lapidar_respiracao_ok")

if(!respiracaoConfirmada){

window.location.href =
"pagina_institucional_lapidar.html"

}


/* FLUXO NORMAL */

function entrarSistema(){

window.location.href =
"entrada_obra.html"

}

</script>


</body>
</html>
