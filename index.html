<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lapidar — Site das Letras</title>

<style>

body{

margin:0;
font-family:Arial, sans-serif;

background:#0d0603;
color:white;

display:flex;
justify-content:center;
align-items:center;
height:100vh;

}

.container{

text-align:center;
max-width:420px;
padding:20px;

}

.logo{

width:260px; /* tamanho aumentado com qualidade preservada */
margin-bottom:25px;

}

.titulo{

font-size:32px;
font-weight:bold;
margin:10px 0;
letter-spacing:2px;

}

.subtitulo{

color:#ff7b2c;
font-size:15px;
margin-bottom:25px;

}

.frase{

color:#ff7b2c;
font-size:16px;
margin-bottom:40px;
line-height:1.6;

}

input{

width:100%;
padding:16px;
margin:10px 0;

border-radius:30px;
border:none;

font-size:16px;

}

.botao{

display:block;
width:100%;

margin-top:20px;

padding:18px;

border-radius:35px;
border:none;

background:#ff5a00;
color:white;

font-size:18px;
font-weight:bold;

cursor:pointer;

transition:0.3s;

}

.botao:hover{

background:#ff6f1a;

}

</style>

</head>

<body>

<div class="container">

<img class="logo"
src="file_00000000760c720ebb734bb5e71340bb.png">

<div class="titulo">

— LAPIDAR —

</div>

<div class="subtitulo">

Um projeto do Site das Letras Edições Literárias

</div>

<div class="frase">

Aqui você tira os seus rascunhos da gaveta e realiza os seus sonhos.

</div>

<input placeholder="UTILIZADOR">

<input type="password"
placeholder="SENHA">

<button class="botao">

Entre para diagramar o seu livro

</button>

</div>

</body>

</html>
