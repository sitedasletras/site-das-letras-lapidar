<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site das Letras — Lapidar —</title>

<style>
body{margin:0;font-family:Arial;background:#f4f4f4;text-align:center;padding:50px 20px;}
.container{max-width:980px;margin:auto;background:white;padding:40px;border-radius:18px;box-shadow:0 6px 18px rgba(0,0,0,0.08);}
button{margin-top:20px;padding:14px 22px;font-size:17px;border:none;border-radius:10px;background:#222;color:white;cursor:pointer;}
button:hover{background:#444;}
.modulo{display:none;text-align:left;margin-top:10px;}
fieldset{border:1px solid #ddd;border-radius:12px;padding:20px;margin-top:20px;}
input,select{width:100%;padding:10px;margin-top:5px;border-radius:6px;border:1px solid #ccc;font-size:16px;}
.certificado{margin-top:15px;background:#fff;border:2px solid #bbb;border-radius:12px;padding:24px;white-space:pre-line;text-align:center;}
</style>
</head>

<body>

<div class="container">

<h1>Site das Letras<br>— Lapidar —</h1>

<button onclick="abrirProjetoCompleto()">Entrar no Projeto Completo</button>

<div id="projetoCompleto" class="modulo">

<fieldset>
<label>Título</label>
<input id="tituloObra">

<label>Autor</label>
<input id="autorCapa">
</fieldset>

<fieldset>
<button onclick="gerarIDEditorialInstitucional()">Gerar ID editorial institucional da obra</button>
<div id="idEditorialGerado" class="certificado"></div>
</fieldset>

<fieldset>
<button onclick="registrarNoCatalogo()">Registrar obra no catálogo institucional SDL</button>
<div id="catalogoGerado" class="certificado"></div>
</fieldset>

</div>
</div>

<script>

function abrirProjetoCompleto(){
document.getElementById("projetoCompleto").style.display="block";
}

function gerarCodigoEditorialSDL(){

var titulo=document.getElementById("tituloObra").value||"obra";
var autor=document.getElementById("autorCapa").value||"autor";

var agora=new Date();

var ano=agora.getFullYear();
var mes=String(agora.getMonth()+1).padStart(2,"0");
var dia=String(agora.getDate()).padStart(2,"0");
var hora=String(agora.getHours()).padStart(2,"0");
var minuto=String(agora.getMinutes()).padStart(2,"0");

var hashBase=titulo+autor+agora.getTime();
var hash=btoa(hashBase).replace(/[^A-Z0-9]/gi,"").substring(0,6).toUpperCase();

return "SDL-"+ano+"-"+mes+"-"+dia+"-"+hora+"-"+minuto+"-"+hash;
}

function gerarIDEditorialInstitucional(){

var codigoSDL=gerarCodigoEditorialSDL();

document.getElementById("idEditorialGerado").innerText=
"ID EDITORIAL INSTITUCIONAL LAPIDAR\n\nCódigo:\n"+codigoSDL;

localStorage.setItem("ultimoIDSDL",codigoSDL);

}

function registrarNoCatalogo(){

var codigoSDL=localStorage.getItem("ultimoIDSDL");

if(!codigoSDL){

codigoSDL=gerarCodigoEditorialSDL();

}

var catalogo=JSON.parse(localStorage.getItem("catalogoSDL")||"[]");

catalogo.push(codigoSDL);

localStorage.setItem("catalogoSDL",JSON.stringify(catalogo));

document.getElementById("catalogoGerado").innerText=
"CATÁLOGO INSTITUCIONAL SDL\n\nObras registradas nesta sessão:\n\n"+catalogo.join("\n");

}

</script>

</body>
</html>
