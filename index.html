<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lapidar • Login</title>

<style>

body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:#e6d3a3;
}

.container{
max-width:420px;
margin:60px auto;
background:white;
padding:30px;
border-radius:18px;
box-shadow:0 10px 25px rgba(0,0,0,.12);
}

.brasao{
display:block;
margin:auto;
width:140px;
margin-bottom:12px;
}

.logo{
text-align:center;
font-size:36px;
font-weight:bold;
letter-spacing:3px;
margin-bottom:6px;
}

.sub{
text-align:center;
font-size:13px;
color:#777;
margin-bottom:24px;
}

input{
width:100%;
padding:14px;
margin-bottom:14px;
border-radius:10px;
border:1px solid #ccc;
font-size:15px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
font-size:16px;
cursor:pointer;
font-weight:bold;
}

.login{
background:#1f3f75;
color:white;
margin-bottom:10px;
}

.criar{
background:#d4a73c;
color:white;
margin-bottom:10px;
}

.recuperar{
background:#eee;
}

.footer{
text-align:center;
margin-top:20px;
font-size:12px;
color:#777;
}

</style>
</head>


<body>


<div class="container">

<img
class="brasao"
src="file_00000000d8bc71f5b57491905e34ae99.jpg"
alt="Brasão do Site das Letras"
>

<div class="logo">LAPIDAR</div>

<div class="sub">
Produto institucional do Celeiro Literário<br>
Site das Letras Edições Literárias
</div>


<input
id="usuario"
placeholder="Digite seu login ou e-mail"
>


<input
id="senha"
type="password"
placeholder="Digite sua senha"
>


<button
class="login"
onclick="entrar()"
>
Entrar no Lapidar
</button>


<button
class="criar"
onclick="criarCadastro()"
>
Criar cadastro
</button>


<button
class="recuperar"
onclick="recuperarSenha()"
>
Recuperar senha
</button>


<div class="footer">

Lapidar • Celeiro Literário • Site das Letras Edições Literárias

</div>


</div>


<script>


function entrar(){

let usuario=document.getElementById("usuario").value.toLowerCase()


if(usuario.includes("admin")){

localStorage.setItem("lapidar_perfil","admin")
localStorage.setItem("lapidar_usuario","admin")

window.location.href="sala_reunioes.html"

return

}


if(usuario.includes("heteronimo")){

localStorage.setItem("lapidar_perfil","heteronimo")
localStorage.setItem("lapidar_usuario","heteronimo")

window.location.href="sala_reunioes.html"

return

}


localStorage.setItem("lapidar_perfil","cortesia")
localStorage.setItem("lapidar_usuario","cortesia")

window.location.href="sala_reunioes.html"

}



function criarCadastro(){

alert("Cadastro automático liberado.")

}



function recuperarSenha(){

alert("Recuperação liberada.")

}


</script>


</body>
</html>
