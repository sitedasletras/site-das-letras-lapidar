<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lapidar — Site das Letras — V21</title>

<style>
body{margin:0;font-family:Arial;background:#f4f4f4;text-align:center;padding:50px 20px;}
.container{max-width:980px;margin:auto;background:white;padding:40px;border-radius:18px;box-shadow:0 6px 18px rgba(0,0,0,0.08);}
button{margin-top:20px;padding:14px 22px;font-size:17px;border:none;border-radius:10px;background:#222;color:white;cursor:pointer;}
button:hover{background:#444;}
.modulo{display:none;text-align:left;margin-top:10px;}
fieldset{border:1px solid #ddd;border-radius:12px;padding:20px;margin-top:20px;}
.certificado{margin-top:15px;background:#fff;border:2px solid #bbb;border-radius:12px;padding:24px;white-space:pre-line;text-align:center;}
</style>
</head>

<body>

<div class="container">

<h1>Site das Letras<br>Lapidar V21</h1>

<button onclick="abrirSistema()">Entrar</button>

<div id="sistema" class="modulo">

<fieldset>
<button onclick="gerarRelatorioHistorico()">Gerar relatório histórico geral SDL</button>
<div id="saidaHistorico" class="certificado"></div>
</fieldset>

<fieldset>
<button onclick="exportarHistoricoPDF()">Exportar relatório histórico SDL (PDF)</button>
<div id="saidaHistoricoPDF" class="certificado"></div>
</fieldset>

</div>
</div>

<script>

function abrirSistema(){
document.getElementById("sistema").style.display="block";
}

function dataBrasil(){
return new Date().toLocaleString("pt-BR",{timeZone:"America/Sao_Paulo"});
}

function gerarRelatorioHistorico(){

var dados=JSON.parse(localStorage.getItem("relatorioMensalSDL")||"{}");

var totalPais={};

Object.keys(dados).forEach(mes=>{

Object.keys(dados[mes]).forEach(pais=>{

if(!totalPais[pais]) totalPais[pais]=0;

totalPais[pais]+=dados[mes][pais];

});

});

var paises=Object.keys(totalPais);

if(paises.length===0){

document.getElementById("saidaHistorico").innerText=
"RELATÓRIO HISTÓRICO SDL\n\nNenhum registro encontrado ainda.";

return;

}

var total=0;

var texto="RELATÓRIO HISTÓRICO EDITORIAL SDL\n";
texto+="Site das Letras Edições Literárias\n\n";
texto+="Período: desde o início do catálogo\n";
texto+="Horário oficial: Brasil\n\n";

paises.forEach(p=>{

texto+=p+" — "+totalPais[p]+" registros\n";

total+=totalPais[p];

});

texto+="\nTotal geral: "+total+" obras registradas";

document.getElementById("saidaHistorico").innerText=texto;

localStorage.setItem("relatorioHistoricoTextoAtual",texto);

}

function exportarHistoricoPDF(){

var texto=localStorage.getItem("relatorioHistoricoTextoAtual");

if(!texto){

alert("Gere o relatório histórico primeiro.");

return;

}

var janela=window.open("","_blank");

janela.document.write("<pre style='font-family:Arial;font-size:14px'>"+texto+"</pre>");

janela.document.close();

janela.print();

document.getElementById("saidaHistoricoPDF").innerText=
"Relatório histórico preparado para exportação.";

}

</script>

</body>
</html>
