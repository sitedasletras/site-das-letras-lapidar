<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=login.html">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lapidar — Entrada Oficial</title>
  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#f7f4ec;
      color:#2f2a24;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
      padding:24px;
    }

    .box{
      background:#fff;
      border:1px solid #e7decd;
      border-radius:16px;
      padding:28px;
      box-shadow:0 8px 22px rgba(0,0,0,0.08);
      max-width:560px;
      text-align:center;
    }

    h1{
      margin:0 0 12px 0;
      color:#4f3f25;
      font-size:28px;
    }

    p{
      margin:0 0 14px 0;
      line-height:1.5;
      color:#5f513d;
    }

    a{
      display:inline-block;
      margin-top:8px;
      padding:12px 18px;
      background:#2f5a57;
      color:#fff;
      text-decoration:none;
      border-radius:10px;
    }

    a:hover{
      background:#244745;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>Lapidar</h1>
    <p>Redirecionando para a entrada oficial do sistema.</p>
    <p>Se o redirecionamento não acontecer automaticamente, clique abaixo.</p>
    <a href="login.html">Abrir login</a>
  </div>

</body>
</html>
