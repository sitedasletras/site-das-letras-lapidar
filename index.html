<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lapidar — Sistema Editorial</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
background:#C9A873;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

/* cruz central */

.cruz{
position:absolute;
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
}

.cruz::before{
content:"";
position:absolute;
width:320px;
height:100%;
background:#E7D2A8;
}

.cruz::after{
content:"";
position:absolute;
width:100%;
height:320px;
background:#E7D2A8;
}

/* container central */

.container{
position:relative;
z-index:2;
text-align:center;
}

/* título */

.titulo{
font-size:42px;
font-weight:bold;
color:#3C2A18;
margin-bottom:10px;
}

/* selo */

.selo{
width:160px;
margin-bottom:20px;
}

/* painel login */

.login-box{

background:white;

padding:40px;

border-radius:18px;

box-shadow:0px 10px 35px rgba(0,0,0,0.25);

width:320px;

margin:auto;

}

/* campos */

input{

width:100%;

padding:12px;

margin-top:10px;

margin-bottom:15px;

border-radius:8px;

border:1px solid #ccc;

}

/* botões */

button{

width:100%;

padding:14px;

border:none;

border-radius:10px;

font-weight:bold;

cursor:pointer;

margin-top:10px;

}

.entrar{

background:#2ecc71;

color:white;

}

.entrar:hover{

background:#27ae60;

}

.sair{

background:#eee;

}

/* recuperar senha */

.recuperar{

font-size:13px;

margin-top:10px;

color:#444;

cursor:pointer;

}

.recuperar:hover{

text-decoration:underline;

}

</style>

</head>

<body>

<div class="cruz"></div>

<div class="container">

<div class="titulo">Lapidar</div>

<img src="file_000000000d8bc71f5b57491905e34ae99.jpg" class="selo">

<div class="login-box">

<input placeholder="Usuário">

<input placeholder="Senha" type="password">

<div class="recuperar">Recuperar senha</div>

<button class="entrar">Entrar no sistema</button>

<button class="sair">Sair geral</button>

</div>

</div>

</body>
</html>
