<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lapidar — Site das Letras</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0c0603;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
text-align:center;
max-width:600px;
width:90%;
}

.titulo{
font-size:48px;
font-weight:bold;
letter-spacing:3px;
}

.subtitulo{
margin-top:12px;
color:#ff7b2c;
font-size:20px;
line-height:1.6;
}

.info{
margin-top:30px;
color:#ffd2b3;
line-height:1.7;
}

.botao{
width:100%;
padding:20px;
margin-top:28px;
border:none;
border-radius:40px;
background:#ff5a00;
color:white;
font-size:20px;
font-weight:bold;
cursor:pointer;
}

.botao:hover{
background:#ff6f1a;
}

</style>

</head>

<body>

<div class="container">

<div class="titulo">

LAPIDAR

</div>

<div class="subtitulo">

Sistema editorial do Site das Letras

</div>

<div class="info">

Carregando ambiente seguro...

</div>

<button
class="botao"
onclick="entrarSistema()">

Entrar no ambiente editorial

</button>

</div>

<script>

function detectarIdiomaSistema(){

const idioma = navigator.language;

if(idioma.startsWith("pt")) return "pt";
if(idioma.startsWith("en")) return "en";
if(idioma.startsWith("es")) return "es";
if(idioma.startsWith("it")) return "it";
if(idioma.startsWith("fr")) return "fr";
if(idioma.startsWith("de")) return "de";

return "pt";

}

function verificarSessao(){

const sessao =
localStorage.getItem("SDL_sessao_ativa");

if(sessao === "sim"){

window.location.href = "_Indice.html";

}

}

function entrarSistema(){

localStorage.setItem(
"SDL_idioma_interface",
detectarIdiomaSistema()
);

window.location.href =
"login.html";

}

verificarSessao();

</script>

</body>

</html>
