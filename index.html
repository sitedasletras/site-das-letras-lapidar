<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lapidar — Site das Letras — V19</title>

<style>
body{margin:0;font-family:Arial;background:#f4f4f4;text-align:center;padding:50px 20px;}
.container{max-width:980px;margin:auto;background:white;padding:40px;border-radius:18px;box-shadow:0 6px 18px rgba(0,0,0,0.08);}
button{margin-top:20px;padding:14px 22px;font-size:17px;border:none;border-radius:10px;background:#222;color:white;cursor:pointer;}
button:hover{background:#444;}
.modulo{display:none;text-align:left;margin-top:10px;}
fieldset{border:1px solid #ddd;border-radius:12px;padding:20px;margin-top:20px;}
.certificado{margin-top:15px;background:#fff;border:2px solid #bbb;border-radius:12px;padding:24px;white-space:pre-line;text-align:center;}
</style>
</head>

<body>

<div class="container">

<h1>Site das Letras<br>Lapidar V19</h1>

<button onclick="abrirSistema()">Entrar</button>

<div id="sistema" class="modulo">

<fieldset>
<button onclick="gerarRelatorioMensal()">Gerar relatório mensal por país</button>
<div id="saidaRelatorio" class="certificado"></div>
</fieldset>

<fieldset>
<button onclick="exportarRelatorioPDF()">Exportar relatório mensal SDL (PDF)</button>
<div id="saidaPDF" class="certificado"></div>
</fieldset>

</div>
</div>

<script>

function abrirSistema(){
document.getElementById("sistema").style.display="block";
}

function dataBrasil(){
return new Date().toLocaleString("pt-BR",{timeZone:"America/Sao_Paulo"});
}

function componentesBrasil(){
var agora=new Date();
var formatter=new Intl.DateTimeFormat("en-CA",{
timeZone:"America/Sao_Paulo",
year:"numeric",
month:"2-digit"
});
var parts=formatter.formatToParts(agora);
var map={};
parts.forEach(p=>map[p.type]=p.value);
return map;
}

function gerarRelatorioMensal(){

var comp=componentesBrasil();
var chave=comp.year+"-"+comp.month;

var dados=JSON.parse(localStorage.getItem("relatorioMensalSDL")||"{}");
var mesAtual=dados[chave]||{};

var paises=Object.keys(mesAtual);

if(paises.length===0){
document.getElementById("saidaRelatorio").innerText=
"RELATÓRIO MENSAL SDL\n\nNenhum registro neste mês.";
return;
}

var total=0;
var texto="RELATÓRIO MENSAL SDL\n";
texto+="Site das Letras Edições Literárias\n\n";
texto+="Período: "+comp.month+"/"+comp.year+"\n";
texto+="Horário oficial: Brasil\n\n";

paises.forEach(p=>{
texto+=p+" — "+mesAtual[p]+" registros\n";
total+=mesAtual[p];
});

texto+="\nTotal: "+total+" obras";

document.getElementById("saidaRelatorio").innerText=texto;
localStorage.setItem("relatorioTextoAtual",texto);

}

function exportarRelatorioPDF(){

var texto=localStorage.getItem("relatorioTextoAtual");

if(!texto){
alert("Gere o relatório primeiro.");
return;
}

var janela=window.open("","_blank");
janela.document.write("<pre style='font-family:Arial;font-size:14px'>"+texto+"</pre>");
janela.document.close();
janela.print();

document.getElementById("saidaPDF").innerText=
"Relatório mensal institucional preparado para exportação.";

}

</script>

</body>
</html>
