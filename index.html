<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lapidar — Acesso</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
height:100vh;
font-family:Arial,sans-serif;

background-image:url("pergaminho.jpg");
background-size:cover;
background-position:center;
background-repeat:no-repeat;

display:flex;
align-items:center;
justify-content:center;
}

.overlay{
position:absolute;
top:0;
left:0;
right:0;
bottom:0;
background:rgba(0,0,0,0.45);
}

.login-card{

position:relative;

background:white;

padding:42px;

width:360px;

border-radius:18px;

box-shadow:0 30px 60px rgba(0,0,0,0.5);

z-index:2;

}

.logo{

font-size:28px;

font-weight:bold;

text-align:center;

margin-bottom:26px;

color:#0c2e24;

}

label{

display:block;

margin-bottom:6px;

font-weight:bold;

color:#1c3e32;

}

input{

width:100%;

padding:14px;

border-radius:10px;

border:1px solid #ddd;

margin-bottom:16px;

font-size:15px;

}

select{

width:100%;

padding:14px;

border-radius:10px;

border:1px solid #ddd;

margin-bottom:20px;

font-size:15px;

}

button{

width:100%;

padding:14px;

border:none;

border-radius:12px;

font-size:15px;

font-weight:bold;

cursor:pointer;

margin-bottom:10px;

}

.btn-login{

background:#2ecc71;

color:#062414;

}

.btn-login:hover{

background:#28b765;

}

.btn-sair{

background:#eef6f2;

color:#0f2d25;

}

.btn-sair:hover{

background:#dcefe6;

}

.footer{

margin-top:10px;

font-size:12px;

text-align:center;

color:#667d74;

}

.status{

display:none;

margin-top:12px;

padding:10px;

border-radius:10px;

font-size:13px;

}

.ok{

background:#e9fff3;

color:#0e3a2a;

}

.erro{

background:#ffecec;

color:#6b1c1c;

}

</style>
</head>

<body>

<div class="overlay"></div>

<div class="login-card">

<div class="logo">

Lapidar

</div>


<label>Usuário</label>

<input id="usuario" placeholder="Digite o nome do usuário">


<label>Perfil de acesso</label>

<select id="perfil">

<option value="admin">

Administrador

</option>

<option value="veterano">

Veterano

</option>

<option value="cortesia">

Cortesia

</option>

</select>


<button class="btn-login" onclick="entrar()">

Entrar no sistema

</button>


<button class="btn-sair" onclick="sair()">

Sair geral

</button>


<div id="statusBox" class="status"></div>


<div class="footer">

Sistema editorial Lapidar

</div>

</div>



<script>


function entrar(){

let usuario=document.getElementById("usuario").value.trim();

let perfil=document.getElementById("perfil").value;


if(!usuario){

erro("Informe o nome do usuário.");

return;

}


let sessao={

usuario:usuario,

perfil:perfil,

loginEm:new Date().toISOString()

};


localStorage.setItem(

"sessao_lapidar",

JSON.stringify(sessao)

);


ok("Sessão iniciada com sucesso.");


setTimeout(()=>{

window.location.href="producao_integrada.html";

},600);

}



function sair(){

localStorage.removeItem("sessao_lapidar");

localStorage.removeItem("projeto_lapidar");

ok("Sessão encerrada.");

}



function ok(msg){

let box=document.getElementById("statusBox");

box.className="status ok";

box.style.display="block";

box.innerText=msg;

}



function erro(msg){

let box=document.getElementById("statusBox");

box.className="status erro";

box.style.display="block";

box.innerText=msg;

}


</script>

</body>
</html>
