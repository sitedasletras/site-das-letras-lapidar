<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lapidação Literária — Lapidar</title>

<style>

body{
margin:0;
font-family:Arial;
background:linear-gradient(180deg,#103126,#051811);
color:white;
}

.container{
max-width:980px;
margin:auto;
padding:24px;
}

.card{
background:rgba(255,255,255,.07);
border-radius:18px;
padding:22px;
margin-bottom:20px;
}

h1,h2{
margin-top:0;
}

.info{
margin-bottom:12px;
padding:12px;
border-radius:12px;
background:rgba(255,255,255,.05);
}

textarea{
width:100%;
min-height:220px;
border:none;
border-radius:14px;
padding:16px;
font-size:15px;
background:#f4fff8;
color:#113322;
}

button{
border:none;
border-radius:12px;
padding:14px 18px;
font-size:15px;
font-weight:bold;
cursor:pointer;
margin-top:12px;
}

.btn{
background:#2ecc71;
color:#062414;
}

.btn2{
background:#dcefe4;
color:#103222;
}

.status{
display:none;
margin-top:16px;
padding:14px;
border-radius:12px;
background:rgba(46,204,113,.14);
}

</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>Lapidação Literária</h1>

<p>
Registre aqui o refinamento textual da obra.
Ao concluir esta etapa o sistema libera o pagamento.
</p>

</div>


<div class="card">

<h2>Dados do projeto</h2>

<div class="info">
<strong>Título:</strong>
<span id="titulo"></span>
</div>

<div class="info">
<strong>Autor:</strong>
<span id="autor"></span>
</div>

<div class="info">
<strong>Status:</strong>
<span id="status"></span>
</div>

</div>


<div class="card">

<h2>Observações editoriais</h2>

<textarea
id="texto"
placeholder="Observações de lapidação, ajustes narrativos, fluidez, diálogos, ritmo etc."
></textarea>


<br>

<button class="btn"
onclick="executarLapidacao()">

Concluir Lapidação

</button>


<button class="btn2"
onclick="salvarRascunho()">

Salvar rascunho

</button>


<button class="btn2"
onclick="voltarPainel()">

Voltar ao painel

</button>


<div
class="status"
id="mensagem">
</div>

</div>

</div>


<script>

function obterProjeto(){

return JSON.parse(
localStorage.getItem("projeto_lapidar")
);

}


function salvarProjeto(p){

p.ultimaAtualizacao=
new Date().toISOString();

localStorage.setItem(
"projeto_lapidar",
JSON.stringify(p)
);


let historico=
JSON.parse(
localStorage.getItem("historico_lapidar")
|| "[]"
);


historico=
historico.map(x=>x.id===p.id?p:x);


localStorage.setItem(
"historico_lapidar",
JSON.stringify(historico)
);

}


function mostrar(msg){

let box=document.getElementById("mensagem");

box.style.display="block";

box.innerText=msg;

}


function carregar(){

let projeto=obterProjeto();

if(!projeto){

window.location.href=
"producao_integrada.html";

return;

}


document.getElementById("titulo").innerText=
projeto.titulo;

document.getElementById("autor").innerText=
projeto.autor;


document.getElementById("status").innerText=

projeto.lapidacaoExecutada
? "Concluída"
: "Pendente";


if(projeto.textoLapidado){

document.getElementById("texto").value=
projeto.textoLapidado;

}

}


function salvarRascunho(){

let projeto=obterProjeto();

projeto.textoLapidado=

document.getElementById("texto").value;


salvarProjeto(projeto);

mostrar("Rascunho salvo.");

}


function executarLapidacao(){

let projeto=obterProjeto();

projeto.textoLapidado=

document.getElementById("texto").value;


projeto.lapidacaoExecutada=true;

projeto.dataLapidacao=
new Date().toISOString();


salvarProjeto(projeto);

mostrar("Lapidação concluída.");

setTimeout(()=>{

window.location.href=
"painel_projeto.html";

},600);

}


function voltarPainel(){

window.location.href=
"painel_projeto.html";

}


carregar();

</script>


<script src="session_guard.js"></script>

</body>
</html>
