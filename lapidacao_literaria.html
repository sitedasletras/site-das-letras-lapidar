<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lapidação Literária • Lapidar</title>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#1b0d14;
      color:#fff;
    }

    header{
      background:#6f2342;
      padding:20px 16px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    header h1{
      margin:0;
      font-size:22px;
    }

    header a{
      background:#8a97a8;
      color:#fff;
      text-decoration:none;
      padding:10px 14px;
      border-radius:10px;
      font-weight:bold;
      font-size:14px;
    }

    .container{
      max-width:1000px;
      margin:0 auto;
      padding:20px 14px 40px;
    }

    .card{
      background:#2a111c;
      border-radius:18px;
      padding:18px;
      margin-bottom:18px;
      box-shadow:0 4px 14px rgba(0,0,0,.22);
    }

    .card h2{
      margin-top:0;
      font-size:19px;
    }

    .subcard{
      background:#3a1726;
      border-radius:12px;
      padding:14px;
      margin-top:10px;
      line-height:1.6;
      color:#f7dfe8;
      white-space:pre-line;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(260px, 1fr));
      gap:14px;
    }

    label{
      display:block;
      font-weight:bold;
      margin:14px 0 8px;
      color:#ffe7ef;
      font-size:16px;
    }

    input[type="text"],
    select,
    textarea{
      width:100%;
      padding:12px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,.10);
      background:#4a1d31;
      color:#fff;
      margin-bottom:10px;
      font-size:16px;
      font-family:Arial, sans-serif;
    }

    textarea{
      min-height:130px;
      resize:vertical;
    }

    .acoes{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      margin-top:18px;
    }

    button{
      border:none;
      border-radius:12px;
      padding:14px 18px;
      font-size:15px;
      font-weight:bold;
      cursor:pointer;
    }

    .btn-azul{
      background:#365a9c;
      color:#fff;
    }

    .btn-dourado{
      background:#b8943c;
      color:#fff;
    }

    .btn-verde{
      background:#2e7d32;
      color:#fff;
    }

    .btn-cinza{
      background:#8a97a8;
      color:#fff;
    }

    .check-item{
      display:flex;
      align-items:center;
      gap:12px;
      background:#341421;
      padding:14px;
      border-radius:12px;
      margin-bottom:12px;
      font-size:18px;
      font-weight:700;
      cursor:pointer;
    }

    .check-item input{
      width:24px;
      height:24px;
      margin:0;
      flex:0 0 24px;
    }

    .status{
      margin-top:16px;
      background:#3a1726;
      border-radius:12px;
      padding:14px;
      line-height:1.7;
      color:#ffe8f0;
      white-space:pre-line;
      font-size:16px;
    }

    @media(max-width:640px){
      header h1{
        font-size:20px;
      }

      .check-item{
        font-size:17px;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Lapidação Literária</h1>
    <a href="index.html">Voltar</a>
  </header>

  <div class="container">

    <div class="card">
      <h2>Projeto ativo</h2>
      <div class="subcard" id="projetoAtivoBox">Carregando projeto...</div>
    </div>

    <div class="card">
      <h2>Configuração da lapidação</h2>

      <div class="grid">
        <div>
          <label for="nivelLapidacao">Nível da lapidação</label>
          <select id="nivelLapidacao">
            <option value="Essencial">Essencial</option>
            <option value="Intermediário">Intermediário</option>
            <option value="Premium">Premium</option>
          </select>
        </div>

        <div>
          <label for="focoLapidacao">Foco principal</label>
          <select id="focoLapidacao">
            <option value="Clareza textual">Clareza textual</option>
            <option value="Ritmo narrativo">Ritmo narrativo</option>
            <option value="Diálogos">Diálogos</option>
            <option value="Coerência estrutural">Coerência estrutural</option>
            <option value="Humanização geral">Humanização geral</option>
          </select>
        </div>
      </div>

      <div class="grid">
        <div>
          <label for="preservarEstilo">Preservar estilo autoral?</label>
          <select id="preservarEstilo">
            <option value="Sim">Sim</option>
            <option value="Não">Não</option>
          </select>
        </div>

        <div>
          <label for="humanizacaoCompleta">Humanização completa?</label>
          <select id="humanizacaoCompleta">
            <option value="Sim">Sim</option>
            <option value="Não">Não</option>
          </select>
        </div>
      </div>

      <label for="observacoesLapidacao">Observações gerais da lapidação</label>
      <textarea id="observacoesLapidacao" placeholder="Ex.: eliminar ruídos, evitar microfrases, reforçar diálogos, preservar tom do autor, etc."></textarea>

      <div class="acoes">
        <button class="btn-azul" type="button" onclick="salvarConfiguracaoLapidacao()">Salvar configuração da lapidação</button>
      </div>

      <div class="status" id="statusConfiguracaoLapidacao">Configuração da lapidação ainda não registrada.</div>
    </div>

    <div class="card">
      <h2>Texto-base da lapidação</h2>

      <label for="textoLapidacao">Texto para lapidar</label>
      <textarea id="textoLapidacao" placeholder="Cole ou revise aqui o texto-base que seguirá para a lapidação."></textarea>

      <div class="acoes">
        <button class="btn-azul" type="button" onclick="puxarTextoDaObra()">Puxar texto da obra já lida</button>
        <button class="btn-dourado" type="button" onclick="salvarTextoLapidado()">Salvar texto lapidado</button>
      </div>

      <div class="status" id="statusTextoLapidacao">Nenhum texto salvo ainda.</div>
    </div>

    <div class="card">
      <h2>Checklist editorial</h2>

      <label class="check-item">
        <input type="checkbox" id="checkDialogos">
        <span>Revisão de diálogos aplicada</span>
      </label>

      <label class="check-item">
        <input type="checkbox" id="checkCoerencia">
        <span>Coerência narrativa verificada</span>
      </label>

      <label class="check-item">
        <input type="checkbox" id="checkRitmo">
        <span>Ritmo textual ajustado</span>
      </label>

      <label class="check-item">
        <input type="checkbox" id="checkEstilo">
        <span>Estilo autoral preservado</span>
      </label>

      <label class="check-item">
        <input type="checkbox" id="checkHumanizacao">
        <span>Humanização completa aplicada</span>
      </label>

      <div class="acoes">
        <button class="btn-dourado" type="button" onclick="salvarChecklistEditorial()">Salvar checklist editorial</button>
      </div>

      <div class="status" id="statusChecklist">Checklist ainda não registrado.</div>
    </div>

    <div class="card">
      <h2>Confirmação</h2>
      <div class="subcard" id="confirmacaoLapidacao">
        Lapidação ainda não confirmada.
      </div>

      <div class="acoes">
        <button class="btn-verde" type="button" onclick="confirmarLapidacaoESeguir()">Concordo com esta lapidação e quero seguir</button>
        <button class="btn-cinza" type="button" onclick="irParaExpedicao()">Pular para expedição</button>
      </div>
    </div>

  </div>

  <script>
    function obterProjetoAtivo(){
      try{
        return JSON.parse(localStorage.getItem("projetoAtivo") || "{}");
      }catch(e){
        return {};
      }
    }

    function obterModulosSelecionados(){
      try{
        return JSON.parse(localStorage.getItem("lapidar_modulos_marcados") || "{}");
      }catch(e){
        return {};
      }
    }

    function renderProjetoAtivo(){
      var projeto = obterProjetoAtivo();
      var titulo = projeto.titulo || localStorage.getItem("lapidar_projeto_ativo") || "Obra não identificada";
      var autor = projeto.autor || localStorage.getItem("lapidar_obra_autor") || "Autor não identificado";
      var arquivo = projeto.arquivo || localStorage.getItem("lapidar_obra_arquivo_nome") || "";

      var texto = titulo + "\n";
      texto += "Autor: " + autor + "\n";
      if(arquivo){
        texto += "Arquivo: " + arquivo + "\n";
      }
      texto += "Preparando a lapidação literária desta obra.";

      document.getElementById("projetoAtivoBox").innerText = texto;
    }

    function salvarConfiguracaoLapidacao(){
      var config = {
        nivel: document.getElementById("nivelLapidacao").value,
        foco: document.getElementById("focoLapidacao").value,
        preservarEstilo: document.getElementById("preservarEstilo").value,
        humanizacaoCompleta: document.getElementById("humanizacaoCompleta").value,
        observacoes: document.getElementById("observacoesLapidacao").value
      };

      sessionStorage.setItem("lapidacao_config_atual", JSON.stringify(config));

      document.getElementById("statusConfiguracaoLapidacao").innerText =
        "Configuração da lapidação salva com sucesso.\n" +
        "Nível: " + config.nivel + "\n" +
        "Foco: " + config.foco;

      atualizarConfirmacao();
    }

    function puxarTextoDaObra(){
      var texto = localStorage.getItem("lapidar_obra_texto") || "";
      if(!texto.trim()){
        document.getElementById("statusTextoLapidacao").innerText =
          "Nenhum texto original encontrado.";
        return;
      }

      document.getElementById("textoLapidacao").value = texto;
      document.getElementById("statusTextoLapidacao").innerText =
        "Texto-base da obra puxado com sucesso.\n" +
        "Conteúdo pronto para lapidação.";
    }

    function salvarTextoLapidado(){
      var texto = document.getElementById("textoLapidacao").value.trim();

      if(!texto){
        document.getElementById("statusTextoLapidacao").innerText =
          "Nenhum texto para salvar.";
        return;
      }

      localStorage.setItem("lapidar_texto_lapidado", texto);

      document.getElementById("statusTextoLapidacao").innerText =
        "Texto lapidado salvo com sucesso.\n" +
        "Conteúdo registrado para o restante do fluxo.";
    }

    function salvarChecklistEditorial(){
      var checklist = {
        dialogos: document.getElementById("checkDialogos").checked,
        coerencia: document.getElementById("checkCoerencia").checked,
        ritmo: document.getElementById("checkRitmo").checked,
        estilo: document.getElementById("checkEstilo").checked,
        humanizacao: document.getElementById("checkHumanizacao").checked
      };

      sessionStorage.setItem("lapidacao_checklist", JSON.stringify(checklist));

      var itensMarcados = [];
      if(checklist.dialogos) itensMarcados.push("Revisão de diálogos aplicada");
      if(checklist.coerencia) itensMarcados.push("Coerência narrativa verificada");
      if(checklist.ritmo) itensMarcados.push("Ritmo textual ajustado");
      if(checklist.estilo) itensMarcados.push("Estilo autoral preservado");
      if(checklist.humanizacao) itensMarcados.push("Humanização completa aplicada");

      document.getElementById("statusChecklist").innerText =
        itensMarcados.length > 0
          ? "Checklist editorial salvo.\n" + itensMarcados.join("\n")
          : "Checklist salvo sem itens marcados.";

      atualizarConfirmacao();
    }

    function atualizarConfirmacao(){
      var config = {};
      var checklist = {};

      try{
        config = JSON.parse(sessionStorage.getItem("lapidacao_config_atual") || "{}");
      }catch(e){}

      try{
        checklist = JSON.parse(sessionStorage.getItem("lapidacao_checklist") || "{}");
      }catch(e){}

      document.getElementById("confirmacaoLapidacao").innerText =
        "Lapidação configurada.\n" +
        "Nível: " + (config.nivel || "não definido") + "\n" +
        "Foco: " + (config.foco || "não definido") + "\n" +
        "Preservar estilo: " + (config.preservarEstilo || "não definido") + "\n" +
        "Humanização completa: " + (config.humanizacaoCompleta || "não definido") + "\n" +
        "Checklist salvo: " + (Object.keys(checklist).length ? "Sim" : "Não");
    }

    function obterProximoDestinoDepoisDaLapidacao(){
      var modulos = obterModulosSelecionados();

      if(modulos.siloSonoro) return "narracao_editorial.html";

      return "expedicao_material.html";
    }

    function confirmarLapidacaoESeguir(){
      if(!sessionStorage.getItem("lapidacao_config_atual")){
        salvarConfiguracaoLapidacao();
      }

      atualizarConfirmacao();

      var destino = obterProximoDestinoDepoisDaLapidacao();

      document.getElementById("confirmacaoLapidacao").innerText +=
        "\nEncaminhando para: " + destino;

      setTimeout(function(){
        window.location.href = destino;
      }, 500);
    }

    function irParaExpedicao(){
      window.location.href = "expedicao_material.html";
    }

    function restaurarDadosSalvos(){
      try{
        var config = JSON.parse(sessionStorage.getItem("lapidacao_config_atual") || "null");
        if(config){
          if(config.nivel) document.getElementById("nivelLapidacao").value = config.nivel;
          if(config.foco) document.getElementById("focoLapidacao").value = config.foco;
          if(config.preservarEstilo) document.getElementById("preservarEstilo").value = config.preservarEstilo;
          if(config.humanizacaoCompleta) document.getElementById("humanizacaoCompleta").value = config.humanizacaoCompleta;
          if(config.observacoes) document.getElementById("observacoesLapidacao").value = config.observacoes;
          document.getElementById("statusConfiguracaoLapidacao").innerText =
            "Configuração da lapidação salva com sucesso.\n" +
            "Nível: " + config.nivel + "\n" +
            "Foco: " + config.foco;
        }
      }catch(e){}

      try{
        var texto = localStorage.getItem("lapidar_texto_lapidado") || "";
        if(texto){
          document.getElementById("textoLapidacao").value = texto;
          document.getElementById("statusTextoLapidacao").innerText =
            "Texto lapidado já salvo anteriormente.\n" +
            "Conteúdo restaurado nesta tela.";
        }
      }catch(e){}

      try{
        var checklist = JSON.parse(sessionStorage.getItem("lapidacao_checklist") || "null");
        if(checklist){
          document.getElementById("checkDialogos").checked = !!checklist.dialogos;
          document.getElementById("checkCoerencia").checked = !!checklist.coerencia;
          document.getElementById("checkRitmo").checked = !!checklist.ritmo;
          document.getElementById("checkEstilo").checked = !!checklist.estilo;
          document.getElementById("checkHumanizacao").checked = !!checklist.humanizacao;

          var itensMarcados = [];
          if(checklist.dialogos) itensMarcados.push("Revisão de diálogos aplicada");
          if(checklist.coerencia) itensMarcados.push("Coerência narrativa verificada");
          if(checklist.ritmo) itensMarcados.push("Ritmo textual ajustado");
          if(checklist.estilo) itensMarcados.push("Estilo autoral preservado");
          if(checklist.humanizacao) itensMarcados.push("Humanização completa aplicada");

          document.getElementById("statusChecklist").innerText =
            itensMarcados.length > 0
              ? "Checklist editorial salvo.\n" + itensMarcados.join("\n")
              : "Checklist salvo sem itens marcados.";
        }
      }catch(e){}

      atualizarConfirmacao();
    }

    window.addEventListener("load", function(){
      renderProjetoAtivo();
      restaurarDadosSalvos();
    });
  </script>

</body>
</html>
