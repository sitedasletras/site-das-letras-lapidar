<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Leitura Técnica Editorial — Lapidar</title>

<style>

body{
margin:0;
background:#0c0603;
font-family:Arial;
color:white;
display:flex;
justify-content:center;
}

.container{
max-width:720px;
width:92%;
padding:40px 0 60px 0;
}

.titulo{
font-size:34px;
text-align:center;
font-weight:bold;
}

.subtitulo{
text-align:center;
color:#ff7b2c;
margin-top:10px;
margin-bottom:28px;
line-height:1.6;
}

.card{
background:#140c08;
border-radius:14px;
padding:26px;
margin-top:20px;
}

label{
display:block;
margin-top:16px;
color:#ffd2b3;
}

input, select{
width:100%;
padding:12px;
margin-top:6px;
border-radius:8px;
border:none;
}

.botao{
width:100%;
padding:18px;
margin-top:24px;
border:none;
border-radius:40px;
background:#ff5a00;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.info{
margin-top:12px;
font-size:14px;
color:#ffcfaa;
line-height:1.6;
}

</style>

</head>

<body>

<div class="container">

<div class="titulo">
Leitura Técnica Editorial
</div>

<div class="subtitulo">
Lapidar — Site das Letras
</div>

<div class="card">

<label>
Título da obra
</label>

<input id="tituloObra">

<label>
Autor da obra
</label>

<input id="autorObra">

<label>
Tipo de obra
</label>

<select id="tipoObra">

<option>Romance</option>
<option>Contos</option>
<option>Poesia</option>
<option>Infantil</option>
<option>Infantojuvenil</option>
<option>Acadêmico</option>
<option>Outro</option>

</select>

<label>
Idioma da obra
</label>

<select id="idiomaObra">

<option value="pt">Português</option>
<option value="en">English</option>
<option value="es">Español</option>
<option value="it">Italiano</option>
<option value="fr">Français</option>
<option value="de">Deutsch</option>

</select>

<div class="info">
A leitura técnica editorial oferece análise estrutural, narrativa, mercado e posicionamento da obra.
</div>

<div class="info">
Valor simbólico editorial: R$ 4,99
</div>

<button class="botao"
onclick="registrarLeituraTecnica()">

Solicitar leitura técnica editorial

</button>

<button class="botao"
onclick="window.location.href='_Indice.html'">

Voltar para casa do original

</button>

</div>

</div>

<script>

function registrarLeituraTecnica(){

const titulo =
document.getElementById("tituloObra").value;

const autor =
document.getElementById("autorObra").value;

const tipo =
document.getElementById("tipoObra").value;

const idioma =
document.getElementById("idiomaObra").value;

if(!titulo || !autor){

alert("Informe título e autor da obra.");

return;

}

localStorage.setItem("LTE_titulo", titulo);

localStorage.setItem("LTE_autor", autor);

localStorage.setItem("LTE_tipo", tipo);

localStorage.setItem("LTE_idioma", idioma);

localStorage.setItem("LTE_status", "solicitada");

alert("Leitura técnica editorial registrada.");

window.location.href = "relatorio_leitura_tecnica.html";

}

</script>

</body>

</html>
