<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leitura Técnica Editorial — Lapidar</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:#0d0603;
color:white;
display:flex;
justify-content:center;
}

.container{
max-width:760px;
width:92%;
padding:40px 0 60px 0;
}

.titulo{
font-size:36px;
text-align:center;
font-weight:bold;
}

.subtitulo{
text-align:center;
color:#ff7b2c;
margin-top:10px;
margin-bottom:28px;
line-height:1.6;
}

.card{
background:#140c08;
border-radius:14px;
padding:24px;
margin-top:18px;
line-height:1.7;
}

label{
display:block;
margin-top:16px;
margin-bottom:6px;
font-weight:bold;
color:#ffd2b3;
}

input, select, textarea{
width:100%;
padding:12px;
border-radius:10px;
border:none;
box-sizing:border-box;
font-size:15px;
}

textarea{
min-height:120px;
resize:vertical;
}

.botao{
width:100%;
padding:18px;
border:none;
border-radius:40px;
background:#ff5a00;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
margin-top:18px;
}

.botao:hover{
background:#ff6f1a;
}

.botaoCinza{
background:#444;
}

.botaoCinza:hover{
background:#666;
}

.info{
color:#ffd2b3;
line-height:1.7;
margin-top:12px;
}

.status{
margin-top:16px;
font-weight:bold;
color:#9cffb2;
line-height:1.6;
}

.alerta{
margin-top:16px;
color:#ffcfaa;
line-height:1.7;
}

.grade{
display:grid;
grid-template-columns:1fr 1fr;
gap:16px;
}

@media (max-width:680px){
.grade{
grid-template-columns:1fr;
}
}
</style>

</head>
<body>

<div class="container">

<div class="titulo">
Leitura Técnica Editorial
</div>

<div class="subtitulo">
Avaliação estrutural da sua obra pelo sistema Lapidar
</div>

<div class="card">

<div class="grade">

<div>
<label for="tipoPlano">Tipo de avaliação</label>
<select id="tipoPlano" onchange="atualizarTextoPlano()">
<option value="avulso">Avaliação única — R$ 4,99 / $ 4.99</option>
<option value="mensal">Plano Oficina Editorial Lapidar — 40 avaliações mensais — R$ 70 / $ 70</option>
</select>
</div>

<div>
<label for="idiomaObra">Idioma da obra</label>
<select id="idiomaObra">
<option value="pt">Português</option>
<option value="en">English</option>
<option value="es">Español</option>
<option value="it">Italiano</option>
<option value="fr">Français</option>
<option value="de">Deutsch</option>
</select>
</div>

</div>

<label for="tituloObra">Título da obra</label>
<input type="text" id="tituloObra" placeholder="Digite o título da obra">

<label for="autorObra">Nome do autor</label>
<input type="text" id="autorObra" placeholder="Digite o nome do autor">

<label for="tipoObra">Tipo de obra</label>
<select id="tipoObra">
<option value="Romance">Romance</option>
<option value="Contos">Contos</option>
<option value="Poesia">Poesia</option>
<option value="Infantil">Infantil</option>
<option value="Infantojuvenil">Infantojuvenil</option>
