<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Lapidar</title>

  <style>
    *{box-sizing:border-box;}

    body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      background:linear-gradient(180deg, #020617 0%, #0f172a 100%);
      color:#ffffff;
      min-height:100vh;
      padding:24px;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .container{
      width:100%;
      max-width:520px;
      background:#0f172a;
      border:1px solid rgba(255,255,255,0.08);
      border-radius:24px;
      padding:32px 24px;
      box-shadow:0 20px 50px rgba(0,0,0,.5);
      text-align:center;
    }

    .logo{
      width:145px;
      max-width:50vw;
      height:auto;
      display:block;
      margin:0 auto 18px auto;
      border-radius:18px;
      box-shadow:0 10px 28px rgba(0,0,0,.35);
    }

    h2{
      margin:0 0 10px 0;
      font-size:28px;
    }

    .subtitulo{
      font-size:14px;
      opacity:.82;
      line-height:1.5;
      margin-bottom:24px;
    }

    .campo{
      text-align:left;
      margin-bottom:14px;
    }

    .campo label{
      display:block;
      margin-bottom:7px;
      font-size:13px;
      opacity:.82;
    }

    .campo input,
    .campo select{
      width:100%;
      padding:14px;
      border:none;
      border-radius:14px;
      background:#1e293b;
      color:#fff;
      font-size:15px;
      outline:none;
      font-family:Arial, Helvetica, sans-serif;
    }

    .info{
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:14px;
      padding:14px;
      font-size:14px;
      line-height:1.5;
      text-align:left;
      margin:14px 0 4px 0;
      opacity:.92;
    }

    .acoes{
      display:grid;
      gap:12px;
      margin-top:18px;
    }

    .botao{
      width:100%;
      padding:15px;
      border:none;
      border-radius:14px;
      font-size:15px;
      font-weight:bold;
      cursor:pointer;
      transition:.2s ease;
      color:#fff;
      background:#7c3aed;
    }

    .botao:hover{
      transform:translateY(-1px);
      background:#6d28d9;
    }

    .botao.secundario{
      background:#334155;
    }

    .botao.secundario:hover{
      background:#475569;
    }

    .footer{
      margin-top:20px;
      font-size:12px;
      opacity:.55;
      line-height:1.5;
    }

    .hidden{display:none;}
  </style>
</head>
<body>
  <div class="container">
    <img src="file_00000000760c720ebb734bb5e71340bb.png" alt="Site das Letras Edições Literárias" class="logo">

    <h2>Acesso ao Lapidar</h2>

    <div class="subtitulo">
      Ambiente editorial protegido<br>
      Site das Letras Edições Literárias
    </div>

    <div class="campo">
      <label for="nome">Nome de acesso</label>
      <input type="text" id="nome" placeholder="Digite seu nome de acesso">
    </div>

    <div class="campo">
      <label for="senha">Senha</label>
      <input type="password" id="senha" placeholder="Digite sua senha">
    </div>

    <div class="campo">
      <label for="perfil">Perfil</label>
      <select id="perfil" onchange="atualizarDescricaoPerfil()">
        <option value="admin">Admin</option>
        <option value="heteronimo">Heterônimo</option>
        <option value="autor">Autor</option>
        <option value="usuario">Usuário</option>
        <option value="visitante">Visitante</option>
        <option value="cortesia_quimera">Cortesia da Quimera</option>
        <option value="cortesia_valletibooks">Cortesia da ValletiBooks</option>
        <option value="cortesia_acl">Cortesia ACL</option>
        <option value="cortesia_andre_instituicao">Cortesia André Instituição</option>
        <option value="cortesia_estilo_poesia">Cortesia Estilo e Poesia</option>
        <option value="licenca_solidaria">Licença Solidária</option>
      </select>
    </div>

    <div class="campo hidden" id="slotSolidariaBox">
      <label for="slotSolidaria">Número da Licença Solidária</label>
      <select id="slotSolidaria">
        <option value="0001">Licença Solidária 0001</option>
        <option value="0002">Licença Solidária 0002</option>
        <option value="0003">Licença Solidária 0003</option>
        <option value="0004">Licença Solidária 0004</option>
        <option value="0005">Licença Solidária 0005</option>
        <option value="0006">Licença Solidária 0006</option>
        <option value="0007">Licença Solidária 0007</option>
        <option value="0008">Licença Solidária 0008</option>
        <option value="0009">Licença Solidária 0009</option>
        <option value="0010">Licença Solidária 0010</option>
      </select>
    </div>

    <div id="descricaoPerfil" class="info">
      Perfil administrativo com acesso estrutural total.
    </div>

    <div class="acoes">
      <button class="botao" onclick="entrarSistema()">Entrar</button>
      <button class="botao secundario" onclick="voltarInicio()">Voltar ao início</button>
    </div>

    <div class="footer">
      Admin oficial: admin@sitedasletras.com
    </div>
  </div>

  <script>
    const ADMIN_OFICIAL = "admin@sitedasletras.com";
    const ACESSO_PRIMOS = [1, 3, 5, 7, 11, 13];

    function iniciarConfigs() {
      definirPadrao("cfg_quimera_ativa", true);
      definirPadrao("cfg_valleti_ativa", true);

      definirPadrao("cfg_acl_ativa", true);
      definirPadrao("cfg_andre_ativa", true);
      definirPadrao("cfg_estilo_ativa", true);

      definirPadrao("cfg_acl_inicio", "");
      definirPadrao("cfg_andre_inicio", "");
      definirPadrao("cfg_estilo_inicio", "");

      for (let i = 1; i <= 10; i++) {
        const id = String(i).padStart(4, "0");
        definirPadrao(`solidaria_${id}_ativa`, false);
        definirPadrao(`solidaria_${id}_beneficiado`, "");
        definirPadrao(`solidaria_${id}_instituicao`, "");
        definirPadrao(`solidaria_${id}_duracao`, "180");
        definirPadrao(`solidaria_${id}_observacao`, "");
        definirPadrao(`solidaria_${id}_setores`, JSON.stringify(ACESSO_PRIMOS));
      }
    }

    function definirPadrao(chave, valor) {
      if (localStorage.getItem(chave) === null) {
        localStorage.setItem(chave, typeof valor === "string" ? valor : JSON.stringify(valor));
      }
    }

    function pegarBool(chave) {
      return localStorage.getItem(chave) === "true";
    }

    function atualizarDescricaoPerfil() {
      const perfil = document.getElementById("perfil").value;
      const box = document.getElementById("descricaoPerfil");
      const slotBox = document.getElementById("slotSolidariaBox");

      slotBox.classList.add("hidden");

      const textos = {
        admin: "Perfil administrativo com acesso estrutural total.",
        heteronimo: "Perfil editorial ampliado, com circulação ampla e sem acesso a financeiro, auditoria e área administrativa.",
        autor: "Perfil de autor para fluxo editorial comum.",
        usuario: "Perfil de usuário para uso padrão do sistema.",
        visitante: "Perfil de visualização inicial da plataforma.",
        cortesia_quimera: "Cortesia permanente com acesso aos setores 1, 3, 5, 7, 11 e 13.",
        cortesia_valletibooks: "Cortesia permanente com acesso aos setores 1, 3, 5, 7, 11 e 13.",
        cortesia_acl: "Cortesia semestral de divulgação com acesso aos setores 1, 3, 5, 7, 11 e 13.",
        cortesia_andre_instituicao: "Cortesia semestral de divulgação com acesso aos setores 1, 3, 5, 7, 11 e 13.",
        cortesia_estilo_poesia: "Cortesia semestral de divulgação com acesso aos setores 1, 3, 5, 7, 11 e 13.",
        licenca_solidaria: "Acesso por slot de Licença Solidária configurado previamente."
      };

      if (perfil === "licenca_solidaria") {
        slotBox.classList.remove("hidden");
      }

      box.textContent = textos[perfil] || "Perfil não identificado.";
    }

    function semestralValida(chaveAtiva, chaveInicio) {
      if (!pegarBool(chaveAtiva)) return false;

      const inicio = localStorage.getItem(chaveInicio);
      if (!inicio) return false;

      const dataInicio = new Date(inicio);
      const agora = new Date();
      const dias = Math.floor((agora - dataInicio) / (1000 * 60 * 60 * 24));

      return dias <= 180;
    }

    function entrarSistema() {
      const nome = document.getElementById("nome").value.trim();
      const senha = document.getElementById("senha").value.trim();
      const perfil = document.getElementById("perfil").value;
      const slotSolidaria = document.getElementById("slotSolidaria").value;

      if (!nome) {
        alert("Informe o nome de acesso.");
        return;
      }

      if (!senha) {
        alert("Informe a senha.");
        return;
      }

      if (perfil === "admin") {
        if (nome.toLowerCase() !== ADMIN_OFICIAL.toLowerCase()) {
          alert("Admin inválido. Use o e-mail administrativo oficial.");
          return;
        }

        const sessao = {
          nome,
          perfil,
          tipoAcesso: "institucional_total"
        };

        localStorage.setItem("lapidarSessao", JSON.stringify(sessao));
        window.location.href = "index.html";
        return;
      }

      if (perfil === "heteronimo") {
        const sessao = {
          nome,
          perfil,
          tipoAcesso: "heteronimo_privado"
        };

        localStorage.setItem("lapidarSessao", JSON.stringify(sessao));
        window.location.href = "index.html";
        return;
      }

      if (perfil === "cortesia_quimera" && !pegarBool("cfg_quimera_ativa")) {
        alert("Cortesia da Quimera está desativada.");
        return;
      }

      if (perfil === "cortesia_valletibooks" && !pegarBool("cfg_valleti_ativa")) {
        alert("Cortesia da ValletiBooks está desativada.");
        return;
      }

      if (perfil === "cortesia_acl" && !semestralValida("cfg_acl_ativa", "cfg_acl_inicio")) {
        alert("Cortesia ACL está inativa ou expirou.");
        return;
      }

      if (perfil === "cortesia_andre_instituicao" && !semestralValida("cfg_andre_ativa", "cfg_andre_inicio")) {
        alert("Cortesia André Instituição está inativa ou expirou.");
        return;
      }

      if (perfil === "cortesia_estilo_poesia" && !semestralValida("cfg_estilo_ativa", "cfg_estilo_inicio")) {
        alert("Cortesia Estilo e Poesia está inativa ou expirou.");
        return;
      }

      if (perfil === "licenca_solidaria") {
        const ativa = pegarBool(`solidaria_${slotSolidaria}_ativa`);
        const beneficiado = localStorage.getItem(`solidaria_${slotSolidaria}_beneficiado`) || "";
        const duracao = parseInt(localStorage.getItem(`solidaria_${slotSolidaria}_duracao`) || "180", 10);

        if (!ativa) {
          alert(`Licença Solidária ${slotSolidaria} está desativada.`);
          return;
        }

        if (!beneficiado) {
          alert(`Licença Solidária ${slotSolidaria} ainda não possui beneficiado definido.`);
          return;
        }

        const sessao = {
          nome,
          perfil,
          slotSolidaria,
          beneficiado,
          setoresLiberados: ACESSO_PRIMOS,
          tipoAcesso: "solidario_operacional",
          duracao
        };

        localStorage.setItem("lapidarSessao", JSON.stringify(sessao));
        window.location.href = "index.html";
        return;
      }

      if (
        perfil === "cortesia_quimera" ||
        perfil === "cortesia_valletibooks" ||
        perfil === "cortesia_acl" ||
        perfil === "cortesia_andre_instituicao" ||
        perfil === "cortesia_estilo_poesia"
      ) {
        const sessao = {
          nome,
          perfil,
          setoresLiberados: ACESSO_PRIMOS,
          tipoAcesso: "operacional_primos"
        };

        localStorage.setItem("lapidarSessao", JSON.stringify(sessao));
        window.location.href = "index.html";
        return;
      }

      const sessao = {
        nome,
        perfil,
        tipoAcesso: "padrao"
      };

      localStorage.setItem("lapidarSessao", JSON.stringify(sessao));
      window.location.href = "index.html";
    }

    function voltarInicio() {
      window.location.href = "index.html";
    }

    iniciarConfigs();
    atualizarDescricaoPerfil();
  </script>
</body>
</html>
