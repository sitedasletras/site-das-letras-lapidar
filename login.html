<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Acesso ao Lapidar</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
background:#f4efe6;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{

background:white;
padding:30px;
border-radius:12px;
box-shadow:0px 4px 14px rgba(0,0,0,0.15);
width:320px;
text-align:center;

}

h2{

margin-bottom:20px;

}

input{

width:100%;
padding:12px;
margin:8px 0;
border-radius:8px;
border:1px solid #ccc;
font-size:15px;

}

button{

width:100%;
padding:12px;
margin-top:10px;
background:#2e7d32;
border:none;
color:white;
font-size:16px;
border-radius:8px;
cursor:pointer;

}

button:hover{

background:#256528;

}

.aviso{

margin-top:10px;
font-size:13px;
color:#888;

}

</style>

</head>

<body>

<div class="card">

<h2>Acesso ao Lapidar</h2>

<input id="usuario" placeholder="Usuário">

<input id="senha" type="password" placeholder="Senha">

<button onclick="entrar()">Entrar</button>

<div class="aviso">

Área interna do sistema editorial. O acesso depende de autenticação válida.

</div>

</div>

<script>

function entrar(){

const usuario = document.getElementById("usuario").value.trim();
const senha = document.getElementById("senha").value.trim();

if(usuario === ""){
alert("Informe o usuário.");
return;
}

if(senha === ""){
alert("Informe a senha.");
return;
}

/*
Aqui salvamos sessão válida
*/

localStorage.setItem("usuarioLogado", usuario);
localStorage.setItem("perfilAtivo", "admin");

/*
Redirecionamento oficial da espinha dorsal
*/

window.location.href = "painel_setores.html";

}

</script>

</body>

</html>
