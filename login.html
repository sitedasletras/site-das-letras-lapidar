<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Lapidar — A esperança e sonhos dos escritores</title>

<style>

body{
background:#000;
color:#fff;
font-family:Arial;
text-align:center;
padding-top:80px;
}

.container{
width:320px;
margin:auto;
padding:25px;
background:#111;
border-radius:12px;
box-shadow:0px 0px 12px #333;
}

input{
width:90%;
padding:12px;
margin:10px 0;
border-radius:6px;
border:none;
font-size:16px;
}

button{
background:#FFD700;
border:none;
padding:12px;
width:95%;
font-size:18px;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#e6c200;
}

.erro{
color:red;
margin-top:10px;
}

</style>
</head>

<body>

<div class="container">

<h2>Lapidar</h2>

<p>
Entre com seus dados para acessar sua área de diagramação
</p>

<input type="text" id="usuario" placeholder="Digite seu email">

<input type="password" id="senha" placeholder="Digite sua senha">

<button onclick="entrar()">Entrar</button>

<div class="erro" id="erro"></div>

</div>


<script>

const usuarioPadrao = "admin@sitedasletras.com";
const senhaPadrao = "123456";


function entrar(){

let usuario = document.getElementById("usuario").value;
let senha = document.getElementById("senha").value;


if(usuario === usuarioPadrao && senha === senhaPadrao){

localStorage.setItem("lapidar_logado","true");

window.location.href="painel.html";

}else{

document.getElementById("erro").innerText =
"Email ou senha inválidos.";

}

}


if(localStorage.getItem("lapidar_logado") === "true"){

window.location.href="painel.html";

}

</script>

</body>
</html>
