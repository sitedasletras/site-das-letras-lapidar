<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lapidar • Login</title>

<style>

body{

margin:0;
font-family:Arial, Helvetica, sans-serif;
background:#f4f1e8;

display:flex;
justify-content:center;
align-items:center;

height:100vh;

}

.card{

background:white;

padding:40px;

border-radius:22px;

box-shadow:0px 14px 34px rgba(0,0,0,.12);

width:340px;

}

h1{

text-align:center;

margin-bottom:26px;

letter-spacing:3px;

}

input{

width:100%;

padding:14px;

margin-bottom:16px;

border-radius:10px;

border:1px solid #ccc;

font-size:16px;

}

button{

width:100%;

padding:16px;

background:#2e7d32;

color:white;

border:none;

border-radius:12px;

font-weight:bold;

font-size:18px;

cursor:pointer;

}

button:hover{

background:#256628;

}

</style>

</head>

<body>

<div class="card">

<h1>LAPIDAR</h1>

<input
id="usuario"
placeholder="Usuário"
/>

<input
id="senha"
type="password"
placeholder="Senha"
/>

<button onclick="entrar()">

Entrar

</button>

</div>

<script>

function entrar(){

localStorage.setItem(
"lapidar_perfil",
"usuario"
)

window.location.href =
"pagina_institucional_lapidar.html"

}

</script>

</body>
</html>
