<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Lapidar</title>

<style>

body{
margin:0;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:#efece2;
font-family:Arial;
}

.card{
background:white;
padding:40px;
border-radius:18px;
box-shadow:0 10px 40px rgba(0,0,0,0.12);
width:320px;
text-align:center;
}

input{
width:100%;
padding:12px;
margin-top:12px;
border-radius:10px;
border:1px solid #ddd;
font-size:16px;
}

button{
margin-top:18px;
width:100%;
padding:14px;
background:#2f8a36;
border:none;
color:white;
font-weight:bold;
font-size:16px;
border-radius:12px;
cursor:pointer;
}

button:hover{
background:#256f2b;
}

</style>
</head>

<body>

<div class="card">

<h2>Acesso ao Lapidar</h2>

<input id="usuario" placeholder="Usuário">

<input id="senha" placeholder="Senha" type="password">

<button onclick="login()">Entrar</button>

</div>


<script>

function login(){

let usuario=document.getElementById("usuario").value.trim().toLowerCase()

if(usuario===""){

alert("Informe o usuário")
return

}


/*
MAPA OFICIAL DE PERFIS DO LAPIDAR
AJUSTE AQUI APENAS SE PRECISAR
*/

const mapaPerfis = {

admin:"admin",

sigmal:"admin",

siteletras:"admin",

diagramador:"producao",

capista:"producao",

avaliador:"producao",

tradutor:"producao",

producao:"producao",

heteronimo:"heteronimo",

heterônimo:"heteronimo",

autor:"cortesia",

cortesia:"cortesia"

}


/*
DETECTA PERFIL
*/

let perfil = mapaPerfis[usuario]


if(!perfil){

alert("Usuário não reconhecido.\nCadastre no login.html")
return

}


/*
GRAVA SESSÃO
*/

localStorage.setItem("lapidar_sessao_ativa","true")
localStorage.setItem("lapidar_usuario",usuario)
localStorage.setItem("lapidar_perfil",perfil)


/*
ENVIA PARA ENTRADA OFICIAL
*/

window.location.href="/index.html"

}

</script>

</body>
</html>
