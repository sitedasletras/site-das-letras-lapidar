<script src="auditoria.js"></script>
<script src="sessao_unica.js"></script>

<script>

function entrarSistema(){

const usuario = document.getElementById("usuario").value.trim()
const senha = document.getElementById("senha").value.trim()

if(!usuario || !senha){

document.getElementById("statusLogin").innerHTML =
"Preencha usuário e senha."

return

}

const token = SDL_iniciarSessao(usuario)

localStorage.setItem("SDL_token_sessao_global", token)

try{
SDL_registrarAuditoria(
"Login realizado",
"login"
)
}catch(e){}

document.getElementById("statusLogin").innerHTML =
"Acesso autorizado. Redirecionando..."

setTimeout(() => {

window.location.href = "painel_setores.html"

}, 400)

}
</script>
