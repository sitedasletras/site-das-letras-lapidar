<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lapidar • Login</title>
  <style>
    :root{
      --bg:#e8d7a4;
      --cross:#d7c187;
      --card:#ffffff;
      --text:#1f2430;
      --muted:#7b7f87;
      --blue:#244786;
      --blue-dark:#1c3768;
      --gold:#d7ad3a;
      --gold-dark:#be972d;
      --gray:#ececec;
      --gray-dark:#dcdcdc;
      --shadow:0 18px 40px rgba(0,0,0,.14);
      --line:#e6e6e6;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      min-height:100vh;
      font-family:Arial, Helvetica, sans-serif;
      color:var(--text);
      background:
        linear-gradient(to right,
          transparent 0,
          transparent calc(50% - 56px),
          var(--cross) calc(50% - 56px),
          var(--cross) calc(50% + 56px),
          transparent calc(50% + 56px),
          transparent 100%),
        linear-gradient(to bottom,
          transparent 0,
          transparent calc(50% - 42px),
          var(--cross) calc(50% - 42px),
          var(--cross) calc(50% + 42px),
          transparent calc(50% + 42px),
          transparent 100%),
        var(--bg);
      display:flex;
      align-items:flex-start;
      justify-content:center;
      padding:36px 18px;
    }

    .wrap{
      width:100%;
      max-width:420px;
      text-align:center;
    }

    .seal{
      width:100px;
      height:100px;
      object-fit:contain;
      display:block;
      margin:0 auto 16px;
      background:#ead6af;
    }

    .card{
      background:var(--card);
      border-radius:26px;
      box-shadow:var(--shadow);
      padding:26px 18px 20px;
      text-align:left;
    }

    h1{
      margin:0;
      font-size:26px;
      font-weight:800;
      letter-spacing:.4px;
      text-align:center;
    }

    .sub{
      margin:8px 0 18px;
      text-align:center;
      color:var(--muted);
      font-size:13px;
      line-height:1.5;
    }

    label{
      display:block;
      font-size:12px;
      font-weight:700;
      margin:12px 0 6px;
      color:#4d535d;
    }

    input{
      width:100%;
      border:1px solid var(--line);
      border-radius:12px;
      padding:13px 14px;
      font-size:15px;
      outline:none;
    }

    input:focus{
      border-color:#bfc8d8;
    }

    .btn{
      width:100%;
      border:none;
      border-radius:12px;
      padding:14px 16px;
      font-size:16px;
      font-weight:700;
      cursor:pointer;
      margin-top:12px;
      transition:.18s ease;
    }

    .btn:hover{
      transform:translateY(-1px);
    }

    .btn-primary{
      background:var(--blue);
      color:#fff;
    }

    .btn-primary:hover{
      background:var(--blue-dark);
    }

    .btn-gold{
      background:var(--gold);
      color:#fff;
    }

    .btn-gold:hover{
      background:var(--gold-dark);
    }

    .btn-gray{
      background:var(--gray);
      color:#666;
    }

    .btn-gray:hover{
      background:var(--gray-dark);
    }

    .footer{
      margin-top:16px;
      text-align:center;
      color:#8b8f96;
      font-size:12px;
      line-height:1.5;
    }

    .msg{
      margin-top:12px;
      font-size:13px;
      line-height:1.5;
      color:#7c3d3d;
      min-height:20px;
      text-align:center;
      font-weight:700;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="seal" src="https://via.placeholder.com/100x100?text=Site+das+Letras" alt="Selo Lapidar">

    <div class="card">
      <h1>LAPIDAR</h1>
      <div class="sub">
        Produto institucional do Celeiro Literário<br>
        Site das Letras Edições Literárias
      </div>

      <label for="email">Login ou e-mail</label>
      <input id="email" type="text" placeholder="Digite seu e-mail ou telefone internacional">

      <label for="senha">Senha</label>
      <input id="senha" type="password" placeholder="Digite sua senha">

      <button class="btn btn-primary" onclick="entrarNoLapidar()">
        Entrar no Lapidar
      </button>

      <button class="btn btn-gold" onclick="window.location.href='cadastro.html'">
        Criar cadastro
      </button>

      <button class="btn btn-gray" onclick="window.location.href='recuperar_senha.html'">
        Recuperar senha
      </button>

      <div id="mensagem" class="msg"></div>

      <div class="footer">
        Lapidar &nbsp;•&nbsp; Celeiro Literário &nbsp;•&nbsp; Site das Letras Edições Literárias
      </div>
    </div>
  </div>

  <script>
    function entrarNoLapidar(){
      const email = document.getElementById("email").value.trim().toLowerCase();
      const senha = document.getElementById("senha").value.trim();
      const msg = document.getElementById("mensagem");

      if(!email || !senha){
        msg.textContent = "Preencha login e senha para continuar.";
        return;
      }

      // Recria a memória local básica do sistema
      let perfil = "utilizador";

      if(email.includes("admin")){
        perfil = "admin";
      }else if(email.includes("heteronimo") || email.includes("heterônimo") || email.includes("hetero")){
        perfil = "heteronimo";
      }else if(email.includes("cortesia")){
        perfil = "cortesia";
      }

      localStorage.setItem("lapidar_perfil", perfil);
      localStorage.setItem("lapidar_sessao_ativa", "true");
      localStorage.setItem("lapidar_email", email);

      // Roteamento principal
      if(perfil === "admin" || perfil === "heteronimo"){
        window.location.href = "admin_painel.html";
      }else{
        window.location.href = "pagina_institucional_lapidar.html";
      }
    }
  </script>
</body>
</html>
