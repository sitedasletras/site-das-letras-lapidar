<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lapidar — Acesso</title>

<style>

body {
margin:0;
padding:0;
font-family: Arial, sans-serif;
height:100vh;
background:#f4efe6;
display:flex;
align-items:center;
justify-content:center;
position:relative;
}

/* FAIXA VERTICAL PERGAMINHO */

.vertical-pergaminho {

position:absolute;
width:140px;
height:100vh;
background:#e9dcc6;

left:50%;
transform:translateX(-50%);

z-index:0;

}

/* FAIXA HORIZONTAL PERGAMINHO */

.horizontal-pergaminho {

position:absolute;
height:140px;
width:100vw;
background:#e9dcc6;

top:50%;
transform:translateY(-50%);

z-index:0;

}

/* SELO SUPERIOR */

.selo-topo {

position:absolute;
top:20px;
left:50%;

transform:translateX(-50%);

z-index:2;

}

.selo-topo img {

height:110px;

}

/* CAIXA LOGIN RESPONSIVA */

.login-box {

background:white;

height:75vh;   /* 75% da altura da tela */

width:min(90vw, 380px);

padding:40px;

border-radius:16px;

box-shadow:0px 10px 40px rgba(0,0,0,0.18);

display:flex;
flex-direction:column;
justify-content:center;

z-index:1;

text-align:center;

}

/* INPUTS */

.login-box input {

width:100%;

padding:14px;

margin:12px 0;

border-radius:8px;
border:1px solid #ccc;

font-size:16px;

}

/* BOTÃO */

.login-box button {

width:100%;

padding:14px;

border:none;

border-radius:8px;

background:#6d5c3d;

color:white;

font-size:17px;

cursor:pointer;

transition:.2s;

}

.login-box button:hover {

background:#5a4a2e;

}

/* ESQUECI SENHA */

.esqueci {

margin-top:14px;

font-size:15px;

}

.esqueci a {

text-decoration:none;

color:#6d5c3d;

}

.esqueci a:hover {

text-decoration:underline;

}

/* AJUSTE MOBILE EXTRA */

@media(max-width:480px){

.login-box{

height:75vh;

width:88vw;

padding:30px;

}

.selo-topo img{

height:95px;

}

}

</style>
</head>

<body>

<div class="vertical-pergaminho"></div>
<div class="horizontal-pergaminho"></div>

<div class="selo-topo">

<img src="selo-lapidar.png">

</div>

<div class="login-box">

<form>

<input type="text" placeholder="Login">

<input type="password" placeholder="Senha">

<button type="submit">Entrar</button>

<div class="esqueci">
<a href="#">Esqueci minha senha</a>
</div>

</form>

</div>

</body>
</html>
