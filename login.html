<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Lapidar</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:#0d0603;
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{
width:92%;
max-width:420px;
background:#140c08;
border-radius:18px;
padding:28px;
box-sizing:border-box;
}

h1{
margin:0;
font-size:38px;
text-align:center;
}

.subtitulo{
text-align:center;
color:#ff7b2c;
margin-top:10px;
margin-bottom:24px;
line-height:1.6;
}

label{
display:block;
margin-top:14px;
margin-bottom:8px;
font-weight:bold;
color:#ffd2b3;
}

input{
width:100%;
padding:14px;
border:none;
border-radius:10px;
font-size:16px;
box-sizing:border-box;
}

.botao{
width:100%;
padding:18px;
margin-top:20px;
border:none;
border-radius:40px;
background:#ff5a00;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.botao:hover{
opacity:.94;
}

.mensagem{
margin-top:16px;
min-height:24px;
line-height:1.5;
color:#ffb3b3;
text-align:center;
}

.info{
margin-top:18px;
font-size:14px;
line-height:1.6;
color:#ffcfaa;
text-align:center;
}
</style>
</head>

<body>

<div class="container">

<h1>LAPIDAR</h1>

<div class="subtitulo">
Entre no seu ambiente editorial
</div>

<label for="usuario">E-mail</label>
<input type="text" id="usuario" placeholder="Digite seu e-mail">

<label for="senha">Senha</label>
<input type="password" id="senha" placeholder="Digite sua senha">

<button class="botao" onclick="entrar()">
Entrar
</button>

<div id="mensagem" class="mensagem"></div>

<div class="info">
Acesso editorial controlado. Após o login, você será direcionado ao painel de departamentos do Lapidar.
</div>

</div>

<script>
function entrar(){

const usuario = document.getElementById("usuario").value.trim().toLowerCase();
const senha = document.getElementById("senha").value.trim();
const mensagem = document.getElementById("mensagem");

const adminEmail1 = "admin@sitedasletras.com";
const adminEmail2 = "admin@sitedasletrasedicoesliterarias.com";

/*
Troque a senha abaixo pela senha que você quiser usar no admin.
*/
const senhaAdmin = "123456";

if(
(usuario === adminEmail1 || usuario === adminEmail2) &&
senha === senhaAdmin
){
localStorage.setItem("SDL_sessao_ativa","sim");
localStorage.setItem("SDL_usuario_logado",usuario);
localStorage.setItem("SDL_ADMIN","true");
window.location.href = "painel_departamentos.html";
return;
}

mensagem.innerText = "E-mail ou senha inválidos.";
}

if(localStorage.getItem("SDL_sessao_ativa") === "sim"){
window.location.href = "painel_departamentos.html";
}
</script>

</body>
</html>
