<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Acesso ao ambiente Lapidar</title>

<style>

body{
margin:0;
background:#0c0603;
font-family:Arial;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
max-width:420px;
width:90%;
}

.card{
background:#140c08;
border-radius:14px;
padding:30px;
text-align:center;
}

.titulo{
font-size:30px;
font-weight:bold;
margin-bottom:10px;
}

.subtitulo{
color:#ff7b2c;
margin-bottom:20px;
}

input{

width:100%;
padding:14px;
margin-top:12px;
border:none;
border-radius:8px;

}

.botao{

width:100%;
padding:18px;
margin-top:22px;

border:none;
border-radius:40px;

background:#ff5a00;

color:white;
font-size:18px;
font-weight:bold;

cursor:pointer;

}

.info{

margin-top:14px;
font-size:14px;
color:#ffcfaa;

}

</style>

</head>

<body>

<div class="container">

<div class="card">

<div class="titulo">

Lapidar

</div>

<div class="subtitulo">

Entre na sua casa editorial

</div>

<input
id="usuario"
placeholder="Seu e-mail ou nome de acesso">

<input
type="password"
id="senha"
placeholder="Sua senha">

<button
class="botao"
onclick="entrarSistema()">

Entrar no ambiente

</button>

<div class="info">

O acesso é permitido em apenas um dispositivo por vez.

</div>

</div>

</div>

<script>

function detectarIdiomaSistema(){

const idioma = navigator.language;

if(idioma.startsWith("pt")) return "pt";
if(idioma.startsWith("en")) return "en";
if(idioma.startsWith("es")) return "es";
if(idioma.startsWith("it")) return "it";
if(idioma.startsWith("fr")) return "fr";
if(idioma.startsWith("de")) return "de";

return "pt";

}

function entrarSistema(){

const usuario =
document.getElementById("usuario").value;

const senha =
document.getElementById("senha").value;

if(!usuario || !senha){

alert("Informe usuário e senha.");

return;

}

localStorage.setItem(
"SDL_usuario_logado",
usuario
);

localStorage.setItem(
"SDL_sessao_ativa",
"sim"
);

localStorage.setItem(
"SDL_dispositivo_autorizado",
navigator.userAgent
);

localStorage.setItem(
"SDL_idioma_interface",
detectarIdiomaSistema()
);

window.location.href =
"_Indice.html";

}

</script>

</body>

</html>
