<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso ao Lapidar</title>
  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#f7f4ec;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      color:#2f2a24;
      padding:24px;
    }

    .card{
      background:#ffffff;
      padding:32px 28px;
      border-radius:16px;
      box-shadow:0 8px 24px rgba(0,0,0,0.10);
      width:100%;
      max-width:360px;
      text-align:center;
      border:1px solid #e9e2d3;
    }

    h2{
      margin:0 0 10px 0;
      color:#4f3f25;
      font-size:28px;
    }

    .sub{
      margin:0 0 22px 0;
      font-size:14px;
      color:#7a6a50;
      line-height:1.5;
    }

    input{
      width:100%;
      padding:13px 14px;
      margin:8px 0;
      border-radius:10px;
      border:1px solid #d8cfbf;
      font-size:15px;
      background:#fcfbf8;
      outline:none;
    }

    input:focus{
      border-color:#8c7751;
      background:#fffefb;
    }

    button{
      width:100%;
      padding:13px;
      margin-top:12px;
      background:#2f5a57;
      border:none;
      color:white;
      font-size:16px;
      border-radius:10px;
      cursor:pointer;
      transition:0.2s ease;
    }

    button:hover{
      background:#244745;
    }

    .aviso{
      margin-top:14px;
      font-size:13px;
      color:#8a7a60;
      line-height:1.45;
    }

    .erro{
      margin-top:10px;
      font-size:13px;
      color:#9b2c2c;
      min-height:18px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Acesso ao Lapidar</h2>
    <p class="sub">
      Entrada oficial do sistema editorial.
    </p>

    <input id="usuario" placeholder="Usuário">
    <input id="senha" type="password" placeholder="Senha">

    <button onclick="entrar()">Entrar</button>

    <div class="erro" id="erro"></div>

    <div class="aviso">
      O acesso válido prepara a sessão e encaminha para a página de respiro institucional antes do painel.
    </div>
  </div>

  <script>
    function limparErro(){
      document.getElementById("erro").innerText = "";
    }

    function definirPerfil(usuario){
      const u = (usuario || "").trim().toLowerCase();

      if(
        u.includes("admin") ||
        u.includes("administrador") ||
        u.includes("site") ||
        u.includes("sitedasletras")
      ){
        return "admin";
      }

      if(
        u.includes("heteronimo") ||
        u.includes("heterônimo") ||
        u.includes("heter") ||
        u.includes("pseudonimo") ||
        u.includes("pseudônimo")
      ){
        return "heteronimo";
      }

      return "usuario";
    }

    function entrar(){
      limparErro();

      const usuario = document.getElementById("usuario").value.trim();
      const senha = document.getElementById("senha").value.trim();

      if(usuario === ""){
        document.getElementById("erro").innerText = "Informe o usuário.";
        return;
      }

      if(senha === ""){
        document.getElementById("erro").innerText = "Informe a senha.";
        return;
      }

      const perfil = definirPerfil(usuario);

      localStorage.setItem("usuarioLogado", usuario);
      localStorage.setItem("perfilAtivo", perfil);
      localStorage.setItem("sessaoLapidarAtiva", "true");
      localStorage.setItem("entradaLapidarEm", new Date().toISOString());

      window.location.href = "/pagina_respiro.html";
    }
  </script>

</body>
</html>
