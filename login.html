<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lapidar — Login</title>

<style>

body{
margin:0;
font-family:Arial;
background:#efe7d6;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

.container{
background:white;
padding:40px;
border-radius:12px;
box-shadow:0 4px 18px rgba(0,0,0,.12);
width:320px;
text-align:center;
}

h1{
margin-top:0;
color:#5d4037;
}

input{
width:100%;
padding:10px;
margin:10px 0;
border-radius:6px;
border:1px solid #ccc;
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:8px;
background:#5d4037;
color:white;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#4b322b;
}

.footer{
margin-top:20px;
font-size:12px;
color:#777;
}

</style>

</head>

<body>

<div class="container">

<h1>Lapidar</h1>

<input
type="email"
id="email"
placeholder="Seu e-mail"
/>

<input
type="password"
id="senha"
placeholder="Senha"
/>

<button onclick="entrarSistema()">
Entrar
</button>

<div class="footer">
Site das Letras — Edições Literárias, Sonoras & Cinematográficas
</div>

</div>

<script>

function entrarSistema(){

const email =
document.getElementById("email").value.toLowerCase()

let perfil = "usuario"

// regras simples de perfil inicial

if(email.includes("admin")){

perfil="admin"

}

else if(email.includes("heteronimo")){

perfil="heteronimo"

}

else if(email.includes("planaswagner")){

perfil="heteronimo"

}

// salva sessão

localStorage.setItem(
"lapidar_usuario_logado",
"true"
)

localStorage.setItem(
"lapidar_perfil",
perfil
)

// redireciona corretamente

location.href =
"pagina_respiro.html"

}

</script>

</body>
</html>
