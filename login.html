<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lapidar — Login</title>

<style>

body {

margin:0;
height:100vh;

display:flex;
align-items:center;
justify-content:center;

background:#0f172a;

font-family:Arial;

color:white;

}

.container {

background:#111827;

padding:40px;

border-radius:18px;

box-shadow:0px 0px 40px rgba(0,0,0,0.5);

width:320px;

text-align:center;

}

h1 {

margin-bottom:20px;

}

input {

width:100%;

padding:12px;

margin-top:10px;

border-radius:8px;

border:none;

outline:none;

}

button {

margin-top:20px;

width:100%;

padding:12px;

border:none;

border-radius:10px;

background:#22c55e;

color:white;

font-weight:bold;

cursor:pointer;

}

button:hover {

background:#16a34a;

}

.erro {

margin-top:10px;

color:#ef4444;

display:none;

}

</style>

</head>

<body>


<div class="container">

<h1>Lapidar</h1>

<input id="email" placeholder="email">

<input id="senha" type="password" placeholder="senha">

<button onclick="login()">Entrar</button>

<div id="erro" class="erro">
Usuário não reconhecido
</div>

</div>


<script>

function login(){

const email =
document.getElementById("email").value.toLowerCase();

const senha =
document.getElementById("senha").value;


let perfil = "";


/* PERFIS DO SISTEMA */

if(email === "admin" && senha === "admin"){

perfil = "admin";

}

else if(email === "heteronimo" && senha === "heteronimo"){

perfil = "heteronimo";

}

else if(email === "planaswagner@gmail.com"){

perfil = "admin";

}

else{

document.getElementById("erro").style.display="block";
return;

}


/* REGISTRO DE SESSÃO PARA NAS / FIIISAA */

localStorage.setItem("perfilUsuario",perfil);

localStorage.setItem("emailUsuario",email);


/* REDIRECIONAMENTO CORRETO DO LAPIDAR */

window.location.href="pagina_respiro.html";

}

</script>


</body>

</html>
