<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Lapidar</title>

<style>
:root{
--bg:#0d0603;
--card:#140c08;
--text:#ffffff;
--orange:#f7b22c;
--border:rgba(255,123,44,0.18);
--shadow:0 10px 26px rgba(0,0,0,0.28);
}

body{
margin:0;
font-family:Arial, sans-serif;
background:var(--bg);
color:white;
display:flex;
align-items:center;
justify-content:center;
min-height:100vh;
padding:20px;
box-sizing:border-box;
}

.card{
width:100%;
max-width:430px;
background:var(--card);
padding:30px;
border-radius:18px;
border:1px solid var(--border);
box-shadow:var(--shadow);
}

.titulo{
font-size:32px;
font-weight:bold;
margin-bottom:10px;
}

.subtitulo{
color:var(--orange);
margin-bottom:22px;
line-height:1.6;
}

label{
display:block;
margin-top:12px;
margin-bottom:6px;
color:var(--orange);
font-weight:bold;
}

input{
width:100%;
padding:14px;
border-radius:12px;
border:none;
background:#1b0e07;
color:white;
box-sizing:border-box;
}

button{
margin-top:22px;
width:100%;
padding:14px;
border:none;
border-radius:999px;
background:#174d27;
color:white;
font-weight:bold;
cursor:pointer;
}

.status{
margin-top:18px;
padding:12px;
border-radius:12px;
background:rgba(247,178,44,0.12);
line-height:1.6;
}
</style>
</head>

<body>

<div class="card">

<div class="titulo">Lapidar</div>
<div class="subtitulo">
Acesso ao sistema editorial integrado do Site das Letras.
</div>

<label for="usuario">Usuário</label>
<input id="usuario" type="text">

<label for="senha">Senha</label>
<input id="senha" type="password">

<button onclick="entrarSistema()">Entrar</button>

<div id="statusLogin" class="status">
Informe seus dados para acessar o sistema.
</div>

</div>

<script src="auditoria.js"></script>

<script>
function entrarSistema(){
  const usuario = document.getElementById("usuario").value.trim();
  const senha = document.getElementById("senha").value.trim();

  if(!usuario || !senha){
    document.getElementById("statusLogin").innerHTML =
      "Preencha usuário e senha.";
    return;
  }

  localStorage.setItem("SDL_sessao_ativa", "sim");
  localStorage.setItem("SDL_usuario", usuario);

  try{
    SDL_registrarAuditoria("Login realizado no sistema", "login");
  }catch(e){}

  document.getElementById("statusLogin").innerHTML =
    "Acesso autorizado. Redirecionando para os setores do Lapidar...";
  document.getElementById("statusLogin").style.background =
    "rgba(23,77,39,0.28)";

  setTimeout(() => {
    window.location.href = "painel_setores.html";
  }, 500);
}
</script>

</body>
</html>
