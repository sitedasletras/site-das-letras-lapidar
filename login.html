<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Lapidar</title>

<style>

body{
margin:0;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:#efece2;
font-family:Arial;
}

.card{
background:white;
padding:40px;
border-radius:18px;
box-shadow:0 10px 40px rgba(0,0,0,0.12);
width:320px;
text-align:center;
}

input{
width:100%;
padding:12px;
margin-top:12px;
border-radius:10px;
border:1px solid #ddd;
font-size:16px;
}

button{
margin-top:18px;
width:100%;
padding:14px;
background:#2f8a36;
border:none;
color:white;
font-weight:bold;
font-size:16px;
border-radius:12px;
cursor:pointer;
}

button:hover{
background:#256f2b;
}

</style>
</head>

<body>

<div class="card">

<h2>Acesso ao Lapidar</h2>

<input id="usuario" placeholder="Usuário">

<input id="senha" placeholder="Senha" type="password">

<button onclick="login()">Entrar</button>

</div>


<script>

function login(){

let usuario=document.getElementById("usuario").value.trim().toLowerCase()
let senha=document.getElementById("senha").value.trim()

if(usuario=="" || senha==""){

alert("Preencha usuário e senha")
return

}


/*
DEFINE PERFIL AUTOMÁTICO
ajuste depois se quiser
*/

let perfil="cortesia"

if(usuario=="admin") perfil="admin"
if(usuario=="producao") perfil="producao"
if(usuario=="veterano") perfil="veterano"
if(usuario=="heteronimo") perfil="heteronimo"


/*
GRAVA SESSÃO CORRETA DO LAPIDAR
*/

localStorage.setItem("lapidar_sessao_ativa","true")
localStorage.setItem("lapidar_usuario",usuario)
localStorage.setItem("lapidar_perfil",perfil)


/*
REDIRECIONA PARA A ENTRADA OFICIAL
*/

window.location.href="/index.html"

}

</script>

</body>
</html>
