<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mesário da Obra — Lapidar</title>

<style>

body{
margin:0;
font-family:Arial;
background:#efe8dc;
}

header{
background:#3c4f6b;
color:white;
padding:18px;
text-align:center;
font-size:26px;
font-weight:bold;
}

.container{
max-width:900px;
margin:auto;
background:white;
padding:30px;
margin-top:30px;
border-radius:12px;
box-shadow:0 0 12px rgba(0,0,0,.15);
}

h2{
margin-top:0;
color:#3c4f6b;
}

.linha{
display:flex;
justify-content:space-between;
padding:12px;
border-bottom:1px solid #ddd;
font-size:18px;
}

.total{
font-weight:bold;
font-size:22px;
margin-top:20px;
text-align:right;
}

.botao{
margin-top:30px;
width:100%;
padding:18px;
border:none;
border-radius:10px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.voltar{
background:#888;
color:white;
}

.voltar:hover{
background:#666;
}

</style>
</head>

<body>

<header>
Mesário da Obra — Lapidar
</header>

<div class="container">

<h2>Resumo das contribuições editoriais</h2>

<div class="linha">
<span>Assistente de Diagramação</span>
<span id="valorDiagramacao">0</span>
</div>

<div class="linha">
<span>OKapista</span>
<span id="valorCapista">0</span>
</div>

<div class="linha">
<span>Segunda Língua(s)</span>
<span id="valorTraducao">0</span>
</div>

<div class="linha">
<span>Avaliação Literária</span>
<span id="valorAvaliacao">0</span>
</div>

<div class="linha">
<span>Lapidação Literária</span>
<span id="valorHumanizacao">0</span>
</div>

<div class="linha">
<span>Silo Sonoro</span>
<span id="valorAudio">0</span>
</div>

<div class="linha">
<span>Módulo Cinematológico</span>
<span id="valorCinema">0</span>
</div>

<div class="total">
Total acumulado: R$ <span id="valorTotal">0</span>
</div>

<button class="botao voltar" onclick="voltarWorkspace()">
Retornar ao Workspace da Obra
</button>

</div>

<script>

function numero(valor){
if(!valor) return 0;
return Number(valor);
}

function carregarValores(){

const diagramacao =
numero(localStorage.getItem("mesario_diagramacao_valor"));

const capista =
numero(localStorage.getItem("mesario_capista_valor"));

const traducao =
numero(localStorage.getItem("mesario_segunda_lingua_valor"));

const avaliacao =
numero(localStorage.getItem("mesario_avaliacao_valor"));

const humanizacao =
numero(localStorage.getItem("mesario_humanizacao_valor"));

const audio =
numero(localStorage.getItem("mesario_audio_valor"));

const cinema =
numero(localStorage.getItem("mesario_cinema_valor"));

document.getElementById("valorDiagramacao").innerText = diagramacao;

document.getElementById("valorCapista").innerText = capista;

document.getElementById("valorTraducao").innerText = traducao;

document.getElementById("valorAvaliacao").innerText = avaliacao;

document.getElementById("valorHumanizacao").innerText = humanizacao;

document.getElementById("valorAudio").innerText = audio;

document.getElementById("valorCinema").innerText = cinema;

const total =
diagramacao +
capista +
traducao +
avaliacao +
humanizacao +
audio +
cinema;

document.getElementById("valorTotal").innerText = total;

}

function voltarWorkspace(){
location.href="obra_workspace.html";
}

carregarValores();

</script>

</body>
</html>
