<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lapidar — Mesário</title>
<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f2f6f5;
    color:#243533;
}
.topo{
    background:#1f7a6e;
    color:#fff;
    padding:22px 18px;
}
.topo h1{margin:0;font-size:1.8rem}
.topo p{margin:8px 0 0 0;line-height:1.45;opacity:.95}
.container{
    max-width:1240px;
    margin:0 auto;
    padding:18px 14px 30px;
}
.card{
    background:#fff;
    border:1px solid #dcebea;
    border-radius:16px;
    padding:18px;
    box-shadow:0 4px 14px rgba(0,0,0,.08);
    margin-bottom:18px;
}
.card h2{
    margin:0 0 14px 0;
    color:#1f7a6e;
    font-size:1.2rem;
}
.linha{margin:10px 0;font-size:14px}
.preview{
    white-space:pre-wrap;
    line-height:1.55;
    font-size:14px;
    max-height:420px;
    overflow:auto;
    background:#fff;
    border:1px solid #d9ece9;
    border-radius:12px;
    padding:18px;
}
.acoes{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:14px;
}
button{
    border:none;
    border-radius:10px;
    padding:12px 16px;
    font-size:15px;
    cursor:pointer;
    font-weight:bold;
}
.btn-verde{background:#1f7a6e;color:#fff}
.btn-verde:hover{background:#16655b}
.btn-claro{background:#dff1ef;color:#154e47}
.btn-claro:hover{background:#cde7e4}
.btn-azul{background:#2563eb;color:#fff}
.btn-azul:hover{background:#1d4ed8}
.mensagem{
    margin-top:14px;
    padding:12px 14px;
    border-radius:10px;
    display:none;
    font-size:14px;
}
.ok{background:#edf9ef;border:1px solid #b7e1c1;color:#166534}
.erro{background:#fff1f1;border:1px solid #f0b9b9;color:#991b1b}
</style>
</head>
<body>

<header class="topo">
<h1>Mesário</h1>
<p>Etapa oficial de confirmação do fluxo editorial antes da Auditoria e Exportação.</p>
</header>

<main class="container">

<section class="card">
<h2>Validação final do pipeline</h2>

<div class="linha"><strong>Título:</strong> <span id="titulo">Carregando...</span></div>
<div class="linha"><strong>Autor:</strong> <span id="autor">Carregando...</span></div>
<div class="linha"><strong>Status Polir:</strong> <span id="statusPolir">Validando...</span></div>

<div class="acoes">
<button class="btn-claro" onclick="voltarPolir()">Voltar ao Polir</button>
<button class="btn-verde" onclick="confirmarMesario()">Confirmar Mesário</button>
<button class="btn-azul" onclick="seguirAuditoria()">Seguir para Auditoria</button>
</div>

<div id="msgOk" class="mensagem ok"></div>
<div id="msgErro" class="mensagem erro"></div>

</section>

<section class="card">
<h2>Prévia consolidada da obra</h2>
<div class="preview" id="preview">Aguardando obra...</div>
</section>

</main>

<script>

function ok(msg){
let el=document.getElementById("msgOk")
let er=document.getElementById("msgErro")
er.style.display="none"
el.innerText=msg
el.style.display="block"
}

function erro(msg){
let el=document.getElementById("msgOk")
let er=document.getElementById("msgErro")
el.style.display="none"
er.innerText=msg
er.style.display="block"
}

function obra(){
try{
return JSON.parse(localStorage.getItem("obraAtual")||"null")
}catch{return null}
}

function polirOk(){
return localStorage.getItem("polir_concluido")==="true"
}

function carregar(){
let o=obra()

if(!o){
document.getElementById("titulo").innerText="Nenhuma obra ativa"
document.getElementById("autor").innerText="—"
document.getElementById("preview").innerText="Nenhuma obra carregada."
return
}

document.getElementById("titulo").innerText=o?.titulo||"Título não identificado"
document.getElementById("autor").innerText=o?.autor||"Autor não identificado"

document.getElementById("preview").innerText=(o?.textoExtraido||"Sem texto disponível").slice(0,3000)

document.getElementById("statusPolir").innerText=polirOk()?"Concluído":"Pendente"
}

function confirmarMesario(){

if(!polirOk()){
erro("Antes de confirmar o Mesário, execute o Sistema Polir.")
return
}

localStorage.setItem("mesario_confirmado","true")

let relatorio={
data:new Date().toISOString(),
etapa:"mesario.html",
status:"confirmado"
}

localStorage.setItem("mesario_relatorio",JSON.stringify(relatorio))

ok("Mesário confirmado com sucesso.")
}

function seguirAuditoria(){

if(localStorage.getItem("mesario_confirmado")!=="true"){
erro("Confirme o Mesário antes de seguir.")
return
}

window.location.href="auditoria.html"
}

function voltarPolir(){
window.location.href="modulo41_barracao_de_polimento_das_imagens.html"
}

carregar()

</script>

<script src="lapidar_inteligencia_core.js"></script>

</body>
</html>
