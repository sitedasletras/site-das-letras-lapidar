<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cofre Editorial do Autor</title>

<script src="https://unpkg.com/mammoth@1.8.0/mammoth.browser.min.js"></script>

<style>

body{
font-family:Arial;
background:#f4efe6;
margin:0;
}

.topo{
background:#2f5a57;
color:white;
padding:25px;
text-align:center;
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.card{
background:white;
padding:20px;
margin-bottom:20px;
border-radius:12px;
box-shadow:0px 4px 14px rgba(0,0,0,0.08);
}

.upload-area{
border:2px dashed #ccc;
padding:25px;
text-align:center;
cursor:pointer;
border-radius:10px;
}

button{
padding:12px 18px;
background:#2f5a57;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
margin-top:10px;
}

.progress-bar{
height:22px;
background:#ddd;
border-radius:20px;
margin-top:15px;
overflow:hidden;
}

.progress{
height:100%;
width:0%;
background:#2f5a57;
color:white;
text-align:center;
font-size:13px;
}

.a4{
background:white;
padding:40px;
min-height:600px;
border:1px solid #ddd;
box-shadow:0px 6px 18px rgba(0,0,0,0.12);
white-space:pre-wrap;
}

.tag{
background:#eef3f8;
padding:6px 10px;
border-radius:999px;
margin-right:5px;
display:inline-block;
margin-top:10px;
}

</style>

</head>

<body>

<div class="topo">

<h1>Cofre Editorial do Autor</h1>

</div>

<div class="container">

<div class="card">

<h2>Enviar manuscrito</h2>

<div class="upload-area"
onclick="arquivoInput.click()">

Clique aqui para enviar sua obra

</div>

<input
type="file"
id="arquivoInput"
accept=".docx,.txt"
style="display:none">

<br>

<button onclick="lerObra()">

Iniciar leitura estrutural

</button>

<div class="progress-bar">

<div class="progress"
id="barra">

0%

</div>

</div>

<p id="status">

Aguardando envio da obra

</p>

</div>

<div class="card">

<h2>Diagnóstico editorial automático</h2>

<div id="diagnostico">

Nenhuma obra analisada ainda.

</div>

</div>

<div class="card">

<h2>Leitura visual da obra</h2>

<div id="tags"></div>

<br>

<div class="a4"
id="a4">

Nenhuma obra carregada ainda.

</div>

</div>

<div class="card">

<h2>Imagens da obra</h2>

<input
type="file"
id="imagens"
multiple>

<br>

<button onclick="salvarImagens()">

Salvar imagens

</button>

<p id="statusImagens"></p>

</div>

</div>

<script>

let obraAtual = null

function barra(valor,msg){

document.getElementById("barra").style.width=valor+"%"

document.getElementById("barra").innerText=valor+"%"

document.getElementById("status").innerText=msg

}

async function lerObra(){

let file=document.getElementById("arquivoInput").files[0]

if(!file){

alert("Envie um arquivo")

return

}

barra(10,"Recebendo manuscrito...")

let texto=""

if(file.name.endsWith(".docx")){

let buffer=await file.arrayBuffer()

let result=await mammoth.extractRawText({

arrayBuffer:buffer

})

texto=result.value

}

else{

texto=await file.text()

}

obraAtual={}

obraAtual.texto=texto

obraAtual.titulo=texto.split("\n")[0]

obraAtual.genero=detectarGenero(texto)

obraAtual.clima=detectarClima(texto)

obraAtual.narrador=detectarNarrador(texto)

localStorage.setItem(

"obraAtual",

JSON.stringify(obraAtual)

)

simular()

}

function detectarGenero(t){

if(t.match(/rob[oô]|nave|ia|futuro/i))

return "Ficção científica"

if(t.match(/amor|paixão/i))

return "Romance"

return "Não identificado"

}

function detectarClima(t){

if(t.match(/medo|sombra|trevas/i))

return "Sombrio"

return "Neutro"

}

function detectarNarrador(t){

if(t.match(/\beu\b/i))

return "Primeira pessoa"

return "Terceira pessoa"

}

function simular(){

let etapas=[

"Limpando resíduos técnicos",

"Detectando estrutura",

"Detectando personagens",

"Detectando narrador",

"Detectando clima",

"Refinando gênero",

"Montando painel A4",

"Preparando diagnóstico"

]

let i=0

let progresso=20

let intervalo=setInterval(()=>{

if(i>=etapas.length){

clearInterval(intervalo)

barra(100,"Leitura concluída")

mostrar()

return

}

progresso+=10

barra(progresso,etapas[i])

i++

},500)

}

function mostrar(){

document.getElementById("diagnostico").innerHTML=`

✔ Título: ${obraAtual.titulo}

<br>

✔ Gênero: ${obraAtual.genero}

<br>

✔ Clima: ${obraAtual.clima}

<br>

✔ Narrador: ${obraAtual.narrador}

`

document.getElementById("a4").innerText=

obraAtual.texto.substring(0,18000)

document.getElementById("tags").innerHTML=`

<span class="tag">

${obraAtual.genero}

</span>

<span class="tag">

${obraAtual.clima}

</span>

<span class="tag">

${obraAtual.narrador}

</span>

`

}

function salvarImagens(){

let total=document.getElementById("imagens").files.length

obraAtual.imagens=total

obraAtual.autoGerarCapa=(total==0)

localStorage.setItem(

"obraAtual",

JSON.stringify(obraAtual)

)

if(total==0)

document.getElementById("statusImagens").innerText=

"OKapista irá gerar imagens automaticamente"

else

document.getElementById("statusImagens").innerText=

total+" imagens salvas"

}

</script>

</body>

</html>
