<!DOCTYPE html><html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Lapidar — Bolsão de Limpeza Editorial</title><style>
body{
font-family:Georgia,serif;
background:#f7f6f2;
margin:40px;
color:#222;
}

h1{
text-align:center;
margin-bottom:30px;
}

textarea{
width:100%;
height:300px;
font-size:16px;
padding:15px;
}

button{
padding:12px 22px;
font-size:16px;
background:#2e5f4f;
color:white;
border:none;
margin-top:15px;
cursor:pointer;
}

.resultado{
margin-top:40px;
background:white;
padding:25px;
border-radius:8px;
box-shadow:0px 0px 8px rgba(0,0,0,0.08);
}

.linha{
margin-bottom:10px;
}
</style></head><body><h1>Bolsão de Limpeza Editorial</h1><textarea id="textoEntrada" placeholder="Cole aqui o texto da obra..."></textarea><br><button onclick="analisarTexto()">Executar leitura editorial</button>

<div class="resultado" id="saida"></div><script>

function detectarNarrador(texto){

let primeiraPessoa = (texto.match(/\beu\b/gi)||[]).length
let terceiraPessoa = (texto.match(/\bele\b|\bela\b/gi)||[]).length

if(primeiraPessoa > terceiraPessoa)
return ["1ª pessoa","uso recorrente de 'eu'"]
else if(terceiraPessoa > primeiraPessoa)
return ["3ª pessoa","uso recorrente de 'ele/ela'"]
else
return ["narrador misto","equilíbrio entre referências pessoais"]

}

function detectarGenero(texto){

if(texto.match(/hotel|vizinho|situação absurda|ironia|engraçado/i))
return ["comédia narrativa","contraste situacional + observação cotidiana"]

if(texto.match(/dragão|espada|reino/i))
return ["fantasia","vocabulário épico"]

if(texto.match(/detetive|crime|investigação/i))
return ["policial","estrutura investigativa"]

if(texto.match(/amor|relacionamento/i))
return ["romance literário","estrutura emocional"]

return ["narrativa literária geral","ausência de marcadores rígidos de gênero"]

}

function limparTitulo(texto){

let linhas = texto.split("\n")

for(let linha of linhas){

linha = linha.trim()

if(
linha.length>4 &&
!linha.match(/aqui vai|inserir|placeholder|selo/i)
)
return linha

}

return "Título não identificado com segurança"

}

function analisarTexto(){

let texto = document.getElementById("textoEntrada").value

let narrador = detectarNarrador(texto)
let genero = detectarGenero(texto)
let titulo = limparTitulo(texto)

document.getElementById("saida").innerHTML =

"<div class='linha'><b>Título provável:</b> "+titulo+"</div>"+
"<div class='linha'><b>Narrador detectado:</b> "+narrador[0]+"</div>"+
"<div class='linha'><b>Evidência:</b> "+narrador[1]+"</div>"+
"<div class='linha'><b>Gênero dominante:</b> "+genero[0]+"</div>"+
"<div class='linha'><b>Evidência:</b> "+genero[1]+"</div>"

}

</script></body>
</html>
