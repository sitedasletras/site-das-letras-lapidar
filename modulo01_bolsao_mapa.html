<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lapidar — Módulo 01 Bolsão</title>

<style>

body{
font-family:Arial;
background:#f5f1e8;
margin:0;
padding:40px;
}

.container{
max-width:700px;
margin:auto;
background:white;
padding:40px;
border-radius:12px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h1{
text-align:center;
margin-bottom:30px;
}

.upload-area{
border:2px dashed #c9b78a;
padding:40px;
text-align:center;
cursor:pointer;
border-radius:10px;
}

button{
margin-top:20px;
padding:14px 25px;
border:none;
background:#c9b78a;
color:white;
font-size:16px;
cursor:pointer;
border-radius:6px;
}

button:hover{
background:#b29e70;
}

.status{
margin-top:20px;
color:green;
}

</style>
</head>

<body>

<div class="container">

<h1>Bolsão de Limpeza Editorial</h1>

<div class="upload-area" onclick="document.getElementById('fileInput').click()">
Clique aqui para enviar sua obra
</div>

<input type="file" id="fileInput"
accept=".doc,.docx,.txt,.pdf"
style="display:none">

<div class="status" id="status"></div>

<button onclick="processarArquivo()">Ler Obra</button>

</div>


<script>


function limparSessaoAnterior(){

localStorage.removeItem("obraAtual");

}



function detectarTitulo(texto){

let linhas = texto.split("\n");

for(let linha of linhas){

linha = linha.trim();

if(linha.length > 3 && linha.length < 80 && !linha.includes(".")){

return linha;

}

}

return "Título não detectado";

}



function detectarAutor(texto){

let linhas = texto.split("\n");

for(let linha of linhas){

linha = linha.trim().toLowerCase();

if(linha.startsWith("autor") || linha.startsWith("por")){

return linha.replace("autor:", "").replace("por:", "").trim();

}

}

return "Autor não detectado";

}



function detectarCapitulos(texto){

let regex = /(capítulo\s\d+|capitulo\s\d+|chapter\s\d+|prólogo|prefácio)/gi;

let encontrados = texto.match(regex);

return encontrados ? encontrados : [];

}



function detectarInicioNarrativa(texto){

let partes = texto.split("\n");

for(let parte of partes){

if(parte.length > 200){

return parte.substring(0,150) + "...";

}

}

return "Início narrativo não detectado";

}



function processarArquivo(){

const input = document.getElementById("fileInput");

if(!input.files.length){

alert("Envie um arquivo primeiro.");

return;

}

const arquivo = input.files[0];

limparSessaoAnterior();

const reader = new FileReader();


reader.onload = function(e){

const texto = e.target.result;

const obra = {

arquivoOriginal: arquivo.name,

titulo: detectarTitulo(texto),

autor: detectarAutor(texto),

capitulos: detectarCapitulos(texto),

inicioNarrativa: detectarInicioNarrativa(texto),

textoExtraido: texto

};


localStorage.setItem("obraAtual", JSON.stringify(obra));

document.getElementById("status").innerText =
"Obra lida com sucesso. Redirecionando para Workspace...";


setTimeout(() => {

window.location.href = "obra_workspace.html";

},1500);

};


reader.readAsText(arquivo);

}


</script>

</body>
</html>
