<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lapidar • Módulo 03 — Assistente de Diagramação</title>
  <style>
    :root{
      --bg:#f7f5ef;
      --card:#ffffff;
      --line:#c9c1b2;
      --text:#2f2a24;
      --muted:#5f574c;
      --blue-soft:#e3edf7;
      --blue:#4f6f8f;
      --blue-dark:#3d5a73;
      --gold:#c79a2e;
      --gold-dark:#a77e1f;
      --sand:#d9cfbf;
      --shadow:0 12px 28px rgba(67,58,45,.10);
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family: Arial, Helvetica, sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    .container{
      max-width:980px;
      margin:0 auto;
      padding:28px 16px 40px;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      gap:12px;
      margin-bottom:18px;
    }

    .small-btn{
      border:none;
      border-radius:14px;
      padding:12px 16px;
      font-size:15px;
      font-weight:bold;
      cursor:pointer;
      background:#ece7db;
      color:var(--text);
    }

    .small-btn:hover{
      background:#e2dccd;
    }

    .hero{
      background:var(--blue-soft);
      border:1px solid var(--line);
      border-radius:28px;
      padding:30px;
      box-shadow:var(--shadow);
      margin-bottom:22px;
    }

    .eyebrow{
      display:inline-block;
      padding:8px 14px;
      border-radius:999px;
      background:#d4e3f2;
      color:#3d5f7a;
      font-size:14px;
      font-weight:bold;
      margin-bottom:14px;
    }

    h1{
      margin:0 0 10px 0;
      font-size:34px;
      line-height:1.15;
      color:#3d5f7a;
    }

    .subtitle{
      margin:0;
      font-size:20px;
      color:var(--muted);
      line-height:1.7;
    }

    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:24px;
      padding:22px;
      box-shadow:var(--shadow);
      margin-bottom:20px;
    }

    h2{
      margin:0 0 14px 0;
      font-size:28px;
      color:#3d5f7a;
    }

    p{
      margin:0 0 14px 0;
      font-size:18px;
      line-height:1.8;
    }

    label{
      display:block;
      font-size:17px;
      font-weight:bold;
      margin:14px 0 8px;
    }

    select{
      width:100%;
      padding:14px;
      border:1px solid var(--line);
      border-radius:14px;
      font-size:16px;
      background:#f7f8fb;
    }

    .mesario{
      margin-top:18px;
      background:#faf6ee;
      border:1px solid var(--line);
      border-left:7px solid var(--gold);
      border-radius:18px;
      padding:16px 18px;
    }

    .mesario h3{
      margin:0 0 8px 0;
      font-size:22px;
      color:#6a5435;
    }

    .mesario-valor{
      display:inline-block;
      margin-top:8px;
      padding:8px 12px;
      border-radius:12px;
      background:#fff7e6;
      border:1px solid #e2c98f;
      font-weight:bold;
      color:#7a5d1d;
    }

    .actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
      margin-top:18px;
    }

    .main-btn{
      width:100%;
      border:none;
      border-radius:18px;
      padding:18px 20px;
      font-size:18px;
      font-weight:bold;
      cursor:pointer;
    }

    .btn-next{
      background:var(--blue);
      color:white;
    }

    .btn-next:hover{
      background:var(--blue-dark);
    }

    .btn-skip{
      background:var(--sand);
      color:var(--text);
    }

    .btn-skip:hover{
      background:#cdc1ae;
    }

    .hidden{
      display:none !important;
    }

    @media (max-width:800px){
      .topbar,
      .actions{
        grid-template-columns:1fr;
        display:grid;
      }

      h1{ font-size:30px; }
      h2{ font-size:25px; }
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="topbar">
      <button class="small-btn" onclick="history.back()">← Retornar</button>
      <button class="small-btn" onclick="window.location.href='index.html'">Sair do sistema</button>
    </div>

    <section class="hero">
      <div class="eyebrow">Lapidar • Módulo 03</div>
      <h1>Assistente de Diagramação do Autor</h1>
      <p class="subtitle">
        Aqui é onde o seu texto ganha formato e forma de páginas para formar o seu futuro livro.
      </p>
    </section>

    <section class="card">
      <h2>Configuração inicial da diagramação</h2>

      <label for="formatoLivro">Formato do livro</label>
      <select id="formatoLivro">
        <option>A5</option>
        <option>A4</option>
        <option>16x23</option>
        <option>Infantil</option>
        <option>Pocket</option>
        <option>Personalizado</option>
      </select>

      <label for="tipografia">Tipografia</label>
      <select id="tipografia">
        <option>Times New Roman</option>
        <option>Arial</option>
        <option>Garamond</option>
      </select>

      <label for="idiomaEdicao">Idioma da edição</label>
      <select id="idiomaEdicao">
        <option>Português do Brasil</option>
        <option>Português de Portugal</option>
        <option>Português internacional lusófono</option>
        <option>Inglês dos Estados Unidos</option>
        <option>Inglês do Reino Unido</option>
        <option>Espanhol da Espanha</option>
        <option>Espanhol da América Latina</option>
      </select>

      <div class="mesario" id="mesarioSecao">
        <h3>Mesário da seção</h3>
        <p>Valor acumulado da diagramação nesta seção.</p>
        <div class="mesario-valor" id="mesarioValor">CVR sugerida desta seção: R$ 0,00</div>
      </div>

      <div class="actions">
        <button class="main-btn btn-next" onclick="seguirParaProximo()">Concluir esta etapa e seguir</button>
        <button class="main-btn btn-skip" onclick="window.location.href='motor_sequencial.html'">Pular este módulo por agora</button>
      </div>
    </section>

  </div>

  <script>
    function aplicarRegraPerfil(){
      const perfil = (localStorage.getItem("lapidar_perfil") || "").toLowerCase();
      const cortesia = perfil.includes("cortesia");
      if(cortesia){
        document.getElementById("mesarioSecao").classList.add("hidden");
      }
    }

    function seguirParaProximo(){
      window.location.href = "motor_sequencial.html";
    }

    aplicarRegraPerfil();
  </script>
</body>
</html>
