<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Módulo 03 — Assistente de Diagramação</title>

<style>

body{
margin:0;
font-family:Georgia, serif;
background:#eef2f6;
}

.topo{
background:#2c5282;
color:white;
padding:16px;
text-align:center;
font-size:24px;
font-weight:bold;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.card{
background:white;
border-radius:14px;
padding:20px;
box-shadow:0px 8px 20px rgba(0,0,0,0.08);
margin-bottom:20px;
}

.a4{

width:210mm;
min-height:297mm;
margin:auto;
background:white;
padding:18mm 16mm;

border:1px solid #ccc;

line-height:1.8;
font-size:13pt;
color:#222;

}

.meta{
text-align:center;
border-bottom:1px solid #ddd;
padding-bottom:12px;
margin-bottom:20px;
}

.meta h1{
font-size:18pt;
margin:0;
}

.meta small{
color:#666;
}

.pagina{
margin-bottom:20px;
text-align:justify;
}

.controles{

display:flex;
gap:12px;
margin-top:20px;

}

button{

padding:12px 16px;
border:none;
border-radius:8px;
cursor:pointer;
font-size:16px;

}

.botao1{
background:#2c5282;
color:white;
}

.botao2{
background:#777;
color:white;
}

.botao3{
background:#2e8b57;
color:white;
}

</style>

</head>

<body>

<div class="topo">
Módulo 03 — Assistente de Diagramação (Matriz Editorial A4)
</div>

<div class="container">

<div class="card">

<div class="a4">

<div class="meta">

<h1 id="tituloObra">
Carregando título...
</h1>

<small id="autorObra">
Carregando autor...
</small>

</div>

<div id="textoObra" class="pagina">

Carregando manuscrito...

</div>

</div>

<div class="controles">

<button class="botao3" onclick="paginaAnterior()">◀ Página anterior</button>

<button class="botao3" onclick="proximaPagina()">Próxima página ▶</button>

<button class="botao2" onclick="voltarExecutor()">Retornar ao Executor</button>

</div>

</div>

</div>

<script>

let paginaAtual = 0;
let paginas = [];

function carregarTexto(){

let texto =

localStorage.getItem("texto_obra_limpo") ||

localStorage.getItem("texto_obra") ||

"Texto ainda não carregado pelo Cofre.";

let titulo =

localStorage.getItem("matriz_editorial_titulo") ||

"Título da obra";

let autor =

localStorage.getItem("matriz_editorial_autor") ||

"Autor não identificado";

document.getElementById("tituloObra").innerText = titulo;

document.getElementById("autorObra").innerText = autor;

paginas = dividirPaginas(texto);

mostrarPagina();

}

function dividirPaginas(texto){

let tamanhoPagina = 1800;

let lista = [];

for(let i=0;i<texto.length;i+=tamanhoPagina){

lista.push(texto.substring(i,i+tamanhoPagina));

}

return lista;

}

function mostrarPagina(){

document.getElementById("textoObra").innerText = paginas[paginaAtual];

}

function proximaPagina(){

if(paginaAtual < paginas.length-1){

paginaAtual++;

mostrarPagina();

}

}

function paginaAnterior(){

if(paginaAtual > 0){

paginaAtual--;

mostrarPagina();

}

}

function voltarExecutor(){

window.location.href="modulo_executor.html";

}

carregarTexto();

</script>

</body>
</html>
