<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lapidar • Módulo 05 — Segunda Língua(s)</title>

<style>

:root{
--bg:#f7f5ef;
--card:#ffffff;
--line:#d8d2c4;
--text:#2f2a24;
--muted:#5f574c;
--title:#6b5b46;

--trad-bg:#eef6f1;
--trad-accent:#3e7d61;
--trad-accent-dark:#2f5f4a;

--soft:#ece7db;
--soft-dark:#e2dccd;

--gold:#c79a2e;
--gold-bg:#fff7e6;
}

*{box-sizing:border-box;}

body{
margin:0;
font-family:Arial;
background:var(--bg);
color:var(--text);
}

.container{
max-width:1050px;
margin:auto;
padding:28px 16px 40px;
}

.topbar{
display:flex;
justify-content:space-between;
margin-bottom:18px;
}

.small-btn{
border:none;
border-radius:14px;
padding:12px 16px;
font-size:15px;
font-weight:bold;
cursor:pointer;
background:var(--soft);
}

.small-btn:hover{
background:var(--soft-dark);
}

.hero{
background:var(--trad-bg);
border:1px solid var(--line);
border-left:8px solid var(--trad-accent);
border-radius:28px;
padding:30px;
margin-bottom:22px;
}

.eyebrow{
display:inline-block;
padding:8px 14px;
border-radius:999px;
background:#fff;
font-size:14px;
font-weight:bold;
margin-bottom:14px;
}

h1{
margin:0 0 10px 0;
font-size:34px;
color:var(--title);
}

.subtitle{
font-size:20px;
line-height:1.8;
color:var(--muted);
}

.card{
background:var(--card);
border:1px solid var(--line);
border-radius:24px;
padding:22px;
margin-bottom:18px;
}

h2{
margin:0 0 14px 0;
font-size:28px;
color:var(--title);
}

label{
display:block;
font-weight:bold;
margin:14px 0 8px;
}

select{
width:100%;
padding:14px;
border-radius:14px;
border:1px solid var(--line);
background:#f7f8fb;
}

.mesario{
margin-top:14px;
background:var(--gold-bg);
border-left:7px solid var(--gold);
border-radius:18px;
padding:16px 18px;
}

.actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
margin-top:18px;
}

.main-btn{
border:none;
border-radius:18px;
padding:18px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.btn-next{
background:var(--trad-accent);
color:white;
}

.btn-next:hover{
background:var(--trad-accent-dark);
}

.btn-skip{
background:var(--soft);
}

.hidden{
display:none!important;
}

</style>
</head>

<body>

<div class="container">

<div class="topbar">
<button class="small-btn" onclick="history.back()">← Retornar</button>
<button class="small-btn" onclick="window.location.href='index.html'">Sair do sistema</button>
</div>

<section class="hero">
<div class="eyebrow">Lapidar • Módulo 05</div>

<h1>Segunda Língua(s)</h1>

<p class="subtitle">
Aqui preparamos a travessia da sua obra para outros idiomas com segurança editorial.
</p>
</section>

<section class="card">

<h2>Idioma de destino</h2>

<label>Selecionar idioma para tradução</label>

<select>

<option>Inglês (Estados Unidos)</option>
<option>Inglês (Reino Unido)</option>
<option>Espanhol (Espanha)</option>
<option>Espanhol (América Latina)</option>
<option>Francês</option>
<option>Italiano</option>

</select>

<div class="mesario" id="mesarioSecao">

<strong>Mesário da seção</strong><br>
Valor acumulado desta tradução.<br><br>

<strong>CVR sugerida desta seção: R$ 0,00</strong>

</div>

<div class="actions">

<button class="main-btn btn-next"
onclick="window.location.href='motor_sequencial.html'">

Concluir esta etapa e seguir

</button>

<button class="main-btn btn-skip"
onclick="window.location.href='motor_sequencial.html'">

Pular este módulo por agora

</button>

</div>

</section>

</div>

<script>

function aplicarRegraPerfil(){

const perfil=(localStorage.getItem("lapidar_perfil")||"").toLowerCase();

if(perfil.includes("cortesia")){

document.getElementById("mesarioSecao").classList.add("hidden");

}

}

aplicarRegraPerfil();

</script>

</body>
</html>
