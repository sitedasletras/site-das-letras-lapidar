<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lapidar • Módulo 07 — Avaliação Literária</title>
  <style>
    :root{
      --bg:#f7f5ef;
      --card:#ffffff;
      --line:#c9c1b2;
      --text:#2f2a24;
      --muted:#5f574c;
      --red-soft:#f4e3e3;
      --red:#9a4d4d;
      --red-dark:#823c3c;
      --gold:#c79a2e;
      --sand:#d9cfbf;
      --shadow:0 12px 28px rgba(67,58,45,.10);
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family: Arial, Helvetica, sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    .container{
      max-width:980px;
      margin:0 auto;
      padding:28px 16px 40px;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      gap:12px;
      margin-bottom:18px;
    }

    .small-btn{
      border:none;
      border-radius:14px;
      padding:12px 16px;
      font-size:15px;
      font-weight:bold;
      cursor:pointer;
      background:#ece7db;
      color:var(--text);
    }

    .small-btn:hover{
      background:#e2dccd;
    }

    .hero{
      background:var(--red-soft);
      border:1px solid var(--line);
      border-radius:28px;
      padding:30px;
      box-shadow:var(--shadow);
      margin-bottom:22px;
    }

    .eyebrow{
      display:inline-block;
      padding:8px 14px;
      border-radius:999px;
      background:#edd2d2;
      color:#7a3f3f;
      font-size:14px;
      font-weight:bold;
      margin-bottom:14px;
    }

    h1{
      margin:0 0 10px 0;
      font-size:34px;
      line-height:1.15;
      color:#7a3f3f;
    }

    .subtitle{
      margin:0;
      font-size:20px;
      color:var(--muted);
      line-height:1.7;
    }

    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:24px;
      padding:22px;
      box-shadow:var(--shadow);
      margin-bottom:20px;
    }

    h2{
      margin:0 0 14px 0;
      font-size:28px;
      color:#7a3f3f;
    }

    p{
      margin:0 0 14px 0;
      font-size:18px;
      line-height:1.8;
    }

    label{
      display:block;
      font-size:17px;
      font-weight:bold;
      margin:14px 0 8px;
    }

    select{
      width:100%;
      padding:14px;
      border:1px solid var(--line);
      border-radius:14px;
      font-size:16px;
      background:#f7f8fb;
    }

    .mesario{
      margin-top:18px;
      background:#faf6ee;
      border:1px solid var(--line);
      border-left:7px solid var(--gold);
      border-radius:18px;
      padding:16px 18px;
    }

    .mesario h3{
      margin:0 0 8px 0;
      font-size:22px;
      color:#6a5435;
    }

    .mesario-valor{
      display:inline-block;
      margin-top:8px;
      padding:8px 12px;
      border-radius:12px;
      background:#fff7e6;
      border:1px solid #e2c98f;
      font-weight:bold;
      color:#7a5d1d;
    }

    .actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
      margin-top:18px;
    }

    .main-btn{
      width:100%;
      border:none;
      border-radius:18px;
      padding:18px 20px;
      font-size:18px;
      font-weight:bold;
      cursor:pointer;
    }

    .btn-next{
      background:var(--red);
      color:white;
    }

    .btn-next:hover{
      background:var(--red-dark);
    }

    .btn-skip{
      background:var(--sand);
      color:var(--text);
    }

    .btn-skip:hover{
      background:#cdc1ae;
    }

    .hidden{
      display:none !important;
    }

    @media (max-width:800px){
      .topbar,
      .actions{
        grid-template-columns:1fr;
        display:grid;
      }

      h1{ font-size:30px; }
      h2{ font-size:25px; }
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="topbar">
      <button class="small-btn" onclick="history.back()">← Retornar</button>
      <button class="small-btn" onclick="window.location.href='index.html'">Sair do sistema</button>
    </div>

    <section class="hero">
      <div class="eyebrow">Lapidar • Módulo 07</div>
      <h1>Avaliação Literária</h1>
      <p class="subtitle">
        Aqui alguém lê sua obra com atenção e te mostra o que já está bom, o que pode melhorar e como fortalecer o seu livro.
      </p>
    </section>

    <section class="card">
      <h2>Configuração inicial da avaliação</h2>

      <label for="tipoParecer">Tipo de parecer</label>
      <select id="tipoParecer">
        <option>Parecer geral da obra</option>
        <option>Parecer narrativo</option>
        <option>Parecer estrutural</option>
        <option>Parecer editorial ampliado</option>
      </select>
