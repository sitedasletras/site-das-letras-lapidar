<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lapidar • Módulo 13 — Lapidação Literária</title>

<style>

:root{
--bg:#f7f5ef;
--card:#ffffff;
--line:#d8d2c4;
--text:#2f2a24;
--muted:#5f574c;
--title:#6b5b46;

--lap-bg:#f1eef8;
--lap-accent:#6c5aa8;
--lap-accent-dark:#52448b;

--soft:#ece7db;
--soft-dark:#e2dccd;

--gold:#c79a2e;
--gold-bg:#fff7e6;
}

*{box-sizing:border-box;}

body{
margin:0;
font-family:Arial;
background:var(--bg);
color:var(--text);
}

.container{
max-width:1050px;
margin:auto;
padding:28px 16px 40px;
}

.topbar{
display:flex;
justify-content:space-between;
margin-bottom:18px;
}

.small-btn{
border:none;
border-radius:14px;
padding:12px 16px;
font-size:15px;
font-weight:bold;
cursor:pointer;
background:var(--soft);
}

.small-btn:hover{
background:var(--soft-dark);
}

.hero{
background:var(--lap-bg);
border:1px solid var(--line);
border-left:8px solid var(--lap-accent);
border-radius:28px;
padding:30px;
margin-bottom:22px;
}

.eyebrow{
display:inline-block;
padding:8px 14px;
border-radius:999px;
background:#fff;
font-size:14px;
font-weight:bold;
margin-bottom:14px;
}

h1{
margin:0 0 10px 0;
font-size:34px;
color:var(--title);
}

.subtitle{
font-size:20px;
line-height:1.8;
color:var(--muted);
}

.card{
background:var(--card);
border:1px solid var(--line);
border-radius:24px;
padding:22px;
margin-bottom:18px;
}

h2{
margin:0 0 14px 0;
font-size:28px;
color:var(--title);
}

.checkbox{
margin-bottom:10px;
font-size:18px;
}

.checkbox input{
margin-right:8px;
}

.mesario{
margin-top:14px;
background:var(--gold-bg);
border-left:7px solid var(--gold);
border-radius:18px;
padding:16px 18px;
}

.actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
margin-top:18px;
}

.main-btn{
border:none;
border-radius:18px;
padding:18px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.btn-next{
background:var(--lap-accent);
color:white;
}

.btn-next:hover{
background:var(--lap-accent-dark);
}

.btn-skip{
background:var(--soft);
}

.hidden{
display:none!important;
}

</style>
</head>

<body>

<div class="container">

<div class="topbar">

<button class="small-btn"
onclick="history.back()">

← Retornar

</button>

<button class="small-btn"
onclick="window.location.href='index.html'">

Sair do sistema

</button>

</div>

<section class="hero">

<div class="eyebrow">

Lapidar • Módulo 13

</div>

<h1>

Lapidação Literária

</h1>

<p class="subtitle">

Aqui preservamos sua voz autoral enquanto fortalecemos ritmo, clareza e coerência narrativa.

</p>

</section>

<section class="card">

<h2>

Selecione os ajustes desejados

</h2>

<label class="checkbox">

<input type="checkbox">

Humanização completa da obra

</label>

<label class="checkbox">

<input type="checkbox">

Revisão de diálogos

</label>

<label class="checkbox">

<input type="checkbox">

Coerência narrativa

</label>

<label class="checkbox">

<input type="checkbox">

Ritmo textual

</label>

<label class="checkbox">

<input type="checkbox">

Preservação de estilo autoral

</label>

<div class="mesario"
id="mesarioSecao">

<strong>

Mesário da seção

</strong>

<br>

Valor acumulado desta lapidação.

<br><br>

<strong>

CVR sugerida desta seção: R$ 0,00

</strong>

</div>

<div class="actions">

<button class="main-btn btn-next"
onclick="window.location.href='motor_sequencial.html'">

Concluir esta etapa e seguir

</button>

<button class="main-btn btn-skip"
onclick="window.location.href='motor_sequencial.html'">

Pular este módulo por agora

</button>

</div>

</section>

</div>

<script>

function aplicarRegraPerfil(){

const perfil=(localStorage.getItem("lapidar_perfil")||"").toLowerCase();

if(perfil.includes("cortesia")){

document.getElementById("mesarioSecao").classList.add("hidden");

}

}

aplicarRegraPerfil();

</script>

</body>
</html>
