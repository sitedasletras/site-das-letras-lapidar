<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lapidar • Módulo 17 — Silo Sonoro</title>

<style>

:root{
--bg:#f7f5ef;
--card:#ffffff;
--line:#c9c1b2;
--text:#2f2a24;
--muted:#5f574c;
--blue-soft:#e3edf7;
--blue:#4f6f8f;
--blue-dark:#3d5a73;
--gold:#c79a2e;
--sand:#d9cfbf;
--shadow:0 12px 28px rgba(67,58,45,.10);
}

body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:var(--bg);
color:var(--text);
}

.container{
max-width:980px;
margin:auto;
padding:28px 16px 40px;
}

.topbar{
display:flex;
justify-content:space-between;
margin-bottom:18px;
}

.small-btn{
border:none;
border-radius:14px;
padding:12px 16px;
font-size:15px;
font-weight:bold;
cursor:pointer;
background:#ece7db;
}

.small-btn:hover{
background:#e2dccd;
}

.hero{
background:var(--blue-soft);
border-radius:28px;
padding:30px;
margin-bottom:22px;
box-shadow:var(--shadow);
}

.eyebrow{
display:inline-block;
padding:8px 14px;
border-radius:999px;
background:#d4e3f2;
font-size:14px;
font-weight:bold;
margin-bottom:14px;
}

h1{
margin:0 0 10px 0;
font-size:34px;
color:#3d5a73;
}

.subtitle{
font-size:20px;
line-height:1.7;
}

.card{
background:white;
border-radius:24px;
padding:22px;
box-shadow:var(--shadow);
margin-bottom:20px;
}

h2{
margin:0 0 14px 0;
font-size:28px;
color:#3d5a73;
}

p{
font-size:18px;
line-height:1.8;
}

label{
display:block;
font-size:17px;
font-weight:bold;
margin:14px 0 8px;
}

select{
width:100%;
padding:14px;
border:1px solid var(--line);
border-radius:14px;
font-size:16px;
background:#f7f8fb;
}

.mesario{
margin-top:18px;
background:#faf6ee;
border-left:7px solid var(--gold);
border-radius:18px;
padding:16px 18px;
}

.mesario-valor{
margin-top:8px;
padding:8px 12px;
border-radius:12px;
background:#fff7e6;
border:1px solid #e2c98f;
font-weight:bold;
display:inline-block;
}

.actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
margin-top:18px;
}

.main-btn{
padding:18px;
font-size:18px;
border:none;
border-radius:18px;
cursor:pointer;
}

.btn-next{
background:var(--blue);
color:white;
}

.btn-next:hover{
background:var(--blue-dark);
}

.btn-skip{
background:var(--sand);
}

.hidden{
display:none !important;
}

@media(max-width:800px){

.topbar,
.actions{
grid-template-columns:1fr;
display:grid;
}

}

</style>

</head>

<body>

<div class="container">

<div class="topbar">
<button class="small-btn" onclick="history.back()">← Retornar</button>
<button class="small-btn" onclick="window.location.href='index.html'">Sair do sistema</button>
</div>

<section class="hero">

<div class="eyebrow">Lapidar • Módulo 17</div>

<h1>Silo Sonoro</h1>

<p class="subtitle">

Aqui sua obra ganha voz. Transformamos o texto em experiência narrada para alcançar novos leitores e ouvintes.

</p>

</section>

<section class="card">

<h2>Configuração da narração editorial</h2>

<label>Formato da narração</label>

<select>

<option>Audiobook completo</option>

<option>Narração por capítulos</option>

<option>Trechos selecionados para divulgação</option>

<option>Amostra sonora da obra</option>

</select>

<label>Estilo de voz</label>

<select>

<option>Voz narrativa neutra</option>

<option>Voz literária expressiva</option>

<option>Voz documental</option>

<option>Voz institucional</option>

</select>

<div class="mesario" id="mesarioSecao">

<h3>Mesário da seção</h3>

<p>Valor acumulado desta seção.</p>

<div class="mesario-valor">

Silo Sonoro: R$ 630,00

</div>

</div>

<div class="actions">

<button class="main-btn btn-next"

onclick="seguirParaProximo()">

Concluir esta etapa e seguir

</button>

<button class="main-btn btn-skip"

onclick="window.location.href='motor_sequencial.html'">

Pular este módulo por agora

</button>

</div>

</section>

</div>

<script>

function aplicarRegraPerfil(){

const perfil=(localStorage.getItem("lapidar_perfil")||"").toLowerCase();

if(perfil.includes("cortesia")){

document.getElementById("mesarioSecao").classList.add("hidden");

}

}

function seguirParaProximo(){

window.location.href="motor_sequencial.html";

}

aplicarRegraPerfil();

</script>

</body>
</html>
