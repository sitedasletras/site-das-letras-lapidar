<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Módulo 01 — Bolsão</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#eee8dd;
color:#2f2a24;
}

.topo{
background:#e2d8ca;
padding:18px;
text-align:center;
font-size:26px;

border-bottom:1px solid #d2c6b6;
}

.sub{

padding:10px;

}

.container{
max-width:1000px;

}

.card{
background:white;

padding:20px;

}

.card h2{

.upload-box{

}

.upload-box:hover{

}

.status{

font-weight:bold;
color:#196b3a;
}

.select{
width:100%;
padding:12px;
margin-top:10px;
border-radius:8px;
border:1px solid #ccc;
}

.botao{
width:100%;
padding:18px;
border:none;
border-radius:12px;
font-size:18px;
font-weight:bold;
cursor:pointer;
margin-top:12px;
}

.leitura{
background:#6f6559;
color:white;
}

.leitura:hover{
background:#584f45;
}

.workspace{
background:#cdbfa9;
color:#3b342c;
}

.workspace:hover{
background:#b8a98e;
}

</style>

</head>

<body>

<div class="topo">

</div>

</div>

<div class="container">

id="arquivo"
style="display:none"

<option value="Receita">
Receita
</option>

</select>

<select id="secundario"
class="select">

</option>

</option>

</option>

<option value="Paranormal">

</option>

<option value="Espírita">

</option>

<option value="Histórico">
Histórico
</option>

<option value="Vampirismo">

</option>

<option value="Zumbis">

</option>

<option value="Lobisomens">
Lobisomens
</option>

<option value="Sereias">
Sereias
</option>

</select>

<select id="terciario"
class="select">

<option value="">
Classificação terciária (opcional)
</option>

<option value="Romance">
Romance
</option>

<option value="Investigação">
Investigação
</option>

<option value="Terror">
Terror
</option>

<option value="Gótico">
Gótico
</option>

<option value="Cyberpunk">
Cyberpunk
</option>

<option value="Religioso">
Religioso
</option>

<option value="Teológico">
Teológico
</option>

<option value="Sobrenatural">
Sobrenatural
</option>

<option value="Paranormal">

<option value="Espírita">

</option>

<option value="Lobisomens">

</option>

<option value="Sereias">
Sereias
</option>

</select>

</div>

<div class="card">

<h2>Leitura estrutural</h2>

<button
class="botao leitura"
onclick="iniciarLeitura()">

Iniciar leitura estrutural

</button>

<button
class="botao workspace"
onclick="abrirWorkspace()">

Ir para Workspace da Obra

</button>

</div>

</div>

<script>

function arquivoSelecionado(event){

let arquivo=event.target.files[0]

if(!arquivo)return

document.getElementById("statusArquivo")
innerText="Arquivo recebido: "+arquivo.name

localStorage.setItem(
"lapidar_bolsao_upload",
JSON.stringify({
arquivoNome:arquivo.name
})
)

}

function iniciarLeitura(){

let dados=JSON.parse(
localStorage.getItem("lapidar_bolsao_upload")||"{}"
)

dados.principal=
document.getElementById("principal").value

dados.secundario=
document.getElementById("secundario").value

dados.terciario=
document.getElementById("terciario").value

localStorage.setItem(
"lapidar_bolsao_upload",
JSON.stringify(dados)
)

window.location.href="bolsao_limpeza.html"

}

function abrirWorkspace(){

window.location.href="obra_workspace.html"

}

</script>

</body>
</html>
