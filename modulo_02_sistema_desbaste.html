<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lapidar — Sistema Desbaste</title>

<style>

body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:#f4f6f8;
}

header{

background:#102437;
color:white;
padding:20px;
text-align:center;
font-size:22px;
font-weight:bold;

}

.container{

max-width:900px;
margin:auto;
margin-top:40px;
background:white;
padding:40px;
border-radius:14px;
box-shadow:0px 6px 20px rgba(0,0,0,0.12);

}

.etapa{

margin-bottom:30px;
padding:20px;
border-left:6px solid #0b5ed7;
background:#f8fbff;
border-radius:8px;

}

.etapa h3{

margin-top:0;

}

.status{

font-weight:bold;
margin-top:10px;

}

.botao-principal{

background:#198754;
color:white;
border:none;
padding:18px 30px;
font-size:18px;
border-radius:10px;
cursor:pointer;
margin-top:25px;

}

.botao-principal:hover{

background:#146c43;

}

.botao-desativado{

background:#999 !important;
cursor:not-allowed !important;

}

.info{

margin-top:20px;
font-size:14px;
color:#666;
text-align:center;

}

</style>

</head>

<body>

<header>

Sistema Desbaste — Consolidação Estrutural da Obra

</header>

<div class="container">

<div class="etapa">

<h3>Camada 1 — Consolidação Estrutural</h3>

<div id="status1" class="status">

Em processamento...

</div>

</div>

<div class="etapa">

<h3>Camada 2 — Leitura Narrativa</h3>

<div id="status2" class="status">

Aguardando...

</div>

</div>

<div class="etapa">

<h3>Camada 3 — Consolidação Editorial</h3>

<div id="status3" class="status">

Aguardando...

</div>

</div>

<div style="text-align:center">

<button

id="botaoWorkspace"

class="botao-principal botao-desativado"

disabled

onclick="seguirWorkspace()"

>

Seguir para Workspace da Obra

</button>

<div class="info">

O Sistema Desbaste é obrigatório antes do acesso aos módulos editoriais.

</div>

</div>

</div>

<script>

let etapaAtual = 0

function executarDesbaste(){

setTimeout(()=>{

document.getElementById("status1").innerHTML="Estrutura narrativa consolidada ✓"

etapaAtual++

executarEtapa2()

},2000)

}

function executarEtapa2(){

setTimeout(()=>{

document.getElementById("status2").innerHTML="Elementos narrativos reconhecidos ✓"

etapaAtual++

executarEtapa3()

},2000)

}

function executarEtapa3(){

setTimeout(()=>{

document.getElementById("status3").innerHTML="Ficha-base editorial preparada ✓"

etapaAtual++

finalizarDesbaste()

},2000)

}

function finalizarDesbaste(){

localStorage.setItem("desbaste_concluido","true")

let botao=document.getElementById("botaoWorkspace")

botao.disabled=false

botao.classList.remove("botao-desativado")

}

function seguirWorkspace(){

if(localStorage.getItem("desbaste_concluido")=="true"){

window.location.href="obra_workspace.html"

}

}

executarDesbaste()

</script>

</body>

</html>
