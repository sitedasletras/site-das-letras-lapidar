<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lapidar — Sistema Desbaste</title>

<style>

body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:#f4f6f8;
}

header{

background:#102437;
color:white;
padding:20px;
text-align:center;
font-size:22px;
font-weight:bold;

}

.container{

max-width:900px;
margin:auto;
margin-top:40px;
background:white;
padding:40px;
border-radius:14px;
box-shadow:0px 6px 20px rgba(0,0,0,0.12);

}

.etapa{

margin-bottom:30px;
padding:20px;
border-left:6px solid #0b5ed7;
background:#f8fbff;
border-radius:8px;

}

.etapa h3{

margin-top:0;

}

.status{

font-weight:bold;
margin-top:10px;

}

.botao-principal{

background:#198754;
color:white;
border:none;
padding:18px 30px;
font-size:18px;
border-radius:10px;
cursor:pointer;
margin-top:25px;

}

.botao-principal:hover{

background:#146c43;

}

.botao-desativado{

background:#999 !important;
cursor:not-allowed !important;

}

.info{

margin-top:20px;
font-size:14px;
color:#666;
text-align:center;

}

</style>

</head>

<body>

<header>

Sistema Desbaste — Consolidação Editorial da Obra

</header>

<div class="container">

<div class="etapa">

<h3>Etapa 1</h3>

<div id="status1" class="status">

Consolidação estrutural da obra em andamento…

</div>

</div>

<div class="etapa">

<h3>Etapa 2</h3>

<div id="status2" class="status">

Aguardando sequência de leitura editorial…

</div>

</div>

<div class="etapa">

<h3>Etapa 3</h3>

<div id="status3" class="status">

Aguardando preparação da base técnica da obra…

</div>

</div>

<div style="text-align:center">

<button

id="botaoWorkspace"

class="botao-principal botao-desativado"

disabled

onclick="seguirWorkspace()"

>

Seguir para Workspace da Obra

</button>

<div class="info">

Esta etapa é obrigatória antes do acesso aos módulos editoriais do sistema Lapidar.

</div>

</div>

</div>

<script>

function etapa1(){

setTimeout(()=>{

document.getElementById("status1").innerHTML="Estrutura geral consolidada ✓"

etapa2()

},2200)

}

function etapa2(){

document.getElementById("status2").innerHTML="Identificação de elementos narrativos principais em andamento…"

setTimeout(()=>{

document.getElementById("status2").innerHTML="Elementos narrativos identificados ✓"

etapa3()

},2600)

}

function etapa3(){

document.getElementById("status3").innerHTML="Preparação da base editorial da obra em andamento…"

setTimeout(()=>{

document.getElementById("status3").innerHTML="Base editorial consolidada ✓"

finalizarDesbaste()

},2800)

}

function finalizarDesbaste(){

localStorage.setItem("desbaste_concluido","true")

let botao=document.getElementById("botaoWorkspace")

botao.disabled=false

botao.classList.remove("botao-desativado")

}

function seguirWorkspace(){

if(localStorage.getItem("desbaste_concluido")=="true"){

window.location.href="obra_workspace.html"

}

}

etapa1()

</script>

</body>

</html>
