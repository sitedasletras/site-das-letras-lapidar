<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lapidar — Módulo 02 | Sistema Desbaste</title>
  <style>
    :root{
      --bg:#f3f5f8;
      --header:#0f2538;
      --card:#ffffff;
      --line:#d9e0e7;
      --text:#1f2d3d;
      --muted:#5c6b7a;
      --primary:#6c6256;
      --primary-dark:#5a5147;
      --info-bg:#eef6ff;
      --info-line:#0b5ed7;
      --warn-bg:#fff8e1;
      --warn-line:#d97706;
      --ok:#198754;
      --shadow:0 8px 24px rgba(0,0,0,.10);
      --radius:18px;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    .topbar{
      background:var(--header);
      color:#fff;
      padding:18px 16px;
      text-align:center;
      font-size:22px;
      font-weight:700;
    }

    .wrap{
      max-width:1100px;
      margin:24px auto 36px;
      padding:0 14px;
    }

    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:22px;
      margin-bottom:18px;
    }

    .card h2{
      margin:0 0 14px;
      font-size:1.55rem;
      color:#223548;
    }

    .etapas{
      display:grid;
      gap:14px;
      margin-bottom:18px;
    }

    .etapa{
      background:#f7f9fb;
      border:1px solid #dde5ec;
      border-left:5px solid #2f80ed;
      border-radius:14px;
      padding:16px;
    }

    .etapa strong{
      display:block;
      margin-bottom:6px;
      color:#223548;
    }

    .etapa span{
      color:#495869;
      line-height:1.45;
    }

    .grid-2{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:16px;
    }

    .box{
      background:#fafbfc;
      border:1px solid #e1e7ed;
      border-radius:14px;
      padding:18px;
    }

    .box h3{
      margin:0 0 12px;
      color:#223548;
      font-size:1.05rem;
    }

    .linha{
      padding:10px 0;
      border-bottom:1px solid #e5eaf0;
      line-height:1.45;
      font-size:15px;
    }

    .linha:last-child{border-bottom:none}

    .rotulo{
      font-weight:700;
      color:#314457;
    }

    .notice{
      margin-top:16px;
