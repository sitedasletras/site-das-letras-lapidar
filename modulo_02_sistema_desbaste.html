<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sistema Desbaste — Camadas 2 e 3</title>

<style>

body{
font-family:Georgia, serif;
background:#efe9df;
margin:0;
padding:40px;
color:#3a342d;
}

.container{
max-width:1200px;
margin:auto;
}

.card{
background:white;
border-radius:16px;
padding:25px;
margin-bottom:25px;
box-shadow:0 8px 18px rgba(0,0,0,0.08);
}

h1{
text-align:center;
margin-bottom:30px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:25px;
}

.a4-preview{

width:210mm;
height:297mm;

background:white;

margin:auto;

border:1px solid #ccc;

padding:35mm 25mm;

overflow:auto;

box-shadow:0 0 10px rgba(0,0,0,0.1);

font-size:14pt;

line-height:1.6;

}

.status{
padding:10px;
margin:5px 0;
border-radius:6px;
}

.ok{
background:#e9f7ef;
}

.warn{
background:#fff3cd;
}

.info{
background:#eef4ff;
}

button{
padding:10px 20px;
border:none;
border-radius:8px;
background:#3a342d;
color:white;
cursor:pointer;
}

button:hover{
background:black;
}

input[type="checkbox"]{
transform:scale(1.2);
margin-right:8px;
}

textarea{
width:100%;
height:200px;
}

</style>

</head>

<body>

<div class="container">

<h1>Sistema Desbaste — Leitura Estrutural Profunda</h1>

<div class="card">

<label>

<input type="checkbox" id="semAutor">

Obra sem autor identificado

</label>

</div>

<div class="grid">

<div class="card">

<h2>Camada 2 — Leitura Profunda (SAI)</h2>

<div id="estruturaResultado"></div>

</div>

<div class="card">

<h2>Camada 3 — Qualificação Editorial</h2>

<div id="qualificacaoResultado"></div>

</div>

</div>

<div class="card">

<h2>Texto da Obra — Base Técnica A4</h2>

<textarea id="textoEntrada"
placeholder="Cole aqui o texto da obra para simulação da leitura estrutural..."></textarea>

<br><br>

<button onclick="analisarTexto()">Executar Leitura Estrutural</button>

</div>

<div class="card">

<h2>Pré-visualização Técnica A4</h2>

<div class="a4-preview" id="previewA4"></div>

</div>

</div>

<script>

function analisarTexto(){

let texto=document.getElementById("textoEntrada").value;

let estrutura="";

let qualificacao="";

let capitulos=/cap[ií]tulo/i.test(texto);

let prefacio=/pref[aá]cio/i.test(texto);

let dedic=/dedicat[oó]ria/i.test(texto);

let epigrafe=/ep[ií]grafe/i.test(texto);

let prologo=/pr[oó]logo/i.test(texto);

let dialogos=/—/.test(texto);

estrutura+=capitulos?
"<div class='status ok'>Capítulos detectados</div>":
"<div class='status warn'>Capítulos não identificados</div>";

estrutura+=prefacio?
"<div class='status ok'>Prefácio identificado</div>":
"<div class='status warn'>Prefácio não identificado</div>";

estrutura+=dedic?
"<div class='status ok'>Dedicatória identificada</div>":
"<div class='status warn'>Dedicatória não identificada</div>";

estrutura+=epigrafe?
"<div class='status ok'>Epígrafe identificada</div>":
"<div class='status warn'>Epígrafe não identificada</div>";

estrutura+=prologo?
"<div class='status ok'>Prólogo identificado</div>":
"<div class='status warn'>Prólogo não identificado</div>";

estrutura+=dialogos?
"<div class='status ok'>Diálogos detectados</div>":
"<div class='status warn'>Diálogos não detectados</div>";

document.getElementById("estruturaResultado").innerHTML=estrutura;

qualificacao+="<div class='status info'>Estrutura narrativa contínua detectada</div>";

if(!prefacio)
qualificacao+="<div class='status warn'>Pré-textuais opcionais ausentes</div>";

qualificacao+="<div class='status ok'>Obra apta para preparação editorial</div>";

document.getElementById("qualificacaoResultado").innerHTML=qualificacao;

document.getElementById("previewA4").innerText=texto;

}

</script>

</body>

</html>
