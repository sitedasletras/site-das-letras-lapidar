<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lapidar — Diagramação Editorial</title>
<style>
body{margin:0;font-family:Arial;background:#f5efe5;color:#2d251b}
header{background:#6b4f1d;color:#fff;padding:20px}
main{max-width:1200px;margin:auto;padding:20px}
.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:20px;border:1px solid #eadfce}
button{padding:12px;border:none;border-radius:8px;font-weight:bold;margin-top:10px;cursor:pointer}
.btn{background:#6b4f1d;color:#fff}
.ok{color:#166534;margin-top:10px}
.erro{color:#991b1b;margin-top:10px}
.preview{border:1px solid #eadfce;padding:20px;border-radius:10px;background:#faf6ef}
</style>
</head>

<body>

<header>
<h1>Diagramação Editorial</h1>
</header>

<main>

<div class="card">

<label>Formato:</label>
<select id="formatoLivro">
<option>A5</option>
<option>14x21</option>
<option>16x23</option>
<option>A4</option>
<option>Infantil</option>
</select>

<label>Fonte:</label>
<select id="fonteLivro">
<option>Times New Roman</option>
<option>Garamond</option>
<option>Arial</option>
</select>

<label>Saída:</label>
<select id="saidaLivro">
<option value="pdf">PDF</option>
<option value="epub">EPUB</option>
<option value="pdf_epub">PDF + EPUB</option>
</select>

<button class="btn" onclick="gerar()">Gerar diagramação</button>
<button class="btn" onclick="seguir()">Seguir exportação</button>

<div id="msg"></div>

</div>

<div class="card preview" id="previewLivro">
Prévia aparecerá aqui
</div>

</main>

<script>

function gerar(){

let config={
formato:document.getElementById("formatoLivro").value,
fonte:document.getElementById("fonteLivro").value,
saida:document.getElementById("saidaLivro").value
}

localStorage.setItem("diagramacao_config",JSON.stringify(config))
localStorage.setItem("diagramacao_pronta","true")

document.getElementById("previewLivro").innerHTML=
"Miolo diagramado em "+config.formato+" com fonte "+config.fonte

document.getElementById("msg").innerHTML="<div class='ok'>Diagramação pronta</div>"

}

function seguir(){

if(localStorage.getItem("diagramacao_pronta")!="true"){
document.getElementById("msg").innerHTML="<div class='erro'>Primeiro gere a diagramação</div>"
return
}

window.location.href="ponte_diagramacao_exportacao.html"

}

</script>

</body>
</html>
