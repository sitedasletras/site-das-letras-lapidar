<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produção em vídeo da obra — Lapidar</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f1e8;
}

header{
background:#32497d;
color:white;
padding:18px;
display:flex;
justify-content:space-between;
font-size:18px;
}

.container{
max-width:900px;
margin:auto;
padding:30px;
}

.card{
background:#fff8e1;
padding:25px;
border-radius:16px;
margin-bottom:20px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
border:1px solid #f0d67a;
}

.botao{
width:100%;
padding:18px;
margin-top:12px;
border:none;
border-radius:12px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.amarelo1{
background:#ffd54f;
color:#3e2723;
}

.amarelo2{
background:#ffca28;
color:#3e2723;
}

.amarelo3{
background:#ffb300;
color:#3e2723;
}

.amarelo4{
background:#f9a825;
color:white;
}

.continuar{
background:#2e7d32;
color:white;
margin-top:22px;
}

.retornar{
background:#455a64;
color:white;
}

.apagar{
background:#b71c1c;
color:white;
}

p{
color:#5d4037;
}
</style>
</head>
<body>

<header>
<div>Produção em vídeo da obra</div>
<div>Lapidar</div>
</header>

<div class="container">
<div class="card">

<h2>Escolha o tipo de vídeo que deseja criar</h2>

<p>
Você pode escolher um ou vários. Depois o sistema organiza automaticamente.
</p>

<button class="botao amarelo1">
Criar vídeo contando a história do livro
</button>

<button class="botao amarelo2">
Criar uma cena do livro em vídeo
</button>

<button class="botao amarelo3">
Criar vídeo de apresentação do livro
</button>

<button class="botao amarelo4">
Criar vídeos curtos para Instagram, TikTok e YouTube
</button>

<button class="botao continuar" onclick="seguir()">
Continuar com as escolhas feitas
</button>

<button class="botao retornar" onclick="retornar()">
Voltar para escolher outro tipo de produção
</button>

<button class="botao apagar" onclick="limpar()">
Apagar escolhas desta tela
</button>

</div>
</div>

<script>
function seguir(){
window.location.href="/confirmacao_final_modulos.html";
}

function retornar(){
window.location.href="/selecionar_modulos.html";
}

function limpar(){
location.reload();
}
</script>

</body>
</html>
