<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Produção em vídeo da obra — Lapidar</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f4f1e8;
}

header{
background:#32497d;
color:white;
padding:18px;
display:flex;
justify-content:space-between;
font-size:18px;
}

.container{
max-width:900px;
margin:auto;
padding:30px;
}

.card{
background:white;
padding:25px;
border-radius:16px;
margin-bottom:20px;
box-shadow:0px 8px 20px rgba(0,0,0,.08);
}

.botao{
width:100%;
padding:18px;
margin-top:12px;
border:none;
border-radius:12px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.video_historia{
background:#ffb300;
color:black;
}

.video_cena{
background:#6b8ec1;
color:white;
}

.video_apresentacao{
background:#8e24aa;
color:white;
}

.video_redes{
background:#2e7d32;
color:white;
}

.outros{
background:#455a64;
color:white;
margin-top:25px;
}

.limpar{
background:#b71c1c;
color:white;
}

</style>
</head>

<body>

<header>

<div>Produção em vídeo da obra</div>

<div>Lapidar</div>

</header>


<div class="container">

<div class="card">

<h2>Escolha o tipo de vídeo que deseja criar</h2>

<p>
Você pode escolher um ou vários.
Depois o sistema organiza automaticamente.
</p>


<button class="botao video_historia">

Criar vídeo contando a história do livro

</button>


<button class="botao video_cena">

Criar uma cena do livro em vídeo

</button>


<button class="botao video_apresentacao">

Criar vídeo de apresentação do livro

</button>


<button class="botao video_redes">

Criar vídeos curtos para Instagram, TikTok e YouTube

</button>


<button class="botao outros" onclick="seguir()">

Quero escolher outros tipos de produção

</button>


<button class="botao limpar" onclick="limpar()">

Apagar escolhas desta tela

</button>


</div>

</div>


<script>

function seguir(){

window.location.href="confirmacao_final_modulos.html"

}

function limpar(){

location.reload()

}

</script>

</body>
</html>
