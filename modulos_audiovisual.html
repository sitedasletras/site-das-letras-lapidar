<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Módulos audiovisuais — Lapidar</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f4f1e8;
}

header{
background:#32497d;
color:white;
padding:18px;
display:flex;
justify-content:space-between;
font-size:18px;
}

.container{
max-width:900px;
margin:auto;
padding:30px;
}

.card{
background:white;
padding:25px;
border-radius:16px;
margin-bottom:20px;
box-shadow:0px 8px 20px rgba(0,0,0,.08);
}

.botao{
width:100%;
padding:18px;
margin-top:12px;
border:none;
border-radius:12px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.storyboard{
background:#ffb300;
color:black;
}

.cena{
background:#6b8ec1;
color:white;
}

.trailer{
background:#8e24aa;
color:white;
}

.exportacao{
background:#2e7d32;
color:white;
}

.continuar{
background:#455a64;
color:white;
margin-top:25px;
}

</style>
</head>

<body>

<header>

<div>Módulos audiovisuais disponíveis</div>

<div>Lapidar</div>

</header>


<div class="container">

<div class="card">

<h2>Escolha os módulos cinematológicos</h2>

<p>
Selecione os recursos audiovisuais desejados para sua obra.
</p>


<button class="botao storyboard">
Storyboard narrativo
</button>


<button class="botao cena">
Cena dramatizada cinematológica
</button>


<button class="botao trailer">
Trailer editorial da obra
</button>


<button class="botao exportacao">
Exportação multiplataforma (Reels / Shorts / TikTok / YouTube)
</button>


<button
class="botao continuar"
onclick="seguir()"
>

Continuar para confirmação final

</button>


</div>

</div>


<script>

function seguir(){

window.location.href="confirmacao_final_modulos.html"

}

</script>

</body>
</html>
