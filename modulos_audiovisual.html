<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produção em vídeo da obra — Lapidar</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f1e8;
}

header{
background:#32497d;
color:white;
padding:18px;
display:flex;
justify-content:space-between;
font-size:18px;
}

.container{
max-width:900px;
margin:auto;
padding:30px;
}

.card{
background:#fff8e1;
padding:25px;
border-radius:16px;
margin-bottom:20px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
border:1px solid #f0d67a;
}

.botao{
width:100%;
padding:18px;
margin-top:12px;
border:none;
border-radius:12px;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:0.2s;
}

.amarelo1{
background:#ffd54f;
color:#3e2723;
}

.amarelo2{
background:#ffca28;
color:#3e2723;
}

.amarelo3{
background:#ffb300;
color:#3e2723;
}

.amarelo4{
background:#f9a825;
color:white;
}

.ativo{
outline:4px solid #8d6e00;
transform:scale(1.01);
}

.continuar{
background:#2e7d32;
color:white;
margin-top:22px;
}

.retornar{
background:#607d8b;
color:white;
}

.apagar{
background:#b71c1c;
color:white;
}

p{
color:#5d4037;
}
</style>
</head>
<body>

<header>
<div>Produção em vídeo da obra</div>
<div>Lapidar</div>
</header>

<div class="container">
<div class="card">

<h2>Escolha o tipo de vídeo que deseja criar</h2>

<p>
Você pode escolher um ou vários. Depois o sistema organiza automaticamente.
</p>

<button class="botao amarelo1" id="btnHistoria" onclick="toggleEscolha('video_historia','btnHistoria')">
Criar vídeo contando a história do livro
</button>

<button class="botao amarelo2" id="btnCena" onclick="toggleEscolha('video_cena','btnCena')">
Criar uma cena do livro em vídeo
</button>

<button class="botao amarelo3" id="btnApresentacao" onclick="toggleEscolha('video_apresentacao','btnApresentacao')">
Criar vídeo de apresentação do livro
</button>

<button class="botao amarelo4" id="btnRedes" onclick="toggleEscolha('video_redes','btnRedes')">
Criar vídeos curtos para Instagram, TikTok e YouTube
</button>

<button class="botao continuar" onclick="seguirFluxo()">
Continuar com as escolhas feitas
</button>

<button class="botao retornar" onclick="retornar()">
Voltar para escolher outro tipo de produção
</button>

<button class="botao apagar" onclick="limpar()">
Apagar escolhas desta tela
</button>

</div>
</div>

<script>

function toggleEscolha(chave,idBotao){

if(localStorage.getItem(chave)==="sim"){
localStorage.removeItem(chave);
document.getElementById(idBotao).classList.remove("ativo");
}else{
localStorage.setItem(chave,"sim");
document.getElementById(idBotao).classList.add("ativo");
}

}

function temLivro(){
return (
localStorage.getItem("correcao_recomendada")==="sim" ||
localStorage.getItem("lapidacao_texto")==="sim" ||
localStorage.getItem("traducao_livro")==="sim" ||
localStorage.getItem("diagramacao_livro")==="sim" ||
localStorage.getItem("capa_livro")==="sim" ||
localStorage.getItem("estrutura_livro")==="sim" ||
localStorage.getItem("qualidade_livro")==="sim"
);
}

function temMusica(){
return (
localStorage.getItem("narracao_voz")==="sim" ||
localStorage.getItem("audiolivro")==="sim" ||
localStorage.getItem("trilha_sonora")==="sim" ||
localStorage.getItem("musica_tema")==="sim" ||
localStorage.getItem("versao_cantada")==="sim" ||
localStorage.getItem("distribuicao_audio")==="sim"
);
}

function seguirFluxo(){

localStorage.setItem("modulo_audiovisual_configurado","sim");

if(!temLivro()){
window.location.href="/alerta_correcao_antes_audiovisual.html";
return;
}

if(temMusica() && localStorage.getItem("modulo_musica_configurado")!=="sim"){
window.location.href="/modulos_musica.html";
return;
}

window.location.href="/confirmacao_final_modulos.html";
}

function retornar(){
window.location.href="/selecionar_modulos.html";
}

function limpar(){

localStorage.removeItem("video_historia");
localStorage.removeItem("video_cena");
localStorage.removeItem("video_apresentacao");
localStorage.removeItem("video_redes");
localStorage.removeItem("modulo_audiovisual_configurado");

location.reload();
}

window.onload=function(){

if(localStorage.getItem("video_historia")==="sim"){
document.getElementById("btnHistoria").classList.add("ativo");
}

if(localStorage.getItem("video_cena")==="sim"){
document.getElementById("btnCena").classList.add("ativo");
}

if(localStorage.getItem("video_apresentacao")==="sim"){
document.getElementById("btnApresentacao").classList.add("ativo");
}

if(localStorage.getItem("video_redes")==="sim"){
document.getElementById("btnRedes").classList.add("ativo");
}

}

</script>

</body>
</html>
