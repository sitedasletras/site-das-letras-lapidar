<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Módulos Audiovisuais — Lapidar</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f8f1df;
color:#2a2a2a;
}

header{
background:#9a7b13;
color:white;
padding:16px 20px;
display:flex;
justify-content:space-between;
align-items:center;
font-size:18px;
}

.container{
max-width:960px;
margin:auto;
padding:28px;
}

.card{
background:white;
border-radius:18px;
padding:26px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
border:1px solid #ead9a5;
}

h1{
margin:0 0 12px 0;
font-size:32px;
color:#5a4600;
}

p{
margin:0 0 20px 0;
font-size:18px;
line-height:1.6;
color:#66573a;
}

.botao{
width:100%;
padding:18px;
margin-top:14px;
border:none;
border-radius:12px;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:0.2s;
}

.amarelo{
background:#c19b2e;
color:white;
}

.amarelo-escuro{
background:#8c6f12;
color:white;
}

.ativo{
outline:4px solid rgba(0,0,0,.18);
transform:scale(1.01);
}

.info{
margin-top:20px;
padding:14px 16px;
border-radius:12px;
background:#fff6d8;
color:#6a5600;
font-weight:bold;
display:none;
}
</style>
</head>
<body>

<header>
<div>Módulos audiovisuais</div>
<div>Lapidar</div>
</header>

<div class="container">
<div class="card">

<h1>Selecione os módulos audiovisuais</h1>

<p>
Escolha quais etapas audiovisuais deseja executar agora.
Você pode voltar depois e ativar novos módulos se quiser.
</p>

<button class="botao amarelo" id="btnHistoria"
onclick="toggleModuloAudiovisual('video_historia','btnHistoria','Vídeo da história selecionado')">
Criar vídeo contando a história do livro
</button>

<button class="botao amarelo" id="btnCena"
onclick="toggleModuloAudiovisual('video_cena','btnCena','Cena dramatizada selecionada')">
Criar uma cena do livro em vídeo
</button>

<button class="botao amarelo" id="btnApresentacao"
onclick="toggleModuloAudiovisual('video_apresentacao','btnApresentacao','Vídeo de apresentação selecionado')">
Criar vídeo de apresentação do livro
</button>

<button class="botao amarelo" id="btnRedes"
onclick="toggleModuloAudiovisual('video_redes','btnRedes','Vídeos curtos para redes sociais selecionados')">
Criar vídeos curtos para Instagram, TikTok e YouTube
</button>

<button class="botao amarelo-escuro" onclick="continuarFluxoAudiovisual()">
Continuar execução audiovisual
</button>

<div class="info" id="statusAudiovisual">
Seleção registrada. Preparando execução audiovisual.
</div>

</div>
</div>

<script src="/auditoria.js"></script>
<script>
function marcarVisualInicial(){
const modulos = [
["video_historia","btnHistoria"],
["video_cena","btnCena"],
["video_apresentacao","btnApresentacao"],
["video_redes","btnRedes"]
];

modulos.forEach(function(item){
if(localStorage.getItem(item[0])==="sim"){
document.getElementById(item[1]).classList.add("ativo");
}
});
}

async function toggleModuloAudiovisual(chave,idBotao,mensagem){
const botao = document.getElementById(idBotao);

if(localStorage.getItem(chave)==="sim"){
localStorage.removeItem(chave);
botao.classList.remove("ativo");

await LapidarAuditoria.registrarEvento("Módulo audiovisual removido",{
modulo:chave
});
}else{
localStorage.setItem(chave,"sim");
botao.classList.add("ativo");

await LapidarAuditoria.registrarEvento(mensagem,{
modulo:chave
});
}
}

async function continuarFluxoAudiovisual(){
const selecionados = [
"video_historia",
"video_cena",
"video_apresentacao",
"video_redes"
];

let algumSelecionado=false;

selecionados.forEach(function(mod){
if(localStorage.getItem(mod)==="sim"){
algumSelecionado=true;
}
});

if(!algumSelecionado){
alert("Selecione pelo menos um módulo audiovisual.");
return;
}

document.getElementById("statusAudiovisual").style.display="block";

await LapidarAuditoria.registrarEvento("Execução audiovisual iniciada",{
videoHistoria:localStorage.getItem("video_historia")||"nao",
videoCena:localStorage.getItem("video_cena")||"nao",
videoApresentacao:localStorage.getItem("video_apresentacao")||"nao",
videoRedes:localStorage.getItem("video_redes")||"nao"
});

await LapidarAuditoria.encerrarSessaoModulo("modulos_audiovisual");

setTimeout(function(){
window.location.href="/painel_execucao_obra.html";
},800);
}

window.onload = async function(){
await LapidarAuditoria.iniciarSessaoModulo("modulos_audiovisual");
await LapidarAuditoria.registrarEvento("Tela de módulos audiovisuais aberta",{});
marcarVisualInicial();
};
</script>

</body>
</html>
