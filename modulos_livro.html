<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Produção do livro — Lapidar</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f4f1e8;
}

header{
background:#32497d;
color:white;
padding:18px;
display:flex;
justify-content:space-between;
font-size:18px;
}

.container{
max-width:900px;
margin:auto;
padding:30px;
}

.card{
background:white;
padding:25px;
border-radius:16px;
margin-bottom:20px;
box-shadow:0px 8px 20px rgba(0,0,0,.08);
}

.destaque{
background:#e8f5e9;
padding:15px;
border-radius:12px;
margin-bottom:20px;
font-weight:bold;
}

.botao{
width:100%;
padding:18px;
margin-top:12px;
border:none;
border-radius:12px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.organizar{
background:#2e7d32;
color:white;
}

.diagramar{
background:#1565c0;
color:white;
}

.capa{
background:#ffb300;
color:black;
}

.traduzir{
background:#8e24aa;
color:white;
}

.avaliar{
background:#455a64;
color:white;
}

.estrutura{
background:#00897b;
color:white;
}

.melhorar{
background:#6d4c41;
color:white;
}

.continuar{
background:#1b5e20;
color:white;
margin-top:20px;
}

.outros{
background:#5d4037;
color:white;
}

.limpar{
background:#b71c1c;
color:white;
}

</style>
</head>

<body>

<header>

<div>Produção do livro</div>

<div>Lapidar</div>

</header>


<div class="container">

<div class="card">

<h2>Escolha o que deseja fazer com seu livro</h2>

<div class="destaque">

Se você está começando agora, recomendamos iniciar por:
Organizar e limpar o texto do livro

</div>


<button class="botao organizar">

Organizar e limpar o texto do livro

</button>


<button class="botao diagramar">

Preparar o livro para impressão

</button>


<button class="botao capa">

Criar a capa do livro

</button>


<button class="botao traduzir">

Traduzir o livro para outro idioma

</button>


<button class="botao estrutura">

Ver como a história do seu livro está organizada

</button>


<button class="botao avaliar">

Ver se o seu livro está bom e o que pode melhorar

</button>


<button class="botao melhorar">

Melhorar a escrita do livro

</button>


<button class="botao continuar" onclick="seguir()">

Continuar com as escolhas feitas

</button>


<button class="botao outros" onclick="outros()">

Quero escolher outros tipos de produção

</button>


<button class="botao limpar" onclick="limpar()">

Apagar escolhas desta tela

</button>


</div>

</div>


<script>

function seguir(){

window.location.href="confirmacao_final_modulos.html"

}

function outros(){

window.location.href="selecionar_modulos.html"

}

function limpar(){

location.reload()

}

</script>

</body>
</html>
