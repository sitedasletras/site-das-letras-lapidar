<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produção editorial do livro — Lapidar</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f1e8;
}

header{
background:#32497d;
color:white;
padding:18px;
display:flex;
justify-content:space-between;
font-size:18px;
}

.container{
max-width:900px;
margin:auto;
padding:30px;
}

.card{
background:#eaf1fb;
padding:25px;
border-radius:16px;
margin-bottom:20px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
border:1px solid #c5d6f2;
}

.botao{
width:100%;
padding:18px;
margin-top:12px;
border:none;
border-radius:12px;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:0.2s;
}

.azul1{background:#7ea2d6;color:white;}
.azul2{background:#6f95cc;color:white;}
.azul3{background:#6188c1;color:white;}
.azul4{background:#537bb7;color:white;}
.azul5{background:#456eac;color:white;}
.azul6{background:#3761a2;color:white;}
.azul7{background:#295497;color:white;}

.ativo{
outline:4px solid #163d73;
transform:scale(1.01);
}

.continuar{
background:#2e7d32;
color:white;
margin-top:22px;
}

.retornar{
background:#607d8b;
color:white;
}

.apagar{
background:#b71c1c;
color:white;
}

p{
color:#2f3e55;
}
</style>
</head>
<body>

<header>
<div>Produção editorial do livro</div>
<div>Lapidar</div>
</header>

<div class="container">
<div class="card">

<h2>Escolha o que deseja fazer com seu livro</h2>

<p>
Você pode escolher um ou vários. Depois você entra na configuração editorial.
</p>

<button class="botao azul1" id="btnCorrecao" onclick="toggleEscolha('correcao_recomendada','btnCorrecao')">
Corrigir ortografia e gramática
</button>

<button class="botao azul2" id="btnLapidacao" onclick="toggleEscolha('lapidacao_texto','btnLapidacao')">
Melhorar a escrita do texto
</button>

<button class="botao azul3" id="btnTraducao" onclick="toggleEscolha('traducao_livro','btnTraducao')">
Traduzir o livro para outro idioma
</button>

<button class="botao azul4" id="btnDiagramacao" onclick="toggleEscolha('diagramacao_livro','btnDiagramacao')">
Preparar o livro para impressão
</button>

<button class="botao azul5" id="btnCapa" onclick="toggleEscolha('capa_livro','btnCapa')">
Criar a capa do livro
</button>

<button class="botao azul6" id="btnEstrutura" onclick="toggleEscolha('estrutura_livro','btnEstrutura')">
Ver como a história do seu livro está organizada
</button>

<button class="botao azul7" id="btnQualidade" onclick="toggleEscolha('qualidade_livro','btnQualidade')">
Ver se o seu livro está bom e o que pode melhorar
</button>

<button class="botao continuar" onclick="seguirFluxo()">
Continuar com as escolhas feitas
</button>

<button class="botao retornar" onclick="retornar()">
Voltar para escolher outro tipo de produção
</button>

<button class="botao apagar" onclick="limpar()">
Apagar escolhas desta tela
</button>

</div>
</div>

<script>
function toggleEscolha(chave,idBotao){
if(localStorage.getItem(chave)==="sim"){
localStorage.removeItem(chave);
document.getElementById(idBotao).classList.remove("ativo");
}else{
localStorage.setItem(chave,"sim");
document.getElementById(idBotao).classList.add("ativo");
}
}

function seguirFluxo(){
localStorage.setItem("modulo_livro_configurado","sim");
window.location.href="/editorial_livro_configuracao.html";
}

function retornar(){
window.location.href="/selecionar_modulos.html";
}

function limpar(){
localStorage.removeItem("correcao_recomendada");
localStorage.removeItem("lapidacao_texto");
localStorage.removeItem("traducao_livro");
localStorage.removeItem("diagramacao_livro");
localStorage.removeItem("capa_livro");
localStorage.removeItem("estrutura_livro");
localStorage.removeItem("qualidade_livro");
localStorage.removeItem("modulo_livro_configurado");
location.reload();
}

window.onload=function(){
if(localStorage.getItem("correcao_recomendada")==="sim"){
document.getElementById("btnCorrecao").classList.add("ativo");
}
if(localStorage.getItem("lapidacao_texto")==="sim"){
document.getElementById("btnLapidacao").classList.add("ativo");
}
if(localStorage.getItem("traducao_livro")==="sim"){
document.getElementById("btnTraducao").classList.add("ativo");
}
if(localStorage.getItem("diagramacao_livro")==="sim"){
document.getElementById("btnDiagramacao").classList.add("ativo");
}
if(localStorage.getItem("capa_livro")==="sim"){
document.getElementById("btnCapa").classList.add("ativo");
}
if(localStorage.getItem("estrutura_livro")==="sim"){
document.getElementById("btnEstrutura").classList.add("ativo");
}
if(localStorage.getItem("qualidade_livro")==="sim"){
document.getElementById("btnQualidade").classList.add("ativo");
}
}
</script>

</body>
</html>
