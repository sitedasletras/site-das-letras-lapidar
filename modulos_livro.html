<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Módulos editoriais — Lapidar</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f4f1e8;
}

header{
background:#32497d;
color:white;
padding:18px;
display:flex;
justify-content:space-between;
font-size:18px;
}

.container{
max-width:900px;
margin:auto;
padding:30px;
}

.card{
background:white;
padding:25px;
border-radius:16px;
margin-bottom:20px;
box-shadow:0px 8px 20px rgba(0,0,0,.08);
}

.botao{
width:100%;
padding:18px;
margin-top:10px;
border:none;
border-radius:12px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.bolsa{
background:#2e7d32;
color:white;
}

.diagramacao{
background:#1565c0;
color:white;
}

.capista{
background:#ffb300;
color:black;
}

.traducao{
background:#8e24aa;
color:white;
}

.avaliacao{
background:#455a64;
color:white;
}

.humanizacao{
background:#00897b;
color:white;
}

</style>
</head>

<body>

<header>

<div>Módulos editoriais disponíveis</div>

<div>Lapidar</div>

</header>


<div class="container">

<div class="card">

<h2>Escolha os módulos da produção editorial</h2>

<p>
Você pode escolher um ou vários módulos.
O sistema seguirá a ordem técnica automaticamente.
</p>


<button class="botao bolsa">

Módulo 01 — Bolsão de limpeza editorial

</button>


<button class="botao diagramacao">

Módulo 03 — Assistente de diagramação

</button>


<button class="botao capista">

Módulo 05 — OKapista

</button>


<button class="botao traducao">

Módulo 07 — Segunda Língua(s)

</button>


<button class="botao avaliacao">

Módulo 09 — Avaliação literária

</button>


<button class="botao humanizacao">

Módulo 11 — Lapidação literária

</button>


</div>

</div>

</body>
</html>
