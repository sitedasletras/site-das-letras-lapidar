<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Módulos do Livro — Lapidar</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#eef2fa;
color:#2a2a2a;
}

header{
background:#2f4f8f;
color:white;
padding:16px 20px;
display:flex;
justify-content:space-between;
align-items:center;
font-size:18px;
}

.container{
max-width:960px;
margin:auto;
padding:28px;
}

.card{
background:white;
border-radius:18px;
padding:26px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
border:1px solid #dce4f4;
}

h1{
margin:0 0 12px 0;
font-size:32px;
color:#2f3e55;
}

p{
margin:0 0 20px 0;
font-size:18px;
line-height:1.6;
color:#555;
}

.botao{
width:100%;
padding:18px;
margin-top:14px;
border:none;
border-radius:12px;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:0.2s;
}

.azul{
background:#6f95cc;
color:white;
}

.azul-escuro{
background:#32497d;
color:white;
}

.ativo{
outline:4px solid rgba(0,0,0,.18);
transform:scale(1.01);
}

.info{
margin-top:20px;
padding:14px 16px;
border-radius:12px;
background:#e9f2ff;
color:#1a3d7c;
font-weight:bold;
display:none;
}
</style>
</head>
<body>

<header>
<div>Módulos editoriais</div>
<div>Lapidar</div>
</header>

<div class="container">
<div class="card">

<h1>Selecione os módulos do livro</h1>

<p>
Escolha quais etapas editoriais deseja executar agora.  
Você pode voltar depois e ativar novos módulos se quiser.
</p>

<button class="botao azul" id="btnDiagramacao"
onclick="toggleModuloLivro('modulo_diagramacao','btnDiagramacao','Diagramação selecionada')">
Assistente de Diagramação do Autor
</button>

<button class="botao azul" id="btnCapista"
onclick="toggleModuloLivro('modulo_capista','btnCapista','OKapista selecionado')">
OKapista — Criação de capa
</button>

<button class="botao azul" id="btnSegundaLingua"
onclick="toggleModuloLivro('modulo_segunda_lingua','btnSegundaLingua','Segunda Língua selecionada')">
Segunda Língua(s)
</button>

<button class="botao azul" id="btnAvaliacao"
onclick="toggleModuloLivro('modulo_avaliacao','btnAvaliacao','Avaliação Literária selecionada')">
Avaliação Literária
</button>

<button class="botao azul" id="btnAnalisador"
onclick="toggleModuloLivro('modulo_analisador','btnAnalisador','Analisador de obra selecionado')">
Analisador de Obra
</button>

<button class="botao azul" id="btnLapidacao"
onclick="toggleModuloLivro('modulo_lapidacao','btnLapidacao','Lapidação Literária selecionada')">
Lapidação Literária
</button>

<button class="botao azul-escuro"
onclick="continuarFluxoLivro()">
Continuar execução editorial
</button>

<div class="info" id="statusLivro">
Seleção registrada. Preparando execução editorial.
</div>

</div>
</div>

<script src="/auditoria.js"></script>

<script>

function marcarVisualInicial(){

const modulos = [
["modulo_diagramacao","btnDiagramacao"],
["modulo_capista","btnCapista"],
["modulo_segunda_lingua","btnSegundaLingua"],
["modulo_avaliacao","btnAvaliacao"],
["modulo_analisador","btnAnalisador"],
["modulo_lapidacao","btnLapidacao"]
];

modulos.forEach(function(item){

if(localStorage.getItem(item[0])==="sim"){

document.getElementById(item[1]).classList.add("ativo");

}

});

}

function toggleModuloLivro(chave,idBotao,mensagem){

const botao = document.getElementById(idBotao);

if(localStorage.getItem(chave)==="sim"){

localStorage.removeItem(chave);

botao.classList.remove("ativo");

LapidarAuditoria.registrarEvento("Módulo editorial removido",{
modulo:chave
});

}else{

localStorage.setItem(chave,"sim");

botao.classList.add("ativo");

LapidarAuditoria.registrarEvento(mensagem,{
modulo:chave
});

}

}

function continuarFluxoLivro(){

const selecionados = [

"modulo_diagramacao",
"modulo_capista",
"modulo_segunda_lingua",
"modulo_avaliacao",
"modulo_analisador",
"modulo_lapidacao"

];

let algumSelecionado=false;

selecionados.forEach(function(mod){

if(localStorage.getItem(mod)==="sim"){

algumSelecionado=true;

}

});

if(!algumSelecionado){

alert("Selecione pelo menos um módulo editorial.");

return;

}

document.getElementById("statusLivro").style.display="block";

LapidarAuditoria.registrarEvento("Execução editorial iniciada",{

diagramacao:localStorage.getItem("modulo_diagramacao")||"nao",

capista:localStorage.getItem("modulo_capista")||"nao",

segundaLingua:localStorage.getItem("modulo_segunda_lingua")||"nao",

avaliacao:localStorage.getItem("modulo_avaliacao")||"nao",

analisador:localStorage.getItem("modulo_analisador")||"nao",

lapidacao:localStorage.getItem("modulo_lapidacao")||"nao"

});

setTimeout(function(){

window.location.href="/painel_execucao_obra.html";

},800);

}

window.onload=function(){

marcarVisualInicial();

LapidarAuditoria.registrarEvento("Tela de módulos editoriais aberta",{});

};

</script>

</body>
</html>
