<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produção do livro — Lapidar</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f1e8;
}

header{
background:#32497d;
color:white;
padding:18px;
display:flex;
justify-content:space-between;
font-size:18px;
}

.container{
max-width:900px;
margin:auto;
padding:30px;
}

.card{
background:#eaf1fb;
padding:25px;
border-radius:16px;
margin-bottom:20px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
border:1px solid #c5d6f2;
}

.botao{
width:100%;
padding:18px;
margin-top:12px;
border:none;
border-radius:12px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

/* família azul do livro */
.azul1{background:#7ea2d6;color:white;}
.azul2{background:#6f95cc;color:white;}
.azul3{background:#6188c1;color:white;}
.azul4{background:#537bb7;color:white;}
.azul5{background:#456eac;color:white;}
.azul6{background:#3761a2;color:white;}
.azul7{background:#295497;color:white;}

/* padrões fixos do sistema */
.continuar{background:#2e7d32;color:white;margin-top:22px;}
.retornar{background:#607d8b;color:white;}
.apagar{background:#b71c1c;color:white;}

p{
color:#2f3e55;
}
</style>
</head>
<body>

<header>
<div>Produção do livro</div>
<div>Lapidar</div>
</header>

<div class="container">
<div class="card">

<h2>Escolha o que deseja fazer com seu livro</h2>

<p>
Você pode escolher um ou vários. Depois o sistema organiza automaticamente.
</p>

<button class="botao azul1">
Organizar e limpar o texto do livro
</button>

<button class="botao azul2">
Preparar o livro para impressão
</button>

<button class="botao azul3">
Criar a capa do livro
</button>

<button class="botao azul4">
Traduzir o livro para outro idioma
</button>

<button class="botao azul5">
Ver como a história do seu livro está organizada
</button>

<button class="botao azul6">
Ver se o seu livro está bom e o que pode melhorar
</button>

<button class="botao azul7">
Melhorar a escrita do livro
</button>

<button class="botao continuar" onclick="seguir()">
Continuar com as escolhas feitas
</button>

<button class="botao retornar" onclick="retornar()">
Voltar para escolher outro tipo de produção
</button>

<button class="botao apagar" onclick="limpar()">
Apagar escolhas desta tela
</button>

</div>
</div>

<script>
function seguir(){
window.location.href="/confirmacao_final_modulos.html";
}

function retornar(){
window.location.href="/selecionar_modulos.html";
}

function limpar(){
location.reload();
}
</script>

</body>
</html>
