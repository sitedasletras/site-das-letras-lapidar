<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Módulos de Voz e Música — Lapidar</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#eef7ef;
color:#2a2a2a;
}

header{
background:#2f7d4f;
color:white;
padding:16px 20px;
display:flex;
justify-content:space-between;
align-items:center;
font-size:18px;
}

.container{
max-width:960px;
margin:auto;
padding:28px;
}

.card{
background:white;
border-radius:18px;
padding:26px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
border:1px solid #cfe6d2;
}

h1{
margin:0 0 12px 0;
font-size:32px;
color:#24543a;
}

p{
margin:0 0 20px 0;
font-size:18px;
line-height:1.6;
color:#4f6657;
}

.botao{
width:100%;
padding:18px;
margin-top:14px;
border:none;
border-radius:12px;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:0.2s;
}

.verde{
background:#5aa07a;
color:white;
}

.verde-escuro{
background:#2f7d4f;
color:white;
}

.ativo{
outline:4px solid rgba(0,0,0,.18);
transform:scale(1.01);
}

.info{
margin-top:20px;
padding:14px 16px;
border-radius:12px;
background:#e8f6eb;
color:#1f5b34;
font-weight:bold;
display:none;
}
</style>
</head>
<body>

<header>
<div>Módulos de voz e música</div>
<div>Lapidar</div>
</header>

<div class="container">
<div class="card">

<h1>Selecione os módulos de voz e música</h1>

<p>
Escolha quais etapas sonoras deseja executar agora.
Você pode voltar depois e ativar novos módulos se quiser.
</p>

<button class="botao verde" id="btnNarracao"
onclick="toggleModuloMusica('narracao_voz','btnNarracao','Narração com voz selecionada')">
Transformar o livro em narração com voz
</button>

<button class="botao verde" id="btnAudiolivro"
onclick="toggleModuloMusica('audiolivro','btnAudiolivro','Audiolivro selecionado')">
Criar audiolivro completo
</button>

<button class="botao verde" id="btnDramatizada"
onclick="toggleModuloMusica('leitura_dramatizada','btnDramatizada','Leitura dramatizada selecionada')">
Criar leitura dramatizada
</button>

<button class="botao verde" id="btnTrilha"
onclick="toggleModuloMusica('trilha_sonora','btnTrilha','Trilha sonora selecionada')">
Criar trilha sonora inspirada no livro
</button>

<button class="botao verde" id="btnTema"
onclick="toggleModuloMusica('musica_tema','btnTema','Música tema selecionada')">
Criar música tema da obra
</button>

<button class="botao verde" id="btnCantada"
onclick="toggleModuloMusica('versao_cantada','btnCantada','Versão cantada selecionada')">
Criar versão cantada de trechos do livro
</button>

<button class="botao verde" id="btnDistribuicao"
onclick="toggleModuloMusica('distribuicao_audio','btnDistribuicao','Distribuição em plataformas de áudio selecionada')">
Preparar distribuição nas plataformas de áudio
</button>

<button class="botao verde-escuro" onclick="continuarFluxoMusica()">
Continuar execução de voz e música
</button>

<div class="info" id="statusMusica">
Seleção registrada. Preparando execução de voz e música.
</div>

</div>
</div>

<script src="/auditoria.js"></script>
<script>
function marcarVisualInicial(){
const modulos = [
["narracao_voz","btnNarracao"],
["audiolivro","btnAudiolivro"],
["leitura_dramatizada","btnDramatizada"],
["trilha_sonora","btnTrilha"],
["musica_tema","btnTema"],
["versao_cantada","btnCantada"],
["distribuicao_audio","btnDistribuicao"]
];

modulos.forEach(function(item){
if(localStorage.getItem(item[0])==="sim"){
document.getElementById(item[1]).classList.add("ativo");
}
});
}

async function toggleModuloMusica(chave,idBotao,mensagem){
const botao = document.getElementById(idBotao);

if(localStorage.getItem(chave)==="sim"){
localStorage.removeItem(chave);
botao.classList.remove("ativo");

await LapidarAuditoria.registrarEvento("Módulo de voz/música removido",{
modulo:chave
});
}else{
localStorage.setItem(chave,"sim");
botao.classList.add("ativo");

await LapidarAuditoria.registrarEvento(mensagem,{
modulo:chave
});
}
}

async function continuarFluxoMusica(){
const selecionados = [
"narracao_voz",
"audiolivro",
"leitura_dramatizada",
"trilha_sonora",
"musica_tema",
"versao_cantada",
"distribuicao_audio"
];

let algumSelecionado=false;

selecionados.forEach(function(mod){
if(localStorage.getItem(mod)==="sim"){
algumSelecionado=true;
}
});

if(!algumSelecionado){
alert("Selecione pelo menos um módulo de voz ou música.");
return;
}

document.getElementById("statusMusica").style.display="block";

await LapidarAuditoria.registrarEvento("Execução de voz e música iniciada",{
narracao:localStorage.getItem("narracao_voz")||"nao",
audiolivro:localStorage.getItem("audiolivro")||"nao",
leituraDramatizada:localStorage.getItem("leitura_dramatizada")||"nao",
trilhaSonora:localStorage.getItem("trilha_sonora")||"nao",
musicaTema:localStorage.getItem("musica_tema")||"nao",
versaoCantada:localStorage.getItem("versao_cantada")||"nao",
distribuicaoAudio:localStorage.getItem("distribuicao_audio")||"nao"
});

await LapidarAuditoria.encerrarSessaoModulo("modulos_musica");

setTimeout(function(){
window.location.href="/painel_execucao_obra.html";
},800);
}

window.onload = async function(){
await LapidarAuditoria.iniciarSessaoModulo("modulos_musica");
await LapidarAuditoria.registrarEvento("Tela de módulos de voz e música aberta",{});
marcarVisualInicial();
};
</script>

</body>
</html>
