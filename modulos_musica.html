<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Produção com voz e áudio — Lapidar</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f4f1e8;
}

header{
background:#32497d;
color:white;
padding:18px;
display:flex;
justify-content:space-between;
font-size:18px;
}

.container{
max-width:900px;
margin:auto;
padding:30px;
}

.card{
background:white;
padding:25px;
border-radius:16px;
margin-bottom:20px;
box-shadow:0px 8px 20px rgba(0,0,0,.08);
}

.botao{
width:100%;
padding:18px;
margin-top:12px;
border:none;
border-radius:12px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.narracao{
background:#2e7d32;
color:white;
}

.audiobook{
background:#6b8ec1;
color:white;
}

.musica{
background:#ffb300;
color:black;
}

.redes{
background:#8e24aa;
color:white;
}

.continuar{
background:#1b5e20;
color:white;
margin-top:20px;
}

.outros{
background:#5d4037;
color:white;
}

.limpar{
background:#b71c1c;
color:white;
}

</style>
</head>

<body>

<header>

<div>Produção com voz e áudio</div>

<div>Lapidar</div>

</header>


<div class="container">

<div class="card">

<h2>Escolha o que deseja fazer com o áudio da sua obra</h2>

<p>
Você pode escolher um ou vários.
Depois o sistema organiza automaticamente.
</p>


<button class="botao narracao">

Transformar o livro em narração com voz

</button>


<button class="botao audiobook">

Criar audiobook do livro

</button>


<button class="botao musica">

Criar música inspirada no livro

</button>


<button class="botao redes">

Criar áudios curtos para Instagram, TikTok e YouTube

</button>


<button class="botao continuar" onclick="seguir()">

Continuar com as escolhas feitas

</button>


<button class="botao outros" onclick="outros()">

Quero escolher outros tipos de produção

</button>


<button class="botao limpar" onclick="limpar()">

Apagar escolhas desta tela

</button>


</div>

</div>


<script>

function seguir(){

window.location.href="confirmacao_final_modulos.html"

}

function outros(){

window.location.href="selecionar_modulos.html"

}

function limpar(){

location.reload()

}

</script>

</body>
</html>
