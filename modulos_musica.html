<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produção com voz e música — Lapidar</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f1e8;
}

header{
background:#32497d;
color:white;
padding:18px;
display:flex;
justify-content:space-between;
font-size:18px;
}

.container{
max-width:900px;
margin:auto;
padding:30px;
}

.card{
background:#e8f5e9;
padding:25px;
border-radius:16px;
margin-bottom:20px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
border:1px solid #bfe3c4;
}

.botao{
width:100%;
padding:18px;
margin-top:12px;
border:none;
border-radius:12px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}


/* família verde */

.verde1{background:#81c784;color:white;}
.verde2{background:#66bb6a;color:white;}
.verde3{background:#4caf50;color:white;}
.verde4{background:#43a047;color:white;}
.verde5{background:#388e3c;color:white;}
.verde6{background:#2e7d32;color:white;}
.verde7{background:#1b5e20;color:white;}


/* padrões institucionais */

.continuar{
background:#2e7d32;
color:white;
margin-top:22px;
}

.retornar{
background:#607d8b;
color:white;
}

.apagar{
background:#b71c1c;
color:white;
}

p{
color:#2e4a33;
}

</style>
</head>
<body>

<header>

<div>Produção com voz e música</div>

<div>Lapidar</div>

</header>


<div class="container">

<div class="card">

<h2>Escolha o que deseja criar com áudio ou música</h2>

<p>
Você pode escolher um ou vários recursos.
</p>


<button class="botao verde1">
Transformar o livro em narração com voz
</button>

<button class="botao verde2">
Criar audiolivro completo
</button>

<button class="botao verde3">
Criar leitura dramatizada
</button>

<button class="botao verde4">
Criar trilha sonora inspirada no livro
</button>

<button class="botao verde5">
Criar música tema da obra
</button>

<button class="botao verde6">
Criar versão cantada de trechos do livro
</button>

<button class="botao verde7">
Preparar distribuição nas plataformas de áudio
</button>


<button class="botao continuar" onclick="seguir()">
Continuar com as escolhas feitas
</button>

<button class="botao retornar" onclick="retornar()">
Voltar para escolher outro tipo de produção
</button>

<button class="botao apagar" onclick="limpar()">
Apagar escolhas desta tela
</button>


</div>

</div>


<script>

function seguir(){
window.location.href="/confirmacao_final_modulos.html";
}

function retornar(){
window.location.href="/selecionar_modulos.html";
}

function limpar(){
location.reload();
}

</script>

</body>
</html>
