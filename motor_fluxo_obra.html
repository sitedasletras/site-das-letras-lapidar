<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preparando fluxo da obra — Lapidar</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f4f1e8;
}

header{
background:#32497d;
color:white;
padding:18px;
display:flex;
justify-content:space-between;
}

.container{
max-width:900px;
margin:auto;
padding:30px;
}

.card{
background:white;
padding:25px;
border-radius:16px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.etapa{
margin-top:14px;
padding:16px;
border-radius:12px;
font-size:18px;
font-weight:bold;
}

.azul{background:#6b8ec1;color:white;}
.amarelo{background:#c19b2e;color:white;}
.verde{background:#5aa07a;color:white;}

.botao{
width:100%;
padding:18px;
margin-top:25px;
border:none;
border-radius:12px;
font-size:18px;
font-weight:bold;
cursor:pointer;
background:#2e7d32;
color:white;
}

</style>
</head>
<body>

<header>
<div>Organizando o andamento da obra</div>
<div>Lapidar</div>
</header>

<div class="container">
<div class="card">

<h2>Sequência automática definida pelo Lapidar</h2>

<div id="fluxo"></div>

<button class="botao" onclick="iniciarFluxo()">
Iniciar execução dos módulos selecionados
</button>

</div>
</div>

<script>

function add(texto,classe){

const bloco=document.createElement("div");

bloco.className="etapa "+classe;

bloco.innerText=texto;

document.getElementById("fluxo").appendChild(bloco);

}

window.onload=function(){

/* LIVRO */

if(localStorage.getItem("correcao_recomendada")==="sim"){
add("Correção ortográfica e gramatical (gratuita)","azul");
}

if(localStorage.getItem("lapidacao_texto")==="sim"){
add("Melhoria da escrita do texto","azul");
}

if(localStorage.getItem("traducao_livro")==="sim"){
add("Tradução do livro","azul");
}

if(localStorage.getItem("estrutura_livro")==="sim"){
add("Leitura estrutural da história","azul");
}

if(localStorage.getItem("qualidade_livro")==="sim"){
add("Relatório de qualidade da obra","azul");
}

if(localStorage.getItem("diagramacao_livro")==="sim"){
add("Preparação do livro para impressão","azul");
}

if(localStorage.getItem("capa_livro")==="sim"){
add("Criação da capa do livro","azul");
}


/* AUDIOVISUAL */

if(localStorage.getItem("video_historia")==="sim"){
add("Vídeo contando a história do livro","amarelo");
}

if(localStorage.getItem("video_cena")==="sim"){
add("Cena dramatizada do livro","amarelo");
}

if(localStorage.getItem("video_apresentacao")==="sim"){
add("Vídeo de apresentação do livro","amarelo");
}

if(localStorage.getItem("video_redes")==="sim"){
add("Vídeos curtos para redes sociais","amarelo");
}


/* VOZ / MÚSICA */

if(localStorage.getItem("narracao_voz")==="sim"){
add("Narração com voz","verde");
}

if(localStorage.getItem("audiolivro")==="sim"){
add("Produção de audiolivro","verde");
}

if(localStorage.getItem("trilha_sonora")==="sim"){
add("Criação de trilha sonora","verde");
}

if(localStorage.getItem("musica_tema")==="sim"){
add("Música tema da obra","verde");
}

if(localStorage.getItem("versao_cantada")==="sim"){
add("Versão cantada da obra","verde");
}

if(localStorage.getItem("distribuicao_audio")==="sim"){
add("Distribuição em plataformas de áudio","verde");
}

}

function iniciarFluxo(){

window.location.href="/painel_execucao_obra.html";

}

</script>

</body>
</html>
