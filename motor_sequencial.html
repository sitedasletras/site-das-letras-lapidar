<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lapidar • Continuidade da Jornada</title>
  <style>
    :root{
      --bg:#f7f5ef;
      --card:#ffffff;
      --line:#d8d2c4;
      --text:#2f2a24;
      --muted:#5f574c;
      --title:#6b5b46;
      --soft:#ece7db;
      --soft-dark:#e2dccd;
      --accent:#8a6a43;
      --accent-dark:#705331;
      --shadow:0 12px 28px rgba(67,58,45,.10);
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .card{
      width:100%;
      max-width:860px;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:28px;
      padding:32px 28px;
      box-shadow:var(--shadow);
      text-align:center;
    }

    .eyebrow{
      display:inline-block;
      padding:8px 14px;
      border-radius:999px;
      background:#efe9dc;
      color:#6b5b46;
      font-size:14px;
      font-weight:bold;
      margin-bottom:14px;
    }

    h1{
      margin:0 0 12px 0;
      font-size:34px;
      line-height:1.15;
      color:var(--title);
    }

    p{
      margin:0 0 14px 0;
      font-size:19px;
      line-height:1.9;
      color:var(--muted);
    }

    .field{
      margin:18px auto 0;
      max-width:640px;
      background:#faf8f2;
      border:1px solid var(--line);
      border-radius:18px;
      padding:16px 18px;
      text-align:left;
    }

    .field strong{
      display:block;
      margin-bottom:6px;
      font-size:16px;
      color:#3d352d;
    }

    .field span{
      display:block;
      font-size:17px;
      color:#000;
      line-height:1.7;
    }

    .actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
      margin-top:22px;
    }

    .main-btn{
      border:none;
      border-radius:18px;
      padding:18px 20px;
      font-size:18px;
      font-weight:bold;
      cursor:pointer;
      transition:.2s ease;
    }

    .main-btn:hover{
      transform:translateY(-1px);
    }

    .btn-next{
      background:var(--accent);
      color:#fff;
    }

    .btn-next:hover{
      background:var(--accent-dark);
    }

    .btn-home{
      background:var(--soft);
      color:var(--text);
    }

    .btn-home:hover{
      background:var(--soft-dark);
    }

    @media (max-width:800px){
      .actions{
        grid-template-columns:1fr;
      }

      h1{
        font-size:30px;
      }

      p{
        font-size:18px;
      }
    }
  </style>
</head>
<body>
  <section class="card">
    <div class="eyebrow">Lapidar • Continuidade da Jornada</div>
    <h1>O próximo setor da sua obra já está preparado</h1>
    <p>
      O Lapidar está seguindo a sequência que você escolheu. Quando estiver pronto, continue para o próximo passo da jornada editorial.
    </p>

    <div class="field">
      <strong>Próximo setor</strong>
      <span id="proximoModuloNome">Preparando o próximo passo...</span>
    </div>

    <div class="actions">
      <button class="main-btn btn-next" onclick="irParaProximoModulo()">
        Seguir para o próximo setor
      </button>

      <button class="main-btn btn-home" onclick="window.location.href='pagina_institucional_lapidar.html'">
        Voltar ao início do Lapidar
      </button>
    </div>
  </section>

  <script>
    function nomeBonitoDoModulo(arquivo){
      const mapa = {
        "modulo03_assistente_diagramacao_mapa.html": "Assistente de Diagramação do Autor",
        "modulo05_segunda_linguas_mapa.html": "Segunda Língua(s)",
        "modulo07_avaliacao_literaria_mapa.html": "Avaliação Literária",
        "modulo11_analisador_de_obra_mapa.html": "Analisador de Obra",
        "modulo13_lapidacao_literaria_mapa.html": "Lapidação Literária",
        "modulo17_silo_sonoro_mapa.html": "Silo Sonoro",
        "modulo19_okapista_mapa.html": "OKapista"
      };
      return mapa[arquivo] || "Próxima etapa editorial";
    }

    function atualizarTextoDoProximo(){
      const fila = JSON.parse(localStorage.getItem("fila_modulos_lapidar") || "[]");
      const indiceAtual = parseInt(localStorage.getItem("indice_fluxo_lapidar") || "0", 10);
      const proximoIndice = indiceAtual + 1;

      if(proximoIndice >= fila.length){
        document.getElementById("proximoModuloNome").textContent = "Expedição Final";
        return;
      }

      document.getElementById("proximoModuloNome").textContent = nomeBonitoDoModulo(fila[proximoIndice]);
    }

    function irParaProximoModulo(){
      let fila = JSON.parse(localStorage.getItem("fila_modulos_lapidar") || "[]");
      let indice = parseInt(localStorage.getItem("indice_fluxo_lapidar") || "0", 10);

      indice++;
      localStorage.setItem("indice_fluxo_lapidar", indice.toString());

      if(indice >= fila.length){
        window.location.href = "expedicao_final.html";
        return;
      }

      window.location.href = fila[indice];
    }

    atualizarTextoDoProximo();
  </script>
</body>
</html>
