<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Motor Sequencial Lapidar</title>

<style>

body{
font-family:Georgia, serif;
background:#f4ecd8;
text-align:center;
padding-top:100px;
}

.caixa{
background:white;
display:inline-block;
padding:40px;
border-radius:10px;
box-shadow:0px 3px 6px rgba(0,0,0,0.2);
}

button{

margin-top:30px;

padding:15px 40px;

font-size:18px;

border:none;

background:#5a4a2f;

color:white;

border-radius:8px;

cursor:pointer;

}

button:hover{

background:#3e321f;

}

</style>

</head>

<body>

<div class="caixa">

<h2>Lapidar está organizando o próximo passo da sua obra</h2>

<p>
Seguiremos agora para a próxima etapa do caminho editorial escolhido.
</p>

<button onclick="irParaProximoModulo()">Continuar</button>

</div>

<script>

function irParaProximoModulo(){

let fila = JSON.parse(localStorage.getItem("fila_modulos_lapidar"));

let indice = parseInt(localStorage.getItem("indice_fluxo_lapidar"));

if(!fila){

window.location.href="expedicao_material.html";

return;

}

indice++;

localStorage.setItem("indice_fluxo_lapidar",indice);

if(indice >= fila.length){

window.location.href="expedicao_material.html";

return;

}

window.location.href=fila[indice];

}

</script>

</body>
</html>
