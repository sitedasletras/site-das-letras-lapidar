<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Módulo 17 — Narração Editorial</title>

<style>

body{
font-family: Arial;
background:#f4efe6;
margin:0;
padding:0;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.header{
font-size:32px;
font-weight:bold;
margin-bottom:10px;
}

.sub{
font-size:18px;
margin-bottom:20px;
}

.box{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:20px;
box-shadow:0px 0px 8px rgba(0,0,0,0.1);
}

label{
display:block;
margin:10px 0;
font-size:18px;
}

button{
padding:15px;
font-size:18px;
background:#8b0000;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
width:100%;
}

button:hover{
background:#a30000;
}

.result{
margin-top:20px;
font-size:20px;
font-weight:bold;
color:green;
}

.footer{
margin-top:40px;
font-size:14px;
text-align:center;
opacity:0.6;
}

</style>
</head>

<body>

<div class="container">

<div class="header">
🎧 Módulo 17 — Narração Editorial
</div>

<div class="sub">
Conversão sonora da obra e relatórios editoriais
</div>

<div class="box">

<label>
<input type="checkbox" id="obra">
 Narrar obra completa
</label>

<label>
<input type="checkbox" id="avaliacaoTecnica">
 Narrar Avaliação Técnica Literária
</label>

<label>
<input type="checkbox" id="avaliacaoEditorial">
 Narrar Avaliação Editorial
</label>

<label>
<input type="checkbox" id="iel">
 Narrar Índice Emocional Literário (IEL)
</label>

<label>
<input type="checkbox" id="relatorio">
 Narrar Relatório Estrutural da Obra
</label>

<label>
<input type="checkbox" id="prefacio">
 Narrar Prefácio / Prólogo / Epílogo
</label>

<label>
<input type="checkbox" id="capitulos">
 Narrar capítulos selecionados
</label>

<label>
<input type="checkbox" id="ocr">
 Narrar obra transcrita (OCR)
</label>

</div>

<div class="box">

<label>Formato de saída:</label>

<label>
<input type="radio" name="formato" checked>
 MP3
</label>

<label>
<input type="radio" name="formato">
 WAV
</label>

<label>
<input type="radio" name="formato">
 MP3 + WAV
</label>

</div>

<div class="box">

<button onclick="gerarNarracao()">
Gerar narração editorial
</button>

<div id="resultado" class="result"></div>

</div>

<div class="footer">
Lapidar — Sistema Editorial Multimodal
</div>

</div>

<script>

function gerarNarracao(){

document.getElementById("resultado").innerHTML =
"Narração editorial adicionada ao fluxo da obra com sucesso.";

}

</script>

</body>
</html>
