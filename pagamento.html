<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagamento — Lapidar</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(180deg,#0b3a2b,#041a12);
color:white;
}

.container{
max-width:900px;
margin:auto;
padding:24px;
}

.card{
background:rgba(255,255,255,.07);
border-radius:18px;
padding:22px;
margin-bottom:20px;
}

h1,h2{
margin-top:0;
}

p{
line-height:1.6;
color:#d9efe2;
}

.info{
margin-bottom:12px;
padding:12px;
border-radius:12px;
background:rgba(255,255,255,.05);
}

button{
border:none;
border-radius:12px;
padding:14px 18px;
font-size:15px;
font-weight:bold;
cursor:pointer;
margin-top:12px;
margin-right:8px;
}

.btn{
background:#2ecc71;
color:#062414;
}

.btn2{
background:#dcefe4;
color:#103222;
}

.status{
display:none;
margin-top:16px;
padding:14px;
border-radius:12px;
background:rgba(46,204,113,.14);
}

.erro{
display:none;
margin-top:16px;
padding:14px;
border-radius:12px;
background:rgba(231,76,60,.14);
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>Pagamento do Projeto</h1>

<p>
Confirme o pagamento para concluir a etapa financeira do Lapidar e liberar a exportação da obra.
</p>

</div>

<div class="card">

<h2>Dados do projeto</h2>

<div class="info">
<strong>Título:</strong>
<span id="titulo"></span>
</div>

<div class="info">
<strong>Autor:</strong>
<span id="autor"></span>
</div>

<div class="info">
<strong>Lapidação:</strong>
<span id="lapidacao"></span>
</div>

<div class="info">
<strong>Pagamento:</strong>
<span id="pagamento"></span>
</div>

<button class="btn" onclick="confirmarPagamento()">
Simular pagamento aprovado
</button>

<button class="btn2" onclick="voltarPainel()">
Voltar ao painel
</button>

<div class="status" id="mensagem"></div>
<div class="erro" id="erro"></div>

</div>

</div>

<script>
function obterProjeto(){
return JSON.parse(localStorage.getItem("projeto_lapidar"));
}

function salvarProjeto(p){
p.ultimaAtualizacao = new Date().toISOString();

localStorage.setItem(
"projeto_lapidar",
JSON.stringify(p)
);

let historico = JSON.parse(
localStorage.getItem("historico_lapidar") || "[]"
);

historico = historico.map(x => x.id === p.id ? p : x);

localStorage.setItem(
"historico_lapidar",
JSON.stringify(historico)
);
}

function mostrar(msg){
let box = document.getElementById("mensagem");
box.style.display = "block";
box.innerText = msg;
}

function mostrarErro(msg){
let box = document.getElementById("erro");
box.style.display = "block";
box.innerText = msg;
}

function carregar(){
let projeto = obterProjeto();

if(!projeto){
window.location.href = "producao_integrada.html";
return;
}

document.getElementById("titulo").innerText = projeto.titulo;
document.getElementById("autor").innerText = projeto.autor;

document.getElementById("lapidacao").innerText =
projeto.lapidacaoExecutada ? "Concluída" : "Pendente";

document.getElementById("pagamento").innerText =
projeto.pagamentoConfirmado ? "Confirmado" : "Pendente";

if(!projeto.lapidacaoExecutada){
mostrarErro("A Lapidação Literária precisa ser concluída antes do pagamento.");
}
}

function confirmarPagamento(){
let projeto = obterProjeto();

if(!projeto){
window.location.href = "producao_integrada.html";
return;
}

if(!projeto.lapidacaoExecutada){
alert("Conclua primeiro a Lapidação Literária.");
return;
}

projeto.pagamentoConfirmado = true;
projeto.downloadLiberado = true;
projeto.dataPagamento = new Date().toISOString();

salvarProjeto(projeto);

document.getElementById("pagamento").innerText = "Confirmado";

mostrar("Pagamento confirmado com sucesso.");

setTimeout(() => {
window.location.href = "exportador_obra.html";
}, 700);
}

function voltarPainel(){
window.location.href = "painel_projeto.html";
}

carregar();
</script>

<script src="session_guard.js"></script>

</body>
</html>
