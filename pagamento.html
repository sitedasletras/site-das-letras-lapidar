<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagamento — Lapidar</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0d0603;
color:white;
display:flex;
justify-content:center;
}

.container{
max-width:760px;
width:92%;
padding:40px 0 60px 0;
}

.titulo{
font-size:36px;
text-align:center;
font-weight:bold;
}

.subtitulo{
text-align:center;
color:#ff7b2c;
margin-top:10px;
margin-bottom:28px;
line-height:1.6;
}

.card{
background:#140c08;
padding:24px;
border-radius:14px;
margin-top:18px;
line-height:1.8;
}

.label{
color:#ff7b2c;
font-weight:bold;
}

.valor{
color:#ffd2b3;
}

select{
width:100%;
padding:14px;
border-radius:12px;
border:none;
font-size:16px;
margin-top:8px;
}

.botao{
width:100%;
padding:18px;
border-radius:40px;
border:none;
margin-top:18px;
font-size:18px;
font-weight:bold;
cursor:pointer;
background:#ff5a00;
color:white;
}

.botao:hover{
background:#ff6f1a;
}

.botaoSecundario{
background:#333;
}

.botaoSecundario:hover{
background:#555;
}

.sucesso{
margin-top:20px;
text-align:center;
color:#9cffb2;
font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<div class="titulo">
Pagamento
</div>

<div class="subtitulo">
Confirmação do serviço editorial selecionado
</div>

<div class="card">

<div>
<span class="label">Serviço selecionado</span><br>
<span id="servicoSelecionado" class="valor"></span>
</div>

<div style="margin-top:16px">
<span class="label">Valor correspondente</span><br>
<span id="valorServico" class="valor"></span>
</div>

</div>

<div class="card">

<span class="label">
Forma de pagamento
</span>

<select id="formaPagamento">

<option value="">
Selecione
</option>

<option value="pix">
Pix
</option>

<option value="deposito">
Depósito bancário
</option>

<option value="cartao">
Cartão
</option>

</select>

</div>

<button class="botao"
onclick="confirmarPagamento()">

Confirmar pagamento

</button>

<button class="botao botaoSecundario"
onclick="window.location.href='_Indice.html'">

Voltar

</button>

<div id="mensagemSucesso"
class="sucesso">

</div>

</div>

<script>

function detectarPais(){

const idioma =
navigator.language || "pt-BR";

return idioma.startsWith("pt")
? "BR"
: "EXT";

}

function moeda(){

return detectarPais() === "BR"
? "R$"
: "$";

}

function preencherTela(){

const servico =
localStorage.getItem("SDL_servico_extra");

if(servico === "leitura_tecnica"){

document.getElementById("servicoSelecionado")
.innerText =
"Leitura Técnica Editorial — avaliação única";

document.getElementById("valorServico")
.innerText =
moeda() + " 4,99";

return;

}

if(servico === "leitura_tecnica_mensal"){

document.getElementById("servicoSelecionado")
.innerText =
"Plano Oficina Editorial Lapidar — 40 avaliações mensais";

document.getElementById("valorServico")
.innerText =
moeda() + " 70";

return;

}

document.getElementById("servicoSelecionado")
.innerText =
"Serviço editorial";

document.getElementById("valorServico")
.innerText =
moeda();

}

function confirmarPagamento(){

const forma =
document.getElementById("formaPagamento").value;

if(!forma){

alert(
"Escolha a forma de pagamento."
);

return;

}

const servico =
localStorage.getItem("SDL_servico_extra");

localStorage.setItem(
"SDL_metodo_pagamento",
forma
);

localStorage.setItem(
"SDL_status_pagamento",
"confirmado"
);

/* ATIVAÇÃO DO PLANO LTE */

if(servico === "leitura_tecnica_mensal"){

localStorage.setItem(
"LTE_plano_mensal",
"ativo"
);

localStorage.setItem(
"LTE_creditos_restantes",
"40"
);

localStorage.setItem(
"LTE_creditos_usados",
"0"
);

}

/* ATIVAÇÃO AVULSO */

if(servico === "leitura_tecnica"){

localStorage.setItem(
"LTE_status",
"solicitada"
);

}

document.getElementById("mensagemSucesso")
.innerText =
"Pagamento confirmado com sucesso.";

setTimeout(function(){

window.location.href =
"status_plano.html";

},1200);

}

preencherTela();

</script>

</body>
</html>
