<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagamento — Lapidar</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(180deg,#0b3a2b,#041a12);
color:#ffffff;
}

.container{
max-width:900px;
margin:0 auto;
padding:24px;
}

.card{
background:rgba(255,255,255,0.07);
border:1px solid rgba(255,255,255,0.08);
border-radius:18px;
padding:22px;
margin-bottom:20px;
}

h1,h2{
margin-top:0;
}

p{
color:#d9efe2;
line-height:1.6;
}

.info{
margin-bottom:12px;
padding:12px;
border-radius:12px;
background:rgba(255,255,255,0.05);
}

.actions{
display:flex;
flex-wrap:wrap;
gap:12px;
margin-top:18px;
}

button{
border:none;
border-radius:12px;
padding:14px 18px;
font-size:15px;
font-weight:bold;
cursor:pointer;
}

.btn-principal{
background:#2ecc71;
color:#062414;
}

.btn-principal:hover{
background:#29b765;
}

.btn-secundario{
background:#dcefe4;
color:#103222;
}

.btn-secundario:hover{
background:#c8e6d4;
}

.status{
display:none;
margin-top:16px;
padding:14px;
border-radius:12px;
background:rgba(46,204,113,0.14);
border:1px solid rgba(46,204,113,0.25);
color:#dbffea;
}

.erro{
display:none;
margin-top:16px;
padding:14px;
border-radius:12px;
background:rgba(231,76,60,0.14);
border:1px solid rgba(231,76,60,0.25);
color:#ffd9d4;
}
</style>
</head>
<body>

<div class="container">

    <div class="card">
        <h1>Pagamento do Projeto</h1>
        <p>
            Confirme o pagamento para concluir a etapa financeira do Lapidar e seguir corretamente
            para a exportação da obra dentro do fluxo editorial.
        </p>
    </div>

    <div class="card">
        <h2>Dados do projeto</h2>

        <div class="info"><strong>Título:</strong> <span id="tituloProjeto">Carregando...</span></div>
        <div class="info"><strong>Autor:</strong> <span id="autorProjeto">Carregando...</span></div>
        <div class="info"><strong>Status da Lapidação:</strong> <span id="statusLapidacao">Carregando...</span></div>
        <div class="info"><strong>Status do Pagamento:</strong> <span id="statusPagamento">Carregando...</span></div>

        <div class="actions">
            <button class="btn-principal" onclick="confirmarPagamento()">Simular pagamento aprovado</button>
            <button class="btn-secundario" onclick="voltarPainel()">Voltar ao painel</button>
        </div>

        <div class="status" id="mensagemStatus"></div>
        <div class="erro" id="mensagemErro"></div>
    </div>

</div>

<script>
function obterProjeto(){
    const projetoSalvo = localStorage.getItem("projeto_lapidar");
    if(!projetoSalvo){
        return null;
    }

    try{
        return JSON.parse(projetoSalvo);
    }catch(e){
        return null;
    }
}

function obterHistorico(){
    try{
        return JSON.parse(localStorage.getItem("historico_lapidar") || "[]");
    }catch(e){
        return [];
    }
}

function salvarProjeto(projeto){
    projeto.ultimaAtualizacao = new Date().toISOString();
    localStorage.setItem("projeto_lapidar", JSON.stringify(projeto));

    const historico = obterHistorico();
    const novoHistorico = historico.map(item => {
        if(item.id === projeto.id){
            return projeto;
        }
        return item;
    });

    localStorage.setItem("historico_lapidar", JSON.stringify(novoHistorico));
}

function mostrarStatus(texto){
    const box = document.getElementById("mensagemStatus");
    box.style.display = "block";
    box.textContent = texto;
}

function mostrarErro(texto){
    const box = document.getElementById("mensagemErro");
    box.style.display = "block";
    box.textContent = texto;
}

function carregarTela(){
    const projeto = obterProjeto();

    if(!projeto){
        alert("Projeto não encontrado. Volte para a produção integrada.");
        window.location.href = "producao_integrada.html";
        return;
    }

    document.getElementById("tituloProjeto").textContent = projeto.titulo || "Sem título";
    document.getElementById("autorProjeto").textContent = projeto.autor || "Sem autor";
    document.getElementById("statusLapidacao").textContent = projeto.lapidacaoExecutada ? "Concluída" : "Pendente";
    document.getElementById("statusPagamento").textContent = projeto.pagamentoConfirmado ? "Confirmado" : "Aguardando";

    if(!projeto.lapidacaoExecutada){
        mostrarErro("A Lapidação Literária ainda não foi concluída. O pagamento só pode seguir depois dessa etapa.");
    }
}

function confirmarPagamento(){
    const projeto = obterProjeto();

    if(!projeto){
        alert("Projeto não encontrado.");
        return;
    }

    if(!projeto.lapidacaoExecutada){
        alert("Conclua primeiro a Lapidação Literária.");
        return;
    }

    projeto.pagamentoConfirmado = true;
    projeto.downloadLiberado = true;
    projeto.dataPagamento = new Date().toISOString();

    salvarProjeto(projeto);

    document.getElementById("statusPagamento").textContent = "Confirmado";
    mostrarStatus("Pagamento confirmado com sucesso. Redirecionando para o exportador da obra...");

    setTimeout(() => {
        window.location.href = "exportador_obra.html";
    }, 800);
}

function voltarPainel(){
    window.location.href = "painel_projeto.html";
}

carregarTela();
</script>

<script src="session_guard.js"></script>

</body>
</html>
