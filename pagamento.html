<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagamento — Lapidar</title>

<style>

:root{
--bg:#0d0603;
--card:#140c08;
--card2:#1b100a;
--text:#ffffff;
--muted:#ffd2b3;
--orange:#f7b22c;
--orangeStrong:#ff5a00;
--green:#9cfdb2;
--danger:#ff7070;
--border:rgba(255,123,44,0.18);
--shadow:0 10px 26px rgba(0,0,0,0.28);
}

body{
margin:0;
font-family:Arial;
background:var(--bg);
color:white;
}

.container{
width:min(900px,95%);
margin:auto;
padding:40px 0;
}

.titulo{
font-size:38px;
font-weight:bold;
}

.subtitulo{
margin-top:6px;
color:var(--orange);
}

.card{
margin-top:30px;
background:var(--card);
padding:24px;
border-radius:18px;
border:1px solid var(--border);
box-shadow:var(--shadow);
}

.linha{
margin-top:12px;
color:var(--muted);
}

.rotulo{
color:var(--orange);
font-weight:bold;
}

select{
margin-top:12px;
width:100%;
padding:14px;
border-radius:12px;
border:none;
background:#1b0e07;
color:white;
}

.statusBox{
margin-top:22px;
padding:18px;
border-radius:14px;
background:rgba(247,178,44,0.12);
border:1px solid rgba(247,178,44,0.2);
color:#ffe7b0;
}

.actions{
margin-top:26px;
display:flex;
flex-wrap:wrap;
gap:12px;
}

.botao{
border:none;
padding:14px 18px;
border-radius:999px;
font-weight:bold;
cursor:pointer;
}

.botaoConfirmar{
background:#174d27;
color:#dfffe8;
}

.botaoIndice{
background:#24150f;
color:white;
}

.botaoPlano{
background:var(--orangeStrong);
color:white;
}

</style>
</head>

<body>

<div class="container">

<div class="titulo">
REGISTRO DE PAGAMENTO
</div>

<div class="subtitulo">
Confirmação do pagamento do plano editorial Lapidar
</div>



<div class="card">

<div class="linha">
<span class="rotulo">Plano selecionado:</span>
<span id="planoSelecionado">Verificando...</span>
</div>


<select id="formaPagamento">

<option value="">Selecione a forma de pagamento</option>

<option>PIX</option>

<option>Transferência</option>

<option>Depósito</option>

<option>Cartão</option>

<option>Outro</option>

</select>


<div class="statusBox" id="statusPagamento">
Nenhum pagamento registrado ainda.
</div>

</div>



<div class="actions">

<button class="botao botaoConfirmar" onclick="registrarPagamento()">
Confirmar pagamento
</button>

<button class="botao botaoPlano" onclick="abrirPlanos()">
Escolher plano
</button>

<button class="botao botaoIndice" onclick="voltarIndice()">
Voltar ao índice
</button>

</div>



</div>



<script>

function verificarSessao(){

const sessao=localStorage.getItem("SDL_sessao_ativa")

if(sessao!=="sim"){

window.location.href="login.html"

}

}



function carregarPlano(){

try{

const plano=localStorage.getItem("SDL_plano")

if(plano){

document.getElementById("planoSelecionado").innerHTML=plano

}else{

document.getElementById("planoSelecionado").innerHTML=
"Nenhum plano selecionado"

}

}catch(e){

document.getElementById("planoSelecionado").innerHTML=
"Erro ao carregar plano"

}

}



function registrarPagamento(){

const forma=document.getElementById("formaPagamento").value

const plano=localStorage.getItem("SDL_plano")

if(!plano){

document.getElementById("statusPagamento").innerHTML=
"Selecione primeiro um plano antes de registrar pagamento."

return

}

if(!forma){

document.getElementById("statusPagamento").innerHTML=
"Selecione uma forma de pagamento."

return

}

try{

localStorage.setItem("SDL_pagamento",forma)

document.getElementById("statusPagamento").innerHTML=
"Pagamento registrado com sucesso via "+forma

document.getElementById("statusPagamento").style.background=
"rgba(23,77,39,0.28)"

}catch(e){

document.getElementById("statusPagamento").innerHTML=
"Erro ao registrar pagamento."

}

}



function abrirPlanos(){

window.location.href="planos_doacoes.html"

}



function voltarIndice(){

window.location.href="_Indice.html"

}



verificarSessao()
carregarPlano()

</script>

</body>
</html>
