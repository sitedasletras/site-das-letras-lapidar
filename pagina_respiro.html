<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lapidar — Inicializando ambiente simbiótico</title>

<style>

body {

margin:0;
height:100vh;

display:flex;
align-items:center;
justify-content:center;

background:#0f172a;

font-family:Arial;

color:white;

}

.container {

background:#111827;

padding:40px;

border-radius:18px;

box-shadow:0px 0px 40px rgba(0,0,0,0.5);

text-align:center;

width:420px;

}

.loader {

margin-top:20px;

width:40px;
height:40px;

border-radius:50%;

border:4px solid #374151;
border-top:4px solid #22c55e;

animation:giro 1s linear infinite;

}

@keyframes giro {

0% { transform:rotate(0deg); }

100% { transform:rotate(360deg); }

}

</style>

</head>

<body>

<div class="container">

<h2>Lapidar iniciando ambiente simbiótico</h2>

<p>Preparando estrutura editorial...</p>

<div class="loader"></div>

</div>

<script>


/* ================================
FIIISAA + NAS + FISA + ISC
núcleo simbiótico do Lapidar
=============================== */


(function(){

"use strict";


const perfil =
localStorage.getItem("perfilUsuario");

const email =
localStorage.getItem("emailUsuario");


let score = 100;
let risco = "baixo";


if(!perfil){

score -= 20;

}


if(!email){

score -= 10;

}


if(score < 60){

risco = "alto";

}

else if(score < 80){

risco = "medio";

}


/* REGISTRO NAS */

let historico =
JSON.parse(localStorage.getItem("nasRelatorios")) || [];

historico.unshift({

data:new Date().toISOString(),

perfil:perfil || "desconhecido",

email:email || "nao informado",

score:score,

risco:risco

});


if(historico.length > 20){

historico = historico.slice(0,20);

}


localStorage.setItem(

"nasRelatorios",

JSON.stringify(historico)

);


/* REGISTRO ISC FUTURO */

if(!localStorage.getItem("iscRegistry")){

localStorage.setItem(

"iscRegistry",

JSON.stringify({

versao:"0.1",

tools:[

"Google AI Studio",

"Google Stitch",

"Google Flow",

"Google Pomelli"

]

})

);

}


/* PAINEL TÉCNICO SOMENTE PERFIS AUTORIZADOS */

if(

perfil === "admin"

||

perfil === "heteronimo"

||

email === "planaswagner@gmail.com"

){

const painel = document.createElement("div");

painel.style.position="fixed";
painel.style.bottom="10px";
painel.style.right="10px";
painel.style.width="300px";
painel.style.background="#111";
painel.style.color="#fff";
painel.style.padding="12px";
painel.style.borderRadius="12px";
painel.style.fontSize="12px";
painel.style.zIndex="99999";

painel.innerHTML =

"<b>FIIISAA ativo</b><br>" +

"Perfil: " + perfil + "<br>" +

"Score estrutural: " + score + "<br>" +

"Nível de risco: " + risco;

document.body.appendChild(painel);

}


/* CONTINUA FLUXO NORMAL */

setTimeout(function(){

window.location.href="painel_setores.html";

},3000);


})();


</script>



<script src="lapidar_inteligencia_core.js"></script>
</body>

</html>
