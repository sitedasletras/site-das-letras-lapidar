<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Departamentos — Lapidar</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0e0604;
color:white;
}

header{
background:#2f436d;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.container{
max-width:1100px;
margin:auto;
padding:30px 20px;
}

.card{
background:#1c0e08;
border-radius:14px;
padding:20px;
margin-bottom:20px;
box-shadow:0 6px 18px rgba(0,0,0,.25);
}

.departamento{
background:#24130c;
padding:14px;
border-radius:10px;
margin-top:12px;
display:flex;
justify-content:space-between;
align-items:center;
}

button{
padding:10px 14px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
background:#2f436d;
color:white;
}

button.alt{
background:#8a6f3f;
}

button.sec{
background:#6c757d;
}

</style>
</head>

<body>

<header>

<h2>Painel de Departamentos</h2>

<button onclick="voltar()">Voltar</button>

</header>


<div class="container">


<div class="card">

<h3>Projeto ativo</h3>

<div id="nomeProjeto">

Nenhum projeto ativo selecionado.

</div>

</div>



<div class="card">

<h3>Departamentos disponíveis</h3>


<div class="departamento">

<span>Assistente de Diagramação do Autor</span>

<button onclick="abrirDiagramacao()">Abrir</button>

</div>


<div class="departamento">

<span>OKapista</span>

<button onclick="abrirCapista()">Abrir</button>

</div>


<div class="departamento">

<span>Segunda Língua(s)</span>

<button onclick="abrirTraducao()">Abrir</button>

</div>


<div class="departamento">

<span>Avaliação Literária</span>

<button onclick="abrirLeitura()">Abrir</button>

</div>


<div class="departamento">

<span>Analisador de Obra</span>

<button onclick="abrirAnalise()">Abrir</button>

</div>


<div class="departamento">

<span>Lapidação Literária</span>

<button onclick="abrirLapidacao()">Abrir</button>

</div>


</div>



<div class="card">

<h3>Navegação rápida</h3>

<button onclick="abrirSetores()">Painel de setores</button>

<button onclick="abrirFluxo()">Fluxo editorial</button>

<button onclick="abrirPreview()" class="alt">Preview do projeto</button>

<button onclick="abrirProgresso()" class="sec">Progresso da obra</button>

</div>


</div>



<script>

/* SESSION GUARD PADRÃO LAPIDAR */

const perfil = localStorage.getItem("lapidar_perfil")

if(!perfil){

window.location.href="index.html"

}


/* PROJETO ATIVO */

const projeto = localStorage.getItem("lapidar_projeto_ativo")

if(projeto){

document.getElementById("nomeProjeto").innerText = projeto

}


/* ABERTURA DE DEPARTAMENTOS */

function abrirDiagramacao(){

window.location.href="preferencias_diagramacao.html"

}

function abrirCapista(){

window.location.href="relatorio_capista.html"

}

function abrirTraducao(){

window.location.href="idioma_obra.html"

}

function abrirLeitura(){

window.location.href="relatorio_leitura_tecnica.html"

}

function abrirAnalise(){

window.location.href="relatorio_projeto.html"

}

function abrirLapidacao(){

window.location.href="relatorio_lapidacao.html"

}


/* NAVEGAÇÃO GERAL */

function abrirSetores(){

window.location.href="painel_setores.html"

}

function abrirFluxo(){

window.location.href="status_fluxo_editorial.html"

}

function abrirPreview(){

window.location.href="preview_projeto.html"

}

function abrirProgresso(){

window.location.href="progresso_projeto.html"

}

function voltar(){

window.location.href="projetos.html"

}

</script>


</body>
</html>
