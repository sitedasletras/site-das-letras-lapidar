<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Departamentos • Lapidar</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
background:#0e0604;
color:white;
}

header{
background:#2f436d;
padding:18px 20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.container{
max-width:1100px;
margin:auto;
padding:24px;
}

.card{
background:#1c0e08;
border-radius:14px;
padding:20px;
margin-bottom:18px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:16px;
}

button{

width:100%;
padding:16px;
border:none;
border-radius:10px;
background:#2f436d;
color:white;
font-size:16px;
cursor:pointer;

}

button:hover{

background:#415f99;

}

.topo{

display:flex;
justify-content:space-between;
align-items:center;

}

.badge{

background:#8a6f3f;
padding:6px 12px;
border-radius:20px;
font-size:12px;

}

.status{

margin-top:12px;
background:#2a140c;
padding:12px;
border-radius:10px;

}

</style>
</head>
<body>

<header>

<h2>Painel de Departamentos</h2>

<div class="badge" id="perfilBadge"></div>

</header>

<div class="container">

<div class="card">

<h3>Fluxo do projeto</h3>

<div class="grid">

<button onclick="abrirUpload()">
Upload da obra
</button>

<button onclick="abrirAnalisador()">
Analisador de obra
</button>

<button onclick="abrirProjetos()">
Projetos e obras
</button>

</div>

<div class="status">

Fluxo correto recomendado:<br><br>

Upload → Análise → Departamentos → Expedição

</div>

</div>


<div class="card">

<h3>Setores Lapidar</h3>

<div class="grid">

<button onclick="abrirDiagramador()">
Diagramador
</button>

<button onclick="abrirCapista()">
Capista
</button>

<button onclick="abrirSegundaLingua()">
Segunda Língua(s)
</button>

<button onclick="abrirAvaliacao()">
Avaliação Literária
</button>

<button onclick="abrirLapidacao()">
Lapidação Literária
</button>

<button onclick="abrirExpedicao()">
Expedição
</button>

</div>

</div>


<div class="card">

<h3>Painéis auxiliares</h3>

<div class="grid">

<button onclick="abrirSetores()">
Painel setores
</button>

<button onclick="abrirMesario()">
Mesário-mor
</button>

<button onclick="abrirRelatorios()">
Relatórios
</button>

</div>

</div>

</div>


<script>

const perfil = localStorage.getItem("lapidar_perfil")

if(!perfil){

window.location.href="index.html"

}

document.getElementById("perfilBadge").innerText="Perfil: "+perfil


function abrirUpload(){

window.location.href="upload_obra.html"

}

function abrirAnalisador(){

window.location.href="analisador_obra.html"

}

function abrirProjetos(){

window.location.href="projetos.html"

}


function abrirDiagramador(){

window.location.href="diagramador_editor.html"

}

function abrirCapista(){

window.location.href="capista.html"

}

function abrirSegundaLingua(){

window.location.href="segunda_lingua.html"

}

function abrirAvaliacao(){

window.location.href="avaliacao_literaria.html"

}

function abrirLapidacao(){

window.location.href="lapidacao_literaria.html"

}

function abrirExpedicao(){

window.location.href="expedicao_material.html"

}


function abrirSetores(){

window.location.href="painel_setores.html"

}

function abrirMesario(){

window.location.href="mesario_mor.html"

}

function abrirRelatorios(){

window.location.href="relatorios.html"

}

</script>

</body>
</html>
