<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Departamentos</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0e0604;
color:white;
}

header{
background:#2f436d;
padding:18px 20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.container{
max-width:1000px;
margin:auto;
padding:24px 16px 40px;
}

.card{
background:#1c0e08;
border-radius:14px;
padding:20px;
margin-bottom:18px;
box-shadow:0 6px 18px rgba(0,0,0,.25);
}

.departamento{
background:#2a140c;
padding:16px;
border-radius:10px;
margin-top:10px;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:10px;
}

button{
padding:12px 16px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
background:#2f436d;
color:white;
}

.upload{
background:#8a6f3f;
}

</style>
</head>
<body>

<header>
<h2>Painel de Departamentos</h2>
<button onclick="voltar()">Voltar</button>
</header>

<div class="container">

<div class="card">

<h3>Projeto ativo</h3>

<div id="nomeProjeto">
Nenhum projeto ativo selecionado.
</div>

</div>


<div class="card">

<h3>Departamentos disponíveis</h3>


<div class="departamento">
📄 Upload da obra
<button class="upload" onclick="abrirUploadObra()">Abrir</button>
</div>


<div class="departamento">
🖼 Upload imagens da capa
<button class="upload" onclick="abrirUploadCapa()">Abrir</button>
</div>


<div class="departamento">
📐 Diagramador
<button onclick="abrirDiagramador()">Abrir</button>
</div>


<div class="departamento">
🧠 Avaliação literária
<button onclick="abrirParecer()">Abrir</button>
</div>


<div class="departamento">
🌎 Segunda língua(s)
<button onclick="abrirTraducao()">Abrir</button>
</div>


<div class="departamento">
✨ Lapidação literária
<button onclick="abrirLapidacao()">Abrir</button>
</div>


</div>

</div>

<script>

const perfil = localStorage.getItem("lapidar_perfil");

if(!perfil){
window.location.href="index.html";
}

const projeto = localStorage.getItem("lapidar_projeto_ativo");

if(projeto){
document.getElementById("nomeProjeto").innerText = projeto;
}


function voltar(){
window.location.href="painel_setores.html";
}


function abrirUploadObra(){
window.location.href="upload_obra.html";
}


function abrirUploadCapa(){
window.location.href="upload_imagens_capa.html";
}


function abrirDiagramador(){
window.location.href="diagramador_inicio.html";
}


function abrirParecer(){
window.location.href="avaliacao_literaria.html";
}


function abrirTraducao(){
window.location.href="segunda_lingua.html";
}


function abrirLapidacao(){
window.location.href="lapidacao_literaria.html";
}

</script>

</body>
</html>
