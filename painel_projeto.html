<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel do Projeto — Lapidar</title>

<style>

body{
margin:0;
font-family:Arial;
background:linear-gradient(180deg,#0d2a21,#04120d);
color:white;
}

.container{
max-width:1100px;
margin:auto;
padding:24px;
}

.card{
background:rgba(255,255,255,.07);
border-radius:18px;
padding:24px;
margin-bottom:20px;
}

h1,h2{
margin-top:0;
}

.info{
background:rgba(255,255,255,.05);
padding:12px;
border-radius:12px;
margin-bottom:10px;
}

.tag{
display:inline-block;
padding:8px 14px;
border-radius:999px;
background:rgba(255,255,255,.08);
margin:4px;
font-size:14px;
}

.status-ok{
background:rgba(46,204,113,.15);
border-left:4px solid #2ecc71;
}

.status-wait{
background:rgba(241,196,15,.15);
border-left:4px solid #f1c40f;
}

.status-stop{
background:rgba(231,76,60,.15);
border-left:4px solid #e74c3c;
}

.progress-bar{
height:18px;
background:#ffffff15;
border-radius:999px;
overflow:hidden;
}

.progress-fill{
height:100%;
width:0%;
background:linear-gradient(90deg,#2ecc71,#7dffb3);
transition:.4s;
}

button{
border:none;
padding:14px 18px;
border-radius:12px;
cursor:pointer;
font-weight:bold;
margin:6px;
}

.btn{
background:#2ecc71;
color:#062414;
}

.btn2{
background:#dcefe4;
color:#103222;
}

.autosave{
margin-bottom:14px;
padding:12px;
border-radius:12px;
background:rgba(46,204,113,.12);
border:1px solid rgba(46,204,113,.25);
font-size:14px;
}

</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>Painel do Projeto</h1>

<div class="autosave" id="autoSaveStatus">
Projeto salvo automaticamente.
</div>

<div class="progress-bar">
<div class="progress-fill" id="barra"></div>
</div>

<br>

<div class="info">
<strong>Título:</strong>
<span id="titulo"></span>
</div>

<div class="info">
<strong>Autor:</strong>
<span id="autor"></span>
</div>

<div class="info">
<strong>Criado em:</strong>
<span id="dataCriacao"></span>
</div>

<div class="info">
<strong>Última atualização:</strong>
<span id="ultimaAtualizacao"></span>
</div>

</div>


<div class="card">

<h2>Status editorial</h2>

<div id="statusLapidacao" class="info"></div>

<div id="statusPagamento" class="info"></div>

<div id="statusExportacao" class="info"></div>

</div>


<div class="card">

<h2>Módulos selecionados</h2>

<div id="modulos"></div>

</div>


<div class="card">

<h2>Próxima ação</h2>

<div id="proximaAcao"></div>

<br>

<button class="btn" onclick="continuarFluxo()">
Continuar fluxo editorial
</button>

<button class="btn2" onclick="abrirHistorico()">
Abrir histórico de projetos
</button>

<button class="btn2" onclick="novoProjeto()">
Criar novo projeto
</button>

</div>


</div>


<script>

function obterProjeto(){

return JSON.parse(localStorage.getItem("projeto_lapidar"));

}


function salvarProjeto(p){

p.ultimaAtualizacao = new Date().toISOString();

localStorage.setItem("projeto_lapidar",JSON.stringify(p));

}


function formatarData(d){

return new Date(d).toLocaleString("pt-BR");

}


function atualizarPainel(){

let projeto = obterProjeto();

if(!projeto){

window.location.href="producao_integrada.html";

return;

}

document.getElementById("titulo").innerText = projeto.titulo;

document.getElementById("autor").innerText = projeto.autor;

document.getElementById("dataCriacao").innerText =
formatarData(projeto.criadoEm);

document.getElementById("ultimaAtualizacao").innerText =
projeto.ultimaAtualizacao
? formatarData(projeto.ultimaAtualizacao)
: "Agora";


let progresso = 20;


if(projeto.lapidacaoExecutada){

document.getElementById("statusLapidacao").innerHTML =
"Lapidação Literária concluída";

document.getElementById("statusLapidacao").className =
"info status-ok";

progresso = 50;

}else{

document.getElementById("statusLapidacao").innerHTML =
"Lapidação Literária pendente";

document.getElementById("statusLapidacao").className =
"info status-wait";

}


if(projeto.pagamentoConfirmado){

document.getElementById("statusPagamento").innerHTML =
"Pagamento confirmado";

document.getElementById("statusPagamento").className =
"info status-ok";

progresso = 75;

}else{

document.getElementById("statusPagamento").innerHTML =
"Pagamento pendente";

document.getElementById("statusPagamento").className =
"info status-wait";

}


if(projeto.downloadLiberado){

document.getElementById("statusExportacao").innerHTML =
"Exportação liberada";

document.getElementById("statusExportacao").className =
"info status-ok";

progresso = 100;

}else{

document.getElementById("statusExportacao").innerHTML =
"Exportação indisponível";

document.getElementById("statusExportacao").className =
"info status-stop";

}


document.getElementById("barra").style.width =
progresso+"%";


let lista = "";

projeto.modulosSelecionados.forEach(m=>{

lista += `<span class="tag">${m}</span>`;

});

document.getElementById("modulos").innerHTML = lista;


if(!projeto.lapidacaoExecutada){

document.getElementById("proximaAcao").innerText =
"Próximo passo: executar Lapidação Literária.";

}

else if(!projeto.pagamentoConfirmado){

document.getElementById("proximaAcao").innerText =
"Próximo passo: confirmar pagamento.";

}

else{

document.getElementById("proximaAcao").innerText =
"Próximo passo: exportar obra.";

}

salvarProjeto(projeto);

}


function continuarFluxo(){

let projeto = obterProjeto();

if(!projeto.lapidacaoExecutada){

window.location.href="lapidacao_literaria.html";

return;

}

if(!projeto.pagamentoConfirmado){

window.location.href="pagamento.html";

return;

}

window.location.href="exportador_obra.html";

}


function abrirHistorico(){

window.location.href="historico_projetos.html";

}


function novoProjeto(){

localStorage.removeItem("projeto_lapidar");

window.location.href="producao_integrada.html";

}


atualizarPainel();

</script>


<script src="session_guard.js"></script>

</body>
</html>
