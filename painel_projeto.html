<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel do Projeto — Lapidar</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(180deg,#0d2a21,#04120d);
color:white;
}

.container{
max-width:900px;
margin:auto;
padding:24px;
}

.card{
background:rgba(255,255,255,0.06);
border-radius:16px;
padding:20px;
margin-bottom:18px;
}

button{
padding:14px;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
width:100%;
margin-top:10px;
}

.locked{
background:#555;
color:#bbb;
cursor:not-allowed;
}

.enabled{
background:#2ecc71;
color:#062414;
}

.title{
font-size:22px;
margin-bottom:10px;
}
</style>
</head>

<body>

<div class="container">

<div class="card">
<div class="title">Painel Central do Projeto</div>
<div id="dadosProjeto"></div>
</div>

<div class="card">
<button id="btnLapidacao" onclick="abrirLapidacao()">Executar Lapidação Literária</button>
<button id="btnPagamento" onclick="abrirPagamento()">Ir para Pagamento</button>
<button id="btnDownload" onclick="abrirDownload()">Liberar Download</button>
</div>

</div>

<script>

const projeto = JSON.parse(localStorage.getItem("projeto_lapidar"));

if(!projeto){
alert("Projeto não encontrado. Volte para produção integrada.");
window.location.href="producao_integrada.html";
}

document.getElementById("dadosProjeto").innerHTML=
"<b>Obra:</b> "+projeto.titulo+"<br>"+
"<b>Autor:</b> "+projeto.autor+"<br>"+
"<b>Módulos:</b> "+projeto.modulosSelecionados.join(", ");

const btnLapidacao=document.getElementById("btnLapidacao");
const btnPagamento=document.getElementById("btnPagamento");
const btnDownload=document.getElementById("btnDownload");

btnLapidacao.className="enabled";

if(projeto.lapidacaoExecutada){
btnPagamento.className="enabled";
}else{
btnPagamento.className="locked";
btnPagamento.disabled=true;
}

if(projeto.pagamentoConfirmado){
btnDownload.className="enabled";
}else{
btnDownload.className="locked";
btnDownload.disabled=true;
}

function abrirLapidacao(){

projeto.lapidacaoExecutada=true;
localStorage.setItem("projeto_lapidar",JSON.stringify(projeto));

window.location.href="lapidacao_literaria.html";

}

function abrirPagamento(){

if(!projeto.lapidacaoExecutada)return;

projeto.pagamentoConfirmado=true;
localStorage.setItem("projeto_lapidar",JSON.stringify(projeto));

window.location.href="pagamento.html";

}

function abrirDownload(){

if(!projeto.pagamentoConfirmado)return;

projeto.downloadLiberado=true;
localStorage.setItem("projeto_lapidar",JSON.stringify(projeto));

window.location.href="exportador_obra.html";

}

</script>

</body>
</html>
