<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ponte Geral de Módulos — Lapidar</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
background:#f6f1e7;
display:flex;
align-items:center;
justify-content:center;
height:100vh;
text-align:center;
}

.box{
background:white;
padding:40px;
border-radius:14px;
box-shadow:0 6px 20px rgba(0,0,0,0.15);
max-width:500px;
}

h1{
margin-top:0;
color:#6b4c2c;
}

.status{
margin-top:20px;
font-size:16px;
color:#444;
}

</style>
</head>

<body>

<div class="box">

<h1>Lapidar</h1>

<div class="status" id="status">
Organizando o próximo passo da sua obra...
</div>

</div>


<script>


function getParametro(nome){
const params = new URLSearchParams(window.location.search);
return params.get(nome);
}


function carregarJSON(chave){
try{
return JSON.parse(localStorage.getItem(chave));
}catch{
return null;
}
}


function abrir(destino){

document.getElementById("status").innerText =
"Abrindo " + destino.replace(".html","") + "...";

setTimeout(()=>{
window.location.href = destino;
},900);

}



function iniciarPonte(){

const moduloSolicitado = getParametro("modulo");

const entrada = carregarJSON("lapidar_entrada_bolsao") || {};
const obra = carregarJSON("obraAtual") || {};

const tipoObra = obra.tipo || "";
const objetivo = entrada.objetivoAutor || "";


console.log("Módulo solicitado:", moduloSolicitado);
console.log("Tipo da obra:", tipoObra);
console.log("Objetivo:", objetivo);



/*
========================
EXCEÇÃO INTELIGENTE
POESIA → SILO SONORO
========================
*/

if(tipoObra.toLowerCase().includes("poesia") 
&& objetivo.toLowerCase().includes("audio")){

document.getElementById("status").innerText =
"Preparando texto para gravação no Silo Sonoro...";

setTimeout(()=>{
window.location.href = "silo_sonoro_inicio.html";
},1200);

return;
}



/*
========================
ORDEM EDITORIAL PADRÃO
========================
*/

if(moduloSolicitado === "02"){

abrir("diagramador_inicio.html");
return;

}


if(moduloSolicitado === "03"){

if(!localStorage.getItem("mioloDiagramado")){

document.getElementById("status").innerText =
"Antes de preparar a capa, vamos organizar o miolo do livro.";

setTimeout(()=>{
window.location.href = "diagramador_inicio.html";
},1400);

return;

}

abrir("capista_inicio.html");
return;

}


if(moduloSolicitado === "05"){

abrir("segunda_lingua_inicio.html");
return;

}


if(moduloSolicitado === "07"){

abrir("avaliacao_inicio.html");
return;

}


if(moduloSolicitado === "11"){

abrir("analisador_inicio.html");
return;

}


if(moduloSolicitado === "13"){

abrir("lapidacao_inicio.html");
return;

}


if(moduloSolicitado === "17"){

abrir("silo_sonoro_inicio.html");
return;

}



/*
========================
PADRÃO DEFAULT
========================
*/

document.getElementById("status").innerText =
"Módulo ainda não configurado.";

}



iniciarPonte();

</script>

</body>
</html>
