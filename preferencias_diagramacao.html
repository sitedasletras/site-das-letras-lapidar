<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lapidar — Preferências de Diagramação</title>

<style>

body{

margin:0;
font-family:Arial, sans-serif;
background:#0d0603;
color:white;

display:flex;
justify-content:center;
align-items:center;

min-height:100vh;

}

.container{

width:95%;
max-width:600px;

}

h1{

text-align:center;
margin-bottom:20px;

}

label{

display:block;
margin-top:15px;
font-size:16px;

}

select{

width:100%;
padding:12px;
margin-top:6px;

border-radius:8px;
border:none;

font-size:16px;

}

button{

width:100%;
padding:15px;

margin-top:30px;

border:none;
border-radius:30px;

background:#ff5a00;
color:white;

font-size:18px;
font-weight:bold;

cursor:pointer;

}

.info{

margin-top:15px;
font-size:14px;
color:#ffb27a;

}

</style>

</head>


<body>

<div class="container">

<h1>Preferências de Diagramação</h1>


<label>

Formato do livro

</label>

<select id="formato">

<option>A5</option>
<option>16x23</option>
<option>A4</option>
<option>6x9</option>

</select>



<label>

Alinhamento do texto

</label>

<select id="alinhamento">

<option>Justificado</option>
<option>Alinhado à esquerda</option>
<option>Centrado (poesia)</option>

</select>



<label>

Recuo de parágrafo

</label>

<select id="recuo">

<option>1.25 cm (editorial padrão)</option>
<option>Sem recuo</option>

</select>



<label>

Hifenização automática

</label>

<select id="hifenizacao">

<option>Ativar</option>
<option>Desativar</option>

</select>



<label>

Modo automático de preparação

</label>

<select id="modo">

<option value="livre">Modo livre</option>
<option value="professor">Modo professor</option>
<option value="poesia">Modo poesia</option>
<option value="memorial">Modo memorial</option>
<option value="infantil">Modo infantil</option>
<option value="classico">Modo clássico editorial</option>

</select>



<label>

Tema de visualização

</label>

<select id="tema">

<option value="claro">Modo clássico (papel branco)</option>
<option value="invertido">Modo noturno (preto com letras brancas)</option>

</select>


<div class="info">

O modo noturno melhora a leitura na tela.
Não altera automaticamente a versão para impressão.

</div>



<button onclick="salvarPreferencias()">

Confirmar Preferências

</button>

</div>



<script>

function salvarPreferencias(){

const formato = document.getElementById("formato").value;

const alinhamento = document.getElementById("alinhamento").value;

const recuo = document.getElementById("recuo").value;

const hifenizacao = document.getElementById("hifenizacao").value;

const modo = document.getElementById("modo").value;

const tema = document.getElementById("tema").value;



localStorage.setItem("SDL_formato", formato);

localStorage.setItem("SDL_alinhamento", alinhamento);

localStorage.setItem("SDL_recuo", recuo);

localStorage.setItem("SDL_hifenizacao", hifenizacao);

localStorage.setItem("SDL_modo_preparacao", modo);

localStorage.setItem("SDL_tema_visual", tema);



aplicarModoAutomatico(modo);



alert("Preferências salvas com sucesso.");

window.location.href="revisao_pedido.html";

}



function aplicarModoAutomatico(modo){

if(modo === "professor"){

localStorage.setItem("SDL_formato","A4");

localStorage.setItem("SDL_recuo","Sem recuo");

localStorage.setItem("SDL_alinhamento","Alinhado à esquerda");

}



if(modo === "poesia"){

localStorage.setItem("SDL_recuo","Sem recuo");

localStorage.setItem("SDL_alinhamento","Centrado (poesia)");

}



if(modo === "memorial"){

localStorage.setItem("SDL_tema_visual","invertido");

}



if(modo === "classico"){

localStorage.setItem("SDL_formato","A5");

localStorage.setItem("SDL_alinhamento","Justificado");

}



}

</script>


</body>

</html>
