<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preferências de diagramação — Lapidar</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0d0603;
color:white;
display:flex;
justify-content:center;
}

.container{
max-width:760px;
width:92%;
padding:40px 0 60px 0;
}

.titulo{
font-size:36px;
text-align:center;
font-weight:bold;
}

.subtitulo{
text-align:center;
color:#ff7b2c;
margin-top:10px;
margin-bottom:28px;
line-height:1.6;
}

.card{
background:#140c08;
padding:24px;
border-radius:14px;
margin-top:20px;
line-height:1.8;
}

label{
display:block;
margin-top:16px;
margin-bottom:6px;
font-weight:bold;
color:#ffd2b3;
}

select{
width:100%;
padding:12px;
border-radius:10px;
border:none;
font-size:15px;
}

.botao{
width:100%;
padding:18px;
margin-top:18px;
border:none;
border-radius:40px;
background:#ff5a00;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.botao:hover{
background:#ff6f1a;
}

.botaoCinza{
background:#444;
}

.botaoCinza:hover{
background:#666;
}

.sucesso{
margin-top:18px;
color:#9cffb2;
font-weight:bold;
text-align:center;
}

</style>
</head>
<body>

<div class="container">

<div class="titulo">
Preferências de diagramação
</div>

<div class="subtitulo">
Ajustes rápidos antes da geração automática do preview editorial
</div>

<div class="card">

<label>
Formato do livro
</label>

<select id="formatoLivro">
<option value="A5">A5 (padrão editorial)</option>
<option value="16x23">16 x 23 cm</option>
<option value="6x9">6 x 9 polegadas</option>
<option value="A4">A4</option>
<option value="Infantil">Formato infantil</option>
</select>

<label>
Margens
</label>

<select id="margensLivro">
<option value="espelhadas">Margens espelhadas (recomendado)</option>
<option value="simples">Margens simples</option>
</select>

<label>
Fonte editorial
</label>

<select id="fonteLivro">
<option value="padrao">Fonte editorial automática</option>
<option value="serifada">Serifada clássica</option>
<option value="moderna">Moderna sem serifa</option>
</select>

<label>
Diálogo com travessão
</label>

<select id="dialogoTravessao">
<option value="sim">Sim (padrão Site das Letras)</option>
<option value="nao">Não</option>
</select>

<label>
Hifenização automática
</label>

<select id="hifenizacao">
<option value="sim">Sim</option>
<option value="nao">Não</option>
</select>

<div id="confirmacao" class="sucesso"></div>

<button class="botao"
onclick="salvarPreferencias()">
Salvar preferências
</button>

<button class="botao"
onclick="seguirPreview()">
Gerar preview editorial
</button>

<button class="botaoCinza botao"
onclick="voltarUpload()">
Voltar
</button>

</div>

</div>

<script>

function salvarPreferencias(){

localStorage.setItem(
"SDL_formato_livro",
document.getElementById("formatoLivro").value
);

localStorage.setItem(
"SDL_margens_livro",
document.getElementById("margensLivro").value
);

localStorage.setItem(
"SDL_fonte_livro",
document.getElementById("fonteLivro").value
);

localStorage.setItem(
"SDL_dialogo_travessao",
document.getElementById("dialogoTravessao").value
);

localStorage.setItem(
"SDL_hifenizacao",
document.getElementById("hifenizacao").value
);

localStorage.setItem(
"SDL_preferencias_diag",
"sim"
);

document.getElementById("confirmacao").innerText =
"Preferências registradas com sucesso.";

}

function seguirPreview(){

const registrado =
localStorage.getItem("SDL_entrada_obra_registrada");

if(registrado !== "sim"){

alert("Envie primeiro o original.");

return;

}

window.location.href =
"preview_projeto.html";

}

function voltarUpload(){

window.location.href =
"upload_livro.html";

}

</script>

</body>
</html>
