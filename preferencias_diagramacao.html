<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Preferências da Diagramação — Lapidar</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0d0603;
color:white;
display:flex;
justify-content:center;
}

.container{
max-width:720px;
width:92%;
padding:40px 0 60px 0;
}

.titulo{
font-size:36px;
text-align:center;
font-weight:bold;
}

.subtitulo{
text-align:center;
color:#ff7b2c;
margin-top:10px;
margin-bottom:30px;
}

.card{

background:#140c08;
border-radius:14px;
padding:22px;
margin-top:20px;

}

label{
display:block;
margin-top:14px;
margin-bottom:6px;
font-weight:bold;
color:#ffd2b3;
}

select{

width:100%;
padding:12px;
border-radius:10px;
border:none;

}

.botao{

width:100%;
padding:18px;
margin-top:20px;
border:none;
border-radius:40px;
background:#ff5a00;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;

}

.botaoCinza{

background:#444;

}

.botaoCinza:hover{

background:#666;

}

.sucesso{

margin-top:20px;
color:#9cffb2;
text-align:center;

}

</style>

</head>

<body>

<div class="container">

<div class="titulo">
Preferências da Diagramação
</div>

<div class="subtitulo">
Escolha como deseja preparar a apresentação editorial do seu livro
</div>

<div class="card">

<label>Idioma editorial da obra</label>

<input
type="text"
id="idiomaMostrado"
readonly
style="width:100%;padding:12px;border-radius:10px;border:none;"
>

<label>Tamanho do livro</label>

<select id="formatoLivro">

<option value="">Selecione</option>
<option>A5</option>
<option>16x23</option>
<option>6x9</option>
<option>A4</option>

</select>

<label>Margens</label>

<select id="margensLivro">

<option value="">Selecione</option>
<option>Espelhadas</option>
<option>Normais</option>

</select>

<label>Alinhamento do texto</label>

<select id="alinhamentoTexto">

<option value="">Selecione</option>
<option>Justificado</option>
<option>Alinhado à esquerda</option>

</select>

<label>Parágrafos</label>

<select id="paragrafosTexto">

<option value="">Selecione</option>
<option>Recuo primeira linha</option>
<option>Sem recuo</option>

</select>

<label>Hifenização</label>

<select id="hifenizacaoTexto">

<option value="">Selecione</option>
<option>Automática</option>
<option>Desativada</option>

</select>

</div>

<button class="botao" onclick="salvarPreferencias()">
Salvar preferências
</button>

<button class="botao" onclick="seguirResumo()">
Seguir para revisão do pedido
</button>

<button class="botao botaoCinza" onclick="window.location.href='upload_livro.html'">
Voltar para entrada do original
</button>

<button class="botao botaoCinza" onclick="window.location.href='_Indice.html'">
Voltar para casa do original
</button>

<div id="mensagemSucesso" class="sucesso"></div>

</div>

<script>

function traduzirIdioma(codigo){

if(codigo === "pt") return "Português";
if(codigo === "en") return "English";
if(codigo === "es") return "Español";
if(codigo === "it") return "Italiano";
if(codigo === "fr") return "Français";
if(codigo === "de") return "Deutsch";

return "Português";

}

function obterIdiomaMestre(){

const idiomaGlobal = localStorage.getItem("SDL_idioma_obra_global");

const idiomaLocal = localStorage.getItem("SDL_idioma_obra");

return idiomaGlobal || idiomaLocal || "pt";

}

function carregarIdioma(){

const idioma = obterIdiomaMestre();

document.getElementById("idiomaMostrado").value =
traduzirIdioma(idioma);

}

function salvarPreferencias(){

const formato =
document.getElementById("formatoLivro").value;

const margens =
document.getElementById("margensLivro").value;

const alinhamento =
document.getElementById("alinhamentoTexto").value;

const paragrafos =
document.getElementById("paragrafosTexto").value;

const hifenizacao =
document.getElementById("hifenizacaoTexto").value;

if(!formato){

alert("Escolha o formato do livro.");

return;

}

if(!margens){

alert("Escolha o tipo de margens.");

return;

}

if(!alinhamento){

alert("Escolha o alinhamento.");

return;

}

if(!paragrafos){

alert("Escolha o estilo de parágrafo.");

return;

}

if(!hifenizacao){

alert("Escolha a hifenização.");

return;

}

localStorage.setItem("SDL_formato", formato);

localStorage.setItem("SDL_margens", margens);

localStorage.setItem("SDL_alinhamento", alinhamento);

localStorage.setItem("SDL_paragrafos", paragrafos);

localStorage.setItem("SDL_hifenizacao", hifenizacao);

document.getElementById("mensagemSucesso").innerHTML =

"Preferências salvas com sucesso.";

}

function seguirResumo(){

const formato =
localStorage.getItem("SDL_formato");

if(!formato){

alert("Salve primeiro as preferências.");

return;

}

window.location.href =
"revisao_pedido.html";

}

carregarIdioma();

</script>

</body>

</html>
