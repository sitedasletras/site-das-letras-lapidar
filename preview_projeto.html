<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview do Projeto — Lapidar</title>

<style>

:root{
--bg:#0d0603;
--card:#140c08;
--card2:#1b100a;
--text:#ffffff;
--muted:#ffd2b3;
--orange:#f7b22c;
--orangeStrong:#ff5a00;
--green:#9cfdb2;
--border:rgba(255,123,44,0.18);
--shadow:0 10px 26px rgba(0,0,0,0.28);
}

body{
margin:0;
font-family:Arial;
background:var(--bg);
color:white;
}

.container{
width:min(1100px,95%);
margin:auto;
padding:40px 0;
}

.titulo{
font-size:36px;
font-weight:bold;
}

.subtitulo{
margin-top:6px;
color:var(--orange);
}

.card{
margin-top:30px;
background:var(--card);
padding:24px;
border-radius:18px;
border:1px solid var(--border);
box-shadow:var(--shadow);
}

.status{
margin-top:20px;
padding:16px;
border-radius:12px;
background:rgba(247,178,44,0.12);
border:1px solid rgba(247,178,44,0.25);
}

.linha{
margin-top:12px;
color:var(--muted);
}

.rotulo{
color:var(--orange);
font-weight:bold;
}

.actions{
margin-top:24px;
display:flex;
flex-wrap:wrap;
gap:12px;
}

button{
border:none;
padding:14px 18px;
border-radius:999px;
cursor:pointer;
font-weight:bold;
}

.btnEditar{
background:#174d27;
color:white;
}

.btnHistorico{
background:var(--orangeStrong);
color:white;
}

.btnIndice{
background:#24150f;
color:white;
}

</style>
</head>

<body>

<div class="container">

<div class="titulo">
Preview do Projeto
</div>

<div class="subtitulo">
Visualização do projeto ativo selecionado no Lapidar
</div>



<div id="statusPreview" class="status">
Carregando projeto ativo...
</div>



<div id="dadosProjeto"></div>



<div class="actions">

<button class="btnEditar" onclick="abrirUpload()">
Editar projeto
</button>

<button class="btnHistorico" onclick="abrirHistorico()">
Abrir histórico
</button>

<button class="btnIndice" onclick="voltarIndice()">
Voltar ao índice
</button>

</div>

</div>



<script>

function verificarSessao(){

const sessao = localStorage.getItem("SDL_sessao_ativa")

if(sessao !== "sim"){
window.location.href="login.html"
}

}



function carregarPreview(){

let lista = []
let ativo = null
let projeto = null

try{

lista = JSON.parse(
localStorage.getItem("SDL_projetos_lista") || "[]"
)

ativo = localStorage.getItem("SDL_projeto_ativo")

}catch(e){}



if(!ativo){

document.getElementById("statusPreview").innerHTML =
"Nenhum projeto ativo selecionado."

return

}



projeto = lista.find(p => p.id === ativo)



if(!projeto){

document.getElementById("statusPreview").innerHTML =
"Projeto ativo não encontrado na lista."

return

}



document.getElementById("statusPreview").innerHTML =
"Projeto carregado com sucesso."

document.getElementById("statusPreview").style.background =
"rgba(23,77,39,0.28)"



document.getElementById("dadosProjeto").innerHTML = `

<div class="card">

<div class="linha">
<span class="rotulo">Título:</span>
${projeto.titulo || "—"}
</div>

<div class="linha">
<span class="rotulo">Subtítulo:</span>
${projeto.subtitulo || "—"}
</div>

<div class="linha">
<span class="rotulo">Autor:</span>
${projeto.autor || "—"}
</div>

<div class="linha">
<span class="rotulo">Coleção:</span>
${projeto.colecao || "—"}
</div>

<div class="linha">
<span class="rotulo">Formato:</span>
${projeto.formato || "—"}
</div>

<div class="linha">
<span class="rotulo">Status editorial:</span>
${projeto.status || "—"}
</div>

<div class="linha">
<span class="rotulo">Observações:</span>
${projeto.observacoes || "—"}
</div>

<div class="linha">
<span class="rotulo">Registrado em:</span>
${formatarData(projeto.dataRegistro)}
</div>

</div>

`

}



function formatarData(d){

if(!d) return "—"

try{
return new Date(d).toLocaleString("pt-BR")
}catch{
return d
}

}



function abrirUpload(){
window.location.href="upload_livro.html"
}



function abrirHistorico(){
window.location.href="historico_projetos.html"
}



function voltarIndice(){
window.location.href="_Indice.html"
}



verificarSessao()
carregarPreview()

</script>

</body>
</html>
