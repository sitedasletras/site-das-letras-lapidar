<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview do Projeto — Lapidar</title>

<style>

:root{
--bg:#0d0603;
--card:#140c08;
--card2:#1b100a;
--text:#ffffff;
--muted:#ffd2b3;
--orange:#f7b22c;
--orangeStrong:#ff5a00;
--green:#9cfdb2;
--danger:#ff7070;
--border:rgba(255,123,44,0.18);
--shadow:0 10px 26px rgba(0,0,0,0.28);
}

body{
margin:0;
font-family:Arial;
background:var(--bg);
color:white;
}

.container{
width:min(1100px,95%);
margin:auto;
padding:40px 0;
}

.titulo{
font-size:38px;
font-weight:bold;
}

.subtitulo{
margin-top:6px;
color:var(--orange);
}

.preview-card{
margin-top:30px;
background:var(--card);
padding:28px;
border-radius:18px;
border:1px solid var(--border);
box-shadow:var(--shadow);
}

.preview-titulo{
font-size:28px;
font-weight:bold;
margin-bottom:8px;
}

.preview-subtitulo{
font-size:20px;
color:var(--orange);
margin-bottom:18px;
}

.linha{
margin-top:12px;
color:var(--muted);
}

.rotulo{
color:var(--orange);
font-weight:bold;
}

.observacoes{
margin-top:20px;
padding:18px;
border-radius:14px;
background:var(--card2);
line-height:1.8;
white-space:pre-line;
}

.statusBox{
margin-top:20px;
padding:18px;
border-radius:14px;
background:rgba(247,178,44,0.12);
border:1px solid rgba(247,178,44,0.2);
color:#ffe7b0;
}

.actions{
margin-top:26px;
display:flex;
flex-wrap:wrap;
gap:12px;
}

.botao{
border:none;
padding:14px 18px;
border-radius:999px;
font-weight:bold;
cursor:pointer;
}

.botaoIndice{
background:#24150f;
color:white;
}

.botaoUpload{
background:#174d27;
color:#dfffe8;
}

.botaoHistorico{
background:var(--orangeStrong);
color:white;
}

</style>
</head>

<body>

<div class="container">

<div class="titulo">
PREVIEW DO PROJETO
</div>

<div class="subtitulo">
Visualização rápida do cadastro editorial atual
</div>



<div id="statusPreview" class="statusBox">
Carregando dados do projeto...
</div>



<div id="areaPreview"></div>



<div class="actions">

<button class="botao botaoUpload" onclick="abrirUpload()">
Editar projeto
</button>

<button class="botao botaoHistorico" onclick="abrirHistorico()">
Abrir histórico
</button>

<button class="botao botaoIndice" onclick="voltarIndice()">
Voltar ao índice
</button>

</div>



</div>



<script>

function verificarSessao(){

const sessao = localStorage.getItem("SDL_sessao_ativa")

if(sessao !== "sim"){

window.location.href = "login.html"

}

}



function carregarPreview(){

let projeto = null

try{

const bruto = localStorage.getItem("SDL_projeto_ativo")

if(bruto){

projeto = JSON.parse(bruto)

}

}catch(e){

console.log("Erro ao ler projeto")

}



const status = document.getElementById("statusPreview")
const area = document.getElementById("areaPreview")

if(!projeto){

status.innerHTML =
"Nenhum projeto ativo encontrado neste dispositivo."

area.innerHTML = ""

return

}



status.innerHTML =
"Preview carregado com sucesso."

status.style.background =
"rgba(23,77,39,0.28)"



area.innerHTML = `

<div class="preview-card">

<div class="preview-titulo">
${projeto.titulo || "Sem título"}
</div>

<div class="preview-subtitulo">
${projeto.subtitulo || "—"}
</div>

<div class="linha">
<span class="rotulo">Autor:</span>
${projeto.autor || "—"}
</div>

<div class="linha">
<span class="rotulo">Coleção:</span>
${projeto.colecao || "—"}
</div>

<div class="linha">
<span class="rotulo">Formato:</span>
${projeto.formato || "—"}
</div>

<div class="linha">
<span class="rotulo">Status editorial:</span>
${projeto.status || "—"}
</div>

<div class="observacoes">
<span class="rotulo">Observações:</span>

${projeto.observacoes || "Sem observações registradas."}
</div>

<div class="linha">
<span class="rotulo">Data do registro:</span>
${formatarData(projeto.dataRegistro)}
</div>

</div>

`

}



function formatarData(data){

if(!data) return "—"

try{

return new Date(data).toLocaleString("pt-BR")

}catch(e){

return data

}

}



function abrirUpload(){

window.location.href="upload_livro.html"

}



function abrirHistorico(){

window.location.href="historico_projetos.html"

}



function voltarIndice(){

window.location.href="_Indice.html"

}



verificarSessao()
carregarPreview()

</script>

</body>
</html>
