<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produção Integrada</title>

<style>

body{
font-family:Arial;
background:#efe2c2;
margin:0;
padding:0;
}

header{
background:#2f436d;
color:white;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:20px;
padding:20px;
}

.card{
background:white;
border-radius:16px;
padding:20px;
position:relative;
box-shadow:0 6px 14px rgba(0,0,0,0.1);
}

.lock{
position:absolute;
top:12px;
right:12px;
background:#a00;
color:white;
padding:4px 8px;
border-radius:6px;
font-size:12px;
display:none;
}

button{
margin-top:10px;
padding:10px;
border:none;
background:#2f436d;
color:white;
border-radius:8px;
cursor:pointer;
}

button:disabled{
background:#aaa;
cursor:not-allowed;
}

</style>
</head>

<body>

<header>

<h2>Produção Integrada</h2>

<button onclick="logout()">Sair</button>

</header>

<div class="grid">

<div class="card" id="card1">
<div class="lock">🔒</div>
<h3>Setor 1</h3>
<button onclick="abrir(1)">Entrar</button>
</div>

<div class="card" id="card3">
<div class="lock">🔒</div>
<h3>Setor 3</h3>
<button onclick="abrir(3)">Entrar</button>
</div>

<div class="card" id="card5">
<div class="lock">🔒</div>
<h3>Setor 5</h3>
<button onclick="abrir(5)">Entrar</button>
</div>

<div class="card" id="card7">
<div class="lock">🔒</div>
<h3>Setor 7</h3>
<button onclick="abrir(7)">Entrar</button>
</div>

<div class="card" id="card11">
<div class="lock">🔒</div>
<h3>Setor 11</h3>
<button onclick="abrir(11)">Entrar</button>
</div>

<div class="card" id="card13">
<div class="lock">🔒</div>
<h3>Setor 13</h3>
<button onclick="abrir(13)">Entrar</button>
</div>

</div>


<script>


function logout(){

localStorage.removeItem("lapidar_perfil")

window.location.href="index.html"

}


function abrir(setor){

alert("Abrindo setor "+setor)

}


function aplicarPermissoes(){

const perfil=localStorage.getItem("lapidar_perfil")

if(!perfil)return


if(perfil==="admin" || perfil==="heteronimo") return


const cortesias=JSON.parse(localStorage.getItem("lapidar_cortesias") || "{}")


if(!cortesias[perfil]) return


const dados=cortesias[perfil]


if(dados.status!=="ativa"){

bloquearTudo()

return

}


if(dados.accessLevel==="global") return


const permitidos=dados.sectors || []


[1,3,5,7,11,13].forEach(setor=>{

if(!permitidos.includes(setor)){

bloquear(setor)

}

})

}


function bloquear(setor){

const card=document.querySelector("#card"+setor)

card.querySelector("button").disabled=true

card.querySelector(".lock").style.display="block"

}


function bloquearTudo(){

[1,3,5,7,11,13].forEach(bloquear)

}


aplicarPermissoes()


</script>

</body>
</html>
