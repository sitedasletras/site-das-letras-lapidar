<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produção Integrada — Lapidar</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(180deg, #102f24, #061711);
    color: #ffffff;
}

.container {
    max-width: 980px;
    margin: 0 auto;
    padding: 24px;
}

.card {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 18px;
    padding: 22px;
    margin-bottom: 20px;
}

h1, h2 {
    margin-top: 0;
}

p {
    color: #d8efe3;
    line-height: 1.6;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
}

input[type="text"] {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    outline: none;
    margin-bottom: 18px;
    font-size: 15px;
    background: #f3fff8;
    color: #113322;
}

.checkbox-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 12px;
    margin-top: 14px;
}

.checkbox-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    padding: 14px;
    border-radius: 12px;
    color: #e8fff2;
}

.checkbox-item input {
    width: 18px;
    height: 18px;
}

.actions {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 18px;
}

button {
    border: none;
    border-radius: 12px;
    padding: 14px 18px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.btn-principal {
    background: #2ecc71;
    color: #062414;
}

.btn-principal:hover {
    background: #29b765;
}

.btn-secundario {
    background: #dcefe4;
    color: #103222;
}

.btn-secundario:hover {
    background: #c8e6d4;
}

.status {
    display: none;
    margin-top: 16px;
    padding: 14px;
    border-radius: 12px;
    background: rgba(46, 204, 113, 0.14);
    border: 1px solid rgba(46, 204, 113, 0.24);
    color: #dbffea;
}
</style>
</head>
<body>

<div class="container">

    <div class="card">
        <h1>Produção Integrada Lapidar</h1>
        <p>
            Registre a obra, selecione os módulos desejados e abra o painel central do projeto.
            A partir dali, o sistema acompanha a esteira editorial de forma mais clara e mais próxima do autor.
        </p>
    </div>

    <div class="card">
        <h2>Dados da obra</h2>

        <label for="titulo">Título da obra</label>
        <input type="text" id="titulo" placeholder="Digite o título da obra">

        <label for="autor">Autor</label>
        <input type="text" id="autor" placeholder="Digite o nome do autor">

        <h2>Módulos desejados</h2>

        <div class="checkbox-grid">
            <label class="checkbox-item">
                <input type="checkbox" value="Assistente de Diagramação">
                <span>Assistente de Diagramação</span>
            </label>

            <label class="checkbox-item">
                <input type="checkbox" value="OKapista">
                <span>OKapista</span>
            </label>

            <label class="checkbox-item">
                <input type="checkbox" value="Lapidação Literária">
                <span>Lapidação Literária</span>
            </label>

            <label class="checkbox-item">
                <input type="checkbox" value="Avaliação Literária">
                <span>Avaliação Literária</span>
            </label>

            <label class="checkbox-item">
                <input type="checkbox" value="Analisador de Obra">
                <span>Analisador de Obra</span>
            </label>

            <label class="checkbox-item">
                <input type="checkbox" value="Silo Sonoro">
                <span>Silo Sonoro</span>
            </label>
        </div>

        <div class="actions">
            <button class="btn-principal" onclick="registrarProjeto()">Registrar projeto</button>
            <button class="btn-secundario" onclick="limparSessao()">Limpar sessão atual</button>
        </div>

        <div class="status" id="mensagemStatus"></div>
    </div>

</div>

<script>
function mostrarMensagem(texto) {
    const box = document.getElementById("mensagemStatus");
    box.style.display = "block";
    box.textContent = texto;
}

function limparSessao() {
    localStorage.removeItem("projeto_lapidar");
    document.getElementById("titulo").value = "";
    document.getElementById("autor").value = "";
    document.querySelectorAll('input[type="checkbox"]').forEach(item => item.checked = false);
    mostrarMensagem("Sessão limpa com sucesso. Agora você pode iniciar um projeto novo sem fantasmas do anterior.");
}

function registrarProjeto() {
    const titulo = document.getElementById("titulo").value.trim();
    const autor = document.getElementById("autor").value.trim();

    if (!titulo || !autor) {
        alert("Informe título e autor da obra.");
        return;
    }

    const selecionados = Array.from(
        document.querySelectorAll('input[type="checkbox"]:checked')
    ).map(item => item.value);

    localStorage.removeItem("projeto_lapidar");

    const projeto = {
        titulo: titulo,
        autor: autor,
        modulosSelecionados: selecionados,
        lapidacaoExecutada: false,
        pagamentoConfirmado: false,
        downloadLiberado: false,
        criadoEm: new Date().toISOString()
    };

    localStorage.setItem("projeto_lapidar", JSON.stringify(projeto));

    mostrarMensagem("Projeto registrado com sucesso. Abrindo o painel central do projeto...");

    setTimeout(() => {
        window.location.href = "painel_projeto.html";
    }, 700);
}
</script>

</body>
</html>
