<!-- SUBSTITUA APENAS O BLOCO <script> FINAL DO producao_integrada.html POR ESTE -->

<script>
const perfil = localStorage.getItem("lapidar_perfil");
const usuarioInterno = localStorage.getItem("lapidar_usuario");
const usuarioLogado = localStorage.getItem("lapidar_usuario_logado");
const nome = localStorage.getItem("lapidar_nome") || usuarioInterno || usuarioLogado || "";

// perfis institucionais tratados como cortesia dinâmica
const perfisInstitucionais = [
"cortesia",
"quimera",
"andre",
"cl",
"valetbooks",
"estilopoesia"
];

if(!perfil){
window.location.href = "index.html";
}

// admin / heteronimo continuam completos
if(perfil === "admin" || perfil === "heteronimo"){
if(!usuarioInterno){
window.location.href = "index.html";
}
}

// utilizador continua normal
if(perfil === "utilizador"){
if(!usuarioLogado){
window.location.href = "index.html";
}
}

// agora todos institucionais usam mesma regra da cortesia
if(perfisInstitucionais.includes(perfil)){
if(!usuarioInterno && !usuarioLogado){
window.location.href = "index.html";
}
}

let setorAtual = null;

function sairPrograma(){
localStorage.removeItem("lapidar_perfil");
localStorage.removeItem("lapidar_usuario");
localStorage.removeItem("lapidar_usuario_logado");
localStorage.removeItem("lapidar_nome");
localStorage.removeItem("lapidar_email");
localStorage.removeItem("lapidar_telefone");
window.location.href = "index.html";
}

function voltarInterno(){
if(perfil === "admin" || perfil === "heteronimo"){
window.location.href = "sala_reunioes.html";
return;
}
window.location.href = "index.html";
}

function chaveSetor(id){
return "lapidar_setor_" + perfil + "_" + id;
}

function carregarSetor(id){
try{
return JSON.parse(localStorage.getItem(chaveSetor(id)) || "{}");
}catch(e){
return {};
}
}

function salvarSetorAtual(){
if(!setorAtual){
return;
}

const dados = {
notes: document.getElementById("workspaceNotes").value,
status: document.getElementById("workspaceStatus").value,
updatedAt: new Date().toISOString()
};

localStorage.setItem(chaveSetor(setorAtual), JSON.stringify(dados));
document.getElementById("workspaceSuccess").classList.add("show");
}

function aplicarPerfil(){

const heroSmall = document.getElementById("heroSmall");
const heroTitle = document.getElementById("heroTitle");
const heroText = document.getElementById("heroText");
const btnInterno = document.getElementById("btnInterno");
const cardMesario = document.getElementById("cardMesario");
const valores = document.querySelectorAll(".valor-comum");

if(perfil === "admin"){

heroSmall.innerText = "Lapidar · Produção Integrada";
heroTitle.innerText = "Produção Integrada";
heroText.innerText = "Área interna com acesso completo aos setores e ao Mesário.";
btnInterno.classList.remove("hidden");
cardMesario.classList.remove("hidden");
valores.forEach(el => el.classList.remove("hidden"));

}

else if(perfil === "heteronimo"){

heroSmall.innerText = "Lapidar · Produção Integrada";
heroTitle.innerText = "Produção Integrada";
heroText.innerText = "Área interna com acesso aos setores e ao Mesário.";
btnInterno.classList.remove("hidden");
cardMesario.classList.remove("hidden");
valores.forEach(el => el.classList.remove("hidden"));

}

else if(perfil === "utilizador"){

heroSmall.innerText = "Lapidar · Programas";
heroTitle.innerText = "Programas do Lapidar";
heroText.innerText = "Escolha o programa desejado.";
btnInterno.classList.add("hidden");
cardMesario.classList.remove("hidden");
valores.forEach(el => el.classList.add("hidden"));

}

else if(perfisInstitucionais.includes(perfil)){

heroSmall.innerText = "Lapidar · Programas";
heroTitle.innerText = "Programas do Lapidar";
heroText.innerText = "Acesso institucional configurado pelo painel de permissões.";
btnInterno.classList.add("hidden");
cardMesario.classList.add("hidden");
valores.forEach(el => el.classList.add("hidden"));

}

else{

window.location.href = "index.html";

}

}

aplicarPerfil();
</script>
