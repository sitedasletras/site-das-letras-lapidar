<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produção Integrada — Lapidar</title>

<style>

body{
margin:0;
font-family:Arial;
background:linear-gradient(180deg,#102f24,#061711);
color:white;
}

.container{
max-width:980px;
margin:auto;
padding:24px;
}

.card{
background:rgba(255,255,255,.07);
border-radius:18px;
padding:22px;
margin-bottom:20px;
}

h1,h2{
margin-top:0;
}

input{
width:100%;
padding:14px;
border-radius:12px;
border:none;
margin-bottom:18px;
font-size:15px;
}

.checkbox-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:12px;
}

.checkbox-item{
background:rgba(255,255,255,.05);
padding:12px;
border-radius:12px;
}

button{
border:none;
padding:14px 18px;
border-radius:12px;
cursor:pointer;
font-weight:bold;
margin-top:12px;
}

.btn{
background:#2ecc71;
color:#062414;
}

.btn2{
background:#dcefe4;
color:#103222;
}

.status{
display:none;
margin-top:14px;
padding:12px;
border-radius:12px;
background:rgba(46,204,113,.15);
}

</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>Produção Integrada</h1>

<p>
Cadastre sua obra e selecione os módulos editoriais desejados.
</p>

</div>

<div class="card">

<h2>Dados da obra</h2>

<input
id="titulo"
placeholder="Título da obra"
/>

<input
id="autor"
placeholder="Nome do autor"
/>

<h2>Módulos editoriais</h2>

<div class="checkbox-grid">

<label class="checkbox-item">
<input type="checkbox" value="Assistente de Diagramação">
Assistente de Diagramação
</label>

<label class="checkbox-item">
<input type="checkbox" value="OKapista">
OKapista
</label>

<label class="checkbox-item">
<input type="checkbox" value="Lapidação Literária">
Lapidação Literária
</label>

<label class="checkbox-item">
<input type="checkbox" value="Avaliação Literária">
Avaliação Literária
</label>

<label class="checkbox-item">
<input type="checkbox" value="Analisador de Obra">
Analisador de Obra
</label>

<label class="checkbox-item">
<input type="checkbox" value="Silo Sonoro">
Silo Sonoro
</label>

</div>

<br>

<button class="btn"
onclick="registrarProjeto()">

Registrar projeto

</button>

<button class="btn2"
onclick="limparSessao()">

Limpar sessão atual

</button>

<div
class="status"
id="mensagem">
</div>

</div>

</div>

<script>

function obterHistorico(){

return JSON.parse(
localStorage.getItem("historico_lapidar")
|| "[]"
);

}


function salvarHistorico(lista){

localStorage.setItem(
"historico_lapidar",
JSON.stringify(lista)
);

}


function limparSessao(){

localStorage.removeItem("projeto_lapidar");

document.getElementById("titulo").value="";
document.getElementById("autor").value="";

document.querySelectorAll("input[type=checkbox]")
.forEach(x=>x.checked=false);

mostrarMensagem(
"Sessão limpa com sucesso."
);

}


function mostrarMensagem(msg){

let box=document.getElementById("mensagem");

box.style.display="block";

box.innerText=msg;

}


function registrarProjeto(){

let titulo=
document.getElementById("titulo").value.trim();

let autor=
document.getElementById("autor").value.trim();


if(!titulo||!autor){

alert("Informe título e autor.");

return;

}


let modulos=
Array.from(
document.querySelectorAll(
"input[type=checkbox]:checked"
)
).map(x=>x.value);


let agora=
new Date().toISOString();


let projeto={

id:
"lapidar_"
+Date.now(),

titulo,

autor,

modulosSelecionados:modulos,

criadoEm:agora,

ultimaAtualizacao:agora,

lapidacaoExecutada:false,

pagamentoConfirmado:false,

downloadLiberado:false,

textoLapidado:null,

dataLapidacao:null,

dataPagamento:null,

exportadoEm:null

};


localStorage.setItem(
"projeto_lapidar",
JSON.stringify(projeto)
);


let historico=
obterHistorico();

historico.push(projeto);

salvarHistorico(historico);


mostrarMensagem(
"Projeto criado com sucesso."
);


setTimeout(()=>{

window.location.href=
"painel_projeto.html";

},600);

}

</script>

</body>
</html>
