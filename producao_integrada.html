<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produção Integrada — Lapidar</title>

<style>

body{
font-family:Arial;
background:#f5ecd2;
margin:0;
padding:40px;
}

.container{
max-width:800px;
margin:auto;
background:white;
padding:30px;
border-radius:12px;
box-shadow:0px 8px 25px rgba(0,0,0,0.1);
}

h1{
text-align:center;
}

label{
font-weight:bold;
display:block;
margin-top:20px;
}

input{
width:100%;
padding:12px;
margin-top:5px;
border-radius:6px;
border:1px solid #ccc;
}

button{
margin-top:30px;
padding:15px;
width:100%;
background:#2e5c8a;
color:white;
font-size:18px;
border:none;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#1f3e5e;
}

.modulos{
margin-top:30px;
}

.modulos label{
display:block;
margin:8px 0;
}

.status{
margin-top:25px;
padding:15px;
background:#eef3f8;
border-radius:8px;
}

</style>

</head>

<body>

<div class="container">

<h1>Produção Integrada Lapidar</h1>

<label>Título da obra</label>
<input id="titulo">

<label>Autor</label>
<input id="autor">

<label>Arquivo da obra</label>
<input type="file" id="arquivo">

<div class="modulos">

<h2>Módulos desejados</h2>

<label><input type="checkbox" id="diagramacao"> Assistente de Diagramação</label>

<label><input type="checkbox" id="capa"> OKapista</label>

<label><input type="checkbox" id="traducao"> Segunda Língua(s)</label>

<label><input type="checkbox" id="avaliacao"> Avaliação Literária</label>

<label><input type="checkbox" id="lapidacao"> Lapidação Literária</label>

</div>

<button onclick="registrarProjeto()">Registrar Projeto</button>

<div class="status" id="statusProjeto">

Nenhum projeto ativo

</div>

</div>

<script>

function limparProjetoAnterior(){

localStorage.removeItem("projetoAtivo")

}

function registrarProjeto(){

limparProjetoAnterior()

let projeto = {

titulo:document.getElementById("titulo").value,

autor:document.getElementById("autor").value,

arquivo:document.getElementById("arquivo").value,

diagramacao:document.getElementById("diagramacao").checked,

capa:document.getElementById("capa").checked,

traducao:document.getElementById("traducao").checked,

avaliacao:document.getElementById("avaliacao").checked,

lapidacao:document.getElementById("lapidacao").checked,

data:new Date().toLocaleString()

}

localStorage.setItem("projetoAtivo", JSON.stringify(projeto))

mostrarProjeto()

}

function mostrarProjeto(){

let projeto = JSON.parse(localStorage.getItem("projetoAtivo"))

if(!projeto){

document.getElementById("statusProjeto").innerHTML="Nenhum projeto ativo"

return

}

document.getElementById("statusProjeto").innerHTML=`

Projeto ativo:

Título: ${projeto.titulo}

Autor: ${projeto.autor}

Criado em: ${projeto.data}

`

}

mostrarProjeto()

</script>

</body>

</html>
