<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produção Integrada</title>

<style>

body{
font-family:Arial;
background:#efe2c2;
margin:0;
padding:0;
}

header{
background:#2f436d;
color:white;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:20px;
padding:20px;
}

.card{
background:white;
border-radius:16px;
padding:20px;
position:relative;
box-shadow:0 6px 14px rgba(0,0,0,0.1);
}

.lock{
position:absolute;
top:12px;
right:12px;
background:#a00;
color:white;
padding:4px 8px;
border-radius:6px;
font-size:12px;
display:none;
}

button{
margin-top:10px;
padding:10px;
border:none;
background:#2f436d;
color:white;
border-radius:8px;
cursor:pointer;
}

button:disabled{
background:#aaa;
cursor:not-allowed;
}

small{
display:block;
opacity:.7;
margin-top:6px;
}

</style>
</head>

<body>

<header>

<h2>Produção Integrada</h2>

<button onclick="logout()">Sair</button>

</header>

<div class="grid">

<div class="card" id="card1">
<div class="lock">🔒</div>
<h3>Assistente de Diagramação do Autor</h3>
<small>(Setor 1)</small>
<button onclick="abrir(1)">Entrar</button>
</div>

<div class="card" id="card3">
<div class="lock">🔒</div>
<h3>OKapista</h3>
<small>(Setor 3)</small>
<button onclick="abrir(3)">Entrar</button>
</div>

<div class="card" id="card5">
<div class="lock">🔒</div>
<h3>Segunda Língua(s)</h3>
<small>(Setor 5)</small>
<button onclick="abrir(5)">Entrar</button>
</div>

<div class="card" id="card7">
<div class="lock">🔒</div>
<h3>Avaliação Literária</h3>
<small>(Setor 7)</small>
<button onclick="abrir(7)">Entrar</button>
</div>

<div class="card" id="card11">
<div class="lock">🔒</div>
<h3>Analisador de Obra</h3>
<small>(Setor 11)</small>
<button onclick="abrir(11)">Entrar</button>
</div>

<div class="card" id="card13">
<div class="lock">🔒</div>
<h3>Lapidação Literária</h3>
<small>(Setor 13)</small>
<button onclick="abrir(13)">Entrar</button>
</div>

</div>


<script>

/* =========================
LOGOUT
========================= */

function logout(){

localStorage.removeItem("lapidar_perfil")

window.location.href="index.html"

}


/* =========================
REGISTRO AUTOMÁTICO DE ACESSO
========================= */

function registrarAcesso(setor=null){

const hoje = new Date()
const dia = hoje.toISOString().slice(0,10)
const mes = dia.slice(0,7)
const ano = dia.slice(0,4)

let stats = JSON.parse(localStorage.getItem("lapidar_stats") || "{}")

if(!stats[dia]) stats[dia]=0
stats[dia]++

if(!stats[mes]) stats[mes]=0
stats[mes]++

if(!stats[ano]) stats[ano]=0
stats[ano]++

/* registro por setor */

if(setor){

if(!stats["setor_"+setor]) stats["setor_"+setor]=0

stats["setor_"+setor]++

}

localStorage.setItem("lapidar_stats", JSON.stringify(stats))

}


/* =========================
ABRIR SETOR
========================= */

function abrir(setor){

registrarAcesso(setor)

alert("Abrindo setor "+setor)

}


/* =========================
PERMISSÕES
========================= */

function aplicarPermissoes(){

const perfil=localStorage.getItem("lapidar_perfil")

if(!perfil) return


/* admin e heterônimo têm acesso total */

if(perfil==="admin" || perfil==="heteronimo"){

registrarAcesso()

return

}


const cortesias=JSON.parse(localStorage.getItem("lapidar_courtesy_profiles") || "{}")


if(!cortesias[perfil]){

registrarAcesso()

return

}


const dados=cortesias[perfil]


if(dados.status!=="ativa"){

bloquearTudo()

registrarAcesso()

return

}


/* acesso global */

if(dados.accessLevel==="TOP_GLOBAL"){

registrarAcesso()

return

}


/* acesso personalizado */

const permitidos=dados.sectors || []


[1,3,5,7,11,13].forEach(setor=>{

if(!permitidos.includes(setor)){

bloquear(setor)

}

})

registrarAcesso()

}


/* =========================
BLOQUEIO
========================= */

function bloquear(setor){

const card=document.querySelector("#card"+setor)

card.querySelector("button").disabled=true

card.querySelector(".lock").style.display="block"

}


function bloquearTudo(){

[1,3,5,7,11,13].forEach(bloquear)

}


/* =========================
INICIALIZAÇÃO
========================= */

aplicarPermissoes()

</script>

</body>
</html>
