<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produção Integrada — Lapidar</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(180deg, #102f24, #061711);
    color: white;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 24px;
}

.card {
    background: rgba(255,255,255,0.06);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
}

h1 {
    margin-top: 0;
}

input {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    margin-top: 8px;
    margin-bottom: 16px;
}

label {
    font-weight: bold;
}

.checkbox-group {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 10px;
}

.checkbox-item {
    background: rgba(255,255,255,0.05);
    padding: 10px;
    border-radius: 10px;
}

button {
    background: #2ecc71;
    border: none;
    padding: 14px 20px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #27ae60;
}
</style>
</head>

<body>

<div class="container">

<div class="card">
<h1>Registrar Projeto</h1>

<label>Título da obra</label>
<input id="titulo" placeholder="Digite o título">

<label>Autor</label>
<input id="autor" placeholder="Digite o autor">

<h2>Selecionar módulos</h2>

<div class="checkbox-group">

<label class="checkbox-item">
<input type="checkbox" value="Assistente de Diagramação"> Assistente de Diagramação
</label>

<label class="checkbox-item">
<input type="checkbox" value="OKapista"> OKapista
</label>

<label class="checkbox-item">
<input type="checkbox" value="Lapidação Literária"> Lapidação Literária
</label>

</div>

<br>

<button onclick="registrarProjeto()">Registrar projeto</button>

</div>

</div>

<script>

function registrarProjeto() {

const titulo = document.getElementById("titulo").value.trim();
const autor = document.getElementById("autor").value.trim();

const checkboxes = document.querySelectorAll("input[type='checkbox']:checked");

let modulosSelecionados = [];

checkboxes.forEach(cb => {
modulosSelecionados.push(cb.value);
});


if (!titulo || !autor) {

alert("Informe título e autor.");
return;

}


localStorage.setItem("projeto_lapidar", JSON.stringify({

titulo: titulo,
autor: autor,
modulosSelecionados: modulosSelecionados,
lapidacaoExecutada: false,
pagamentoConfirmado: false

}));


alert("Projeto registrado com sucesso.");

window.location.href = "lapidacao_literaria.html";

}

</script>

</body>
</html>
