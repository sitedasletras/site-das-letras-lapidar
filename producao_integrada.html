<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Produção Integrada Lapidar</title>

<style>

body{
font-family: Arial, sans-serif;
background:#f4efe6;
margin:0;
padding:0;
}

.container{
max-width:500px;
margin:auto;
padding:20px;
}

h1{
text-align:center;
color:#5a4636;
}

.upload-box{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:20px;
}

button{
width:100%;
padding:14px;
font-size:18px;
border:none;
border-radius:10px;
cursor:pointer;
}

.botao-registrar{
background:#2e7d32;
color:white;
margin-top:20px;
}

.botao-registrar:hover{
background:#1b5e20;
}

/* módulos */

.modulo-opcao{
display:flex;
align-items:center;
gap:12px;
font-size:18px;
font-weight:600;
padding:14px 12px;
cursor:pointer;
border-radius:10px;
}

.modulo-opcao input{
width:24px;
height:24px;
}

/* cores departamentos */

.mod-diagramacao{
color:#1f4e8c;
}

.mod-capista{
color:#2e7d32;
}

.mod-traducao{
color:#6a1b9a;
}

.mod-avaliacao{
color:#b28704;
}

.mod-analisador{
color:#455a64;
}

.mod-lapidacao{
color:#7b1e3a;
}

.mod-sonoro{
color:#c2185b;
}

/* hover */

.modulo-opcao:hover{
background:rgba(0,0,0,0.05);
}

.info-escopo{
margin-top:20px;
font-size:14px;
color:#5a4636;
text-align:center;
}

</style>
</head>


<body>

<div class="container">

<h1>Produção Integrada Lapidar</h1>

<div class="upload-box">

<input type="file" id="arquivoLivro">

<br><br>

<label class="modulo-opcao mod-diagramacao">
<input type="checkbox" id="diagramacao">
Assistente de Diagramação
</label>

<label class="modulo-opcao mod-capista">
<input type="checkbox" id="capista">
OKapista
</label>

<label class="modulo-opcao mod-traducao">
<input type="checkbox" id="traducao">
Segunda Língua(s)
</label>

<label class="modulo-opcao mod-avaliacao">
<input type="checkbox" id="avaliacao">
Avaliação Literária
</label>

<label class="modulo-opcao mod-analisador">
<input type="checkbox" id="analisador">
Analisador de Obra
</label>

<label class="modulo-opcao mod-lapidacao">
<input type="checkbox" id="lapidacao">
Lapidação Literária
</label>

<label class="modulo-opcao mod-sonoro">
<input type="checkbox" id="sonoro">
Silo Sonoro
</label>


<button class="botao-registrar" onclick="registrarProjeto()">
Registrar Projeto
</button>


<div class="info-escopo">

No Lapidar, cada obra é tratada como um conjunto independente de trabalho.<br>
Apenas os módulos selecionados serão executados neste projeto.<br>
Após a geração do material final, o conjunto é encerrado automaticamente.

</div>


</div>

</div>


<script>

function registrarProjeto(){

const selecionados = []

if(diagramacao.checked) selecionados.push("diagramacao")
if(capista.checked) selecionados.push("capista")
if(traducao.checked) selecionados.push("traducao")
if(avaliacao.checked) selecionados.push("avaliacao")
if(analisador.checked) selecionados.push("analisador")
if(lapidacao.checked) selecionados.push("lapidacao")
if(sonoro.checked) selecionados.push("sonoro")


if(selecionados.length === 0){

alert("Selecione ao menos um módulo.")

return

}


localStorage.setItem("modulosSelecionados", JSON.stringify(selecionados))

window.location.href = "diagramacao_config.html"

}

</script>


</body>
</html>
