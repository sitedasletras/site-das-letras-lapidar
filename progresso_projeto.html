<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progresso do Projeto — Lapidar</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0d0603;
color:white;
}

header{
background:#2f436d;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.container{
max-width:900px;
margin:auto;
padding:30px 20px;
}

.card{
background:#1c0e08;
border-radius:14px;
padding:20px;
margin-bottom:20px;
box-shadow:0 6px 18px rgba(0,0,0,.25);
}

.progressBox{
margin-top:15px;
background:#2a140c;
border-radius:10px;
overflow:hidden;
}

.progressBar{
height:24px;
background:#8a6f3f;
width:0%;
display:flex;
align-items:center;
justify-content:center;
font-size:13px;
}

button{
padding:12px 16px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
background:#2f436d;
color:white;
margin-top:10px;
margin-right:10px;
}

button.alt{
background:#8a6f3f;
}

button.sec{
background:#6c757d;
}

</style>
</head>

<body>

<header>

<h2>Progresso da Obra</h2>

<button onclick="voltar()">Voltar</button>

</header>


<div class="container">


<div class="card">

<h3>Projeto ativo</h3>

<div id="nomeProjeto">

Nenhum projeto ativo selecionado.

</div>

</div>



<div class="card">

<h3>Progresso geral da produção</h3>

<div class="progressBox">

<div class="progressBar" id="barraProgresso">

0%

</div>

</div>

<button onclick="aumentar()">Avançar progresso</button>

<button onclick="reduzir()" class="sec">Reduzir progresso</button>

</div>



<div class="card">

<h3>Navegação rápida</h3>

<button onclick="abrirFluxo()">Abrir fluxo editorial</button>

<button onclick="abrirSetores()">Abrir setores</button>

<button onclick="abrirPreview()" class="alt">Abrir preview</button>

</div>


</div>


<script>

/* SESSION GUARD PADRÃO LAPIDAR */

const perfil = localStorage.getItem("lapidar_perfil")

if(!perfil){

window.location.href="index.html"

}



/* CARREGAR PROJETO ATIVO */

const projeto = localStorage.getItem("lapidar_projeto_ativo")

if(projeto){

document.getElementById("nomeProjeto").innerText = projeto

}



/* CONTROLE DO PROGRESSO */

let progresso = Number(localStorage.getItem("lapidar_progresso")) || 0

const barra = document.getElementById("barraProgresso")

function atualizarBarra(){

barra.style.width = progresso + "%"

barra.innerText = progresso + "%"

}

atualizarBarra()



function aumentar(){

if(progresso < 100){

progresso += 5

localStorage.setItem("lapidar_progresso", progresso)

atualizarBarra()

}

}



function reduzir(){

if(progresso > 0){

progresso -= 5

localStorage.setItem("lapidar_progresso", progresso)

atualizarBarra()

}

}



/* NAVEGAÇÃO */

function abrirFluxo(){

window.location.href="status_fluxo_editorial.html"

}

function abrirSetores(){

window.location.href="painel_setores.html"

}

function abrirPreview(){

window.location.href="preview_projeto.html"

}

function voltar(){

window.location.href="projetos.html"

}

</script>


</body>
</html>
