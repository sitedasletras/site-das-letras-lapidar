<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projetos — Lapidar</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0e0604;
color:white;
}

header{
background:#2f436d;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.container{
max-width:1000px;
margin:auto;
padding:30px 20px;
}

.card{
background:#1c0e08;
border-radius:14px;
padding:20px;
margin-bottom:20px;
box-shadow:0 6px 18px rgba(0,0,0,.25);
}

.lista{
margin-top:15px;
padding:12px;
background:#24130c;
border-radius:10px;
}

button{
padding:12px 16px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
background:#2f436d;
color:white;
margin-top:10px;
margin-right:10px;
}

button.alt{
background:#8a6f3f;
}

button.sec{
background:#6c757d;
}

.projetoItem{
margin-top:10px;
padding:10px;
background:#2a140c;
border-radius:8px;
display:flex;
justify-content:space-between;
align-items:center;
}

</style>
</head>

<body>

<header>

<h2>Projetos e Obras</h2>

<button onclick="voltar()">Voltar ao Admin</button>

</header>


<div class="container">


<div class="card">

<h3>Projeto ativo</h3>

<div id="projetoAtual">

Nenhum projeto ativo selecionado.

</div>

</div>



<div class="card">

<h3>Criar novo projeto</h3>

<button onclick="novoProjeto()">

Criar novo projeto

</button>

</div>



<div class="card">

<h3>Selecionar projeto existente</h3>

<div class="lista" id="listaProjetos">

Nenhum projeto registrado ainda.

</div>

</div>



<div class="card">

<h3>Navegação rápida</h3>

<button onclick="abrirPreview()">Preview do projeto</button>

<button onclick="abrirFluxo()">Fluxo editorial</button>

<button onclick="abrirSetores()">Setores</button>

<button onclick="abrirDepartamentos()" class="alt">

Departamentos

</button>

<button onclick="abrirProgresso()" class="sec">

Progresso da obra

</button>

</div>


</div>



<script>

/* SESSION GUARD */

const perfil = localStorage.getItem("lapidar_perfil")

if(!perfil){

window.location.href="index.html"

}


/* PROJETO ATIVO */

let projeto = localStorage.getItem("lapidar_projeto_ativo")

if(projeto){

document.getElementById("projetoAtual").innerText = projeto

}


/* LISTA DE PROJETOS */

let historico = JSON.parse(localStorage.getItem("lapidar_historico_projetos") || "[]")

function atualizarLista(){

let area = document.getElementById("listaProjetos")

if(historico.length === 0){

area.innerHTML = "Nenhum projeto registrado ainda."

return

}

area.innerHTML = ""

historico.forEach(nome => {

area.innerHTML += `
<div class="projetoItem">

<span>${nome}</span>

<button onclick="selecionarProjeto('${nome}')">

Selecionar

</button>

</div>
`

})

}

atualizarLista()


/* NOVO PROJETO */

function novoProjeto(){

let nome = prompt("Nome do novo projeto:")

if(!nome) return

localStorage.setItem("lapidar_projeto_ativo", nome)

historico.push(nome)

localStorage.setItem("lapidar_historico_projetos", JSON.stringify(historico))

location.reload()

}


/* SELECIONAR PROJETO */

function selecionarProjeto(nome){

localStorage.setItem("lapidar_projeto_ativo", nome)

location.reload()

}


/* NAVEGAÇÃO */

function abrirPreview(){

window.location.href="preview_projeto.html"

}

function abrirFluxo(){

window.location.href="status_fluxo_editorial.html"

}

function abrirSetores(){

window.location.href="painel_setores.html"

}

function abrirDepartamentos(){

window.location.href="painel_departamentos.html"

}

function abrirProgresso(){

window.location.href="progresso_projeto.html"

}

function voltar(){

window.location.href="admin.html"

}

</script>


</body>
</html>
