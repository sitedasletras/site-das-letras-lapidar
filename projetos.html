<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projetos e Obras</title>

<style>

body{
font-family:Arial;
background:#efe2c2;
margin:0;
padding:0;
}

header{
background:#2f436d;
color:white;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.container{
padding:20px;
}

.card{
background:white;
border-radius:12px;
padding:20px;
margin-bottom:20px;
box-shadow:0 4px 10px rgba(0,0,0,.1);
}

button{
padding:12px 18px;
border:none;
border-radius:8px;
background:#2f436d;
color:white;
cursor:pointer;
margin-right:10px;
}

button.sec{
background:#8a6f3f;
}

button.alt{
background:#6c757d;
}

.lista{
margin-top:10px;
padding:10px;
background:#f7f2e4;
border-radius:8px;
}

</style>
</head>

<body>

<header>

<h2>Projetos e Obras</h2>

<button onclick="voltar()">Voltar ao Admin</button>

</header>


<div class="container">


<div class="card">

<h3>Projeto ativo</h3>

<div id="projetoAtual">

Nenhum projeto ativo selecionado.

</div>

<br>

<button onclick="abrirFluxo()">Abrir fluxo editorial</button>

<button class="sec" onclick="abrirCentro()">Abrir centro da obra</button>

</div>



<div class="card">

<h3>Histórico de projetos</h3>

<div class="lista" id="historicoProjetos">

Sem projetos registrados ainda.

</div>

</div>



<div class="card">

<h3>Ações rápidas</h3>

<button onclick="novoProjeto()">Criar novo projeto</button>

<button class="alt" onclick="abrirRelatorios()">Abrir relatórios</button>

</div>


</div>


<script>

/* =========================
SESSION GUARD INSTITUCIONAL
========================= */

const perfil = localStorage.getItem("lapidar_perfil")

if(!perfil){

window.location.href="index.html"

}


/* =========================
CARREGAR PROJETO ATIVO
========================= */

const projeto = localStorage.getItem("lapidar_projeto_ativo")

if(projeto){

document.getElementById("projetoAtual").innerText = projeto

}


/* =========================
CARREGAR HISTÓRICO
========================= */

const historico = JSON.parse(localStorage.getItem("lapidar_historico_projetos") || "[]")

if(historico.length){

document.getElementById("historicoProjetos").innerHTML = historico.join("<br>")

}


/* =========================
AÇÕES
========================= */

function novoProjeto(){

let nome = prompt("Nome do novo projeto:")

if(!nome) return


localStorage.setItem("lapidar_projeto_ativo",nome)

let hist = JSON.parse(localStorage.getItem("lapidar_historico_projetos") || "[]")

hist.push(nome)

localStorage.setItem("lapidar_historico_projetos",JSON.stringify(hist))

location.reload()

}


function abrirFluxo(){

window.location.href="status_fluxo_editorial.html"

}


function abrirCentro(){

window.location.href="painel_setores.html"

}


function abrirRelatorios(){

window.location.href="hub_relatorios.html"

}


function voltar(){

window.location.href="admin.html"

}

</script>


</body>
</html>
