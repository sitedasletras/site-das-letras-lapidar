<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Próximo passo da obra — Lapidar</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f1e8;
}

header{
background:#32497d;
color:white;
padding:18px;
display:flex;
justify-content:space-between;
font-size:18px;
}

.container{
max-width:900px;
margin:auto;
padding:30px;
}

.card{
background:white;
padding:25px;
border-radius:16px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.botao{
width:100%;
padding:18px;
margin-top:14px;
border:none;
border-radius:12px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.amarelo{
background:#c19b2e;
color:white;
}

.verde{
background:#5aa07a;
color:white;
}

.offwhite{
background:#f5f1e6;
color:#2b2b2b;
border:2px solid #32497d;
}

.preto{
background:#000000;
color:white;
}

p{
color:#4e4e4e;
line-height:1.6;
}
</style>
</head>
<body>

<header>
<div>Próximo passo da obra</div>
<div>Lapidar</div>
</header>

<div class="container">
<div class="card">

<h2>Você deseja continuar escolhendo outros tipos de produção?</h2>

<p>
Você já concluiu esta etapa.
Agora pode escolher outro tipo de produção ou encerrar suas escolhas por aqui.
</p>

<p>
O Lapidar organizará depois a ordem técnica correta da obra.
</p>

<button class="botao amarelo" onclick="irAudiovisual()">
Ir para Produção Audiovisual
</button>

<button class="botao verde" onclick="irMusica()">
Ir para Produção com Voz / Música
</button>

<button class="botao offwhite" onclick="encerrarEscolhas()">
Encerrar escolhas por aqui e seguir
</button>

<button class="botao preto" onclick="voltarInicio()">
Voltar ao início do planejamento
</button>

</div>
</div>

<script>
function irAudiovisual(){
window.location.href="/modulos_audiovisual.html";
}

function irMusica(){
window.location.href="/modulos_musica.html";
}

function encerrarEscolhas(){
window.location.href="/confirmacao_final_modulos.html";
}

function voltarInicio(){
window.location.href="/selecionar_modulos.html";
}
</script>

</body>
</html>
