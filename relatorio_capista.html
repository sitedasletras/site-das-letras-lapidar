<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatório do Capista — Lapidar</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0e0604;
color:white;
}

header{
background:#2f436d;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.container{
max-width:1000px;
margin:auto;
padding:30px 20px;
}

.card{
background:#1c0e08;
border-radius:14px;
padding:20px;
margin-bottom:20px;
box-shadow:0 6px 18px rgba(0,0,0,.25);
}

textarea{
width:100%;
height:160px;
border-radius:10px;
border:none;
padding:10px;
margin-top:10px;
background:#140a06;
color:white;
}

button{
padding:12px 16px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
background:#2f436d;
color:white;
margin-top:10px;
margin-right:10px;
}

button.alt{
background:#8a6f3f;
}

button.sec{
background:#6c757d;
}

</style>
</head>

<body>

<header>

<h2>Relatório do Capista</h2>

<button onclick="voltar()">Voltar</button>

</header>


<div class="container">


<div class="card">

<h3>Projeto ativo</h3>

<div id="nomeProjeto">

Nenhum projeto ativo selecionado.

</div>

</div>



<div class="card">

<h3>Análise da capa</h3>

<textarea id="campoCapista"
placeholder="Registrar observações sobre capa, contracapa, orelhas, lombada, tipografia, identidade visual editorial..."></textarea>

<button onclick="salvarRelatorio()">

Salvar relatório do capista

</button>

</div>



<div class="card">

<h3>Navegação rápida</h3>

<button onclick="abrirDepartamentos()">Departamentos</button>

<button onclick="abrirSetores()">Setores</button>

<button onclick="abrirFluxo()">Fluxo editorial</button>

<button onclick="abrirPreview()" class="alt">Preview</button>

<button onclick="abrirProgresso()" class="sec">Progresso</button>

</div>


</div>



<script>

/* SESSION GUARD PADRÃO LAPIDAR */

const perfil = localStorage.getItem("lapidar_perfil")

if(!perfil){

window.location.href="index.html"

}


/* PROJETO ATIVO */

const projeto = localStorage.getItem("lapidar_projeto_ativo")

if(projeto){

document.getElementById("nomeProjeto").innerText = projeto

}


/* CARREGAR RELATÓRIO EXISTENTE */

const relatorioCapista = localStorage.getItem("lapidar_relatorio_capista")

if(relatorioCapista){

document.getElementById("campoCapista").value = relatorioCapista

}


/* SALVAR RELATÓRIO */

function salvarRelatorio(){

const texto = document.getElementById("campoCapista").value

localStorage.setItem("lapidar_relatorio_capista", texto)

alert("Relatório do capista salvo com sucesso.")

}


/* NAVEGAÇÃO */

function abrirDepartamentos(){

window.location.href="painel_departamentos.html"

}

function abrirSetores(){

window.location.href="painel_setores.html"

}

function abrirFluxo(){

window.location.href="status_fluxo_editorial.html"

}

function abrirPreview(){

window.location.href="preview_projeto.html"

}

function abrirProgresso(){

window.location.href="progresso_projeto.html"

}

function voltar(){

window.location.href="painel_departamentos.html"

}

</script>


</body>
</html>
