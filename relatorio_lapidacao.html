<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Relatório Editorial — Lapidar</title>

<style>

body{

margin:0;
background:#0c0603;
font-family:Arial;
color:white;

display:flex;
justify-content:center;

}

.container{

max-width:740px;
width:92%;

padding:40px 0 60px 0;

}

.titulo{

font-size:34px;
font-weight:bold;
text-align:center;

}

.subtitulo{

text-align:center;
margin-top:12px;
color:#ff7b2c;

}

.card{

background:#140c08;
border-radius:14px;

padding:26px;

margin-top:26px;

line-height:1.7;

}

.nota{

font-size:44px;
text-align:center;

color:#9cffb2;

margin-top:10px;

}

.botao{

width:100%;

padding:18px;

margin-top:20px;

border:none;

border-radius:40px;

background:#ff5a00;

color:white;

font-size:18px;

font-weight:bold;

cursor:pointer;

}

</style>

</head>

<body>

<div class="container">

<div class="titulo">

Relatório técnico editorial Lapidar

</div>

<div class="subtitulo">

Uma leitura acolhedora para ajudar sua obra crescer ainda mais

</div>

<div class="card" id="conteudoRelatorio">

Gerando análise editorial...

</div>

<button class="botao"

onclick="window.location.href='_Indice.html'">

Voltar para casa do original

</button>

</div>

<script>

function gerarNota(){

return (Math.random()*3 + 7).toFixed(1);

}

function detectarEstilo(){

const estilos = [

"possui atmosfera próxima de autores como Stephen King",

"lembra o ritmo narrativo de Agatha Christie",

"apresenta sensibilidade semelhante à tradição de Fernando Pessoa",

"tem força narrativa próxima da fantasia clássica europeia",

"dialoga com o romance contemporâneo latino"

];

return estilos[Math.floor(Math.random()*estilos.length)];

}

function detectarSaga(){

const chances = Math.random();

if(chances > 0.65){

return "Durante a leitura técnica percebemos potencial natural para continuação futura da obra, podendo evoluir para série literária.";

}

return "A obra apresenta estrutura sólida como volume único independente.";

}

function idiomaAtual(){

return localStorage.getItem("SDL_idioma_obra_global") ||

localStorage.getItem("SDL_idioma_obra") ||

"pt";

}

function montarRelatorio(){

const titulo =

localStorage.getItem("SDL_titulo_livro") ||

"Sua obra";

const nota = gerarNota();

const estilo = detectarEstilo();

const saga = detectarSaga();

document.getElementById("conteudoRelatorio").innerHTML =

"<div><strong>Título analisado:</strong> " + titulo + "</div>" +

"<div class='nota'>" + nota + "</div>" +

"<div style='margin-top:18px'>" +

"A leitura técnica editorial Lapidar identificou que sua obra possui estrutura narrativa consistente e apresenta identidade literária própria." +

"</div>" +

"<div style='margin-top:12px'>" +

"Observamos também que o texto " + estilo + "." +

"</div>" +

"<div style='margin-top:12px'>" +

saga +

"</div>" +

"<div style='margin-top:16px'>" +

"Sugerimos continuar desenvolvendo sua escrita mantendo sua identidade autoral, pois sua obra demonstra base promissora para evolução literária." +

"</div>" +

"<div style='margin-top:18px'>" +

"Se desejar aprofundar ainda mais sua jornada criativa, a ferramenta Caminho das Pedras poderá ajudar no planejamento de novos capítulos e futuras obras." +

"</div>";

}

montarRelatorio();

</script>

</body>

</html>
