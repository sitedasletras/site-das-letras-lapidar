<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatório Mestre Lapidar</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:#0d0603;
color:white;
}

.container{
width:min(1100px,95%);
margin:auto;
padding:40px 0 60px;
}

.titulo{
font-size:34px;
font-weight:bold;
}

.subtitulo{
margin-top:6px;
color:#f7b22c;
}

.card{
margin-top:24px;
background:#140c08;
border:1px solid rgba(255,123,44,0.18);
border-radius:16px;
padding:20px;
line-height:1.8;
}

.label{
color:#f7b22c;
font-weight:bold;
margin-top:10px;
}

.status{
margin-top:18px;
padding:16px;
border-radius:12px;
background:rgba(247,178,44,0.12);
border:1px solid rgba(247,178,44,0.25);
color:#ffe7b0;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px;
}

.blocoTexto{
margin-top:14px;
padding:16px;
border-radius:12px;
background:#1b100a;
line-height:1.8;
}

.timelineItem{
margin-top:12px;
padding:14px;
border-radius:12px;
background:#1b100a;
line-height:1.7;
}

.actions{
margin-top:28px;
display:flex;
gap:12px;
flex-wrap:wrap;
}

button{
border:none;
padding:14px 18px;
border-radius:999px;
background:#24150f;
color:white;
cursor:pointer;
}

@media(max-width:900px){
.grid{
grid-template-columns:1fr;
}
}
</style>
</head>

<body>

<div class="container">

<div class="titulo">Relatório Mestre Lapidar</div>
<div class="subtitulo">Prontuário editorial consolidado da obra</div>

<div id="statusRelatorio" class="status">
Carregando relatório consolidado...
</div>

<div id="conteudoRelatorio"></div>

<div class="actions">
  <button onclick="window.print()">Exportar PDF mestre</button>
  <button onclick="voltarIndice()">Voltar ao índice</button>
</div>

</div>

<script src="auditoria.js"></script>

<script>
function obterProjetoAtivo(){
  try{
    const lista = JSON.parse(localStorage.getItem("SDL_projetos_lista") || "[]");
    const ativo = localStorage.getItem("SDL_projeto_ativo");
    return lista.find(p => p.id === ativo) || null;
  }catch{
    return null;
  }
}

function obterPedidosProjeto(id){
  try{
    const lista = JSON.parse(localStorage.getItem("SDL_pedidos_lista") || "[]");
    return lista.filter(p => p.projetoID === id);
  }catch{
    return [];
  }
}

function obterCapasProjeto(id){
  try{
    const lista = JSON.parse(localStorage.getItem("SDL_capas_lista") || "[]");
    return lista.filter(c => c.projetoID === id);
  }catch{
    return [];
  }
}

function obterConfiguracaoCapa(id){
  try{
    const cfg = JSON.parse(localStorage.getItem("SDL_configuracao_capa_ativa") || "null");
    if(cfg && cfg.projetoID === id){
      return cfg;
    }
    return null;
  }catch{
    return null;
  }
}

function obterTextosCapa(id){
  try{
    const textos = JSON.parse(localStorage.getItem("SDL_textos_capa_ativos") || "null");
    if(textos && textos.projetoID === id){
      return textos;
    }
    return null;
  }catch{
    return null;
  }
}

function obterAuditoriaProjeto(id, titulo){
  try{
    const logs = JSON.parse(localStorage.getItem("SDL_auditoria_logs") || "[]");
    return logs.filter(l => l.projetoID === id || l.projetoTitulo === titulo);
  }catch{
    return [];
  }
}

function obterPlano(){
  return localStorage.getItem("SDL_plano") || "";
}

function obterPagamento(){
  return localStorage.getItem("SDL_pagamento") || "";
}

function calcularEtapas(projeto, pedidos, capas, cfg, textos, plano, pagamento){
  return [
    { nome: "Projeto cadastrado", ok: !!projeto },
    { nome: "Plano selecionado", ok: !!plano },
    { nome: "Pagamento registrado", ok: !!pagamento },
    { nome: "Pedido editorial registrado", ok: pedidos.length > 0 },
    { nome: "Solicitação de capa registrada", ok: capas.length > 0 },
    { nome: "Configuração técnica da capa", ok: !!cfg },
    { nome: "Textos da capa salvos", ok: !!textos }
  ];
}

function calcularPercentual(etapas){
  const total = etapas.length;
  const concluidas = etapas.filter(e => e.ok).length;
  return Math.round((concluidas / total) * 100);
}

function montarTimeline(projeto, plano, pagamento, pedidos, capas, cfg, textos){
  const eventos = [];

  if(projeto){
    eventos.push({
      titulo: "Projeto criado",
      data: projeto.dataRegistro
    });
  }

  if(plano){
    eventos.push({
      titulo: "Plano editorial selecionado",
      data: "registrado no sistema"
    });
  }

  if(pagamento){
    eventos.push({
      titulo: "Pagamento registrado",
      data: "registrado no sistema"
    });
  }

  pedidos.forEach(p => {
    eventos.push({
      titulo: "Pedido editorial: " + (p.tipo || "Ajuste"),
      data: p.dataRegistro
    });
  });

  capas.forEach(c => {
    eventos.push({
      titulo: "Solicitação de capa registrada",
      data: c.dataRegistro
    });
  });

  if(cfg){
    eventos.push({
      titulo: "Configuração técnica da capa salva",
      data: cfg.dataRegistro
    });
  }

  if(textos){
    eventos.push({
      titulo: "Textos da capa salvos",
      data: textos.dataRegistro
    });
  }

  eventos.sort((a, b) => {
    const da = a.data === "registrado no sistema" ? 0 : new Date(a.data).getTime();
    const db = b.data === "registrado no sistema" ? 0 : new Date(b.data).getTime();
    return da - db;
  });

  return eventos;
}

function gerarStatusInstitucional(projeto, plano, pagamento, pedidos, capas, cfg, textos){
  if(!projeto){
    return "Nenhum projeto ativo selecionado.";
  }

  if(!plano){
    return "Aguardando seleção de plano editorial.";
  }

  if(plano && !pagamento){
    return "Plano selecionado aguardando confirmação de pagamento.";
  }

  if(pagamento && pedidos.length === 0){
    return "Pagamento confirmado aguardando abertura de fluxo editorial.";
  }

  if(pedidos.length > 0 && capas.length === 0){
    return "Fluxo editorial em andamento aguardando solicitação de capa.";
  }

  if(capas.length > 0 && !cfg){
    return "Solicitação de capa registrada aguardando configuração técnica.";
  }

  if(cfg && !textos){
    return "Configuração técnica pronta aguardando textos da capa.";
  }

  if(cfg && textos){
    return "Fluxo editorial ativo com material técnico e textual consolidado.";
  }

  return "Status institucional não identificado.";
}

function formatarData(d){
  if(!d) return "—";
  if(d === "registrado no sistema") return d;

  try{
    return new Date(d).toLocaleString("pt-BR");
  }catch{
    return d;
  }
}

function montarRelatorioLapidar(){
  const projeto = obterProjetoAtivo();
  const status = document.getElementById("statusRelatorio");
  const area = document.getElementById("conteudoRelatorio");

  if(!projeto){
    status.innerHTML = "Nenhum projeto ativo selecionado.";
    area.innerHTML = "";
    return;
  }

  const plano = obterPlano();
  const pagamento = obterPagamento();
  const pedidos = obterPedidosProjeto(projeto.id);
  const capas = obterCapasProjeto(projeto.id);
  const cfg = obterConfiguracaoCapa(projeto.id);
  const textos = obterTextosCapa(projeto.id);
  const logs = obterAuditoriaProjeto(projeto.id, projeto.titulo || "");
  const etapas = calcularEtapas(projeto, pedidos, capas, cfg, textos, plano, pagamento);
  const percentual = calcularPercentual(etapas);
  const timeline = montarTimeline(projeto, plano, pagamento, pedidos, capas, cfg, textos);
  const statusInstitucional = gerarStatusInstitucional(projeto, plano, pagamento, pedidos, capas, cfg, textos);

  status.innerHTML = "Relatório mestre carregado para: <strong>" + (projeto.titulo || "Sem título") + "</strong>";
  status.style.background = "rgba(23,77,39,0.28)";

  let html = "";

  html += `
    <div class="grid">
      <div class="card">
        <div class="label">Título da obra</div>
        ${projeto.titulo || "—"}

        <div class="label">Subtítulo</div>
        ${projeto.subtitulo || "—"}

        <div class="label">Autor</div>
        ${projeto.autor || "—"}

        <div class="label">Coleção</div>
        ${projeto.colecao || "—"}

        <div class="label">Formato</div>
        ${projeto.formato || "—"}

        <div class="label">Status editorial</div>
        ${projeto.status || "—"}

        <div class="label">Data do projeto</div>
        ${formatarData(projeto.dataRegistro)}
      </div>

      <div class="card">
        <div class="label">Plano editorial</div>
        ${plano || "Não selecionado"}

        <div class="label">Pagamento</div>
        ${pagamento ? "Registrado" : "Não registrado"}

        <div class="label">Pedidos editoriais</div>
        ${pedidos.length}

        <div class="label">Solicitações de capa</div>
        ${capas.length}

        <div class="label">Logs de auditoria vinculados</div>
        ${logs.length}

        <div class="label">Progresso consolidado</div>
        ${percentual}%
      </div>
    </div>
  `;

  html += `
    <div class="card">
      <div class="label">Status institucional da obra</div>
      ${statusInstitucional}
    </div>
  `;

  html += `<div class="card"><div class="label">Checklist de progresso</div>`;
  etapas.forEach(etapa => {
    html += `
      <div class="blocoTexto">
        <strong>${etapa.nome}:</strong> ${etapa.ok ? "Concluído" : "Pendente"}
      </div>
    `;
  });
  html += `</div>`;

  html += `<div class="card"><div class="label">Timeline resumida da obra</div>`;
  timeline.forEach(evento => {
    html += `
      <div class="timelineItem">
        <strong>${evento.titulo}</strong><br>
        ${formatarData(evento.data)}
      </div>
    `;
  });
  html += `</div>`;

  html += `
    <div class="grid">
      <div class="card">
        <div class="label">Último pedido editorial</div>
        ${pedidos.length ? `
          <div class="blocoTexto">
            <strong>${pedidos[pedidos.length - 1].titulo || "Sem título"}</strong><br>
            Tipo: ${pedidos[pedidos.length - 1].tipo || "—"}<br>
            Prioridade: ${pedidos[pedidos.length - 1].prioridade || "—"}<br>
            Status: ${pedidos[pedidos.length - 1].status || "—"}<br>
            Data: ${formatarData(pedidos[pedidos.length - 1].dataRegistro)}<br><br>
            ${pedidos[pedidos.length - 1].descricao || "—"}
          </div>
        ` : `Nenhum pedido editorial registrado.`}
      </div>

      <div class="card">
        <div class="label">Módulo capista</div>
        ${cfg ? `
          <div class="blocoTexto">
            Formato: ${cfg.formato || "—"}<br>
            Páginas: ${cfg.paginas || "—"}<br>
            Papel: ${cfg.papelNome || "—"}<br>
            Lombada: ${cfg.lombada || "—"} mm<br>
            Largura aberta: ${cfg.larguraAberta || "—"} mm<br>
            Textos da capa: ${textos ? "Disponíveis" : "Não disponíveis"}
          </div>
        ` : `Nenhuma configuração técnica da capa registrada.`}
      </div>
    </div>
  `;

  html += `
    <div class="card">
      <div class="label">Observações do projeto</div>
      <div class="blocoTexto">${escapeHtml(projeto.observacoes || "Sem observações registradas.")}</div>
    </div>
  `;

  area.innerHTML = html;

  try{
    SDL_registrarAuditoria("Relatório mestre Lapidar gerado", "relatorio_lapidar");
  }catch(e){}
}

function escapeHtml(texto){
  return String(texto)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;")
    .replaceAll("\n", "<br>");
}

function voltarIndice(){
  window.location.href = "_Indice.html";
}

montarRelatorioLapidar();
</script>

</body>
</html>
