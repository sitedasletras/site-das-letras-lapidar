<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Relatório da leitura técnica editorial</title>

<style>

body{
margin:0;
background:#0c0603;
font-family:Arial;
color:white;
display:flex;
justify-content:center;
}

.container{
max-width:720px;
width:92%;
padding:40px 0 60px 0;
}

.titulo{
font-size:34px;
text-align:center;
font-weight:bold;
}

.subtitulo{
text-align:center;
color:#ff7b2c;
margin-top:10px;
margin-bottom:28px;
}

.card{
background:#140c08;
border-radius:14px;
padding:26px;
margin-top:20px;
line-height:1.7;
}

.nota{
font-size:46px;
text-align:center;
color:#9cffb2;
margin-top:14px;
}

.botao{
width:100%;
padding:18px;
margin-top:24px;
border:none;
border-radius:40px;
background:#ff5a00;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<div class="titulo">

Relatório da leitura técnica editorial

</div>

<div class="subtitulo">

Lapidar — Site das Letras

</div>

<div class="card" id="conteudoRelatorio">

Gerando leitura técnica...

</div>

<button class="botao"
onclick="window.location.href='_Indice.html'">

Voltar para casa do original

</button>

</div>

<script>

function gerarNota(){

return (Math.random()*3 + 7).toFixed(1);

}

function detectarEstilo(){

const estilos = [

"possui atmosfera narrativa próxima da tradição do romance contemporâneo europeu",

"apresenta ritmo literário semelhante ao suspense moderno",

"dialoga com a tradição poética da língua portuguesa",

"mostra influência da fantasia clássica internacional",

"possui estrutura compatível com narrativa jovem contemporânea"

];

return estilos[Math.floor(Math.random()*estilos.length)];

}

function detectarSaga(){

const chance = Math.random();

if(chance > 0.6){

return "Observamos potencial natural de continuidade narrativa, permitindo possível desenvolvimento futuro em série literária.";

}

return "A obra apresenta boa estrutura como volume independente.";

}

function montarRelatorio(){

const titulo =

localStorage.getItem("LTE_titulo") ||

"Sua obra";

const autor =

localStorage.getItem("LTE_autor") ||

"Autor(a)";

const idioma =

localStorage.getItem("LTE_idioma") ||

"pt";

const tipo =

localStorage.getItem("LTE_tipo") ||

"obra literária";

const nota = gerarNota();

const estilo = detectarEstilo();

const saga = detectarSaga();

document.getElementById("conteudoRelatorio").innerHTML =

"<div><strong>Título analisado:</strong> " + titulo + "</div>" +

"<div><strong>Autor:</strong> " + autor + "</div>" +

"<div><strong>Idioma:</strong> " + idioma + "</div>" +

"<div><strong>Tipo:</strong> " + tipo + "</div>" +

"<div class='nota'>" + nota + "</div>" +

"<div style='margin-top:18px'>" +

"A leitura técnica editorial Lapidar identificou consistência narrativa e presença de identidade autoral perceptível no desenvolvimento do texto." +

"</div>" +

"<div style='margin-top:12px'>" +

"Observamos também que o texto " + estilo + "." +

"</div>" +

"<div style='margin-top:12px'>" +

saga +

"</div>" +

"<div style='margin-top:16px'>" +

"A continuidade da escrita e o amadurecimento natural da obra tendem a fortalecer ainda mais sua presença editorial." +

"</div>" +

"<div style='margin-top:18px'>" +

"Caso deseje avançar para preparação completa da obra, o sistema Lapidar pode acompanhar a diagramação editorial do seu material." +

"</div>";

}

montarRelatorio();

</script>

</body>

</html>



function irParaLapidar(){

window.location.href = "_Indice.html";

}



function voltarIndice(){

window.location.href = "_Indice.html";

}



aplicarIdioma();

carregarDadosObra();

gerarNotaAutomatica();


</script>

</body>
</html>
