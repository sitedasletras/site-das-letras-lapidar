<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatório de Leitura Técnica — Lapidar</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:#0d0603;
color:white;
}

.container{
width:min(1100px,95%);
margin:auto;
padding:40px 0 60px;
}

.titulo{
font-size:34px;
font-weight:bold;
}

.subtitulo{
margin-top:6px;
color:#f7b22c;
}

.status{
margin-top:18px;
padding:16px;
border-radius:12px;
background:rgba(247,178,44,0.12);
border:1px solid rgba(247,178,44,0.25);
color:#ffe7b0;
}

.card{
margin-top:24px;
background:#140c08;
border:1px solid rgba(255,123,44,0.18);
border-radius:16px;
padding:20px;
line-height:1.8;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px;
}

.label{
color:#f7b22c;
font-weight:bold;
margin-bottom:6px;
display:block;
}

input, select, textarea{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#1b0e07;
color:white;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

textarea{
min-height:140px;
resize:vertical;
}

.preview{
margin-top:18px;
padding:18px;
border-radius:12px;
background:#1b100a;
line-height:1.8;
}

.actions{
margin-top:28px;
display:flex;
gap:12px;
flex-wrap:wrap;
}

button{
border:none;
padding:14px 18px;
border-radius:999px;
background:#24150f;
color:white;
cursor:pointer;
}

.btnSalvar{
background:#174d27;
}

.btnPrint{
background:#5a2c00;
}

@media(max-width:900px){
.grid{
grid-template-columns:1fr;
}
}
</style>
</head>

<body>

<div class="container">

<div class="titulo">Relatório de Leitura Técnica</div>
<div class="subtitulo">Avaliação editorial analítica da obra ativa</div>

<div id="statusLeitura" class="status">
Verificando projeto ativo...
</div>

<div class="card">
  <div class="grid">
    <div>
      <label class="label" for="coerenciaEstrutural">Coerência estrutural</label>
      <select id="coerenciaEstrutural">
        <option>Excelente</option>
        <option>Boa</option>
        <option>Regular</option>
        <option>Fraca</option>
      </select>
    </div>

    <div>
      <label class="label" for="forcaAbertura">Força de abertura</label>
      <select id="forcaAbertura">
        <option>Excelente</option>
        <option>Boa</option>
        <option>Regular</option>
        <option>Fraca</option>
      </select>
    </div>

    <div>
      <label class="label" for="fluidezNarrativa">Fluidez narrativa</label>
      <select id="fluidezNarrativa">
        <option>Excelente</option>
        <option>Boa</option>
        <option>Regular</option>
        <option>Fraca</option>
      </select>
    </div>

    <div>
      <label class="label" for="personagens">Construção de personagens</label>
      <select id="personagens">
        <option>Excelente</option>
        <option>Boa</option>
        <option>Regular</option>
        <option>Fraca</option>
      </select>
    </div>

    <div>
      <label class="label" for="potencialComercial">Potencial comercial</label>
      <select id="potencialComercial">
        <option>Alto</option>
        <option>Médio</option>
        <option>Moderado</option>
        <option>Baixo</option>
      </select>
    </div>

    <div>
      <label class="label" for="originalidade">Originalidade</label>
      <select id="originalidade">
        <option>Alta</option>
        <option>Boa</option>
        <option>Moderada</option>
        <option>Baixa</option>
      </select>
    </div>

    <div>
      <label class="label" for="notaFinal">Nota final (0 a 100)</label>
      <input id="notaFinal" type="number" min="0" max="100" placeholder="Ex.: 87">
    </div>

    <div>
      <label class="label" for="recomendacaoEditorial">Recomendação editorial</label>
      <select id="recomendacaoEditorial">
        <option>Aprovado</option>
        <option>Aprovado com ajustes</option>
        <option>Necessita revisão profunda</option>
        <option>Reavaliar estrutura</option>
      </select>
    </div>
  </div>

  <div style="margin-top:18px;">
    <label class="label" for="pontosFortes">Pontos fortes</label>
    <textarea id="pontosFortes" placeholder="Descreva os principais pontos fortes da obra"></textarea>
  </div>

  <div style="margin-top:18px;">
    <label class="label" for="pontosFracos">Pontos fracos</label>
    <textarea id="pontosFracos" placeholder="Descreva os principais pontos frágeis da obra"></textarea>
  </div>

  <div style="margin-top:18px;">
    <label class="label" for="parecerTecnico">Parecer técnico</label>
    <textarea id="parecerTecnico" placeholder="Escreva o parecer técnico consolidado"></textarea>
  </div>

  <div class="actions">
    <button class="btnSalvar" onclick="salvarLeituraTecnica()">Salvar relatório</button>
    <button onclick="carregarLeituraTecnica()">Recarregar relatório salvo</button>
    <button class="btnPrint" onclick="window.print()">Exportar PDF técnico</button>
    <button onclick="voltarIndice()">Voltar ao índice</button>
  </div>

  <div id="previewLeitura" class="preview">
    A prévia do relatório de leitura técnica aparecerá aqui.
  </div>
</div>

</div>

<script src="auditoria.js"></script>

<script>
function obterProjetoAtivo(){
  try{
    const lista = JSON.parse(localStorage.getItem("SDL_projetos_lista") || "[]");
    const ativo = localStorage.getItem("SDL_projeto_ativo");
    return lista.find(p => p.id === ativo) || null;
  }catch{
    return null;
  }
}

function carregarStatusProjeto(){
  const projeto = obterProjetoAtivo();

  if(!projeto){
    document.getElementById("statusLeitura").innerHTML =
      "Nenhum projeto ativo selecionado.";
    return;
  }

  document.getElementById("statusLeitura").innerHTML =
    "Projeto ativo para leitura técnica: <strong>" + (projeto.titulo || "Sem título") + "</strong>";
  document.getElementById("statusLeitura").style.background =
    "rgba(23,77,39,0.28)";
}

function montarObjetoLeitura(){
  const projeto = obterProjetoAtivo();

  if(!projeto){
    return null;
  }

  return {
    projetoID: projeto.id,
    tituloProjeto: projeto.titulo || "",
    coerenciaEstrutural: document.getElementById("coerenciaEstrutural").value,
    forcaAbertura: document.getElementById("forcaAbertura").value,
    fluidezNarrativa: document.getElementById("fluidezNarrativa").value,
    personagens: document.getElementById("personagens").value,
    potencialComercial: document.getElementById("potencialComercial").value,
    originalidade: document.getElementById("originalidade").value,
    notaFinal: document.getElementById("notaFinal").value.trim(),
    recomendacaoEditorial: document.getElementById("recomendacaoEditorial").value,
    pontosFortes: document.getElementById("pontosFortes").value.trim(),
    pontosFracos: document.getElementById("pontosFracos").value.trim(),
    parecerTecnico: document.getElementById("parecerTecnico").value.trim(),
    dataRegistro: new Date().toISOString()
  };
}

function salvarLeituraTecnica(){
  const leitura = montarObjetoLeitura();

  if(!leitura){
    alert("Nenhum projeto ativo selecionado.");
    return;
  }

  localStorage.setItem("SDL_leitura_tecnica_ativa", JSON.stringify(leitura));

  try{
    SDL_registrarAuditoria("Relatório de leitura técnica salvo", "relatorio_leitura_tecnica");
  }catch(e){}

  renderizarPreview(leitura);
  alert("Relatório de leitura técnica salvo com sucesso.");
}

function carregarLeituraTecnica(){
  const projeto = obterProjetoAtivo();

  if(!projeto){
    alert("Nenhum projeto ativo selecionado.");
    return;
  }

  try{
    const leitura = JSON.parse(localStorage.getItem("SDL_leitura_tecnica_ativa") || "null");

    if(!leitura || leitura.projetoID !== projeto.id){
      document.getElementById("previewLeitura").innerHTML =
        "Nenhum relatório de leitura técnica salvo para este projeto.";
      return;
    }

    document.getElementById("coerenciaEstrutural").value = leitura.coerenciaEstrutural || "Boa";
    document.getElementById("forcaAbertura").value = leitura.forcaAbertura || "Boa";
    document.getElementById("fluidezNarrativa").value = leitura.fluidezNarrativa || "Boa";
    document.getElementById("personagens").value = leitura.personagens || "Boa";
    document.getElementById("potencialComercial").value = leitura.potencialComercial || "Médio";
    document.getElementById("originalidade").value = leitura.originalidade || "Boa";
    document.getElementById("notaFinal").value = leitura.notaFinal || "";
    document.getElementById("recomendacaoEditorial").value = leitura.recomendacaoEditorial || "Aprovado com ajustes";
    document.getElementById("pontosFortes").value = leitura.pontosFortes || "";
    document.getElementById("pontosFracos").value = leitura.pontosFracos || "";
    document.getElementById("parecerTecnico").value = leitura.parecerTecnico || "";

    renderizarPreview(leitura);
  }catch(e){
    document.getElementById("previewLeitura").innerHTML =
      "Erro ao carregar relatório salvo.";
  }
}

function renderizarPreview(leitura){
  let html = "";
  html += "<strong>Projeto:</strong> " + (leitura.tituloProjeto || "—") + "<br><br>";
  html += "<strong>Coerência estrutural:</strong> " + (leitura.coerenciaEstrutural || "—") + "<br>";
  html += "<strong>Força de abertura:</strong> " + (leitura.forcaAbertura || "—") + "<br>";
  html += "<strong>Fluidez narrativa:</strong> " + (leitura.fluidezNarrativa || "—") + "<br>";
  html += "<strong>Construção de personagens:</strong> " + (leitura.personagens || "—") + "<br>";
  html += "<strong>Potencial comercial:</strong> " + (leitura.potencialComercial || "—") + "<br>";
  html += "<strong>Originalidade:</strong> " + (leitura.originalidade || "—") + "<br>";
  html += "<strong>Nota final:</strong> " + (leitura.notaFinal || "—") + "<br>";
  html += "<strong>Recomendação editorial:</strong> " + (leitura.recomendacaoEditorial || "—") + "<br>";
  html += "<strong>Data:</strong> " + formatarData(leitura.dataRegistro) + "<br><br>";
  html += "<strong>Pontos fortes:</strong><br>" + escapeHtml(leitura.pontosFortes || "—") + "<br><br>";
  html += "<strong>Pontos fracos:</strong><br>" + escapeHtml(leitura.pontosFracos || "—") + "<br><br>";
  html += "<strong>Parecer técnico:</strong><br>" + escapeHtml(leitura.parecerTecnico || "—");

  document.getElementById("previewLeitura").innerHTML = html;
}

function formatarData(d){
  if(!d) return "—";
  try{
    return new Date(d).toLocaleString("pt-BR");
  }catch{
    return d;
  }
}

function escapeHtml(texto){
  return String(texto)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;")
    .replaceAll("\n", "<br>");
}

function voltarIndice(){
  window.location.href = "_Indice.html";
}

carregarStatusProjeto();
carregarLeituraTecnica();
</script>

</body>
</html>
