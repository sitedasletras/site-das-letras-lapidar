<script>

function gerarHashSimples(texto){

let hash = 0;

for(let i = 0; i < texto.length; i++){

hash = ((hash << 5) - hash) + texto.charCodeAt(i);

hash |= 0;

}

return Math.abs(hash);

}


function gerarNotaDeterministica(){

const titulo =
localStorage.getItem("SDL_titulo_livro") || "";

const autor =
localStorage.getItem("SDL_nome_autor") || "";

const arquivo =
localStorage.getItem("SDL_nome_arquivo_original") || "";

const tamanho =
localStorage.getItem("SDL_tamanho_arquivo_original") || "";

const chave =
titulo + autor + arquivo + tamanho;

const hash =
gerarHashSimples(chave);

const notaBase =
7 + (hash % 30) / 10;

return notaBase.toFixed(1);

}


function gerarTextoAvaliacao(){

let notaSalva =
localStorage.getItem("LTE_nota_final");

if(!notaSalva){

notaSalva =
gerarNotaDeterministica();

localStorage.setItem(
"LTE_nota_final",
notaSalva
);

}

return
"Segundo leitura técnica editorial Lapidar, a obra apresenta coerência estrutural inicial compatível com desenvolvimento narrativo consistente. Nota preliminar estimada: "
+
notaSalva
+
". Recomenda-se continuidade do desenvolvimento com observação de ritmo narrativo, progressão dramática e potencial de ampliação para obra seriada.";

}

</script>
