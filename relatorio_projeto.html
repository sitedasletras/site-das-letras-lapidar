<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatório Editorial Institucional — Site das Letras</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0d0603;
color:white;
}

.container{
width:min(1000px,95%);
margin:auto;
padding:40px 0;
}

.cabecalho{
margin-bottom:30px;
}

.titulo{
font-size:34px;
font-weight:bold;
}

.sub{
color:#f7b22c;
margin-top:4px;
}

.card{

margin-top:25px;

background:#140c08;

padding:20px;

border-radius:14px;

border:1px solid rgba(255,123,44,0.18);

}

.label{

color:#f7b22c;

margin-top:10px;

font-weight:bold;

}

.assinatura{

margin-top:40px;

font-size:14px;

opacity:.8;

}

button{

margin-top:30px;

padding:14px 18px;

border:none;

border-radius:999px;

background:#24150f;

color:white;

cursor:pointer;

}

</style>
</head>

<body>

<div class="container">

<div class="cabecalho">

<div class="titulo">
Relatório Editorial Institucional
</div>

<div class="sub">
Site das Letras Edições Literárias
</div>

</div>

<div id="conteudo"></div>

<div class="assinatura">
Documento gerado automaticamente pelo sistema Lapidar
</div>

<button onclick="window.print()">
Exportar PDF institucional
</button>

<button onclick="voltarIndice()">
Voltar ao índice
</button>

</div>

<script>

function obterProjeto(){

try{

const lista=
JSON.parse(localStorage.getItem("SDL_projetos_lista")||"[]")

const ativo=
localStorage.getItem("SDL_projeto_ativo")

return lista.find(p=>p.id===ativo)

}catch{

return null

}

}

function obterPedidos(id){

let lista=
JSON.parse(localStorage.getItem("SDL_pedidos_lista")||"[]")

return lista.filter(p=>p.projetoID===id)

}

function obterCapas(id){

let lista=
JSON.parse(localStorage.getItem("SDL_capas_lista")||"[]")

return lista.filter(p=>p.projetoID===id)

}

function montarRelatorio(){

const projeto=obterProjeto()

if(!projeto){

document.getElementById("conteudo").innerHTML=
"Nenhum projeto ativo selecionado."

return

}

const plano=localStorage.getItem("SDL_plano")

const pagamento=localStorage.getItem("SDL_pagamento")

const pedidos=obterPedidos(projeto.id)

const capas=obterCapas(projeto.id)

let html=""

html+=`
<div class="card">

<div class="label">Título da obra</div>
${projeto.titulo}

<div class="label">Autor</div>
${projeto.autor}

<div class="label">Formato editorial</div>
${projeto.formato || "-"}

<div class="label">Data de cadastro</div>
${formatarData(projeto.dataRegistro)}

</div>
`

html+=`
<div class="card">

<div class="label">Plano editorial selecionado</div>
${plano || "Não selecionado"}

<div class="label">Pagamento registrado</div>
${pagamento ? "Sim" : "Não"}

</div>
`

html+=`
<div class="card">

<div class="label">Pedidos editoriais vinculados</div>
${pedidos.length}

<div class="label">Solicitação de capa</div>
${capas.length ? "Registrada" : "Não registrada"}

</div>
`

html+=`
<div class="card">

<div class="label">Status institucional da obra</div>

${gerarStatus(plano,pagamento,pedidos,capas)}

</div>
`

document.getElementById("conteudo").innerHTML=html

}

function gerarStatus(plano,pagamento,pedidos,capas){

if(!plano)
return "Aguardando seleção de plano editorial"

if(plano && !pagamento)
return "Plano selecionado aguardando confirmação de pagamento"

if(pagamento && pedidos.length===0)
return "Pagamento confirmado aguardando pedidos editoriais"

if(pedidos.length>0 && capas.length===0)
return "Pedidos editoriais registrados aguardando solicitação de capa"

if(capas.length>0)
return "Fluxo editorial ativo com identidade visual solicitada"

return "Status não identificado"

}

function formatarData(d){

try{

return new Date(d).toLocaleString("pt-BR")

}catch{

return d

}

}

function voltarIndice(){

window.location.href="_Indice.html"

}

montarRelatorio()

</script>

</body>
</html>
