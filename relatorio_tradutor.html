<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatório do Tradutor — Lapidar</title>

<style>
:root{
--bg:#0d0603;
--card:#140c08;
--card2:#1b100a;
--text:#ffffff;
--orange:#f7b22c;
--ok:#9cfdb2;
--border:rgba(255,123,44,0.18);
--shadow:0 10px 26px rgba(0,0,0,0.28);
}

body{
margin:0;
font-family:Arial,sans-serif;
background:var(--bg);
color:var(--text);
}

.container{
width:min(1100px,95%);
margin:auto;
padding:40px 0 60px;
}

.titulo{
font-size:36px;
font-weight:bold;
}

.subtitulo{
margin-top:6px;
color:var(--orange);
}

.status{
margin-top:20px;
padding:16px;
border-radius:12px;
background:rgba(247,178,44,0.12);
border:1px solid rgba(247,178,44,0.25);
}

.card{
margin-top:24px;
background:var(--card);
border-radius:18px;
padding:22px;
border:1px solid var(--border);
box-shadow:var(--shadow);
}

.linha{
margin-bottom:10px;
}

.preview{
margin-top:18px;
padding:18px;
border-radius:14px;
background:var(--card2);
line-height:1.8;
white-space:pre-line;
}

.actions{
margin-top:24px;
display:flex;
gap:12px;
flex-wrap:wrap;
}

button{
border:none;
padding:14px 18px;
border-radius:999px;
cursor:pointer;
font-weight:bold;
}

.btnAtualizar{
background:#174d27;
color:#fff;
}

.btnIndice{
background:#24150f;
color:#fff;
}

.badge{
display:inline-block;
padding:6px 12px;
border-radius:999px;
background:rgba(23,77,39,0.35);
color:var(--ok);
font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<div class="titulo">Relatório do Tradutor</div>
<div class="subtitulo">Resumo executivo da tradução editorial da obra</div>

<div id="statusRelatorioTradutor" class="status">
Verificando projeto ativo...
</div>

<div class="card">

<div id="conteudoRelatorioTradutor" class="preview">
Carregando relatório...
</div>

<div class="actions">
<button class="btnAtualizar" onclick="gerarRelatorioTradutor()">Atualizar relatório</button>
<button class="btnIndice" onclick="voltarTradutor()">Voltar ao tradutor</button>
</div>

</div>

</div>

<script src="auditoria.js"></script>

<script>

function obterProjetoAtivo(){
try{
const lista=JSON.parse(localStorage.getItem("SDL_projetos_lista")||"[]")
const ativo=localStorage.getItem("SDL_projeto_ativo")
return lista.find(p=>p.id===ativo)||null
}catch{
return null
}
}

function lerJSON(chave){
try{
return JSON.parse(localStorage.getItem(chave)||"null")
}catch{
return null
}
}

function carregarStatus(){
const projeto=obterProjetoAtivo()

if(!projeto){
statusRelatorioTradutor.innerHTML="Nenhum projeto ativo selecionado."
return false
}

statusRelatorioTradutor.innerHTML=
"Relatório aplicado ao projeto: <strong>"+projeto.titulo+"</strong>"
statusRelatorioTradutor.style.background="rgba(23,77,39,0.28)"
return true
}

function gerarRelatorioTradutor(){

const projeto=obterProjetoAtivo()
if(!projeto)return

const planejamento=lerJSON("SDL_planejamento_traducao_ativo")
const glossario=lerJSON("SDL_glossario_traducao_ativo")

let texto=""

texto+="Projeto: "+(projeto.titulo||"—")+"\n\n"

if(planejamento && planejamento.projetoID===projeto.id){

texto+="Idioma origem: "+planejamento.idiomaOrigem+"\n"
texto+="Idioma destino: "+planejamento.idiomaDestino+"\n"
texto+="Tipo tradução: "+planejamento.tipoTraducao+"\n"
texto+="Adaptação cultural: "+planejamento.nivelAdaptacao+"\n"
texto+="Público alvo: "+planejamento.publicoDestino+"\n"
texto+="Manter nomes próprios: "+planejamento.manterNomes+"\n"
texto+="Glossário necessário: "+planejamento.usarGlossario+"\n"
texto+="Revisão nativa: "+planejamento.revisaoNativa+"\n\n"

}else{

texto+="Planejamento de tradução ainda não disponível.\n\n"

}

if(glossario && glossario.projetoID===projeto.id){

texto+="Glossário técnico registrado.\n"

if(glossario.nomesProprios) texto+="• nomes próprios definidos\n"
if(glossario.termosFixos) texto+="• termos técnicos definidos\n"
if(glossario.expressoesSensíveis) texto+="• expressões sensíveis definidas\n"
if(glossario.naoTraduzir) texto+="• termos preservados definidos\n"

texto+="\n"

}else{

texto+="Glossário técnico ainda não registrado.\n\n"

}

const pronto=(planejamento && glossario)

texto+="Status técnico da tradução:\n"

if(pronto){

texto+="✔ tradução apta para consolidação editorial\n"

}else{

texto+="⚠ ainda faltam dados técnicos essenciais\n"

}

conteudoRelatorioTradutor.textContent=texto

try{
SDL_registrarAuditoria("Relatório do tradutor atualizado","relatorio_tradutor")
}catch(e){}

}

function voltarTradutor(){
window.location.href="tradutor_inicio.html"
}

if(carregarStatus()){
gerarRelatorioTradutor()
}

</script>

</body>
</html>
