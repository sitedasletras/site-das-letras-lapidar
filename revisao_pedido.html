<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revisão e Pedidos — Lapidar</title>

<style>

:root{
--bg:#0d0603;
--card:#140c08;
--card2:#1b100a;
--text:#ffffff;
--muted:#ffd2b3;
--orange:#f7b22c;
--orangeStrong:#ff5a00;
--green:#9cfdb2;
--danger:#ff7070;
--border:rgba(255,123,44,0.18);
--shadow:0 10px 26px rgba(0,0,0,0.28);
}

body{
margin:0;
font-family:Arial;
background:var(--bg);
color:white;
}

.container{
width:min(1100px,95%);
margin:auto;
padding:40px 0;
}

.titulo{
font-size:38px;
font-weight:bold;
}

.subtitulo{
margin-top:6px;
color:var(--orange);
}

.card{
margin-top:30px;
background:var(--card);
padding:24px;
border-radius:18px;
border:1px solid var(--border);
box-shadow:var(--shadow);
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px;
margin-top:18px;
}

label{
display:block;
margin-bottom:6px;
color:var(--orange);
font-weight:bold;
}

input, select, textarea{
width:100%;
padding:14px;
border-radius:12px;
border:none;
background:#1b0e07;
color:white;
}

textarea{
min-height:140px;
resize:vertical;
}

.statusBox{
margin-top:22px;
padding:18px;
border-radius:14px;
background:rgba(247,178,44,0.12);
border:1px solid rgba(247,178,44,0.2);
color:#ffe7b0;
}

.pedidoBox{
margin-top:20px;
padding:18px;
border-radius:14px;
background:var(--card2);
line-height:1.8;
}

.actions{
margin-top:26px;
display:flex;
flex-wrap:wrap;
gap:12px;
}

.botao{
border:none;
padding:14px 18px;
border-radius:999px;
font-weight:bold;
cursor:pointer;
}

.botaoSalvar{
background:#174d27;
color:#dfffe8;
}

.botaoIndice{
background:#24150f;
color:white;
}

.botaoRecarregar{
background:var(--orangeStrong);
color:white;
}

</style>
</head>

<body>

<div class="container">

<div class="titulo">
REVISÃO E PEDIDOS EDITORIAIS
</div>

<div class="subtitulo">
Registro de solicitações técnicas dentro do ambiente Lapidar
</div>



<div class="card">

<div class="grid">

<div>
<label>Título do pedido</label>
<input id="tituloPedido">
</div>

<div>
<label>Tipo</label>
<select id="tipoPedido">
<option>Revisão textual</option>
<option>Revisão estrutural</option>
<option>Diagramação</option>
<option>Capa</option>
<option>Ficha catalográfica</option>
<option>Ajuste geral</option>
</select>
</div>

<div>
<label>Prioridade</label>
<select id="prioridadePedido">
<option>Normal</option>
<option>Alta</option>
<option>Emergencial</option>
</select>
</div>

<div>
<label>Status</label>
<select id="statusPedido">
<option>Aberto</option>
<option>Em análise</option>
<option>Em execução</option>
<option>Concluído</option>
</select>
</div>

</div>



<div style="margin-top:18px;">
<label>Descrição</label>
<textarea id="descricaoPedido"></textarea>
</div>



<div id="statusPedidoBox" class="statusBox">
Nenhum pedido registrado ainda.
</div>

</div>



<div id="pedidoRenderizado"></div>



<div class="actions">

<button class="botao botaoSalvar" onclick="registrarPedido()">
Registrar pedido
</button>

<button class="botao botaoRecarregar" onclick="carregarPedido()">
Recarregar pedido salvo
</button>

<button class="botao botaoIndice" onclick="voltarIndice()">
Voltar ao índice
</button>

</div>



</div>



<script>

function verificarSessao(){

const sessao=localStorage.getItem("SDL_sessao_ativa")

if(sessao!=="sim"){

window.location.href="login.html"

}

}



function registrarPedido(){

const titulo=document.getElementById("tituloPedido").value.trim()
const descricao=document.getElementById("descricaoPedido").value.trim()

if(!titulo || !descricao){

document.getElementById("statusPedidoBox").innerHTML=
"Preencha título e descrição do pedido."

return

}

let projeto="Sem projeto vinculado"

try{

const bruto=localStorage.getItem("SDL_projeto_ativo")

if(bruto){

const obj=JSON.parse(bruto)

projeto=obj.titulo || projeto

}

}catch(e){}



const pedido={

titulo,
tipo:document.getElementById("tipoPedido").value,
prioridade:document.getElementById("prioridadePedido").value,
status:document.getElementById("statusPedido").value,
descricao,
projeto,
dataRegistro:new Date().toISOString()

}



try{

localStorage.setItem("SDL_pedido_revisao_ativo",JSON.stringify(pedido))

document.getElementById("statusPedidoBox").innerHTML=
"Pedido registrado com sucesso."

document.getElementById("statusPedidoBox").style.background=
"rgba(23,77,39,0.28)"

renderizarPedido(pedido)

}catch(e){

document.getElementById("statusPedidoBox").innerHTML=
"Erro ao registrar pedido."

}

}



function carregarPedido(){

let pedido=null

try{

const bruto=localStorage.getItem("SDL_pedido_revisao_ativo")

if(bruto){

pedido=JSON.parse(bruto)

}

}catch(e){}



if(!pedido){

document.getElementById("statusPedidoBox").innerHTML=
"Nenhum pedido salvo encontrado."

return

}

renderizarPedido(pedido)

}



function renderizarPedido(p){

document.getElementById("pedidoRenderizado").innerHTML=`

<div class="pedidoBox">

<strong>${p.titulo}</strong><br>

Tipo: ${p.tipo}<br>

Prioridade: ${p.prioridade}<br>

Status: ${p.status}<br>

Projeto vinculado: ${p.projeto}<br>

Registrado em: ${formatarData(p.dataRegistro)}<br><br>

${p.descricao}

</div>

`

}



function formatarData(d){

if(!d) return "—"

try{

return new Date(d).toLocaleString("pt-BR")

}catch(e){

return d

}

}



function voltarIndice(){

window.location.href="_Indice.html"

}



verificarSessao()
carregarPedido()

</script>

</body>
</html>
