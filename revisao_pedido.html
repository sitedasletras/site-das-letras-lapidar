<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Revisão do Pedido — Lapidar</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0d0603;
color:white;
display:flex;
justify-content:center;
}

.container{
width:92%;
max-width:720px;
padding:40px 0 60px 0;
}

.titulo{
font-size:34px;
font-weight:bold;
text-align:center;
}

.subtitulo{
margin-top:10px;
text-align:center;
color:#ff7b2c;
}

.card{

background:#140c08;
margin-top:26px;
padding:22px;
border-radius:14px;
line-height:1.8;

}

.label{

color:#ff7b2c;
font-weight:bold;

}

.valor{

color:#ffd2b3;

}

.botao{

width:100%;
padding:18px;
border-radius:40px;
border:none;
margin-top:18px;
font-size:18px;
font-weight:bold;
cursor:pointer;

background:#ff5a00;
color:white;

}

.botao:hover{

background:#ff6f1a;

}

.botaoSecundario{

background:#333;

}

.botaoSecundario:hover{

background:#555;

}

</style>

</head>

<body>

<div class="container">

<div class="titulo">
Revisão do seu pedido
</div>

<div class="subtitulo">
Confira as informações antes da preparação do material diagramado
</div>


<div class="card">

<div>

<span class="label">
Título da obra
</span>

<br>

<span id="titulo" class="valor">
—
</span>

</div>


<div style="margin-top:16px">

<span class="label">
Nome do autor
</span>

<br>

<span id="autor" class="valor">
—
</span>

</div>


<div style="margin-top:16px">

<span class="label">
Tipo de material
</span>

<br>

<span id="tipo" class="valor">
—
</span>

</div>


<div style="margin-top:16px">

<span class="label">
Destino do material
</span>

<br>

<span id="destino" class="valor">
—
</span>

</div>


<div style="margin-top:16px">

<span class="label">
Estilo de diálogo escolhido
</span>

<br>

<span id="dialogo" class="valor">
—
</span>

</div>


<div style="margin-top:16px">

<span class="label">
Tema visual selecionado
</span>

<br>

<span id="tema" class="valor">
—
</span>

</div>

</div>


<button class="botao"
onclick="window.location.href='relatorio_lapidacao.html'">

Ver Presente de Lapidação Literária

</button>


<button class="botao"
onclick="window.location.href='_Indice.html'">

Continuar para a casa do seu original

</button>


<button class="botao botaoSecundario"
onclick="window.location.href='preferencias_diagramacao.html'">

Voltar para ajustar preferências

</button>


</div>


<script>

document.getElementById("titulo").innerText =
localStorage.getItem("SDL_titulo_livro") || "Não informado";


document.getElementById("autor").innerText =
localStorage.getItem("SDL_nome_autor") || "Não informado";


document.getElementById("tipo").innerText =
localStorage.getItem("SDL_tipo_material") || "Não informado";


document.getElementById("destino").innerText =
localStorage.getItem("SDL_destino_material") || "Não informado";


document.getElementById("dialogo").innerText =
localStorage.getItem("SDL_dialogos") || "Não informado";


document.getElementById("tema").innerText =
localStorage.getItem("SDL_tema_visual") || "Não informado";

</script>


</body>
</html>
