<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Revisão do pedido — Lapidar</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0d0603;
color:white;
display:flex;
justify-content:center;
}

.container{
max-width:720px;
width:92%;
padding:40px 0 60px 0;
}

.titulo{
font-size:36px;
text-align:center;
font-weight:bold;
}

.subtitulo{
text-align:center;
color:#ff7b2c;
margin-top:10px;
margin-bottom:28px;
}

.card{
background:#140c08;
border-radius:14px;
padding:24px;
margin-top:18px;
line-height:1.8;
}

.item{
margin-bottom:10px;
color:#ffd2b3;
}

.destaque{
color:#9cffb2;
font-weight:bold;
}

.botao{

width:100%;
padding:18px;
margin-top:18px;
border:none;
border-radius:40px;
background:#ff5a00;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;

}

.botaoCinza{
background:#444;
}

.botaoCinza:hover{
background:#666;
}

</style>

</head>

<body>

<div class="container">

<div class="titulo">
Revisão do pedido editorial
</div>

<div class="subtitulo">
Confira os dados antes de gerar o relatório técnico da preparação editorial
</div>

<div class="card" id="resumoPedido">

Carregando informações do pedido...

</div>

<button class="botao" onclick="seguirRelatorio()">
Gerar relatório editorial Lapidar
</button>

<button class="botao" onclick="window.location.href='preferencias_diagramacao.html'">
Voltar para preferências
</button>

<button class="botao botaoCinza" onclick="window.location.href='_Indice.html'">
Voltar para casa do original
</button>

</div>

<script>

function traduzirIdioma(codigo){

if(codigo === "pt") return "Português";
if(codigo === "en") return "English";
if(codigo === "es") return "Español";
if(codigo === "it") return "Italiano";
if(codigo === "fr") return "Français";
if(codigo === "de") return "Deutsch";

return "Português";

}

function obterIdiomaMestre(){

const idiomaGlobal =
localStorage.getItem("SDL_idioma_obra_global");

const idiomaLocal =
localStorage.getItem("SDL_idioma_obra");

return idiomaGlobal || idiomaLocal || "pt";

}

function carregarResumo(){

const idioma =
obterIdiomaMestre();

const titulo =
localStorage.getItem("SDL_titulo_livro");

const autor =
localStorage.getItem("SDL_nome_autor");

const tipo =
localStorage.getItem("SDL_tipo_material");

const destino =
localStorage.getItem("SDL_destino_material");

const formato =
localStorage.getItem("SDL_formato");

const margens =
localStorage.getItem("SDL_margens");

const alinhamento =
localStorage.getItem("SDL_alinhamento");

const paragrafos =
localStorage.getItem("SDL_paragrafos");

const hifenizacao =
localStorage.getItem("SDL_hifenizacao");

if(!titulo){

document.getElementById("resumoPedido").innerHTML =

"Dados do pedido ainda não encontrados.";

return;

}

document.getElementById("resumoPedido").innerHTML =

"<div class='item'>Idioma editorial da obra: <span class='destaque'>" + traduzirIdioma(idioma) + "</span></div>" +

"<div class='item'>Título da obra: <span class='destaque'>" + titulo + "</span></div>" +

"<div class='item'>Autor: <span class='destaque'>" + autor + "</span></div>" +

"<div class='item'>Tipo de material: <span class='destaque'>" + tipo + "</span></div>" +

"<div class='item'>Destino editorial: <span class='destaque'>" + destino + "</span></div>" +

"<div class='item'>Formato: <span class='destaque'>" + formato + "</span></div>" +

"<div class='item'>Margens: <span class='destaque'>" + margens + "</span></div>" +

"<div class='item'>Alinhamento: <span class='destaque'>" + alinhamento + "</span></div>" +

"<div class='item'>Parágrafos: <span class='destaque'>" + paragrafos + "</span></div>" +

"<div class='item'>Hifenização: <span class='destaque'>" + hifenizacao + "</span></div>";

}

function seguirRelatorio(){

const titulo =
localStorage.getItem("SDL_titulo_livro");

if(!titulo){

alert("Dados do pedido não encontrados.");

return;

}

window.location.href =
"relatorio_lapidacao.html";

}

carregarResumo();

</script>

</body>

</html>
