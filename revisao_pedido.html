<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revisão e Pedidos — Lapidar</title>

<style>

:root{
--bg:#0d0603;
--card:#140c08;
--card2:#1b100a;
--text:#ffffff;
--muted:#ffd2b3;
--orange:#f7b22c;
--orangeStrong:#ff5a00;
--green:#9cfdb2;
--border:rgba(255,123,44,0.18);
--shadow:0 10px 26px rgba(0,0,0,0.28);
}

body{
margin:0;
font-family:Arial;
background:var(--bg);
color:white;
}

.container{
width:min(1100px,95%);
margin:auto;
padding:40px 0;
}

.titulo{
font-size:36px;
font-weight:bold;
}

.subtitulo{
margin-top:6px;
color:var(--orange);
}

.card{
margin-top:30px;
background:var(--card);
padding:24px;
border-radius:18px;
border:1px solid var(--border);
box-shadow:var(--shadow);
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px;
}

label{
display:block;
margin-bottom:6px;
color:var(--orange);
font-weight:bold;
}

input, select, textarea{
width:100%;
padding:14px;
border-radius:12px;
border:none;
background:#1b0e07;
color:white;
}

textarea{
min-height:140px;
resize:vertical;
}

.status{
margin-top:20px;
padding:16px;
border-radius:12px;
background:rgba(247,178,44,0.12);
border:1px solid rgba(247,178,44,0.25);
}

.pedidoRender{
margin-top:20px;
padding:18px;
background:var(--card2);
border-radius:14px;
line-height:1.8;
}

.actions{
margin-top:24px;
display:flex;
flex-wrap:wrap;
gap:12px;
}

button{
border:none;
padding:14px 18px;
border-radius:999px;
cursor:pointer;
font-weight:bold;
}

.btnSalvar{
background:#174d27;
color:white;
}

.btnIndice{
background:#24150f;
color:white;
}

.btnRecarregar{
background:var(--orangeStrong);
color:white;
}

</style>
</head>

<body>

<div class="container">

<div class="titulo">
Revisão e Pedidos Editoriais
</div>

<div class="subtitulo">
Solicitações vinculadas ao projeto ativo do Lapidar
</div>



<div id="statusProjeto" class="status">
Verificando projeto ativo...
</div>



<div class="card">

<div class="grid">

<div>
<label>Título do pedido</label>
<input id="tituloPedido">
</div>

<div>
<label>Tipo</label>
<select id="tipoPedido">
<option>Revisão textual</option>
<option>Revisão estrutural</option>
<option>Diagramação</option>
<option>Capa</option>
<option>Ficha catalográfica</option>
<option>Ajuste geral</option>
</select>
</div>

<div>
<label>Prioridade</label>
<select id="prioridadePedido">
<option>Normal</option>
<option>Alta</option>
<option>Emergencial</option>
</select>
</div>

<div>
<label>Status</label>
<select id="statusPedido">
<option>Aberto</option>
<option>Em análise</option>
<option>Em execução</option>
<option>Concluído</option>
</select>
</div>

</div>



<div style="margin-top:20px">

<label>Descrição</label>
<textarea id="descricaoPedido"></textarea>

</div>

</div>



<div id="pedidoRenderizado"></div>



<div class="actions">

<button class="btnSalvar" onclick="registrarPedido()">
Registrar pedido
</button>

<button class="btnRecarregar" onclick="carregarPedido()">
Recarregar pedido salvo
</button>

<button class="btnIndice" onclick="voltarIndice()">
Voltar ao índice
</button>

</div>

</div>



<script>

function verificarSessao(){

const sessao = localStorage.getItem("SDL_sessao_ativa")

if(sessao !== "sim"){
window.location.href="login.html"
}

}



function obterProjetoAtivo(){

try{

const lista = JSON.parse(
localStorage.getItem("SDL_projetos_lista") || "[]"
)

const ativo = localStorage.getItem("SDL_projeto_ativo")

return lista.find(p => p.id === ativo)

}catch{

return null

}

}



function verificarProjeto(){

const projeto = obterProjetoAtivo()

if(!projeto){

document.getElementById("statusProjeto").innerHTML =
"Nenhum projeto ativo selecionado."

return

}

document.getElementById("statusProjeto").innerHTML =
"Projeto ativo: <strong>" + projeto.titulo + "</strong>"

document.getElementById("statusProjeto").style.background =
"rgba(23,77,39,0.28)"

}



function registrarPedido(){

const projeto = obterProjetoAtivo()

if(!projeto){

alert("Nenhum projeto ativo selecionado.")
return

}

const titulo =
document.getElementById("tituloPedido").value.trim()

const descricao =
document.getElementById("descricaoPedido").value.trim()

if(!titulo || !descricao){

alert("Preencha título e descrição.")
return

}



const pedido = {

id: "rev_" + Date.now(),

projetoID: projeto.id,
projetoTitulo: projeto.titulo,

titulo,
tipo: document.getElementById("tipoPedido").value,
prioridade: document.getElementById("prioridadePedido").value,
status: document.getElementById("statusPedido").value,

descricao,

dataRegistro: new Date().toISOString()

}



let lista = []

try{

lista = JSON.parse(
localStorage.getItem("SDL_pedidos_lista") || "[]"
)

}catch{}

lista.push(pedido)

localStorage.setItem(
"SDL_pedidos_lista",
JSON.stringify(lista)
)

renderizarPedido(pedido)

}



function carregarPedido(){

const projeto = obterProjetoAtivo()

if(!projeto){

alert("Nenhum projeto ativo.")
return

}

let lista = JSON.parse(
localStorage.getItem("SDL_pedidos_lista") || "[]"
)

const pedido = lista.reverse().find(
p => p.projetoID === projeto.id
)

if(!pedido){

alert("Nenhum pedido encontrado.")
return

}

renderizarPedido(pedido)

}



function renderizarPedido(p){

document.getElementById("pedidoRenderizado").innerHTML =

`<div class="pedidoRender">

<strong>${p.titulo}</strong><br>

Tipo: ${p.tipo}<br>

Prioridade: ${p.prioridade}<br>

Status: ${p.status}<br>

Projeto: ${p.projetoTitulo}<br>

Registrado em:
${formatarData(p.dataRegistro)}<br><br>

${p.descricao}

</div>`

}



function formatarData(d){

try{
return new Date(d).toLocaleString("pt-BR")
}catch{
return d
}

}



function voltarIndice(){
window.location.href="_Indice.html"
}



verificarSessao()
verificarProjeto()

</script>

</body>
</html>
