<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lapidar • Redirecionando</title>
  <meta http-equiv="refresh" content="0; url=admin_painel.html" />
  <style>
    :root{
      --bg:#f7f5ef;
      --card:#ffffff;
      --line:#c9c1b2;
      --text:#2f2a24;
      --muted:#5f574c;
      --hero:#f1e8d8;
      --hero-dark:#8a6a43;
      --soft:#ece7db;
      --soft-dark:#e2dccd;
      --accent:#9a4d4d;
      --accent-dark:#823c3c;
      --shadow:0 12px 28px rgba(67,58,45,.10);
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      background:var(--bg);
      color:var(--text);
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
      padding:20px;
    }

    .card{
      width:100%;
      max-width:760px;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:28px;
      padding:32px 28px;
      box-shadow:var(--shadow);
      text-align:center;
    }

    .eyebrow{
      display:inline-block;
      padding:8px 14px;
      border-radius:999px;
      background:var(--hero);
      color:#6b5b46;
      font-size:14px;
      font-weight:bold;
      margin-bottom:14px;
    }

    h1{
      margin:0 0 12px 0;
      font-size:32px;
      line-height:1.15;
      color:var(--hero-dark);
    }

    p{
      margin:0 0 14px 0;
      font-size:19px;
      line-height:1.8;
      color:var(--muted);
    }

    .btn{
      margin-top:14px;
      border:none;
      border-radius:18px;
      padding:16px 22px;
      font-size:18px;
      font-weight:bold;
      cursor:pointer;
      background:var(--accent);
      color:#fff;
      transition:.2s ease;
    }

    .btn:hover{
      background:var(--accent-dark);
      transform:translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Lapidar • Redirecionamento interno</div>
    <h1>Encaminhando para o painel correto</h1>
    <p>
      O acesso está sendo levado diretamente para a área administrativa principal do sistema.
    </p>
    <p>
      Se o redirecionamento não acontecer sozinho, toque no botão abaixo.
    </p>
    <button class="btn" onclick="window.location.href='admin_painel.html'">
      Ir para o Painel Administrativo
    </button>
  </div>

  <script>
    window.location.href = "admin_painel.html";
  </script>
</body>
</html>
