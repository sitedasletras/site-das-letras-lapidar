<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selecionar módulos • Lapidar</title>

<style>
body{font-family:Arial;background:#0f1f13;color:white;margin:0}
.container{max-width:900px;margin:auto;padding:20px}
.card{background:#183321;padding:20px;border-radius:15px}
label{display:block;margin:10px 0;font-size:18px}
button{background:#2e7d32;border:none;padding:14px 18px;border-radius:10px;color:white;font-weight:bold;cursor:pointer}
</style>
</head>

<body>

<div class="container">
<div class="card">

<h2>Selecionar módulos do projeto</h2>

<label><input type="checkbox" id="diagramacao"> Assistente de Diagramação</label>
<label><input type="checkbox" id="capista"> OKapista</label>
<label><input type="checkbox" id="traducao"> Segunda Língua(s)</label>
<label><input type="checkbox" id="avaliacao"> Avaliação Literária</label>
<label><input type="checkbox" id="analisador"> Analisador de Obra</label>
<label><input type="checkbox" id="lapidacao"> Lapidação Literária</label>
<label><input type="checkbox" id="silo"> Silo Sonoro</label>

<button onclick="salvarSelecao()">Continuar</button>

</div>
</div>

<script>

function salvarSelecao(){

const modulos={
diagramacao:document.getElementById("diagramacao").checked,
capista:document.getElementById("capista").checked,
traducao:document.getElementById("traducao").checked,
avaliacao:document.getElementById("avaliacao").checked,
analisador:document.getElementById("analisador").checked,
lapidacao:document.getElementById("lapidacao").checked,
silo:document.getElementById("silo").checked
};

localStorage.setItem("lapidar_modulos",JSON.stringify(modulos));

const ordem=[
"diagramacao.html",
"capista.html",
"segunda_lingua.html",
"avaliacao_literaria.html",
"analisador_obra.html",
"lapidacao_literaria.html",
"silo_sonoro.html",
"expedicao_material.html"
];

for(let i=0;i<ordem.length;i++){
const chave=ordem[i]
.replace(".html","")
.replace("segunda_lingua","traducao")
.replace("avaliacao_literaria","avaliacao")
.replace("analisador_obra","analisador")
.replace("lapidacao_literaria","lapidacao")
.replace("silo_sonoro","silo");

if(modulos[chave]){
window.location.href=ordem[i];
return;
}
}

alert("Selecione pelo menos um módulo");

}

</script>

</body>
</html>
