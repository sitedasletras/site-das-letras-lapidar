<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Escolha o tipo de produção — Lapidar</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
background:#f4f1e8;
}

header{
background:#32497d;
color:white;
padding:18px;
display:flex;
justify-content:space-between;
font-size:18px;
}

.container{
max-width:900px;
margin:auto;
padding:30px;
}

.card{
background:white;
padding:30px;
border-radius:18px;
margin-bottom:20px;
box-shadow:0px 8px 20px rgba(0,0,0,.08);
}

.botao{
width:100%;
padding:18px;
margin-top:10px;
border:none;
border-radius:12px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.livro{
background:#6b8ec1;
color:white;
}

.audiovisual{
background:#c19b2e;
color:white;
}

.musica{
background:#5aa07a;
color:white;
}

</style>
</head>

<body>

<header>

<div>Escolha o tipo de produção</div>

<div>Lapidar</div>

</header>


<div class="container">


<div class="card">

<h2>Selecione o caminho da sua obra</h2>

<p>
Escolha primeiro o tipo principal de produção.
Depois você poderá escolher os módulos internos.
</p>


<button
class="botao livro"
onclick="irLivro()"
>

Produção Editorial (Livro)

</button>


<button
class="botao audiovisual"
onclick="irAudiovisual()"
>

Produção Audiovisual

</button>


<button
class="botao musica"
onclick="irMusica()"
>

Produção Voz / Música

</button>


</div>


</div>


<script>

function irLivro(){

window.location.href =
"modulos_livro.html"

}


function irAudiovisual(){

window.location.href =
"modulos_audiovisual.html"

}


function irMusica(){

window.location.href =
"modulos_musica.html"

}

</script>

</body>
</html>
