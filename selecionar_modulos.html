<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lapidar — Seleção de módulos</title>
  <style>
    body{
      font-family:Arial, Helvetica, sans-serif;
      background:#f7f5ef;
      margin:0;
      padding:0;
    }

    .container{
      max-width:720px;
      margin:auto;
      padding:40px 20px;
    }

    .card{
      background:white;
      border-radius:18px;
      padding:28px;
      box-shadow:0px 8px 20px rgba(0,0,0,.08);
    }

    h1{
      font-size:22px;
      margin-bottom:8px;
      color:#6b5b46;
    }

    .sub{
      font-size:14px;
      color:#555;
      margin-bottom:26px;
      line-height:1.6;
    }

    .module{
      background:#f2efe8;
      padding:16px;
      margin-bottom:12px;
      border-radius:12px;
      display:flex;
      align-items:center;
      gap:12px;
      font-size:16px;
    }

    .module input{
      transform:scale(1.1);
    }

    .status{
      margin-top:14px;
      padding:12px 14px;
      border-radius:12px;
      background:#faf8f2;
      color:#6b5b46;
      font-size:14px;
      border:1px solid #e0d7c8;
    }

    button{
      width:100%;
      margin-top:18px;
      background:#8a6a3c;
      color:white;
      border:none;
      padding:16px;
      font-size:16px;
      border-radius:12px;
      cursor:pointer;
      font-weight:bold;
    }

    button:hover{
      background:#73572f;
    }

    footer{
      text-align:center;
      margin-top:20px;
      font-size:13px;
      color:#777;
    }
  </style>
</head>
<body>

<div class="container">

  <div class="card">
    <h1>Escolha os módulos editoriais</h1>

    <div class="sub">
      Após o Bolsão de Limpeza Editorial, selecione os setores que deseja ativar.
      O Lapidar seguirá automaticamente a sequência definida.
    </div>

    <form id="formModulos">

      <label class="module">
        <input type="checkbox" value="modulo03_assistente_diagramacao_autor_mapa.html">
        Assistente de Diagramação do Autor
      </label>

      <label class="module">
        <input type="checkbox" value="modulo19_okapista_mapa.html">
        OKapista
      </label>

      <label class="module">
        <input type="checkbox" value="modulo05_segunda_linguas_mapa.html">
        Segunda Língua(s)
      </label>

      <label class="module">
        <input type="checkbox" value="modulo07_avaliacao_literaria_mapa.html">
        Avaliação Literária
      </label>

      <label class="module">
        <input type="checkbox" value="modulo11_analisador_de_obra_mapa.html">
        Analisador de Obra
      </label>

      <label class="module">
        <input type="checkbox" value="modulo13_lapidacao_literaria_mapa.html">
        Lapidação Literária
      </label>

      <label class="module">
        <input type="checkbox" value="modulo17_silo_sonoro_mapa.html">
        Silo Sonoro
      </label>

      <div class="status" id="statusFila">
        Nenhum módulo selecionado ainda.
      </div>

      <button type="button" onclick="seguirFluxo()">
        Continuar jornada editorial
      </button>

    </form>
  </div>

  <footer>
    Lapidar • Celeiro Literário
  </footer>

</div>

<script>
  const checkboxes = document.querySelectorAll("input[type='checkbox']");
  const statusFila = document.getElementById("statusFila");

  function atualizarStatus(){
    const selecionados = Array.from(checkboxes)
      .filter(cb => cb.checked)
      .map(cb => cb.parentElement.textContent.trim());

    if(selecionados.length === 0){
      statusFila.textContent = "Nenhum módulo selecionado ainda.";
      return;
    }

    statusFila.textContent = "Módulos selecionados: " + selecionados.join(" → ");
  }

  checkboxes.forEach(cb => {
    cb.addEventListener("change", atualizarStatus);
  });

  function seguirFluxo(){
    const selecionados = Array.from(document.querySelectorAll("input[type='checkbox']:checked"))
      .map(cb => cb.value.trim())
      .filter(Boolean);

    if(selecionados.length === 0){
      alert("Selecione pelo menos um módulo.");
      return;
    }

    localStorage.removeItem("fila_modulos_lapidar");
    localStorage.removeItem("indice_fluxo_lapidar");

    localStorage.setItem("fila_modulos_lapidar", JSON.stringify(selecionados));
    localStorage.setItem("indice_fluxo_lapidar", "0");
    localStorage.setItem("lapidar_fluxo_ativo", "sim");

    window.location.href = selecionados[0];
  }

  atualizarStatus();
</script>

</body>
</html>
