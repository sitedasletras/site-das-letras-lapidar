<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Lapidar — Seleção de Módulos</title>

<style>

body{
font-family: Georgia, serif;
background:#f4ecd8;
margin:0;
padding:0;
}

.container{
max-width:900px;
margin:auto;
padding:40px;
}

h1{
text-align:center;
color:#5a4a2f;
}

.subtexto{
text-align:center;
margin-bottom:30px;
color:#6b5c3d;
}

.modulos{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.modulo{
background:white;
border-radius:10px;
padding:15px;
box-shadow:0px 2px 5px rgba(0,0,0,0.15);
}

.modulo label{
font-size:18px;
cursor:pointer;
}

.botao{
margin-top:40px;
text-align:center;
}

button{
background:#5a4a2f;
color:white;
font-size:18px;
padding:15px 40px;
border:none;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#3e321f;
}

.aviso{
margin-top:25px;
text-align:center;
font-size:14px;
color:#7a6a48;
}

</style>

</head>

<body>

<div class="container">

<h1>Seleção de Caminho Editorial</h1>

<div class="subtexto">
Escolha abaixo quais etapas deseja realizar agora com sua obra.<br>
Você pode selecionar quantas desejar. O sistema seguirá a ordem escolhida automaticamente.
</div>

<form id="form_modulos">

<div class="modulos">

<div class="modulo">
<label>
<input type="checkbox" value="modulo03_assistente_diagramacao_mapa.html">
Assistente de Diagramação do Autor
</label>
</div>

<div class="modulo">
<label>
<input type="checkbox" value="modulo05_segunda_linguas_mapa.html">
Segunda Língua(s)
</label>
</div>

<div class="modulo">
<label>
<input type="checkbox" value="modulo07_avaliacao_literaria_mapa.html">
Avaliação Literária
</label>
</div>

<div class="modulo">
<label>
<input type="checkbox" value="modulo11_analisador_de_obra_mapa.html">
Analisador de Obra
</label>
</div>

<div class="modulo">
<label>
<input type="checkbox" value="modulo13_lapidacao_literaria_mapa.html">
Lapidação Literária
</label>
</div>

<div class="modulo">
<label>
<input type="checkbox" value="modulo17_silo_sonoro_mapa.html">
Silo Sonoro (Audiobook)
</label>
</div>

<div class="modulo">
<label>
<input type="checkbox" value="modulo19_okapista_mapa.html">
OKapista (Capa completa)
</label>
</div>

</div>

<div class="botao">
<button type="button" onclick="iniciarFluxo()">Iniciar Caminho Editorial</button>
</div>

<div class="aviso">
Após iniciar, o Lapidar seguirá automaticamente a sequência escolhida.
</div>

</form>

</div>

<script>

function iniciarFluxo(){

const selecionados = document.querySelectorAll("input[type=checkbox]:checked");

if(selecionados.length===0){

alert("Selecione pelo menos um módulo para continuar.");

return;

}

let fila=[];

selecionados.forEach(item=>{
fila.push(item.value);
});

localStorage.setItem("fila_modulos_lapidar",JSON.stringify(fila));

localStorage.setItem("indice_fluxo_lapidar",0);

window.location.href=fila[0];

}

</script>

</body>
</html>
