<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Escolha os módulos — Lapidar</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f4f1e8;
}

header{
background:#32497d;
color:white;
padding:18px;
display:flex;
justify-content:space-between;
font-size:18px;
}

.container{
max-width:900px;
margin:auto;
padding:30px;
}

.card{
background:white;
padding:25px;
border-radius:16px;
box-shadow:0px 8px 20px rgba(0,0,0,.08);
}

.botao{
width:100%;
padding:18px;
margin-top:12px;
border:none;
border-radius:12px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.diagramacao{background:#2e6eb5;color:white;}
.okapista{background:#d4af37;color:black;}
.traducao{background:#7e57c2;color:white;}
.avaliacao{background:#546e7a;color:white;}
.analisador{background:#00897b;color:white;}
.lapidacao{background:#6d4c41;color:white;}
.silo_sonoro{background:#9575cd;color:white;}
.silo_cinema{background:#64b5f6;color:white;}
.expedicao{background:#81c784;color:black;}
.music{background:#b39ddb;color:black;}

.voltar{
background:#455a64;
color:white;
margin-top:20px;
}

.limpar{
background:#b71c1c;
color:white;
}

</style>
</head>

<body>

<header>

<div>Módulos disponíveis da obra</div>

<div>Lapidar</div>

</header>


<div class="container">

<div class="card">

<h2>Escolha os módulos que deseja usar na sua obra</h2>

<p>Você pode escolher um ou vários.</p>


<button class="botao diagramacao">
Assistente de diagramação do livro
</button>

<button class="botao okapista">
Criar ou ajustar a capa do livro
</button>

<button class="botao traducao">
Traduzir o livro para outro idioma
</button>

<button class="botao avaliacao">
Ver se o seu livro está bom e o que pode melhorar
</button>

<button class="botao analisador">
Ver como a história do seu livro está organizada
</button>

<button class="botao lapidacao">
Melhorar a escrita do livro
</button>

<button class="botao silo_sonoro">
Transformar o livro em narração com voz
</button>

<button class="botao silo_cinema">
Criar vídeos baseados no livro
</button>

<button class="botao expedicao">
Preparar a expedição editorial da obra
</button>

<button class="botao music">
Criar música inspirada no livro
</button>


<button class="botao voltar" onclick="voltarInicio()">
Voltar para escolher outro tipo de produção
</button>

<button class="botao limpar" onclick="limpar()">
Apagar escolhas desta tela
</button>


</div>

</div>


<script>

function voltarInicio(){
window.location.href="index.html"
}

function limpar(){
location.reload()
}

</script>

</body>
</html>
