<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Status do Fluxo Editorial — Lapidar</title>

<style>

body{
margin:0;
font-family:Arial;
background:#120604;
color:white;
}

header{
background:#2f436d;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.container{
max-width:1000px;
margin:auto;
padding:30px 20px;
}

.card{
background:#1d0a07;
border-radius:14px;
padding:20px;
margin-bottom:20px;
box-shadow:0 6px 20px rgba(0,0,0,.25);
}

.badge{
display:inline-block;
padding:8px 12px;
border-radius:8px;
background:#3a1a11;
margin-top:10px;
font-size:13px;
}

button{
padding:12px 16px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
background:#2f436d;
color:white;
margin-right:10px;
margin-top:10px;
}

button.alt{
background:#8a6f3f;
}

</style>
</head>

<body>

<header>

<h2>Status do Fluxo Editorial</h2>

<button onclick="voltar()">Voltar</button>

</header>


<div class="container">


<div class="card">

<h3>Projeto ativo</h3>

<div id="nomeProjeto">

Nenhum projeto ativo selecionado.

</div>

</div>


<div class="card">

<h3>Planejamento editorial</h3>
<span class="badge">Verificando...</span>

</div>


<div class="card">

<h3>Setor de capa</h3>
<span class="badge">Verificando...</span>

</div>


<div class="card">

<h3>Setor de miolo</h3>
<span class="badge">Verificando...</span>

</div>


<div class="card">

<h3>Setor de tradução</h3>
<span class="badge">Verificando...</span>

</div>


<div class="card">

<h3>Leitura técnica</h3>
<span class="badge">Verificando...</span>

</div>


<div class="card">

<h3>Prontidão final</h3>
<span class="badge">Verificando...</span>

</div>


<div class="card">

<button onclick="abrirSetores()">Abrir painel de setores</button>

<button onclick="abrirPreview()" class="alt">Abrir preview do projeto</button>

</div>


</div>


<script>

/* SESSION GUARD PADRÃO LAPIDAR */

const perfil = localStorage.getItem("lapidar_perfil")

if(!perfil){

window.location.href="index.html"

}


/* CARREGAR PROJETO ATIVO */

const projeto = localStorage.getItem("lapidar_projeto_ativo")

if(projeto){

document.getElementById("nomeProjeto").innerText = projeto

}


/* NAVEGAÇÃO */

function abrirSetores(){

window.location.href="painel_setores.html"

}


function abrirPreview(){

window.location.href="preview_projeto.html"

}


function voltar(){

window.location.href="projetos.html"

}

</script>


</body>
</html>
