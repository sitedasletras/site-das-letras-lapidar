<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Status do Fluxo Editorial</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0e0604;
color:white;
}

header{
background:#2f436d;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.container{
max-width:1000px;
margin:auto;
padding:30px 20px;
}

.card{
background:#1c0e08;
border-radius:14px;
padding:20px;
margin-bottom:20px;
box-shadow:0 6px 18px rgba(0,0,0,.25);
}

button{
padding:12px 16px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
background:#2f436d;
color:white;
margin-top:10px;
}

.status{
padding:12px;
margin-top:10px;
border-radius:8px;
background:#2a140c;
}

</style>
</head>

<body>

<header>

<h2>Status do Fluxo Editorial</h2>

<button onclick="voltar()">Voltar</button>

</header>


<div class="container">

<div class="card">

<h3>Projeto ativo</h3>

<div id="projetoAtual">

Nenhum projeto ativo selecionado.

</div>

</div>


<div class="card">

<h3>Etapas do fluxo editorial</h3>

<div class="status">✔ Preparação inicial</div>
<div class="status">✔ Organização estrutural</div>
<div class="status">⏳ Diagramação</div>
<div class="status">⏳ Revisão técnica</div>
<div class="status">⏳ Capa editorial</div>
<div class="status">⏳ Traduções (se houver)</div>
<div class="status">⏳ Publicação final</div>

</div>

</div>


<script>

const perfil = localStorage.getItem("lapidar_perfil")

if(!perfil){

window.location.href="index.html"

}

let projeto = localStorage.getItem("lapidar_projeto_ativo")

if(projeto){

document.getElementById("projetoAtual").innerText = projeto

}

function voltar(){

window.location.href="projetos.html"

}

</script>


</body>
</html>
