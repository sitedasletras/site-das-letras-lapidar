<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Status do Plano — Lapidar</title>

<style>

:root{
--bg:#0d0603;
--card:#140c08;
--card-2:#1b100a;
--text:#ffffff;
--muted:#ffd2b3;
--orange:#f7b22c;
--orange-strong:#ff5a00;
--green:#9cfdb2;
--danger:#ff7070;
--border:rgba(255,123,44,0.18);
--shadow:0 10px 26px rgba(0,0,0,0.28);
}

body{
margin:0;
font-family:Arial;
background:var(--bg);
color:white;
}

.container{
width:min(900px,94%);
margin:auto;
padding:40px 0;
}

.titulo{
font-size:38px;
font-weight:bold;
}

.subtitulo{
margin-top:6px;
color:var(--orange);
}

.card{
margin-top:30px;
background:var(--card);
padding:24px;
border-radius:18px;
border:1px solid var(--border);
box-shadow:var(--shadow);
}

.status-box{
margin-top:20px;
padding:18px;
border-radius:14px;
background:rgba(247,178,44,0.12);
border:1px solid rgba(247,178,44,0.2);
color:#ffe7b0;
}

.linha{
margin-top:12px;
color:var(--muted);
}

.rotulo{
color:var(--orange);
font-weight:bold;
}

.actions{
margin-top:24px;
display:flex;
flex-wrap:wrap;
gap:12px;
}

.botao{
border:none;
padding:14px 18px;
border-radius:999px;
font-weight:bold;
cursor:pointer;
}

.botao-laranja{
background:var(--orange-strong);
color:white;
}

.botao-verde{
background:#174d27;
color:#dfffe8;
}

.botao-escuro{
background:#24150f;
color:white;
}

</style>
</head>

<body>

<div class="container">

<div class="titulo">
STATUS DO PLANO
</div>

<div class="subtitulo">
Situação editorial ativa dentro do ambiente Lapidar
</div>



<div class="card">

<div id="statusPlano" class="status-box">
Verificando plano ativo...
</div>

<div class="linha">
<span class="rotulo">Plano:</span>
<span id="planoAtual">Carregando...</span>
</div>

<div class="linha">
<span class="rotulo">Forma de pagamento:</span>
<span id="formaPagamento">Carregando...</span>
</div>

<div class="linha">
<span class="rotulo">Situação:</span>
<span id="situacaoPlano">Carregando...</span>
</div>

</div>



<div class="actions">

<button class="botao botao-laranja" onclick="abrirPlanos()">
Escolher plano
</button>

<button class="botao botao-verde" onclick="abrirPagamento()">
Registrar pagamento
</button>

<button class="botao botao-escuro" onclick="voltarIndice()">
Voltar ao índice
</button>

</div>



</div>



<script>

function verificarSessao(){

const sessao=localStorage.getItem("SDL_sessao_ativa")

if(sessao!=="sim"){

window.location.href="login.html"

}

}



function carregarStatusPlano(){

let plano="Nenhum plano definido"
let pagamento="Não registrado"
let situacao="Plano inativo"

try{

const planoSalvo=localStorage.getItem("SDL_plano")
const pagamentoSalvo=localStorage.getItem("SDL_pagamento")

if(planoSalvo){

plano=planoSalvo
situacao="Plano registrado"

}

if(pagamentoSalvo){

pagamento=pagamentoSalvo
situacao="Plano ativo"

}

}catch(e){

console.log("Erro ao carregar plano")

}



document.getElementById("planoAtual").innerHTML=plano
document.getElementById("formaPagamento").innerHTML=pagamento
document.getElementById("situacaoPlano").innerHTML=situacao



const box=document.getElementById("statusPlano")

if(situacao==="Plano ativo"){

box.innerHTML="Plano ativo e liberado para uso editorial."
box.style.background="rgba(23,77,39,0.28)"
box.style.border="1px solid rgba(156,253,178,0.18)"

}else{

box.innerHTML="Nenhum plano ativo encontrado. Escolha um plano para liberar os recursos."
box.style.background="rgba(255,112,112,0.12)"
box.style.border="1px solid rgba(255,112,112,0.22)"

}

}



function abrirPlanos(){

window.location.href="planos_doacoes.html"

}



function abrirPagamento(){

window.location.href="pagamento.html"

}



function voltarIndice(){

window.location.href="_Indice.html"

}



verificarSessao()
carregarStatusPlano()

</script>

</body>
</html>
