<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Status do plano editorial</title>

<style>

body{
margin:0;
background:#0c0603;
font-family:Arial;
color:white;
display:flex;
justify-content:center;
}

.container{
max-width:720px;
width:92%;
padding:40px 0 60px 0;
}

.titulo{
font-size:34px;
text-align:center;
font-weight:bold;
}

.subtitulo{
text-align:center;
color:#ff7b2c;
margin-top:10px;
margin-bottom:28px;
}

.card{
background:#140c08;
border-radius:14px;
padding:26px;
margin-top:20px;
line-height:1.8;
}

.item{
margin-bottom:10px;
color:#ffd2b3;
}

.destaque{
color:#9cffb2;
font-weight:bold;
}

.botao{
width:100%;
padding:18px;
margin-top:24px;
border:none;
border-radius:40px;
background:#ff5a00;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<div class="titulo">

Status editorial do seu ambiente

</div>

<div class="subtitulo">

Lapidar — Site das Letras

</div>

<div class="card" id="statusPlano">

Carregando informações do plano...

</div>

<button class="botao"
onclick="window.location.href='_Indice.html'">

Voltar para casa do original

</button>

</div>

<script>

function obterValor(chave){

return localStorage.getItem(chave) || "não registrado";

}

function montarStatus(){

const planoLapidar =
obterValor("SDL_plano_lapidar");

const planoCapista =
obterValor("CAPISTA_plano");

const leituraTecnica =
obterValor("LTE_status");

const capasFisicas =
obterValor("CAPISTA_capas_fisicas");

const capasEpub =
obterValor("CAPISTA_capas_epub");

const idiomasExtras =
obterValor("SDL_idiomas_extras");

const validadePlano =
obterValor("SDL_validade_plano");

document.getElementById("statusPlano").innerHTML =

"<div class='item'>Plano Lapidar ativo: <span class='destaque'>" + planoLapidar + "</span></div>" +

"<div class='item'>Plano Capista ativo: <span class='destaque'>" + planoCapista + "</span></div>" +

"<div class='item'>Leitura técnica editorial: <span class='destaque'>" + leituraTecnica + "</span></div>" +

"<div class='item'>Capas físicas utilizadas: <span class='destaque'>" + capasFisicas + "</span></div>" +

"<div class='item'>Capas EPUB utilizadas: <span class='destaque'>" + capasEpub + "</span></div>" +

"<div class='item'>Idiomas extras ativados: <span class='destaque'>" + idiomasExtras + "</span></div>" +

"<div class='item'>Validade do plano: <span class='destaque'>" + validadePlano + "</span></div>";

}

montarStatus();

</script>

</body>

</html>
