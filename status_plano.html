<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Status do ambiente editorial — Lapidar</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
background:#0d0603;
color:white;
display:flex;
justify-content:center;
}

.container{
max-width:760px;
width:92%;
padding:40px 0 60px 0;
}

.titulo{
font-size:36px;
text-align:center;
font-weight:bold;
}

.subtitulo{
text-align:center;
color:#ff7b2c;
margin-top:10px;
margin-bottom:28px;
line-height:1.6;
}

.card{
background:#140c08;
border-radius:14px;
padding:22px;
margin-top:18px;
line-height:1.7;
}

.label{
color:#ff7b2c;
font-weight:bold;
}

.valor{
color:#ffd2b3;
}

.statusOk{
color:#9cffb2;
font-weight:bold;
}

.statusAviso{
color:#ffd27a;
font-weight:bold;
}

.statusErro{
color:#ff9c9c;
font-weight:bold;
}

.botao{
width:100%;
padding:18px;
margin-top:18px;
border:none;
border-radius:40px;
background:#ff5a00;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.botao:hover{
background:#ff6f1a;
}

.botaoCinza{
background:#444;
}

.botaoCinza:hover{
background:#666;
}

</style>
</head>

<body>

<div class="container">

<div class="titulo">
Status do ambiente editorial
</div>

<div class="subtitulo">
Verificação geral do sistema Lapidar neste navegador
</div>

<div class="card">

<div>
<span class="label">Usuário ativo</span><br>
<span id="usuarioStatus" class="valor"></span>
</div>

<div style="margin-top:14px">
<span class="label">Plano Lapidar</span><br>
<span id="planoStatus"></span>
</div>

<div style="margin-top:14px">
<span class="label">Pagamento</span><br>
<span id="pagamentoStatus"></span>
</div>

<div style="margin-top:14px">
<span class="label">Idioma principal da obra</span><br>
<span id="idiomaStatus"></span>
</div>

<div style="margin-top:14px">
<span class="label">Original enviado</span><br>
<span id="originalStatus"></span>
</div>

<div style="margin-top:14px">
<span class="label">Projeto Capista</span><br>
<span id="capistaStatus"></span>
</div>

<div style="margin-top:14px">
<span class="label">Leitura Técnica Editorial</span><br>
<span id="leituraStatus"></span>
</div>

</div>

<button class="botao"
onclick="window.location.href='_Indice.html'">

Voltar para a casa do original

</button>

<button class="botao botaoCinza"
onclick="logoutSistema()">

Encerrar sessão neste dispositivo

</button>

</div>

<script>

function traduzirIdioma(codigo){

if(codigo === "pt") return "Português";
if(codigo === "en") return "English";
if(codigo === "es") return "Español";
if(codigo === "it") return "Italiano";
if(codigo === "fr") return "Français";
if(codigo === "de") return "Deutsch";

return "Não definido";

}

function statusTexto(valor){

if(valor)
return "<span class='statusOk'>Registrado</span>";

return "<span class='statusAviso'>Não registrado</span>";

}

function statusPagamento(valor){

if(valor === "confirmado")
return "<span class='statusOk'>Confirmado</span>";

if(valor === "pendente")
return "<span class='statusAviso'>Aguardando confirmação</span>";

return "<span class='statusErro'>Não identificado</span>";

}

function carregarStatus(){

const usuario =
localStorage.getItem("SDL_usuario_logado");

const plano =
localStorage.getItem("SDL_plano_lapidar");

const pagamento =
localStorage.getItem("SDL_status_pagamento");

const idioma =
localStorage.getItem("SDL_idioma_obra");

const original =
localStorage.getItem("SDL_original_enviado");

const capista =
localStorage.getItem("CAPISTA_status_geracao");

const leitura =
localStorage.getItem("LTE_status");

document.getElementById("usuarioStatus")
.innerText = usuario || "Não identificado";

document.getElementById("planoStatus")
.innerHTML = plano
? "<span class='statusOk'>" + plano + "</span>"
: "<span class='statusAviso'>Nenhum plano selecionado</span>";

document.getElementById("pagamentoStatus")
.innerHTML = statusPagamento(pagamento);

document.getElementById("idiomaStatus")
.innerHTML = idioma
? "<span class='statusOk'>" + traduzirIdioma(idioma) + "</span>"
: "<span class='statusAviso'>Não definido</span>";

document.getElementById("originalStatus")
.innerHTML = statusTexto(original);

document.getElementById("capistaStatus")
.innerHTML = statusTexto(capista);

document.getElementById("leituraStatus")
.innerHTML = statusTexto(leitura);

}

function logoutSistema(){

localStorage.removeItem("SDL_usuario_logado");
localStorage.removeItem("SDL_sessao_ativa");

window.location.href = "login.html";

}

carregarStatus();

</script>

</body>
</html>
