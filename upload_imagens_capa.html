<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Envio das partes da capa externa</title>

<style>

body{
margin:0;
background:#0c0603;
font-family:Arial;
color:white;
display:flex;
justify-content:center;
}

.container{
max-width:720px;
width:92%;
padding:40px 0 60px 0;
}

.titulo{
font-size:32px;
text-align:center;
font-weight:bold;
}

.subtitulo{
text-align:center;
color:#ff7b2c;
margin-top:12px;
margin-bottom:28px;
}

.card{
background:#140c08;
border-radius:14px;
padding:26px;
margin-top:20px;
}

label{
display:block;
margin-top:18px;
margin-bottom:6px;
color:#ffd2b3;
}

input{
width:100%;
padding:12px;
border-radius:8px;
border:none;
}

.botao{
width:100%;
padding:18px;
margin-top:24px;
border:none;
border-radius:40px;
background:#ff5a00;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.info{
margin-top:14px;
font-size:14px;
color:#ffcfaa;
line-height:1.6;
}

</style>

</head>

<body>

<div class="container">

<div class="titulo">

Envio das partes da capa externa

</div>

<div class="subtitulo">

Envie cada parte da capa separadamente para montagem editorial completa

</div>

<div class="card">

<label>Capa frontal</label>
<input type="file">

<label>Contracapa</label>
<input type="file">

<label>Orelha dianteira</label>
<input type="file">

<label>Orelha traseira</label>
<input type="file">

<label>Lombada</label>
<input type="file">

<div class="info">

Você pode enviar imagens com texto já incluído.

Também é possível enviar versões multilíngues.

Compatível com impressão física e EPUB.

</div>

<button class="botao"
onclick="salvarUploadCapa()">

Salvar partes da capa

</button>

<button class="botao"
onclick="window.location.href='_Indice.html'">

Voltar para casa do original

</button>

</div>

</div>

<script>

function salvarUploadCapa(){

localStorage.setItem(

"SDL_upload_capa_partes",

"ok"

);

alert(

"Partes da capa registradas com sucesso."

);

window.location.href="relatorio_lapidacao.html";

}

</script>

</body>

</html>
