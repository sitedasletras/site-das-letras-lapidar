<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload de Imagens Internas</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0e0604;
color:white;
}

header{
background:#2f436d;
padding:18px 20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.container{
max-width:1000px;
margin:auto;
padding:24px 16px 40px;
}

.card{
background:#1c0e08;
border-radius:14px;
padding:20px;
margin-bottom:18px;
box-shadow:0 6px 18px rgba(0,0,0,.25);
}

label{
display:block;
margin-top:12px;
margin-bottom:6px;
font-weight:bold;
}

input[type="file"]{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#2a140c;
color:white;
}

.preview{
margin-top:12px;
background:#2a140c;
padding:10px;
border-radius:10px;
font-size:14px;
line-height:1.6;
}

button{
padding:12px 16px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
background:#2f436d;
color:white;
margin-top:12px;
margin-right:10px;
}

button.alt{
background:#8a6f3f;
}

</style>
</head>
<body>

<header>

<h2>Upload de Imagens Internas</h2>

<button onclick="voltar()">Voltar</button>

</header>


<div class="container">


<div class="card">

<h3>Projeto ativo</h3>

<div id="nomeProjeto">

Nenhum projeto ativo selecionado.

</div>

</div>



<div class="card">

<h3>Enviar imagens do miolo do livro</h3>

<label>Selecionar imagens (pode enviar várias)</label>

<input
type="file"
id="imagensInternas"
accept="image/*"
multiple
>

<div class="preview" id="statusUpload">

Nenhuma imagem enviada ainda.

</div>

<button onclick="salvarImagens()">Salvar imagens</button>

<button class="alt" onclick="limparCampos()">Limpar</button>

</div>


</div>


<script>

const perfil = localStorage.getItem("lapidar_perfil");

if(!perfil){

window.location.href="index.html";

}


const projeto = localStorage.getItem("lapidar_projeto_ativo");

if(projeto){

document.getElementById("nomeProjeto").innerText = projeto;

}


function salvarImagens(){

let arquivos =
document.getElementById("imagensInternas").files;

if(!arquivos.length){

document.getElementById("statusUpload").innerText =
"Nenhuma imagem selecionada.";

return;

}


let lista = [];

for(let i=0;i<arquivos.length;i++){

lista.push(arquivos[i].name);

}


localStorage.setItem(
"lapidar_imagens_internas",
JSON.stringify(lista)
);


document.getElementById("statusUpload").innerHTML=

"Imagens registradas com sucesso:<br><br>" +

lista.join("<br>");

}


function limparCampos(){

document.getElementById("imagensInternas").value="";

document.getElementById("statusUpload").innerText=
"Campos limpos.";

}


function voltar(){

window.location.href="painel_departamentos.html";

}

</script>


</body>
</html>
