<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload do Livro — Lapidar</title>

<style>

:root{
--bg:#0d0603;
--card:#140c08;
--text:#ffffff;
--muted:#ffd2b3;
--orange:#f7b22c;
--orangeStrong:#ff5a00;
--green:#9cfdb2;
--danger:#ff7070;
--border:rgba(255,123,44,0.18);
--shadow:0 10px 26px rgba(0,0,0,0.28);
}

body{
margin:0;
font-family:Arial;
background:var(--bg);
color:white;
}

.container{
width:min(1000px,95%);
margin:auto;
padding:40px 0;
}

.titulo{
font-size:38px;
font-weight:bold;
}

.subtitulo{
margin-top:6px;
color:var(--orange);
}

.card{
margin-top:30px;
background:var(--card);
padding:24px;
border-radius:18px;
border:1px solid var(--border);
box-shadow:var(--shadow);
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px;
margin-top:18px;
}

label{
display:block;
margin-bottom:6px;
color:var(--orange);
font-weight:bold;
}

input, textarea, select{

width:100%;
padding:14px;
border-radius:12px;
border:none;
background:#1b0e07;
color:white;

}

textarea{

min-height:140px;
resize:vertical;

}

.statusBox{

margin-top:22px;
padding:18px;
border-radius:14px;
background:rgba(247,178,44,0.12);
border:1px solid rgba(247,178,44,0.2);
color:#ffe7b0;

}

.actions{

margin-top:26px;
display:flex;
flex-wrap:wrap;
gap:12px;

}

.botao{

border:none;
padding:14px 18px;
border-radius:999px;
font-weight:bold;
cursor:pointer;

}

.botaoSalvar{

background:#174d27;
color:#dfffe8;

}

.botaoIndice{

background:#24150f;
color:white;

}

.botaoPreview{

background:var(--orangeStrong);
color:white;

}

</style>
</head>

<body>

<div class="container">

<div class="titulo">
REGISTRO DO PROJETO EDITORIAL
</div>

<div class="subtitulo">
Cadastro da obra dentro do ambiente Lapidar
</div>



<div class="card">

<div class="grid">

<div>

<label>Título da obra</label>
<input id="titulo">

</div>


<div>

<label>Subtítulo</label>
<input id="subtitulo">

</div>


<div>

<label>Autor / Heterônimo</label>
<input id="autor">

</div>


<div>

<label>Coleção</label>
<input id="colecao">

</div>


<div>

<label>Formato do livro</label>
<select id="formato">

<option>A5</option>
<option>16x23</option>
<option>6x9</option>
<option>A4</option>

</select>

</div>


<div>

<label>Status editorial</label>
<select id="status">

<option>Em preparação</option>
<option>Em revisão</option>
<option>Em diagramação</option>
<option>Finalizado</option>

</select>

</div>

</div>



<div style="margin-top:18px;">

<label>Observações do projeto</label>
<textarea id="observacoes"></textarea>

</div>



<div class="statusBox" id="statusProjeto">

Nenhum projeto registrado ainda.

</div>

</div>



<div class="actions">

<button class="botao botaoSalvar" onclick="salvarProjeto()">

Salvar projeto

</button>


<button class="botao botaoPreview" onclick="abrirPreview()">

Abrir preview

</button>


<button class="botao botaoIndice" onclick="voltarIndice()">

Voltar ao índice

</button>

</div>



</div>



<script>

function verificarSessao(){

const sessao=localStorage.getItem("SDL_sessao_ativa")

if(sessao!=="sim"){

window.location.href="login.html"

}

}



function salvarProjeto(){

const titulo=document.getElementById("titulo").value.trim()
const subtitulo=document.getElementById("subtitulo").value.trim()
const autor=document.getElementById("autor").value.trim()
const colecao=document.getElementById("colecao").value.trim()
const formato=document.getElementById("formato").value
const status=document.getElementById("status").value
const observacoes=document.getElementById("observacoes").value.trim()

if(!titulo){

document.getElementById("statusProjeto").innerHTML=
"O título da obra é obrigatório."

return

}

const projeto={

titulo,
subtitulo,
autor,
colecao,
formato,
status,
observacoes,
dataRegistro:new Date().toISOString()

}



try{

localStorage.setItem("SDL_projeto_ativo",JSON.stringify(projeto))

document.getElementById("statusProjeto").innerHTML=

"Projeto salvo com sucesso."

document.getElementById("statusProjeto").style.background=

"rgba(23,77,39,0.28)"

}catch(e){

document.getElementById("statusProjeto").innerHTML=

"Erro ao salvar projeto."

}

}



function abrirPreview(){

window.location.href="preview_projeto.html"

}



function voltarIndice(){

window.location.href="_Indice.html"

}



verificarSessao()

</script>

</body>
</html>
