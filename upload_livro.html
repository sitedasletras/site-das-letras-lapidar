<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lapidar — Upload do Livro</title>

<style>

:root{
--bg:#0d0603;
--card:#140c08;
--card-2:#1b100a;
--text:#ffffff;
--muted:#ffd2b3;
--orange:#f7b22c;
--orange-strong:#ff5a00;
--blue:#6ea8ff;
--green:#9cfdb2;
--border:rgba(255,123,44,0.18);
--shadow:0 10px 26px rgba(0,0,0,0.28);
}

body{
margin:0;
font-family:Arial;
background:var(--bg);
color:var(--text);
}

.container{
width:min(1100px,94%);
margin:auto;
padding:30px 0 50px 0;
}

.titulo{
font-size:40px;
font-weight:bold;
}

.subtitulo{
color:var(--orange);
margin-top:6px;
font-size:18px;
}

.bloco{
background:var(--card);
border:1px solid var(--border);
border-radius:18px;
padding:22px;
margin-top:24px;
box-shadow:var(--shadow);
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px;
margin-top:20px;
}

label{
display:block;
margin-bottom:6px;
color:var(--orange);
font-weight:bold;
}

input, select, textarea{
width:100%;
padding:12px;
border-radius:10px;
border:none;
background:#1a0f09;
color:white;
}

textarea{
min-height:120px;
}

.actions{
margin-top:20px;
display:flex;
gap:12px;
flex-wrap:wrap;
}

.botao{
border:none;
padding:14px 18px;
border-radius:999px;
font-weight:bold;
cursor:pointer;
}

.botao-laranja{
background:var(--orange-strong);
color:white;
}

.botao-azul{
background:var(--blue);
color:white;
}

.botao-verde{
background:#174d27;
color:#dfffe8;
}

.botao-escuro{
background:#24150f;
color:white;
}

.status-box{
margin-top:20px;
padding:18px;
border-radius:14px;
background:rgba(247,178,44,0.12);
border:1px solid rgba(247,178,44,0.2);
color:#ffe7b0;
}

.link-btn{
display:block;
margin-top:10px;
text-decoration:none;
text-align:center;
padding:14px;
border-radius:999px;
background:#24150f;
color:white;
}

@media(max-width:900px){

.grid{
grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<div class="container">

<div>

<div class="titulo">
UPLOAD DO LIVRO
</div>

<div class="subtitulo">
Registro inicial da obra dentro do ambiente Lapidar
</div>

</div>



<div class="bloco">

<div class="grid">


<div>

<label>Título da obra</label>
<input id="tituloLivro">


</div>



<div>

<label>Subtítulo</label>
<input id="subtituloLivro">


</div>



<div>

<label>Autor / Heterônimo</label>
<input id="autorLivro">


</div>



<div>

<label>Coleção</label>
<input id="colecaoLivro">


</div>



<div>

<label>Formato do livro</label>
<select id="formatoLivro">

<option>A5</option>
<option>16x23</option>
<option>6x9</option>
<option>A4</option>
<option>Infantil</option>

</select>

</div>



<div>

<label>Status inicial</label>
<select id="statusLivro">

<option>Em preparação</option>
<option>Em diagramação</option>
<option>Em revisão</option>
<option>Pronto para capa</option>

</select>

</div>


</div>



<div style="margin-top:18px">

<label>Observações do projeto</label>
<textarea id="observacoesLivro"></textarea>

</div>



<div class="actions">

<button class="botao botao-laranja"
onclick="registrarProjeto()">

Registrar projeto

</button>


<button class="botao botao-azul"
onclick="abrirPreviewProjeto()">

Preview do projeto

</button>


<button class="botao botao-escuro"
onclick="voltarIndice()">

Voltar ao índice

</button>

</div>



<div class="status-box"
id="statusProjeto">

Nenhum projeto registrado ainda neste dispositivo.

</div>


</div>



<div class="bloco">

<h3>Atalhos rápidos</h3>

<a class="link-btn"
href="historico_projetos.html">

Histórico de projetos

</a>

<a class="link-btn"
href="preview_projeto.html">

Preview do projeto

</a>

<a class="link-btn"
href="_Indice.html">

Voltar ao índice

</a>

</div>



</div>



<script>

function verificarSessao(){

const sessao =
localStorage.getItem("SDL_sessao_ativa");

if(sessao !== "sim"){

window.location.href =
"login.html";

}

}



function registrarProjeto(){

const titulo =
document.getElementById("tituloLivro").value;

const autor =
document.getElementById("autorLivro").value;

if(!titulo || !autor){

alert("Título e autor são obrigatórios.");

return;

}


const projeto = {

titulo:

document.getElementById("tituloLivro").value,

subtitulo:

document.getElementById("subtituloLivro").value,

autor:

document.getElementById("autorLivro").value,

colecao:

document.getElementById("colecaoLivro").value,

formato:

document.getElementById("formatoLivro").value,

status:

document.getElementById("statusLivro").value,

observacoes:

document.getElementById("observacoesLivro").value

};


localStorage.setItem(
"SDL_projeto_ativo",
JSON.stringify(projeto)
);


document.getElementById("statusProjeto").innerHTML =
"Projeto registrado com sucesso: <strong>" +
projeto.titulo +
"</strong>";

}



function abrirPreviewProjeto(){

window.location.href =
"preview_projeto.html";

}



function voltarIndice(){

window.location.href =
"_Indice.html";

}



verificarSessao();

</script>


</body>
</html>
