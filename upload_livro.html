<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Enviar material escrito — Lapidar</title>

<style>

body{

margin:0;
background:#0c0603;
font-family:Arial;
color:white;

display:flex;
justify-content:center;

}

.container{

max-width:720px;
width:92%;

padding:40px 0 60px 0;

}

.titulo{

font-size:34px;
text-align:center;
font-weight:bold;

}

.subtitulo{

text-align:center;
color:#ff7b2c;

margin-top:10px;
margin-bottom:28px;

}

.card{

background:#140c08;
border-radius:14px;

padding:24px;

margin-top:18px;

line-height:1.8;

}

label{

display:block;

margin-top:18px;

font-size:15px;

color:#ffd2b3;

}

input, select{

width:100%;

padding:12px;

margin-top:6px;

border-radius:8px;

border:none;

font-size:16px;

}

.botao{

width:100%;

padding:18px;

margin-top:24px;

border:none;

border-radius:40px;

background:#ff5a00;

color:white;

font-size:18px;

font-weight:bold;

cursor:pointer;

}

.info{

margin-top:14px;

font-size:14px;

color:#ffcfaa;

}

</style>

</head>

<body>

<div class="container">

<div class="titulo">

Entre aqui com o seu arquivo escrito

</div>

<div class="subtitulo">

Aqui começa a preparação editorial do seu material diagramado

</div>

<div class="card">

<label>

Título da obra

</label>

<input id="tituloLivro">

<label>

Nome do autor ou autora

</label>

<input id="autorLivro">

<label>

Idioma principal da obra

</label>

<select id="idiomaObra">

<option value="pt">Português</option>
<option value="en">English</option>
<option value="es">Español</option>
<option value="it">Italiano</option>
<option value="fr">Français</option>
<option value="de">Deutsch</option>

</select>

<label>

Tipo de material enviado

</label>

<select id="tipoMaterial">

<option>Prosa</option>
<option>Poesia</option>
<option>Infantil</option>
<option>Infantojuvenil</option>
<option>Técnico</option>
<option>Acadêmico</option>

</select>

<label>

Envie seu arquivo escrito

</label>

<input type="file"

accept=".doc,.docx,.odt,.pdf,.txt">

<div class="info">

Você pode enviar arquivos Word, LibreOffice, PDF ou TXT.

O material será preparado para diagramação editorial.

</div>

<button

class="botao"

onclick="salvarDados()">

Salvar e continuar

</button>

<button

class="botao"

onclick="window.location.href='_Indice.html'">

Voltar para casa do original

</button>

</div>

</div>

<script>

function salvarDados(){

const titulo =

document.getElementById("tituloLivro").value;

const autor =

document.getElementById("autorLivro").value;

const idioma =

document.getElementById("idiomaObra").value;

const tipo =

document.getElementById("tipoMaterial").value;

if(!titulo){

alert("Informe o título da obra.");

return;

}

localStorage.setItem("SDL_titulo_livro", titulo);

localStorage.setItem("SDL_nome_autor", autor);

localStorage.setItem("SDL_idioma_obra_global", idioma);

localStorage.setItem("SDL_tipo_material", tipo);

window.location.href =

"preferencias_diagramacao.html";

}

</script>

</body>

</html>
