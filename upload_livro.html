<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enviar material escrito — Lapidar</title>

<style>
body{
margin:0;
background:#0c0603;
font-family:Arial, sans-serif;
color:white;
display:flex;
justify-content:center;
}

.container{
max-width:760px;
width:92%;
padding:40px 0 60px 0;
}

.titulo{
font-size:34px;
text-align:center;
font-weight:bold;
}

.subtitulo{
text-align:center;
color:#ff7b2c;
margin-top:10px;
margin-bottom:28px;
line-height:1.6;
}

.card{
background:#140c08;
border-radius:14px;
padding:26px;
margin-top:20px;
line-height:1.8;
}

label{
display:block;
margin-top:16px;
color:#ffd2b3;
}

input, select{
width:100%;
padding:12px;
margin-top:6px;
border-radius:8px;
border:none;
box-sizing:border-box;
}

.botao{
width:100%;
padding:18px;
margin-top:24px;
border:none;
border-radius:40px;
background:#ff5a00;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.botaoCinza{
background:#444;
}

.botaoCinza:hover{
background:#666;
}

.info{
margin-top:12px;
font-size:14px;
color:#ffcfaa;
line-height:1.6;
}

.sucesso{
margin-top:18px;
text-align:center;
color:#9cffb2;
font-weight:bold;
line-height:1.7;
}
</style>
</head>

<body>

<div class="container">

<div class="titulo">
Enviar material escrito
</div>

<div class="subtitulo">
Aqui começa a preparação editorial da sua obra dentro do Lapidar
</div>

<div class="card">

<label>
Título da obra
</label>
<input id="tituloLivro">

<label>
Nome do autor ou autora
</label>
<input id="autorLivro">

<label>
Idioma principal da obra
</label>
<select id="idiomaObra">
<option value="pt">Português</option>
<option value="en">English</option>
<option value="es">Español</option>
<option value="it">Italiano</option>
<option value="fr">Français</option>
<option value="de">Deutsch</option>
</select>

<label>
Tipo de material enviado
</label>
<select id="tipoMaterial">
<option value="Romance">Romance</option>
<option value="Contos">Contos</option>
<option value="Poesia">Poesia</option>
<option value="Infantil">Infantil</option>
<option value="Infantojuvenil">Infantojuvenil</option>
<option value="Acadêmico">Acadêmico</option>
<option value="Outro">Outro</option>
</select>

<label>
Destino editorial pretendido
</label>
<select id="destinoEditorial">
<option value="Livro físico">Livro físico</option>
<option value="EPUB digital">EPUB digital</option>
<option value="Livro físico + EPUB">Livro físico + EPUB</option>
</select>

<label>
Arquivo principal da obra
</label>
<input type="file" id="arquivoObra" accept=".doc,.docx,.odt,.pdf,.txt">

<div class="info">
Você pode enviar arquivos Word, LibreOffice, PDF ou TXT.
</div>

<div class="info">
Obras infantis e infantojuvenis também podem seguir fluxo multilíngue, incluindo EPUB e capa.
</div>

<button class="botao" onclick="salvarEntradaObra()">
Salvar entrada da obra
</button>

<button class="botao" onclick="seguirPreferencias()">
Seguir para preferências da diagramação
</button>

<button class="botao botaoCinza" onclick="window.location.href='_Indice.html'">
Voltar para casa do original
</button>

<div id="mensagemSucesso" class="sucesso"></div>

</div>

</div>

<script>

function carregarIdiomaMestre(){

const idioma =
localStorage.getItem("SDL_idioma_obra_global") ||
localStorage.getItem("SDL_idioma_obra") ||
"pt";

document.getElementById("idiomaObra").value = idioma;

}

function salvarEntradaObra(){

const titulo =
document.getElementById("tituloLivro").value.trim();

const autor =
document.getElementById("autorLivro").value.trim();

const idioma =
document.getElementById("idiomaObra").value;

const tipo =
document.getElementById("tipoMaterial").value;

const destino =
document.getElementById("destinoEditorial").value;

if(!titulo){
alert("Informe o título da obra.");
return;
}

if(!autor){
alert("Informe o nome do autor ou autora.");
return;
}

localStorage.setItem("SDL_titulo_livro", titulo);
localStorage.setItem("SDL_nome_autor", autor);
localStorage.setItem("SDL_idioma_obra", idioma);
localStorage.setItem("SDL_idioma_obra_global", idioma);
localStorage.setItem("SDL_tipo_material", tipo);
localStorage.setItem("SDL_destino_material", destino);
localStorage.setItem("SDL_entrada_obra_registrada", "sim");

if(tipo === "Infantil" || tipo === "Infantojuvenil"){
localStorage.setItem("SDL_fluxo_juvenil", "sim");
}else{
localStorage.setItem("SDL_fluxo_juvenil", "nao");
}

document.getElementById("mensagemSucesso").innerHTML =
"Entrada da obra registrada com sucesso.<br>Idioma principal: <strong>" + idioma + "</strong>";

}

function seguirPreferencias(){

const registrado =
localStorage.getItem("SDL_entrada_obra_registrada");

if(registrado !== "sim"){
alert("Salve primeiro a entrada da obra.");
return;
}

window.location.href = "preferencias_diagramacao.html";

}

carregarIdiomaMestre();

</script>

</body>
</html>
