<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Assistente Diagramador do Autor — Upload da obra</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0e5eff;
color:white;
display:flex;
justify-content:center;
}

.container{
max-width:900px;
width:94%;
padding:40px 0 60px 0;
}

.titulo{
font-size:36px;
font-weight:bold;
text-align:center;
}

.subtitulo{
text-align:center;
margin-top:10px;
margin-bottom:30px;
color:#e9f0ff;
line-height:1.6;
}

.card{
background:white;
color:#0e2a8c;
border-radius:16px;
padding:24px;
margin-top:18px;
line-height:1.7;
}

.label{
font-weight:bold;
margin-top:12px;
display:block;
}

input,select{
width:100%;
padding:12px;
border-radius:10px;
border:1px solid #cfd8ff;
margin-top:6px;
}

input[type=file]{
border:none;
padding:10px 0;
}

.botao{
width:100%;
padding:18px;
margin-top:18px;
border-radius:40px;
border:2px solid white;
background:#0e5eff;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.botao:hover{
opacity:.95;
}

.botaoSec{
background:white;
color:#0e5eff;
border:2px solid #0e5eff;
}

.status{
margin-top:10px;
padding:12px;
border-radius:12px;
background:#eef3ff;
color:#0e2a8c;
}

.ok{
background:#e7fff1;
color:#0d6b3a;
}

.alerta{
background:#fff4df;
color:#7c5400;
}

.checkbox{
margin-top:12px;
display:flex;
gap:10px;
align-items:flex-start;
}

.preview{
margin-top:10px;
background:#f6f9ff;
padding:14px;
border-radius:10px;
}

</style>

</head>

<body>

<div class="container">

<div class="titulo">
Assistente Diagramador do Autor
</div>

<div class="subtitulo">
Envie sua obra e confirme os dados sugeridos automaticamente
</div>

<div id="statusSistema" class="status">
Verificando ambiente editorial...
</div>


<div class="card">

<label class="label">
Arquivo principal da obra
</label>

<input
type="file"
id="arquivo"
accept=".doc,.docx,.pdf">

<label class="label">
Deseja enviar imagem autoral para possível uso na capa?
</label>

<select
id="imagemAutoral"
onchange="toggleImagem()">

<option value="nao">
Não enviar imagem
</option>

<option value="sim">
Sim enviar imagem
</option>

</select>

<div
id="areaImagem"
style="display:none">

<label class="label">
Imagem da capa
</label>

<input
type="file"
id="arquivoImagem"
accept=".jpg,.jpeg,.png,.webp">

<div class="checkbox">

<input
type="checkbox"
id="confirmacaoImagem">

<label>
Declaro possuir direitos autorais da imagem enviada
</label>

</div>

</div>

<button
class="botao"
onclick="lerArquivo()">

Ler obra e sugerir dados

</button>

</div>


<div class="card">

<label class="label">
Título sugerido
</label>

<input
type="text"
id="titulo">

<div class="checkbox">

<input
type="checkbox"
id="confirmTitulo"
checked>

<label>
Confirmar título
</label>

</div>


<label class="label">
Autor sugerido
</label>

<input
type="text"
id="autor">

<div class="checkbox">

<input
type="checkbox"
id="confirmAutor"
checked>

<label>
Confirmar autoria
</label>

</div>


<label class="label">
Idioma principal
</label>

<select id="idioma">

<option value="pt">Português</option>
<option value="en">English</option>
<option value="es">Español</option>
<option value="it">Italiano</option>
<option value="fr">Français</option>
<option value="de">Deutsch</option>

</select>


<label class="label">
Categoria da obra
</label>

<select id="categoria">

<option value="romance">Romance</option>
<option value="contos">Contos</option>
<option value="poesia">Poesia</option>
<option value="infantil">Infantil</option>
<option value="culinaria">Culinária</option>
<option value="fantasia">Fantasia</option>
<option value="terror">Terror</option>
<option value="scifi">Sci-fi</option>
<option value="erotico">Erótico</option>

</select>


<label class="label">
Destino editorial
</label>

<select id="destino">

<option value="fisico">Livro físico</option>
<option value="epub">ePub</option>
<option value="ambos">Ambos</option>

</select>

</div>


<div class="card">

<label class="label">
Preferências sugeridas
</label>

<div
id="sugestao"
class="preview">

Aguardando leitura da obra

</div>


<label class="label">
Recuo primeira linha
</label>

<select id="recuo">

<option value="1.25">
1.25 cm
</option>

<option value="0.75">
0.75 cm
</option>

<option value="0">
Sem recuo
</option>

</select>


<label class="label">
Alinhamento
</label>

<select id="alinhamento">

<option value="justificado">
Justificado
</option>

<option value="esquerda">
Esquerda
</option>

</select>


<label class="label">
Espaçamento entre parágrafos
</label>

<select id="espaco">

<option value="0">
Sem espaço
</option>

<option value="medio">
Médio
</option>

</select>

</div>


<button
class="botao"
onclick="confirmar()">

Confirmar dados e continuar

</button>


<button
class="botao botaoSec"
onclick="location.href='_Indice.html'">

Voltar ao painel

</button>


</div>


<script>


function admin(){

return localStorage.getItem("SDL_ADMIN") === "true";

}


function acesso(){

return (

localStorage.getItem("SDL_status_pagamento") === "confirmado"

||

admin()

);

}


function status(){

const el=document.getElementById("statusSistema");

if(admin()){

el.classList.add("ok");

el.innerText="Modo administrador ativo";

return;

}

if(acesso()){

el.classList.add("ok");

el.innerText="Doação identificada";

return;

}

el.classList.add("alerta");

el.innerText="Modo preview ativo";

}


function toggleImagem(){

const escolha=document.getElementById("imagemAutoral").value;

document.getElementById("areaImagem").style.display=

escolha==="sim"?"block":"none";

}


function detectarCategoria(nome){

nome=nome.toLowerCase();

if(nome.includes("poesia")) return "poesia";

if(nome.includes("conto")) return "contos";

if(nome.includes("receita")) return "culinaria";

if(nome.includes("fantasia")) return "fantasia";

if(nome.includes("terror")) return "terror";

return "romance";

}


function lerArquivo(){

const file=document.getElementById("arquivo").files[0];

if(!file){

alert("Envie o arquivo primeiro");

return;

}

let nome=file.name.replace(/\.[^/.]+$/,"");

nome=nome.replace(/[_-]/g," ");

document.getElementById("titulo").value=nome;

document.getElementById("autor").value=

localStorage.getItem("SDL_nome_autor")

||

"Autor não identificado";

const categoria=detectarCategoria(nome);

document.getElementById("categoria").value=categoria;

document.getElementById("sugestao").innerText=

"Sugestão aplicada conforme categoria: "+categoria;

}


function confirmar(){

const file=document.getElementById("arquivo").files[0];

if(!file){

alert("Envie o arquivo");

return;

}


localStorage.setItem(

"SDL_titulo_livro",

document.getElementById("titulo").value

);


localStorage.setItem(

"SDL_nome_autor",

document.getElementById("autor").value

);


localStorage.setItem(

"SDL_categoria",

document.getElementById("categoria").value

);


localStorage.setItem(

"SDL_idioma",

document.getElementById("idioma").value

);


localStorage.setItem(

"SDL_destino",

document.getElementById("destino").value

);


alert("Dados registrados com sucesso");


location.href="preview_projeto.html";

}


status();


</script>

</body>

</html>
