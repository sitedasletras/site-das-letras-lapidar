<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload da obra — Lapidar</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f1e6;
}

header{
background:#32497d;
color:white;
padding:18px;
display:flex;
justify-content:space-between;
font-size:18px;
}

.container{
max-width:900px;
margin:auto;
padding:30px;
}

.card{
background:white;
padding:25px;
border-radius:16px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.titulo{
font-size:24px;
font-weight:bold;
margin-bottom:10px;
}

.subtitulo{
font-size:16px;
color:#666;
margin-bottom:20px;
}

.botao{
width:100%;
padding:18px;
margin-top:16px;
border:none;
border-radius:12px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.azul{
background:#6b8ec1;
color:white;
}

.preto{
background:black;
color:white;
}

.status{
margin-top:20px;
font-weight:bold;
color:#2f3e55;
}

</style>
</head>

<body>

<header>
<div>Upload da obra</div>
<div>Lapidar</div>
</header>


<div class="container">

<div class="card">

<div class="titulo">
Envio do material da obra
</div>

<div class="subtitulo">
Envie aqui o texto principal da obra.  
Este envio inicia a leitura técnica inicial do Lapidar.
</div>


<input type="file" id="arquivoTexto" accept=".doc,.docx,.pdf,.txt">

<button class="botao azul" onclick="registrarUploadTexto()">
Registrar envio do texto
</button>


<div class="status" id="statusUpload">
Aguardando envio do texto principal.
</div>


<button class="botao preto" onclick="seguirParaLeitura()">
Continuar para leitura inicial
</button>

</div>

</div>


<script src="/auditoria.js"></script>

<script>


async function registrarUploadTexto(){

const arquivo =
document.getElementById("arquivoTexto").files[0];

if(!arquivo){

alert("Selecione o arquivo da obra antes de continuar.");

return;

}


localStorage.setItem("upload_texto_obra","sim");

localStorage.setItem("nome_arquivo_texto",arquivo.name);


await LapidarAuditoria.registrarEvento(
"Upload do texto principal realizado",
{
arquivo:arquivo.name
}
);


document.getElementById("statusUpload").innerText =
"Arquivo recebido: " + arquivo.name;

}


async function seguirParaLeitura(){

if(localStorage.getItem("upload_texto_obra")!=="sim"){

alert("Envie o texto principal antes de continuar.");

return;

}


await LapidarAuditoria.encerrarSessaoModulo("upload_obra");

await LapidarAuditoria.registrarEvento(
"Encaminhamento para leitura técnica inicial",
{}
);


window.location.href="/bolsao_execucao.html";

}


window.onload = async function(){

await LapidarAuditoria.iniciarSessaoModulo("upload_obra");

await LapidarAuditoria.registrarEvento(
"Tela de upload da obra aberta",
{}
);

};


</script>


</body>
</html>
